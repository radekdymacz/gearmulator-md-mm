<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monomachine Editor</title>
<meta name="description" content="Screen-native editor mockup for the Elektron Monomachine (SFX-6 / SFX-60, OS 1.32)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=Silkscreen&display=swap">
<style>
:root{
  color-scheme:light;
  --plate:#d0d1cc;--plate2:#c4c5bf;--plate3:#dcddd8;--print:#2f302b;--print2:#55564f;--print3:#6d6e67;--rule:#9a9b94;
  --key:#292c29;--key2:#3a3d39;--keytext:#e7e6df;--keydim:#9a9b94;
  --trig:#d77c43;--led:#e8553a;--rec:#c94d3a;--lcd:#e0472b;--ink:#38100a;--oxblood:#6b382e;
  --row:30px;--hdr:220px;
  --sans:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --pix:"Silkscreen",ui-monospace,monospace;
  /* legacy names used by the page script */
  --bg:var(--plate2);--s1:var(--plate);--s2:var(--plate2);--s3:var(--plate3);--line:var(--rule);--line2:var(--rule);
  --text:var(--print);--dim:var(--print2);--mute:var(--print3);--amber:var(--trig);--teal:var(--led);--coral:var(--rec);
  --red:var(--rec);--yellow:var(--trig);--white:var(--print);
  --trx:var(--print);--efm:var(--print);--e12:var(--print);--pi:var(--print);--gnd:var(--print);--smp:var(--trig);--inp:var(--print);--mid:var(--print);--ctr:var(--print);
}
:root[data-plate="mk2"]{
  color-scheme:dark;
  --plate:#1b1c1a;--plate2:#131412;--plate3:#252623;--print:#e7e6df;--print2:#b8b7b0;--print3:#8d8c86;--rule:#4a4b46;
  --key:#34362f;--key2:#44473f;--keytext:#e7e6df;--keydim:#8d8c86;--oxblood:#ee613f;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--plate)}
body{color:var(--print);font:500 15px/1.35 var(--sans);padding-inline:16px;padding-block:14px;margin:0}
button,select,input{font:inherit;color:inherit}
button{background:var(--key);color:var(--keytext);border:0;border-radius:3px;padding:5px 11px;cursor:pointer;font-weight:600;letter-spacing:.04em;box-shadow:inset 0 -2px 0 rgba(0,0,0,.35)}
button:hover{background:var(--key2)}
button:active{box-shadow:none;transform:translateY(1px)}
:focus-visible{outline:2px solid var(--led);outline-offset:2px}
select{background:var(--plate3);border:1px solid var(--rule);border-radius:3px;padding:4px 8px;max-width:100%;color:var(--print)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.cap,.card h3{font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--print)}
.app{max-width:1600px;margin:0 auto;display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}

/* top bar: a printed strip, keys lit like the hardware */
.top{display:grid;grid-template-columns:auto 1fr auto;gap:12px 22px;align-items:center;padding:4px 0 12px;border-bottom:2px solid var(--print)}
@media (max-width:1150px){.top{grid-template-columns:1fr}}
.left,.right{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.brand{font:600 24px/1 var(--sans);letter-spacing:.08em;white-space:nowrap}
.brand span{color:var(--oxblood)}
.transport{display:flex;gap:8px;align-items:center}
.play{width:38px;height:34px;padding:0;display:grid;place-items:center}
.play svg{width:14px;height:14px;fill:var(--keytext)}
.play[aria-pressed=true]{background:var(--trig)}
.play[aria-pressed=true] svg{fill:var(--ink)}
.num{background:var(--lcd);color:var(--ink);border-radius:3px;padding:4px 9px;font:15px var(--pix);cursor:ns-resize;touch-action:none;user-select:none;min-width:78px;text-align:right}
.patsel{display:flex;align-items:center;gap:3px}
.patsel button{padding:5px 8px}
.patsel .mono{font:15px var(--pix);background:var(--lcd);color:var(--ink);padding:4px 9px;border-radius:3px}
.tabs{justify-self:center;display:flex;gap:6px}
.tabs button{padding:7px 16px;font-size:14px;letter-spacing:.14em;text-transform:uppercase}
.tabs button[aria-selected=true]{background:var(--trig);color:var(--ink)}
.seg{display:inline-flex;gap:3px}
.seg button{padding:4px 9px;font:500 12px var(--mono);letter-spacing:0}
.seg button[aria-pressed=true]{background:var(--trig);color:var(--ink)}
.meter{display:grid;gap:4px;min-width:150px}
.meter .row{display:flex;gap:10px;justify-content:space-between;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--print2)}
.meter .row b{font:500 12px var(--mono);letter-spacing:0;color:var(--print)}
.meter .bar{height:6px;background:var(--key);overflow:hidden;border-radius:1px}
.meter .bar i{display:block;height:100%;width:var(--f);background:var(--trig);transition:width .15s}
.meter.warn .bar i,.meter.full .bar i{background:var(--led)}
.save{display:flex;align-items:center;gap:7px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--print2);width:132px}
.save i{width:8px;height:8px;border-radius:50%;background:var(--key);flex:none;box-shadow:inset 0 0 0 1px var(--rule)}
.save.dirty i{background:var(--led);box-shadow:0 0 6px var(--led)}
.save.unknown i{opacity:.4;animation:blink 1s steps(2) infinite}
.note{font-size:14px;color:var(--print2)}
.note b{color:var(--print);font-weight:600}

/* layout */
.body{display:grid;grid-template-columns:var(--hdr) minmax(0,1fr);gap:18px;align-items:start}
.body.full{grid-template-columns:minmax(0,1fr)}
@media (max-width:860px){.body{grid-template-columns:minmax(0,1fr)}}
.panel{min-width:0}
.pad{padding:0}

/* track header */
.th{height:var(--row);display:grid;grid-template-columns:22px minmax(0,1fr) 24px 24px;gap:6px;align-items:center;padding:0 4px 0 2px;cursor:pointer;background:var(--plate);border-left:3px solid transparent}
.th:hover{background:var(--plate3)}
.th.sel{border-left-color:var(--trig);background:var(--plate3)}
.th .sw{display:none}
.th .n{font:12px var(--mono);color:var(--print3);text-align:right}
.th .nm{display:flex;gap:7px;align-items:baseline;min-width:0;white-space:nowrap;overflow:hidden}
.th .nm b{font:500 13px var(--mono)}
.th .nm span{font-size:14px;color:var(--print2);overflow:hidden;text-overflow:ellipsis}
.ms{width:24px;height:22px;padding:0;font:600 11px var(--mono);letter-spacing:0;touch-action:none}
.ms.m[aria-pressed=true]{background:var(--rec);color:#fff}
.ms.s[aria-pressed=true]{background:var(--trig);color:var(--ink)}
.th.off .nm{opacity:.45}
.rail{display:grid;gap:2px;border-top:2px solid var(--print);padding-top:6px}

/* sequencer */
.toolbar{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;padding:0 0 12px}
.toolbar label{display:flex;gap:8px;align-items:center;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--print2)}
.toolbar input[type=range]{width:110px;accent-color:var(--trig)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--print2);margin-left:auto}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:14px;height:14px;border-radius:2px;display:inline-block;position:relative;background:var(--trig)}
.scroll{overflow-x:auto}
.seq{display:grid;gap:3px;min-width:max-content;border-top:2px solid var(--print);padding-top:6px}
.seq .r{display:grid;gap:3px;align-items:center}
.th.inrow{position:sticky;left:0;z-index:2}
.rul{height:18px;font:10px var(--mono);color:var(--print3);display:flex;align-items:end;padding-left:2px}
.rul.pgs{font:600 11px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--print2)}
.st{height:var(--row);border-radius:3px;background:var(--key);border:0;padding:0;position:relative;cursor:pointer;box-shadow:inset 0 -2px 0 rgba(0,0,0,.35)}
.st.q{background:var(--key2)}
.st.gap,.rul.gap{margin-left:10px}
.st:hover{filter:brightness(1.25)}
.st.on{background:var(--trig)}
.st.on.acc::after{content:"";position:absolute;left:4px;right:4px;top:4px;height:3px;background:var(--ink)}
.st.on.lk::before{content:"";position:absolute;right:4px;bottom:5px;width:6px;height:6px;background:var(--ink)}
.st.on.sl{background-image:linear-gradient(135deg,transparent 62%,color-mix(in srgb,var(--ink) 50%,transparent) 62%)}
.st.ph{box-shadow:0 0 0 2px var(--led),0 0 8px var(--led)}
.r.sel .st:not(.on){filter:brightness(1.3)}
.r.off .st.on{filter:saturate(.1) brightness(.6)}
.classic .st.on.lk::before{background:color-mix(in srgb,var(--ink) 35%,transparent)}

/* lock lane = the LCD */
.lanewrap{padding:16px 0 8px}
.lanetop{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:8px;border-top:2px solid var(--print);padding-top:8px}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{padding:3px 10px;font:500 12px var(--mono);letter-spacing:0}
.chip[aria-pressed=true]{background:var(--trig);color:var(--ink)}
.chip small{opacity:.7;margin-left:5px}
.lane{display:grid;gap:3px;min-width:max-content;padding:8px;background:var(--lcd);border-radius:4px;touch-action:none;user-select:none}
.lane .lh{position:sticky;left:0;z-index:2;background:var(--lcd);display:flex;align-items:center;height:120px;font:10px var(--pix);color:var(--ink);padding:0 8px 0 4px}
.lane .lh b{font:14px var(--pix);color:var(--ink)}
.lb{height:120px;position:relative;cursor:crosshair;overflow:hidden;border-bottom:1px solid color-mix(in srgb,var(--ink) 35%,transparent)}
.lb.gap{margin-left:10px}
.lb.none{background:repeating-linear-gradient(135deg,transparent 0 4px,color-mix(in srgb,var(--ink) 14%,transparent) 4px 6px);cursor:not-allowed}
.lb i{position:absolute;left:3px;right:3px;bottom:0;background:var(--ink);height:var(--h)}
.lb .base{position:absolute;left:0;right:0;height:0;border-top:1px dashed var(--ink);opacity:.55;bottom:var(--b)}
.lb.ph:not(.ws-seq .lb){background:color-mix(in srgb,var(--ink) 12%,transparent)}
.classic .lb i{opacity:.35}
.warnline{color:var(--rec);font-size:14px;margin:0 0 8px}

/* sound: printed sections, LCD screens */
.cols{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.sound3{display:grid;gap:22px;grid-template-columns:repeat(3,minmax(0,1fr));align-items:start}
@media (max-width:1180px){.sound3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:720px){.sound3{grid-template-columns:minmax(0,1fr)}}
.stack{display:grid;gap:22px}
.fx4{display:grid;gap:22px;margin-top:22px;grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1180px){.fx4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.fx4{grid-template-columns:minmax(0,1fr)}}
.card{border-top:2px solid var(--print);padding-top:8px;display:grid;gap:10px;align-content:start}
.card header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h3{margin:0;color:var(--print)!important}
.card header span{font:12px var(--mono);color:var(--print3)}
.ctl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}
.ctl.four{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:520px){.ctl.four{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pc{position:relative;height:34px;border-radius:3px;background:var(--key);color:var(--keytext);display:flex;justify-content:space-between;align-items:center;padding:0 8px;cursor:ew-resize;user-select:none;touch-action:none;overflow:hidden;box-shadow:inset 0 -2px 0 rgba(0,0,0,.35)}
.pc::after{content:"";position:absolute;bottom:0;left:0;height:3px;width:var(--f);background:var(--trig)}
.pc::before{display:none}
.pc span{position:relative;font:600 12px var(--sans);letter-spacing:.1em;color:var(--keydim)}
.pc b{position:relative;font:500 14px var(--mono);font-variant-numeric:tabular-nums;color:var(--keytext)}
.pc:hover{background:var(--key2)}
.pc.act{background:var(--key2);box-shadow:inset 0 0 0 1px var(--trig)}
.pc.lk span::after{content:"";display:inline-block;width:6px;height:6px;background:var(--led);margin-left:5px;vertical-align:1px}
.pc.empty{cursor:default;background:transparent;box-shadow:inset 0 0 0 1px var(--rule)}
.pc.empty::after{display:none}
canvas.ed{display:block;width:100%;height:150px;border-radius:4px;background:var(--lcd);touch-action:none}
canvas.ed.sm{height:96px}
.edhint{font-size:13px;color:var(--print3);margin-top:-4px}
.shapes{display:flex;gap:3px;flex-wrap:wrap}
.shapes button{padding:3px 5px;line-height:0}
.shapes button[aria-pressed=true]{background:var(--trig);color:var(--ink)}
.kv{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--print2)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.two label{display:grid;gap:4px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--print2)}
.headline{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:baseline;margin-bottom:16px}
.headline h2{margin:0;font:600 26px/1 var(--sans);letter-spacing:.04em}
.fam{font:600 12px var(--sans);letter-spacing:.14em;text-transform:uppercase;padding:3px 8px;border-radius:2px;background:var(--print);color:var(--plate)}

/* mix */
.strips{display:grid;grid-template-columns:repeat(16,minmax(56px,1fr));gap:4px;min-width:960px;border-top:2px solid var(--print);padding-top:8px}
.strip{padding:6px 3px;display:grid;gap:6px;justify-items:stretch;border-left:3px solid transparent}
.strip.sel{border-left-color:var(--trig);background:var(--plate3)}
.strip .top2{display:flex;justify-content:center;font:12px var(--mono);color:var(--print3)}
.strip .top2 i{display:none}
.fader{height:132px;position:relative;cursor:ns-resize;touch-action:none;user-select:none;display:grid;justify-items:center}
.fader .tr{width:6px;height:100%;border-radius:1px;background:var(--key);position:relative}
.fader .tr i{position:absolute;left:0;right:0;bottom:0;height:var(--f);background:var(--trig)}
.fader .cap2{position:absolute;left:50%;transform:translate(-50%,50%);bottom:var(--f);width:32px;height:14px;border-radius:2px;background:var(--key);box-shadow:inset 0 -2px 0 rgba(0,0,0,.4),inset 0 5px 0 -3px var(--keytext)}
.strip .v{text-align:center;font:13px var(--pix);background:var(--lcd);color:var(--ink);border-radius:2px;padding:1px 0}
.strip .pc{height:24px;padding:0 5px}
.strip .pc span{font-size:10px}.strip .pc b{font-size:11px}
.strip .nm{text-align:center;font:12px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip .mrow{display:flex;gap:3px;justify-content:center}

/* song */
.timeline{display:flex;gap:3px;overflow-x:auto;padding:8px;background:var(--lcd);border-radius:4px}
.blk{flex:none;height:44px;border-radius:2px;background:var(--ink);color:var(--lcd);font:11px var(--pix);display:flex;align-items:flex-end;padding:4px 6px}
.blk.cur{box-shadow:0 0 0 2px var(--plate),0 0 0 4px var(--ink)}
table.song{border-collapse:collapse;width:100%;min-width:680px;font-size:15px}
table.song th{font-weight:600;color:var(--print2);text-align:left;font-size:12px;letter-spacing:.16em;text-transform:uppercase;padding:8px 10px;border-bottom:2px solid var(--print)}
table.song td{padding:8px 10px;border-bottom:1px solid var(--rule)}
table.song tr.cur td{background:var(--plate3)}
table.song tr.cur td:first-child{box-shadow:inset 3px 0 0 var(--trig)}
table.song tr.jump td{color:var(--print2);font-style:italic}
.mutes{display:inline-grid;grid-template-columns:repeat(16,10px);gap:2px}
.mutes i{height:14px;border-radius:1px;background:var(--key)}
.mutes i.off{background:var(--rec)}

/* sampler */
.smpgrid{display:grid;gap:22px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:1000px){.smpgrid{grid-template-columns:minmax(0,1fr)}}
.slot.empty{opacity:.8}
.slot .route{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--print2)}
.slot .route b{font:500 12px var(--mono);color:var(--print)}
.memb{display:grid;gap:4px;min-width:260px}
.memb .bar{height:8px;background:var(--key);display:flex;overflow:hidden;border-radius:1px}
.memb .bar i{display:block;height:100%}
.chop{display:grid;gap:3px;min-width:max-content;padding:8px;background:var(--lcd);border-radius:4px}
.cp{height:54px;border-radius:2px;background:transparent;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink) 35%,transparent);padding:0;position:relative;cursor:pointer;font:12px var(--pix);color:var(--lcd);touch-action:none}
.cp.q{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink) 60%,transparent)}
.cp.gap{margin-left:10px}
.cp:hover{background:color-mix(in srgb,var(--ink) 12%,transparent)}
.cp.on{background:var(--ink);cursor:ns-resize}
.cp .sl{position:absolute;left:0;right:0;top:8px;text-align:center}
.cp .fx{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:9px}
.cp.ph{outline:2px solid var(--plate);outline-offset:-4px}
.romlist{border-collapse:collapse;width:100%;min-width:560px;font-size:15px}
.romlist th{font-weight:600;color:var(--print2);text-align:left;font-size:12px;letter-spacing:.16em;text-transform:uppercase;padding:7px 10px;border-bottom:2px solid var(--print)}
.romlist td{padding:6px 10px;border-bottom:1px solid var(--rule)}
.romlist td.e{color:var(--print3)}
.btnrow{display:flex;gap:6px;flex-wrap:wrap}

details.rules{border-top:2px solid var(--print);padding-top:10px;color:var(--print2);font-size:14px}
details.rules summary{cursor:pointer;color:var(--print);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:12px}
details.rules ul{margin:10px 0 0;padding-left:18px;columns:2 340px;column-gap:28px}
details.rules li{margin:0 0 5px;break-inside:avoid}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--lcd);color:var(--ink);font:12px var(--pix);padding:10px 16px;border-radius:3px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:10;box-shadow:0 0 0 3px var(--key)}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== Hardware-true pass (from panel photos) ===== */
:root{
  --plate:#d9dad6;--plate2:#cdcec9;--plate3:#e5e6e2;--print:#94552b;--print2:#7a5a44;--print3:#8d7a6c;--rule:#b99a80;--body:#2f2c29;
  --key:#3a4049;--key2:#4a525c;--keytext:#e9e4d6;--keydim:#a9aeb6;--cream:#e9e4d6;--creamtext:#2d2b27;
  --led:#ff3b2f;--ledoff:#8a3a33;--rec:#e0472e;--lcd:#b3c03c;--ink:#1f2a0e;--labfill:#b07a4a;--labtext:#f6efe3;--knob:#3a4049;
  --trig:var(--led);--oxblood:var(--print);
}
:root[data-plate="mk2"]{
  --plate:#161716;--plate2:#0f100f;--plate3:#232422;--print:#f1f0ea;--print2:#c9c8c1;--print3:#94938c;--rule:#5d5e59;--body:#ecebe5;
  --key:#232423;--key2:#30312f;--keytext:#ecebe5;--keydim:#8f908b;--cream:#ece6d6;--creamtext:#1f1e1b;
  --ledoff:#4d1714;--lcd:#ef5a39;--ink:#3a0e08;--labfill:#f1f0ea;--labtext:#111;--knob:#9a9ca0;
}
body{color:var(--body)}
.note,.edhint,.kv,.slot .route{color:var(--print2)}
.th .nm b,.th .nm span{color:var(--body)}.th .nm span{opacity:.75}
.headline h2{color:var(--body)}
button{background:var(--key);color:var(--keytext)}
button.cream,.key.cream{background:var(--cream);color:var(--creamtext)}
button.cream:hover{filter:brightness(.95);background:var(--cream)}

/* LED + printed label, the hardware's way of showing a mode */
.led{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ledoff);flex:none;vertical-align:middle}
.led.on{background:var(--led);box-shadow:0 0 6px 1px var(--led)}
.tabs{gap:18px}
.tabs button,.seg button{background:transparent;box-shadow:none;color:var(--print);display:inline-flex;align-items:center;gap:7px;padding:4px 2px}
.tabs button::before,.seg button::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ledoff);flex:none}
.tabs button[aria-selected=true],.seg button[aria-pressed=true]{background:transparent;color:var(--print)}
.tabs button[aria-selected=true]::before,.seg button[aria-pressed=true]::before{background:var(--led);box-shadow:0 0 6px 1px var(--led)}
.tabs button:hover,.seg button:hover{background:transparent;color:var(--body)}

.dlgbox .danger{background:var(--rec);color:#fff}
.dlgbox.first{max-width:600px}
.dlgbox ol{margin:0;padding-left:20px;display:grid;gap:4px}
.lcdbig{font:15px var(--pix);background:var(--lcd);color:var(--ink);padding:12px 14px;border-radius:3px;text-align:center}
.drop{display:grid;place-items:center;min-height:90px;border:2px dashed var(--print);border-radius:4px;cursor:pointer;padding:12px;text-align:center}
.drop.over{background:var(--plate3)}
.drop.ok{border-style:solid;border-color:var(--lcd);background:color-mix(in srgb,var(--lcd) 20%,transparent)}
.drop.bad{border-style:solid;border-color:var(--rec)}
.firstlink{margin:0}
.firstlink button{background:transparent;box-shadow:none;color:var(--print);font:600 11px var(--sans);letter-spacing:.14em;text-transform:uppercase;padding:0}
.warnchip{background:var(--rec)!important;color:#fff!important}

/* sub-bar removed: LCD line 2 carries each workspace's values */
.subbar{display:none!important}
.lcdpanel{grid-template-rows:auto auto;height:auto!important;padding:4px 2px 3px!important;row-gap:3px}
.lcd2{grid-column:1/-1;display:flex;gap:12px;align-items:baseline;padding:3px 9px 0;border-top:1px solid color-mix(in srgb,var(--ink) 30%,transparent);min-height:18px;white-space:nowrap;overflow:hidden}
.l2{display:inline-flex;gap:5px;align-items:baseline;font:12px var(--pix);color:var(--ink);text-transform:uppercase}
.l2 small{font:9px var(--pix);opacity:.75}
.l2 b{font-weight:400}
.l2.ed{cursor:pointer;border-radius:2px;padding:0 3px;margin:0 -3px}
.l2.ed:hover{background:color-mix(in srgb,var(--ink) 14%,transparent)}
.l2[data-l2="swing"],.l2[data-l2="accAmt"]{cursor:ns-resize}
.patkeys{height:auto!important;align-self:stretch}
.body{margin-top:4px}
.railhead{height:24px!important;align-items:center!important}
.rul{height:24px!important}
.pagectl.rh{display:flex;gap:6px;align-items:center;margin:0}
.pagectl.rh .pgkey{height:22px;padding:0 8px;font-size:10px}
.pagectl.rh .pleds{gap:5px;align-items:center}
.pagectl.rh .pl .led{width:7px;height:7px}
.pagectl.rh .ptog{margin:0;font-size:10px;letter-spacing:.08em;padding:0 1px;gap:3px}
.card header .machbtn{margin:-6px 0 -2px}
.songwarn{display:inline-flex;gap:8px;align-items:center;margin-left:12px;margin-right:auto}
/* fit the whole Sequence page at 1440x900 */
:root{--row:28px!important}
.pgrid.vert{grid-template-rows:14px repeat(8,19px)!important}
.pgrid.vert .pk{height:19px}
.lb{height:174px!important}
/* line 2 never widens the LCD: it takes line 1's width */
.lcd2{width:0;min-width:100%;text-overflow:ellipsis}

/* header v3: logo + WORKSPACE | TRANSPORT (centre) | LCD + SETUP; key rows on one line */
.brand{display:grid!important;gap:3px;line-height:1!important;align-self:flex-start!important;margin-top:20px}
.brand b{font:600 24px/1 var(--sans);letter-spacing:.08em;white-space:nowrap}
.brand b span{color:var(--oxblood)}
.brand small{font:600 9px var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--print2);white-space:nowrap}
.top{align-items:start!important}
.top .left,.rightgrp{align-items:flex-start!important}
.lcdgroup{margin-top:18px;align-self:flex-start!important}
.top .wsgroup,.trgroup{align-self:flex-start!important}
.top .left .wsgroup{grid-column:auto!important;justify-self:auto!important}
.soundgrid>.card:nth-child(-n+3),.ctlui>.card,.songui.lay2>.card,.songleft>.card:first-child,.smpmain>.card:first-child{border-top:0!important;padding-top:0!important}

/* LCD pattern arrows */
.patrow{display:inline-flex;align-items:center;gap:3px}
.lcdbtn{background:transparent!important;box-shadow:none!important;color:var(--ink)!important;padding:0 2px!important;font:14px var(--pix)!important;height:auto;min-width:0;border-radius:2px}
.lcdbtn:hover{background:color-mix(in srgb,var(--ink) 15%,transparent)!important}
/* EDIT group: undo / redo as real keys */
.skey .ico{font-style:normal;font-size:13px;line-height:7px;height:7px;display:block}
.skey:disabled{opacity:.4;cursor:default}
.skey small{min-width:1ch}
.firstlink{display:flex;gap:18px;align-items:center}
.platekey2{background:transparent!important;box-shadow:none!important;color:var(--print)!important;font:600 11px var(--sans)!important;letter-spacing:.14em;text-transform:uppercase;padding:0!important}
.platekey2 span{color:var(--led)}

/* header band: logo, key groups and LCD share one top and one bottom line */
:root{--hband:64px}
.top .left .brand{margin-top:18px!important;height:var(--hband);align-content:center}
.lcdgroup{margin-top:18px!important}
.lcdpanel{height:var(--hband)!important;box-sizing:border-box;align-content:space-between!important;padding:5px 2px 4px!important;overflow:hidden}
.lcdpanel .f b{font-size:13px!important;line-height:1.15}
.lcdpanel small{line-height:1}
.lcd2{padding-top:2px!important;min-height:0!important}
.setkeys .skey{padding:6px 9px 7px!important;letter-spacing:.1em}
.top{--hband:55px}
.top .left .brand{margin-top:0!important}
.lcdgroup{margin-top:0!important}
.lcdpanel{padding:4px 2px 3px!important}
.lcdpanel .f b{font-size:12px!important}
.tkey span,.skey span,.top .tabs button span{white-space:nowrap}
@media (max-width:1500px){
 .lcdpanel .f{padding:0 5px!important}
 .lcdpanel .f b{font-size:11px!important}
 .lcd2{gap:8px!important;padding:2px 5px 0!important}
 .l2{font-size:11px}
 .setkeys .skey{padding:6px 7px 7px!important;font-size:11px!important;letter-spacing:.08em}
 .top .tabs button{padding:6px 8px 7px!important;font-size:11px!important;letter-spacing:.1em}
 .tkey{padding:6px 9px 7px!important;min-width:0!important;font-size:11px!important}
 .brand b{font-size:21px}
 .top{column-gap:12px!important}.top .left,.rightgrp{gap:12px!important}
}
.top .brand b{font-size:19px!important;letter-spacing:.06em;line-height:1}
.top .brand small.ed{color:var(--led);font-size:13px!important;letter-spacing:.42em;font-weight:700;margin-top:3px;display:block}
/* v34: LCD + transport form one centred unit */
.top{grid-template-columns:1fr auto 1fr!important}
.midgrp{grid-column:2;display:flex;gap:14px;align-items:flex-start;justify-self:center}
.top .midgrp .wsgroup.trgroup{grid-column:auto!important;justify-self:auto!important}
.rightgrp{grid-column:3!important;justify-self:end}
.midgrp .lcdgroup{margin-top:0!important}
.midgrp .trgroup{margin-top:0!important}
/* v35: transport lives inside the LCD */
.lcdpanel{grid-template-columns:repeat(6,auto)!important}
.lcd2{grid-column:2/-1!important;grid-row:2}
.lcdsec{grid-column:1;grid-row:2;display:flex;gap:2px;padding:2px 5px 0;border-top:1px solid color-mix(in srgb,var(--ink) 30%,transparent)}
.lcdsec button{all:unset;cursor:pointer;flex:1;text-align:center;font:9px var(--pix);letter-spacing:.04em;text-transform:uppercase;color:var(--ink);opacity:.8;padding:0 2px;border-radius:2px}
.lcdsec button:hover{opacity:1;background:color-mix(in srgb,var(--ink) 15%,transparent)}
.lcdsec button:active{background:var(--ink);color:var(--lcd)}
.lcdt{display:flex;gap:3px}
.lcdt .lt{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:3px;height:16px;padding:0 5px;border-radius:2px;font:12px var(--pix);color:var(--ink);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink) 55%,transparent)}
.lcdt .lt:hover{background:color-mix(in srgb,var(--ink) 15%,transparent)}
.lcdt .lt .led,.lcdt .lt #recled{display:inline-block!important;width:5px!important;height:5px!important;margin:0!important;border-radius:50%;background:transparent!important;box-shadow:inset 0 0 0 1px var(--ink)!important}
.lcdt .lt[aria-pressed=true] {background:var(--ink);color:var(--lcd)}
.lcdt .lt[aria-pressed=true] .led,.lcdt .lt .led.on{background:var(--lcd)!important;box-shadow:none!important}
.lcdt .lt:active{background:var(--ink);color:var(--lcd)}
.midgrp{gap:0!important}
/* v35b: taller LCD, the header's centre */
.top{--lcdh:74px;align-items:center!important}
.top>.left,.top>.rightgrp,.top>.midgrp{align-self:center!important}
.lcdpanel{height:var(--lcdh)!important;padding:7px 3px 6px!important;align-content:space-between!important}
.lcdpanel .f{gap:4px!important}
.lcdpanel .f b{font-size:16px!important}
.lcdpanel small{font-size:10px!important}
.lcd2,.lcdsec{padding-top:5px!important}
.l2{font-size:12px}
.lcdt{gap:4px}
.lcdt .lt{height:20px;padding:0 7px;font-size:13px}
.lcdsec button{font-size:10px}
@media (max-width:1500px){.top{--lcdh:70px}.lcdpanel .f b{font-size:14px!important}.lcdpanel .f{padding:0 6px!important}.lcdt .lt{padding:0 5px}}
/* v36: big transport keys span both LCD rows */
.lcdpanel .trf{grid-row:1/3;align-content:space-between;padding-right:10px!important}
.row2{grid-column:2/-1;grid-row:2;display:flex;align-items:baseline;min-width:0;border-top:1px solid color-mix(in srgb,var(--ink) 30%,transparent)}
.row2 .lcd2{flex:1;width:auto!important;min-width:0!important;border-top:0!important}
.row2 .lcdsec{border-top:0!important;flex:none;gap:4px;padding:5px 7px 0!important;border-left:1px solid color-mix(in srgb,var(--ink) 35%,transparent)}
.lcdsec button{padding:0 3px!important}
.lcdt{gap:5px!important}
.lcdt .lt{height:40px!important;width:44px;padding:0!important;justify-content:center;font-size:20px!important;line-height:1;border-radius:3px;box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--ink) 70%,transparent)!important}
.lcdt .lt .led,.lcdt .lt #recled{display:none!important}
.lcdt .lt.rec[aria-pressed=true]{animation:blink 1s steps(2) infinite}
@media (max-width:1500px){.lcdt .lt{height:36px!important;width:38px;font-size:17px!important}}
/* v38: taller LCD, keys line up with the value row and line 2 */
.top{--lcdh:88px}
.lcdpanel{padding:10px 4px 10px!important;row-gap:8px!important}
.lcdpanel .trf{display:grid!important;grid-template-rows:auto 1fr;align-content:stretch!important;gap:4px!important}
.lcdt{align-self:stretch;align-items:stretch}
.lcdt .lt{height:auto!important;min-height:0}
.row2{align-items:center;padding-top:7px}
.row2 .lcd2,.row2 .lcdsec{padding-top:0!important;align-items:center}
@media (max-width:1500px){.top{--lcdh:82px}.lcdt .lt{height:auto!important}}
/* v39: square keys, thin line like the LCD dividers */
.lcdt .lt{width:auto!important;aspect-ratio:1/1;border-radius:2px!important;font-size:17px!important;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink) 55%,transparent)!important}
.lcdt .lt:hover{background:color-mix(in srgb,var(--ink) 12%,transparent)}
@media (max-width:1500px){.lcdt .lt{font-size:15px!important}.top{--lcdh:76px}.lcdt{gap:4px!important}.lcdpanel{row-gap:5px!important;padding:8px 4px!important}.row2{padding-top:4px!important}}
/* v41: lower LCD */
.top{--lcdh:74px}
.lcdpanel{padding:7px 4px!important;row-gap:4px!important}
.row2{padding-top:4px!important}
@media (max-width:1500px){.top{--lcdh:70px}.lcdpanel{padding:6px 4px!important;row-gap:3px!important}.row2{padding-top:3px!important}}
/* v42: engine switch lives in the LCD, footer removed */
.lcdpanel .engf{display:block}
.lcdeng.kselbtn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px;font:10px var(--pix);letter-spacing:.04em;text-transform:uppercase;color:var(--ink);white-space:nowrap}
.lcdeng.kselbtn:hover{text-decoration:underline}
.lcdeng svg{width:8px;height:5px}
.lcdeng .led{width:5px!important;height:5px!important;border-radius:50%}

/* =====================================================================
   MONOMACHINE EDITOR: plate, LEDs and the MM-only components.
   Everything above this line is the Machinedrum Editor design system, unchanged.
   ===================================================================== */

/* SFX-60 plate (MKI and MKII share it; the MKII only adds the "MKII" print).
   Colours from the emulator's mmSfx60 panel skin: silver chassis, dark-grey print,
   rust track labels, grey-green LCD in a black bezel, red / green / yellow trig LEDs. */
:root,:root[data-plate="mk1"],:root[data-plate="mk2"]{
  color-scheme:light;
  --plate:#d4d5d0;--plate2:#c8cac2;--plate3:#e2e1d9;--print:#383934;--print2:#56574f;--print3:#74756f;--rule:#aaaba5;--body:#292a26;
  --key:#3a3b36;--key2:#4b4d47;--keytext:#efefe8;--keydim:#aeb0a8;--cream:#efefe8;--creamtext:#292a26;
  --led:#e65d42;--ledoff:#7b4035;--ledg:#9fc568;--ledgoff:#56604b;--ledy:#e4c45c;--rec:#cf4f39;
  --lcd:#b9c4b0;--ink:#172014;--bezel:#0d0f0c;--labfill:#a04d39;--labtext:#f0eee7;--knob:#3a3b36;--rust:#a04d39;
  --trig:var(--led);--oxblood:var(--rust);
}
html{scrollbar-gutter:stable}
html,body{min-width:0!important}
.app{min-width:1240px!important}
body{overflow-x:hidden}

/* the LCD sits in a black bezel, like the hardware */
.lcdpanel{box-shadow:0 0 0 3px var(--bezel),inset 0 0 0 1px color-mix(in srgb,var(--ink) 14%,transparent)!important}
canvas.ed,.edblank,#lanescroll,.lcdroll,.slotgrid,.lcdbox{box-shadow:0 0 0 2px var(--bezel)}
.brand small.mk{font:600 9px var(--sans)!important;letter-spacing:.24em!important;color:var(--print2)!important;margin-top:2px}

/* ===== shared small parts ===== */
.led.g.on{background:var(--ledg);box-shadow:0 0 6px 1px var(--ledg)}
.led.y.on{background:var(--ledy);box-shadow:0 0 6px 1px var(--ledy)}
.keyrow{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.lkey{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;font:600 11px var(--sans);letter-spacing:.12em;text-transform:uppercase}
.lkey[aria-pressed=true]{background:var(--cream);color:var(--creamtext)}
.lkey[aria-pressed=true] .led{background:var(--led);box-shadow:0 0 6px 1px var(--led)}
.lkey:disabled{opacity:.4;cursor:default}
.lkey small{font:500 10px var(--mono);letter-spacing:0;opacity:.7}
.hint{font-size:13px;color:var(--print3)}
.hint b{color:var(--print2);font-weight:600}
.pc.dis{opacity:.35;pointer-events:none}
.pc .mod{position:absolute;right:4px;top:3px;font:9px var(--pix);color:var(--lcd);letter-spacing:0}
.pc.lfot{box-shadow:inset 0 -2px 0 rgba(0,0,0,.35),inset 0 0 0 1px var(--lcd)}
.pc.droptarget{outline:2px dashed var(--lcd);outline-offset:1px}
.pc.dropok{outline:2px solid var(--led);outline-offset:1px}
.tag{display:inline-block;font:600 10px var(--sans);letter-spacing:.14em;text-transform:uppercase;padding:2px 6px;border-radius:2px;background:var(--labfill);color:var(--labtext)}
.tag.ghost{background:transparent;color:var(--print2);box-shadow:inset 0 0 0 1px var(--rule)}
.card header .kv{flex-wrap:nowrap}

/* ===== rail ===== */
.sidesw{display:flex;gap:3px;margin:0 0 4px}
.sidesw button{flex:1;height:22px;padding:0;font:600 10px var(--sans);letter-spacing:.14em;text-transform:uppercase;display:inline-flex;gap:5px;align-items:center;justify-content:center}
.sidesw button .led{width:6px;height:6px}
.sidesw button[aria-pressed=true]{background:var(--cream);color:var(--creamtext)}
.sidesw button[aria-pressed=true] .led{background:var(--led);box-shadow:0 0 5px var(--led)}
.th .nm small{font:500 10px var(--mono);color:var(--print3);margin-left:auto}
.th.poly-off{opacity:.4}
.railsec{margin-top:10px;border-top:2px solid var(--print);padding-top:7px;display:grid;gap:5px}
.trigsel{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
.trigsel button{height:34px;padding:3px 0 0;display:grid;justify-items:center;gap:3px;font:600 10px var(--sans);letter-spacing:.1em}
.trigsel button .led{width:7px;height:7px}
.trigsel button[aria-pressed=true]{background:var(--cream);color:var(--creamtext)}
.trigsel button[aria-pressed=true] .led{background:var(--led);box-shadow:0 0 6px 1px var(--led)}
.pagetabs{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.pagetabs button{height:32px;padding:3px 0 0;display:grid;justify-items:center;gap:3px;font:600 8.5px var(--sans);letter-spacing:.04em;background:var(--key)}
.pagetabs button .led{width:6px;height:6px}
.pagetabs button[aria-pressed=true] .led{background:var(--led);box-shadow:0 0 5px var(--led)}
.pagetabs button.has::after{content:"";position:absolute}
.pkcol{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px}
.pkcol .pk{height:22px;width:auto}

/* ===== sequence grid: six tracks, note on every key ===== */
.mseq{display:grid;gap:3px;min-width:max-content}
.mrowg{display:grid;gap:3px;align-items:center}
.mst{position:relative;height:40px;border-radius:3px;border:0;padding:0;background:var(--key);box-shadow:inset 0 -2px 0 rgba(0,0,0,.35);cursor:pointer;--lamp:var(--led)}
.mst.q{background:var(--key2)}
/* 16-step boundary: the step grid stays perfectly equal (no space, no marker in or between cells);
   only the ruler number of a page start is bolder */
.mst.gap,.rul.gap,.tlane .tc.gap,.lb.gap{margin-left:0}
.rul.gap{font-weight:700;color:var(--ink)}
/* the roll, the ENV / SLIDE / SWING rows and the lock lane share one column grid: same template, same
   width, same left edge (items may shrink below their content so 1fr tracks stay equal) */
.mrowg>*,.tlane>*,#lane>*{min-width:0}
.lanewrap #lanescroll{padding-left:0!important;padding-right:0!important}
.mstack.all{min-width:0}
.mst:hover{filter:brightness(1.2)}
.mst.on{background-image:linear-gradient(var(--lamp),var(--lamp));background-repeat:no-repeat;background-position:center 5px;background-size:62% 5px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.35),inset 0 0 14px -6px var(--lamp)}
.mst.on.g{--lamp:var(--ledg)}
.mst.on.y{--lamp:var(--ledy)}
.mst .nt{position:absolute;left:0;right:0;bottom:6px;text-align:center;font:500 10.5px var(--mono);color:var(--keytext);letter-spacing:0;pointer-events:none;white-space:nowrap}
.mst .nt em{font-style:normal;color:var(--keydim);font-size:9px}
.mst.lk::before{content:"";position:absolute;right:4px;top:12px;width:5px;height:5px;background:var(--cream)}
.mst.sl::after{content:"";position:absolute;left:3px;top:12px;width:9px;height:5px;background:linear-gradient(135deg,transparent 45%,var(--cream) 45% 60%,transparent 60%)}
.mst.ph{box-shadow:0 0 0 2px var(--cream)!important}
.mst.dim{opacity:.35}
.mrowg.off .mst.on{filter:saturate(0) brightness(.7)}
.mrowg.sel .mst:not(.on){filter:brightness(1.25)}
.mseq .th{height:40px}
.mseq .rul{height:24px!important}

/* trig tracks of the selected track: every sub-track at once (the hardware cycles TRIG SELECT) */
.tlanes{display:grid;gap:2px;margin-top:10px;min-width:max-content}
.tlane{display:grid;gap:3px;align-items:center}
.tlane .tc{height:16px;border-radius:2px;background:transparent;box-shadow:inset 0 0 0 1px var(--rule);padding:0;cursor:pointer;position:relative}
.tlane .tc:hover{background:var(--plate3)}
.tlane .tc.on{background:var(--key);box-shadow:none}
.tlane .tc.on::after{content:"";position:absolute;left:30%;right:30%;top:5px;height:5px;border-radius:1px;background:var(--lamp,var(--led));box-shadow:0 0 4px var(--lamp,var(--led))}
.tlane .tc.na{opacity:.28;cursor:default;box-shadow:inset 0 0 0 1px var(--rule)}
.tlane .tc.ph{box-shadow:inset 0 0 0 2px var(--print)}
.tlane.amp .tc{--lamp:var(--led)}.tlane.flt .tc{--lamp:var(--ledy)}.tlane.lfo .tc{--lamp:var(--ledg)}.tlane.sld .tc{--lamp:var(--cream)}.tlane.swg .tc{--lamp:var(--keydim)}
.tlab{font:600 10px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--print2);display:flex;justify-content:space-between;align-items:center;padding-right:6px}
.tlab small{font:9px var(--mono);letter-spacing:0;color:var(--print3)}
.seqwrap{display:grid;grid-template-columns:minmax(0,1fr);gap:0}
.seqinfo{display:flex;gap:14px;align-items:center;margin:12px 0 6px;border-top:2px solid var(--print);padding-top:8px;height:34px;white-space:nowrap}
.seqinfo .legend{margin-left:auto}
.legend i.lg.g{background-image:linear-gradient(var(--ledg),var(--ledg))}
.legend i.lg.y{background-image:linear-gradient(var(--ledy),var(--ledy))}
.lanesvg{position:absolute;inset:0;pointer-events:none;overflow:visible}
.lanebox{position:relative}
.lb{height:150px!important}

/* ===== notes: piano roll ===== */
.notesgrid{display:grid;gap:18px}
.rollcard{display:grid;gap:8px}
.rollbar{display:flex;gap:14px;align-items:center;flex-wrap:nowrap;white-space:nowrap}
.rollbar .grow{flex:1}
canvas.roll{display:block;width:100%;height:330px;border-radius:4px;background:var(--lcd);touch-action:none;cursor:crosshair}
.notes3{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
.arpgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:16px;align-items:start}
.arptrack{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:2px;height:112px;padding:6px;background:var(--lcd);border-radius:4px;touch-action:none;user-select:none;position:relative}
.arptrack .ac{position:relative;border-radius:1px;cursor:ns-resize;background:color-mix(in srgb,var(--ink) 8%,transparent)}
.arptrack .ac.na{background:repeating-linear-gradient(135deg,transparent 0 3px,color-mix(in srgb,var(--ink) 16%,transparent) 3px 5px);cursor:e-resize}
.arptrack .ac .z{position:absolute;left:0;right:0;top:50%;border-top:1px dashed color-mix(in srgb,var(--ink) 45%,transparent)}
.arptrack .ac i{position:absolute;left:2px;right:2px;background:var(--ink)}
.arptrack .ac.mute i{background:transparent;box-shadow:inset 0 0 0 1px var(--ink)}
.arptrack .ac b{position:absolute;bottom:1px;left:0;right:0;text-align:center;font:8px var(--pix);color:var(--ink);font-weight:400}
.arptrack .ac.ph{background:color-mix(in srgb,var(--ink) 22%,transparent)}
.arplenrow{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:2px;padding:0 6px}
.arplenrow button{height:14px;padding:0;background:transparent;box-shadow:none;border-radius:1px;border-top:3px solid var(--rule)}
.arplenrow button.on{border-top-color:var(--ledg)}
.arplenrow button:hover{border-top-color:var(--print)}
.statemach{font:10px/1.7 var(--pix);background:var(--lcd);color:var(--ink);padding:8px 10px;border-radius:3px;box-shadow:0 0 0 2px var(--bezel);min-height:58px}
.statemach b{font-weight:400;background:var(--ink);color:var(--lcd);padding:0 4px}

/* ===== sound: four pages, three LFOs ===== */
.sound4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;align-items:stretch}
.sound4 canvas.ed{height:132px}
.sound4 .edblank{height:132px}
.sound4 .card{align-content:start}
.lfo3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:18px;align-items:start}
.lfo3 canvas.ed{height:92px}
.lfohead{display:flex;align-items:center;gap:8px}
.lfohandle{width:26px;height:26px;padding:0;display:grid;place-items:center;border-radius:50%;cursor:grab;background:var(--cream);color:var(--creamtext);font:11px var(--pix);flex:none;box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
.lfohandle:active{cursor:grabbing}
.lforoute{display:flex;gap:6px;align-items:center;flex-wrap:nowrap}
.lforoute .kselbtn{height:26px;min-width:0;width:auto;flex:1}
.lforoute .arrow{font:12px var(--pix);color:var(--print2)}
.shapes.w11 button{padding:2px 3px}
.shapes.w11 svg{width:22px;height:18px}
.cordsvg{position:fixed;inset:0;pointer-events:none;z-index:30}
.card .machbtn{width:auto!important;max-width:240px}
.soundnote{font-size:13px;color:var(--print3);margin-top:-4px;min-height:17px}

/* ===== mix: the routing graph ===== */
.routewrap{display:grid;gap:14px}
.routebar{display:flex;gap:16px;align-items:center;flex-wrap:nowrap;white-space:nowrap}
.routebar .grow{flex:1}
svg.route{display:block;width:100%;height:300px;border-radius:4px;background:var(--lcd);box-shadow:0 0 0 2px var(--bezel);user-select:none}
svg.route text{font-family:Silkscreen,ui-monospace,monospace;fill:var(--ink)}
svg.route .node rect{fill:var(--ink);cursor:pointer}
svg.route .node.sel rect.frame{fill:none;stroke:var(--ink);stroke-width:2}
svg.route .node text{fill:var(--lcd)}
svg.route .node.fx rect.body{fill:transparent;stroke:var(--ink);stroke-width:2}
svg.route .node.fx text{fill:var(--ink)}
svg.route .node.muted{opacity:.45}
svg.route .bus{stroke:var(--ink);stroke-width:3}
svg.route .bus.dim{opacity:.25}
svg.route .cord{fill:none;stroke:var(--ink);stroke-width:2}
svg.route .cord.dash{stroke-dasharray:5 4}
svg.route .cord.dot{stroke-dasharray:1.5 4;stroke-linecap:round;stroke-width:2.5}
svg.route .tap{fill:var(--ink)}
svg.route .jack{fill:transparent;stroke:var(--ink);stroke-width:2}
svg.route .jack.live{fill:var(--ink)}
.strips6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
.strip6{display:grid;gap:5px;padding:6px 6px 8px;border-left:3px solid transparent;align-content:start}
.strip6.sel{border-left-color:var(--led);background:var(--plate3)}
.strip6 .shead{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.strip6 .shead b{font:500 13px var(--mono);color:var(--body)}
.strip6 .shead span{font-size:12px;color:var(--print2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.busk{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.busk button{height:24px;padding:0;font:600 11px var(--mono);letter-spacing:0}
.busk button[aria-pressed=true]{background:var(--cream);color:var(--creamtext)}
.strip6 .kselbtn{height:26px}
.strip6 .inlab{font:600 10px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--print2)}
.flowl{font:11px/1.8 var(--pix);background:var(--lcd);color:var(--ink);padding:8px 12px;border-radius:3px;box-shadow:0 0 0 2px var(--bezel);text-transform:uppercase;display:grid;gap:0}
.flowl i{font-style:normal;opacity:.6}

/* ===== perform: keyboard, multi trig, multi map, assign ===== */
.perf{display:grid;gap:18px}
.perfbar{display:flex;gap:18px;align-items:center;flex-wrap:nowrap;white-space:nowrap}
.kbwrap{position:relative;display:grid;gap:6px}
.kb{position:relative;height:150px;user-select:none;touch-action:none}
.kb .w{position:absolute;top:0;bottom:0;border-radius:0 0 4px 4px;background:var(--cream);box-shadow:inset 0 0 0 1px var(--rule),inset 0 -6px 0 rgba(0,0,0,.08);cursor:pointer}
.kb .b{position:absolute;top:0;height:92px;border-radius:0 0 3px 3px;background:var(--key);box-shadow:inset 0 -4px 0 rgba(0,0,0,.35);z-index:2;cursor:pointer}
.kb .w.dn{background:var(--plate2)}
.kb .b.dn{background:var(--key2)}
.kb .w small{position:absolute;bottom:8px;left:0;right:0;text-align:center;font:500 10px var(--mono);color:var(--print3)}
.kb .zone{position:absolute;top:-8px;height:5px;border-radius:1px;z-index:3}
.kb .splitm{position:absolute;top:-14px;bottom:-4px;width:4px;margin-left:-2px;background:var(--led);box-shadow:0 0 8px var(--led);z-index:4;cursor:ew-resize;border-radius:2px}
.kb .splitm span{position:absolute;top:-2px;left:8px;font:10px var(--pix);color:var(--led);white-space:nowrap}
.mapbands{position:relative;height:22px}
.mapbands .band{position:absolute;top:0;bottom:0;border-radius:2px;background:var(--lcd);color:var(--ink);font:10px var(--pix);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px var(--ink);cursor:pointer;white-space:nowrap;overflow:hidden}
.mapbands .band.sel{background:var(--ink);color:var(--lcd)}
.trklamps{display:flex;gap:10px;align-items:center}
.trklamps span{display:inline-flex;gap:5px;align-items:center;font:600 11px var(--mono);color:var(--print)}
.perf3{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.1fr);gap:22px;align-items:start}
.perf3 canvas.ed{height:120px}
.joy{position:relative;width:150px;height:150px;border-radius:6px;background:var(--lcd);box-shadow:0 0 0 2px var(--bezel);touch-action:none;cursor:grab;flex:none}
.joy .cross{position:absolute;left:50%;top:0;bottom:0;border-left:1px dashed color-mix(in srgb,var(--ink) 45%,transparent)}
.joy .cross2{position:absolute;top:50%;left:0;right:0;border-top:1px dashed color-mix(in srgb,var(--ink) 45%,transparent)}
.joy .knobj{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 3px var(--lcd),0 0 0 5px var(--ink)}
.joy small{position:absolute;font:9px var(--pix);color:var(--ink)}
.asgn{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start}
.asrow{display:grid;grid-template-columns:22px minmax(0,1fr) minmax(0,1fr) 72px;gap:4px;align-items:center}
.asrow .kselbtn{height:28px}
.asrow .pc{height:28px}
.asrow>b{font:12px var(--pix);color:var(--print)}
table.mmap{border-collapse:collapse;width:100%;font-size:14px}
table.mmap th{font-weight:600;color:var(--print2);text-align:left;font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding:5px 6px;border-bottom:2px solid var(--print)}
table.mmap td{padding:4px 6px;border-bottom:1px solid var(--rule);white-space:nowrap}
table.mmap tr.sel td{background:var(--plate3)}
table.mmap tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--led)}
.mutes12{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:3px}
.mutes12 button{height:30px;padding:0;touch-action:none;display:grid;justify-items:center;align-content:center;gap:2px;font:500 11px var(--mono);letter-spacing:0}
.mutes12 button .led{width:6px;height:6px}
.mutes12 button.on .led{background:var(--ledg);box-shadow:0 0 5px var(--ledg)}
.mutes12 button:not(.on){background:var(--rec);color:#fff}
.mutelab{font:600 10px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--print2);margin-top:4px}

/* ===== song (MM): per-row transpose ===== */
.ttr{display:grid;grid-template-columns:34px repeat(6,minmax(0,1fr));gap:3px;align-items:center;flex:1}
.ttr .ilab{min-width:0}
.ttr .tt{display:grid;grid-template-columns:18px 1fr 18px;align-items:center;height:26px;background:var(--key);border-radius:3px;color:var(--keytext)}
.ttr .tt button{all:unset;cursor:pointer;text-align:center;font:600 12px var(--mono);color:var(--keydim)}
.ttr .tt button:hover{color:var(--keytext)}
.ttr .tt b{text-align:center;font:500 12px var(--mono)}
.ttr .tt.on{background:var(--cream);color:var(--creamtext)}.ttr .tt.on button{color:var(--creamtext)}
.mkeys.m12{grid-template-columns:repeat(6,minmax(0,1fr))!important}
.slotgrid{grid-template-columns:34px repeat(16,minmax(0,1fr))!important}

/* ===== sysex receive, the MM's one-way door ===== */
.recvsteps{display:grid;gap:6px;margin:0;padding-left:20px}
.recvsteps li b{font-weight:600}
.lcdbig.recv{letter-spacing:.06em}
body.learn .pc[data-g]{outline:1px dashed var(--print2);outline-offset:1px;cursor:pointer}
body.learn .pc.mapped{outline:2px solid var(--led)}
.pc.mapped:not(.lk) span::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--lcd);margin-right:4px;vertical-align:1px}
.rowst{height:40px;display:grid;align-content:center;gap:3px;padding-left:6px;font:600 10px var(--sans);letter-spacing:.1em;color:var(--print2)}
.rowst span{display:flex;gap:4px;align-items:center;white-space:nowrap}
.rowst .led{width:6px;height:6px}
.tlane .tlab{padding:0 6px 0 0;font-size:9.5px;justify-content:flex-end}	/* the rows' names in the left gutter, by their cells */
.lbscale{height:150px;display:grid;align-content:space-between;justify-items:end;text-align:right;padding:0 6px 0 0;font:9px var(--pix);color:var(--ink)}
.lbscale b{font-weight:400}
.lbscale span{display:grid;opacity:.75}.lbscale small{font:8px var(--pix)}
.ws-seq .rail .th,.ws-midi .rail .th{height:32px}
/* line 2 never widens the LCD (no jump between workspaces) */
.row2{width:0;min-width:100%;overflow:hidden}
.notes3{grid-template-columns:minmax(0,2fr) minmax(0,1fr)!important}
.rollcard header h3{white-space:nowrap}
.rollbar{justify-content:flex-end}
canvas.roll{height:300px}
.arpgrid{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)!important}
.arpgrid .seg{gap:9px;flex-wrap:wrap}
/* ===== one Sequence: overview rows, the expanded note lane, slide/swing, dock ===== */
.mst{height:32px}
.mst.on{background-position:center 4px;background-size:62% 4px}
.mst .nt{bottom:8px;font-size:10.5px}
.mst.lk::before{top:9px}
.mst.sl::after{top:9px}
.rowst{height:32px;gap:1px}
.mst .gt{position:absolute;left:3px;right:3px;bottom:3px;height:3px;border-radius:1px;background:var(--lamp);opacity:.75;pointer-events:none}
.mst .gt.gs{right:-3px}
.mst .gt.gm{left:-3px;right:-3px}
.mst .gt.ge{left:-3px}
.mst.gap .gt.gm,.mst.gap .gt.ge{left:-3px}
.mst:not(.on) .gt{background:var(--keydim);opacity:.6}
.lanehead{display:flex;gap:14px;align-items:center;white-space:nowrap;margin:10px 0 5px;border-top:2px solid var(--print);padding-top:7px;height:32px}
.lanehead .hint{overflow:hidden;text-overflow:ellipsis;min-width:0}
.lanehead .legend{margin-left:auto;flex:none}
.lanecv{min-width:max-content}
canvas.roll{width:100%;display:block;border-radius:4px;background:var(--lcd);box-shadow:0 0 0 2px var(--bezel);touch-action:none;cursor:crosshair}
.tlanes{margin-top:8px!important}
.tlane .tc.envc{display:flex;gap:2px;align-items:center;justify-content:center;box-shadow:none;background:transparent;cursor:default}
.tlane .tc.envc.na{opacity:.3}
.tlane .tc.envc .d{width:9px;height:9px;min-width:0;padding:0;border-radius:50%;background:transparent;box-shadow:inset 0 0 0 1.5px var(--print3);cursor:pointer}
.tlane .tc.envc .d.on.a{background:var(--led);box-shadow:0 0 4px var(--led)}
.tlane .tc.envc .d.on.f{background:var(--ledy);box-shadow:0 0 4px var(--ledy)}
.tlane .tc.envc .d.on.l{background:var(--ledg);box-shadow:0 0 4px var(--ledg)}
.tlane .tc.envc::after{display:none}
/* ALL (up to 64 steps in the width): the three trig-track dots stack in the narrow step */
.mstack.all .tlane .tc.envc{flex-direction:column;gap:1px}
.mstack.all .tlane .tc.envc .d{width:4px;height:4px;box-shadow:inset 0 0 0 1px var(--print3)}
.envlab{display:inline-flex;gap:2px;align-items:center;font:600 9px var(--sans);letter-spacing:.04em;color:var(--print2)}
.envlab i{width:6px;height:6px;border-radius:50%;margin-left:2px}.envlab i.a{background:var(--led)}.envlab i.f{background:var(--ledy)}.envlab i.l{background:var(--ledg)}
.dock{margin-top:10px;border-top:2px solid var(--print);padding-top:8px}
.docktabs{display:flex;gap:4px;align-items:center;height:30px;white-space:nowrap;margin-bottom:8px}
.docktabs .lkey[aria-selected=true]{background:var(--cream);color:var(--creamtext)}
.docktabs .lkey[aria-selected=true] .led{background:var(--led);box-shadow:0 0 6px 1px var(--led)}
.dockinfo{margin-left:12px;font-size:12px;color:var(--print3);overflow:hidden;text-overflow:ellipsis;display:flex;gap:10px;align-items:baseline}
.dockbody{height:158px;overflow:hidden}
.lanetop .docktabs{margin:0 0 0 auto;height:auto}
.lanewrap>.dockbody{height:auto;min-height:158px;overflow:auto;padding-top:8px}
.ws-seq .lanewrap>.dockbody{flex:1 1 auto;min-height:150px}
/* the arpeggiator, transpose and trig setup tabs: the LOCK PARAMETER keys have no meaning there */
.dock3{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) minmax(0,.9fr);gap:18px;align-items:start}
.dock .lb{height:120px!important}
.dock .lbscale{height:120px}
.dock #lanescroll{padding:6px 8px!important}
.dock .arptrack{height:96px}
.dock .statemach{min-height:0;font-size:9.5px;line-height:1.6}
.lanehead{position:sticky;left:0;max-width:100%}
.lanehead .hint{font-size:12px}
.sound4 .card header{flex-wrap:nowrap}
.sound4 .card header>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sound4 .machbtn{width:auto!important;grid-template-columns:auto auto 10px!important;max-width:190px}
.joy{width:128px!important;height:128px!important}
.asrow{grid-template-columns:16px 62px minmax(0,1fr) 70px!important}
.asrow .kselbtn{padding:0 6px;font-size:12px}
.sound4 .pc span,.lfo3 .pc span{letter-spacing:.04em;font-size:11px}
.sound4 .pc b{font-size:13px}
.sound4 .pc{padding:0 6px}
.mst .gt.gd{opacity:.28}
.kb .splitm span{top:18px;left:8px;background:var(--cream);padding:1px 4px;border-radius:2px}
/* ===== v3: one note sequencer, six stacked lanes ===== */
.rail .th{display:block!important;padding:0!important}
.threw{display:grid;grid-template-columns:22px minmax(0,1fr) 24px 24px;gap:6px;align-items:center;padding:0 4px 0 2px;height:100%}
.rail .th.tall .threw{height:34px}
.ws-seq .rail .th{height:34px}
.ws-seq .rail .th.tall{background:var(--plate3)}
.th .lockpick{margin:6px 6px 0 4px;border-top:1px solid var(--rule)!important;padding-top:6px}
.tallinfo{font:500 12px var(--mono);color:var(--print2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mstack{display:grid;gap:3px;min-width:max-content}
.nlane{position:relative;border-radius:4px}
.nlane canvas.roll{height:auto;box-shadow:0 0 0 1px color-mix(in srgb,var(--bezel) 60%,transparent)}
.nlane:not(.big) canvas.roll{cursor:pointer}
.nlane:not(.big):hover canvas.roll{box-shadow:0 0 0 2px var(--print2)}
.nlane.big canvas.roll{box-shadow:0 0 0 2px var(--bezel),0 0 0 4px var(--led)}
.attach{display:grid;grid-template-rows:auto auto 1fr;align-content:start;overflow:hidden}
.lanehint{height:22px;display:flex;align-items:center;white-space:nowrap;overflow:hidden;position:sticky;left:0}
.lanehint .hint{font-size:12px;overflow:hidden;text-overflow:ellipsis}
.attach .tlanes{margin-top:2px!important;height:58px}
.attach .dock{margin-top:6px;padding-top:6px;position:sticky;left:0}
.attach .dockbody{height:134px}
.attach .dock .lb{height:108px!important}.attach .dock .lbscale{height:108px}
.attach .docktabs{margin-bottom:6px}
.velbar{display:block;width:60%;height:12px;border-radius:1px;background:linear-gradient(to top,var(--led) var(--v),transparent var(--v));box-shadow:inset 0 0 0 1px var(--print3)}
.tlane .tc.envc .velbar{margin:auto}
.attach{width:0;min-width:100%}
.attach .tlanes{min-width:0!important}
/* the RECV / SEND n flag has a fixed slot, so the LCD never changes width */

/* the old .play key style must not resize the page LEDs while playing */
.pl.play{width:auto!important;height:auto!important;background:none!important;place-items:initial}
/* ===== v4: the MD Editor's Sequence layout, one roll for the selected track ===== */
.ws-seq .rail .th,.ws-sound .rail .th{height:var(--row)!important;background:transparent}
.rail .th.sel{background:var(--plate3)!important}
.seqtop{height:24px;display:flex;justify-content:flex-end;align-items:center;margin-bottom:3px}
.seqtop .pagectl{margin:0}
#seqscroll{overflow-x:auto}
.ws-seq .lanewrap{padding:12px 0 0!important}
.ws-seq .lb{height:124px!important}
.ws-seq .lbscale{height:124px}
.tlanes{margin-top:6px!important}
.railparams .pagetabs{margin-bottom:2px}
.seqcards{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr) minmax(0,1fr);gap:18px;margin-top:18px;align-items:start}
.seqcards .dock3{grid-template-columns:minmax(0,1fr);gap:10px}
.seqcards .arpc .dock3{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}
.seqcards .arpc .statemach{grid-column:1/-1;min-height:0}
.seqcards .arptrack{height:96px}
.ws-seq .lb{height:80px!important}
.ws-seq .lbscale{height:80px}
/* lock block fills down to the lock lane's bottom */
#rail .railparams{box-sizing:border-box;grid-template-rows:auto auto minmax(0,1fr);align-content:stretch}
#rail .railparams .pkcol{grid-auto-rows:minmax(0,1fr);align-content:stretch}
#rail .railparams .pkcol .pk{height:auto;min-height:0}
#rail .railparams .pagetabs button{height:30px}
#rail .railparams{gap:5px!important}
#rail .railparams .pagetabs button{height:22px;padding:0;grid-auto-flow:column;display:flex;align-items:center;justify-content:center;gap:3px}
#rail .railparams .pagetabs button .led{width:5px;height:5px}
#rail .railparams .rphead{height:22px}
/* ===== rules only at the bottom of rows (no double lines under the header) ===== */
.sound4 .card,.lfo3 .card,.seqcards .card,.perf .card{border-top:0!important;padding-top:0!important}
.sound4{border-bottom:2px solid var(--print);padding-bottom:12px}
.lfo3{border-bottom:2px solid var(--print);padding-bottom:12px;margin-top:12px!important}
.seqcards{margin-top:12px!important}
.card header.tipped{cursor:help}
.card header.tipped h3::after{content:" ⓘ";font-size:10px;color:var(--print3);letter-spacing:0}
/* ===== Sound: dense, one screen ===== */
.sound4 canvas.ed,.sound4 .edblank{height:86px!important}
.sound4 .card{gap:8px}
.sound4 .pc,.lfo3 .pc,.seqcards .pc{height:28px}

/* ===== boot screen inside the LCD (absolute: the LCD keeps its width) ===== */
.lcdpanel{position:relative}

.bootscr .bsbar i{display:block;height:100%;width:0;background:var(--ink);transition:width .2s steps(4)}
/* a host's own LCD picture (MMView.setLcd: the machine's screen while it starts), cross-faded out */
.bootscr.fw{padding:0;gap:0;place-items:center;align-content:center;transition:opacity .45s ease}

/* ===== v5: Sequence rebalance: the roll takes what is left, the lock lane gets MD height ===== */
#seq canvas.roll[data-big]{height:clamp(240px,calc(100vh - 512px),640px)!important}
.ws-seq .lb{height:170px!important}
.ws-seq .lbscale{height:170px}
/* MD v58/v59: no LCD panel behind the lane; keys with LED meters */
.ws-seq #lanescroll{background:transparent!important;box-shadow:none!important;padding:0!important}
.ws-seq .lb{border-bottom:0!important;border-radius:3px!important;overflow:hidden}
.ws-seq .lb:not(.none){background:var(--key)!important;box-shadow:inset 0 -2px 0 rgba(0,0,0,.35)!important}
.ws-seq .lb:not(.none)::after{content:"";position:absolute;left:22%;right:22%;top:8px;bottom:6px;z-index:0;background:repeating-linear-gradient(to top,color-mix(in srgb,var(--led) 16%,transparent) 0 5px,transparent 5px 8px)}
.ws-seq .lb i{position:absolute;z-index:1;left:22%!important;right:22%!important;max-height:calc(100% - 14px);background:repeating-linear-gradient(to top,var(--led) 0 5px,transparent 5px 8px)!important;filter:drop-shadow(0 0 3px color-mix(in srgb,var(--led) 70%,transparent))}
.ws-seq .lb i.bp.dn{background:repeating-linear-gradient(to bottom,var(--led) 0 5px,transparent 5px 8px)!important}
.ws-seq .lb .base{position:absolute;left:0;right:0;z-index:2;height:0;border-top:1px dashed var(--keytext)!important;opacity:.55}
.ws-seq .lb .mid{position:absolute;left:0;right:0;z-index:2;top:calc(8px + (100% - 14px)*.5);border-top:1px solid color-mix(in srgb,var(--keytext) 60%,transparent)}
.ws-seq .lb:not(.none):hover{filter:brightness(1.18)}
.ws-seq .lb.none{background:var(--key)!important;opacity:.28!important}
.ws-seq .lbscale{color:var(--print2)}
/* rail lock block: MD key size (one column of 8, like DATA ENTRY A-H) */
#rail .railparams .pkcol{grid-template-columns:minmax(0,1fr)!important;grid-auto-rows:minmax(18px,1fr)!important}
#rail .railparams .pagetabs button{height:24px}
/* ===== Sound fills the height: canvases and spacing grow with the viewport ===== */
.sound4 canvas.ed,.sound4 .edblank{height:clamp(86px,calc(50vh - 364px),220px)!important}
.lfo3 canvas.ed{height:clamp(50px,calc(35vh - 265px),150px)!important}
.sound4 .card,.lfo3 .card,.seqcards .card{gap:clamp(6px,calc(2vh - 10px),14px)!important}
.sound4{padding-bottom:clamp(12px,calc(3vh - 15px),22px)!important}
.lfo3{padding-bottom:clamp(12px,calc(3vh - 15px),22px)!important;margin-top:clamp(12px,calc(3vh - 15px),22px)!important}
.seqcards{margin-top:clamp(12px,calc(3vh - 15px),22px)!important}
.seqcards .arptrack{height:clamp(62px,calc(20vh - 118px),120px)!important}
/* ===== Control fills the height ===== */
.srch,.mxc{height:clamp(36px,calc((100vh - 290px)/10 - 3px),60px)!important}
.sound4 canvas.ed,.sound4 .edblank{height:clamp(86px,calc(50vh - 300px),250px)!important}
.lfo3 canvas.ed{height:clamp(50px,calc(40vh - 268px),170px)!important}
#seq canvas.roll[data-big]{height:clamp(240px,calc(100vh - 462px),680px)!important}
#rail .railparams .pkcol{grid-auto-rows:minmax(0,1fr)!important;gap:2px!important}
#seq canvas.roll[data-big]{height:clamp(240px,calc(100vh - 498px),660px)!important}
.ws-seq .lb{height:190px!important}
.ws-seq .lbscale{height:190px}
/* fill the height on Perform, Mix and Control too */
.kb{height:clamp(130px,calc(100vh - 424px),560px)!important}
.perf.map .kb{height:clamp(110px,calc(100vh - 752px),420px)!important}
.srch,.mxc{height:clamp(36px,calc((100vh - 222px)/10 - 3px),72px)!important}
.kb{height:clamp(130px,calc(100vh - 436px),560px)!important}
.perf.map .kb{height:clamp(110px,calc(100vh - 740px),420px)!important}
.kb{height:clamp(130px,calc(100vh - 436px),680px)!important}
.srch,.mxc{height:clamp(36px,calc((100vh - 222px)/10 - 3px),90px)!important}
#seq .nlane{width:0;min-width:100%}
#seq canvas.roll{width:100%!important;min-width:0;max-width:100%}
/* v6: compact rail lock block: title on the lane title line, keys at the lane bottom, spare height in between */
#rail .railparams{grid-template-rows:auto minmax(0,1fr) auto auto!important;gap:4px!important}
#rail .railparams::after{content:none}
#rail .railparams .lpspace{min-height:0}
#rail .railparams .pagetabs{grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:3px;margin:0!important}
#rail .railparams .pagetabs button{height:26px!important;display:flex;align-items:center;justify-content:center;gap:5px;padding:0 4px;font:600 11px var(--sans)!important;letter-spacing:.08em;white-space:nowrap;overflow:visible}
#rail .railparams .pagetabs button .led{width:6px!important;height:6px!important}
#rail .railparams .pkcol{grid-template-columns:repeat(2,minmax(0,1fr))!important;grid-auto-rows:26px!important;gap:3px!important}
#rail .railparams .pkcol .pk{height:26px!important;font-size:12px;padding:0 6px}
/* ===== v7: MM lock lane = small MM LCD windows (pale LCD, ink segments), not the MD's red LEDs ===== */
.ws-seq .lb:not(.none){background:var(--lcd)!important;box-shadow:0 0 0 1px var(--bezel),inset 0 0 0 1px color-mix(in srgb,var(--ink) 18%,transparent)!important}
.ws-seq .lb:not(.none)::after{background:repeating-linear-gradient(to top,color-mix(in srgb,var(--ink) 11%,transparent) 0 5px,transparent 5px 8px)!important}
.ws-seq .lb i{background:repeating-linear-gradient(to top,var(--ink) 0 5px,transparent 5px 8px)!important;filter:none!important}
.ws-seq .lb i.bp.dn{background:repeating-linear-gradient(to bottom,var(--ink) 0 5px,transparent 5px 8px)!important}
.ws-seq .lb .base{border-top:1px dashed var(--ink)!important;opacity:.7}
.ws-seq .lb .mid{border-top:1px solid color-mix(in srgb,var(--ink) 70%,transparent)!important}
.ws-seq .lb:not(.none):hover{filter:none;background:color-mix(in srgb,var(--lcd) 86%,var(--ink))!important}
.ws-seq #lane:active .lb:not(.none):hover{background:color-mix(in srgb,var(--lcd) 80%,var(--ink))!important}
.ws-seq .lb.none{background:var(--key)!important;opacity:.28!important;box-shadow:none!important}
/* the trig type as a small state mark at the top of the slot: red = all trigs, green = part / trigless (panel LED colours) */
.ws-seq .lb:not(.none)::before{content:""!important;display:block!important;position:absolute;left:30%;right:30%;top:2px;height:3px;border-radius:1px;z-index:2;background:var(--led)}
.ws-seq .lb.k-part::before,.ws-seq .lb.k-trigless::before{background:var(--ledg)}
/* Soft gliding playhead (as the MD Editor, v45): one ink-tinted column over the roll, the
   ENV/SLIDE/SWING rows and the lock lane, instead of per-cell boxes in the Sequence. B-008: a 2 px edge, so it reads at a
   glance (and, through deskCompat.js, on an older WebKit too) */
#phcol{position:fixed;left:0;top:0;pointer-events:none;z-index:3;opacity:0;border-radius:5px;will-change:transform;
 background:linear-gradient(to bottom,color-mix(in srgb,var(--ink) 20%,transparent),color-mix(in srgb,var(--ink) 11%,transparent));
 box-shadow:0 0 0 2px color-mix(in srgb,var(--ink) 75%,transparent),0 0 12px color-mix(in srgb,var(--ink) 30%,transparent);mix-blend-mode:multiply}
.ws-seq #seq .tc.ph{box-shadow:none!important;outline:none!important}
/* ===== P7 LAYOUT: the page fills the window and scales with it (as the MD Editor) =====
   Fixed bars and fluid rows. Sequence: the piano roll takes what the lock lane leaves, the lane keeps
   at least 150 px and ends at the window's bottom. Mix: the faders and the routing diagram share the
   height, so the page never runs under the Dock. */
html,body{height:100%}
body{box-sizing:border-box;overflow:hidden}
.app{height:100%;min-height:0;grid-template-rows:auto minmax(0,1fr);max-width:none!important}
.app>.body{height:100%;min-height:0;align-items:stretch!important}
#main{min-height:0;overflow:auto;display:flex;flex-direction:column}
#main>*{flex:none}
.rail{align-content:start;min-height:0}
/* Sequence */
.ws-seq #main>.lanewrap{display:flex;flex-direction:column;flex:1 1 auto;min-height:0}
.ws-seq .lanewrap>#lanescroll{flex:1 1 auto;min-height:150px;display:flex;flex-direction:column}
.ws-seq .lanewrap .lanebox{flex:1 1 auto;display:flex;flex-direction:column;min-height:0}
.ws-seq #lane{flex:1 1 auto;min-height:0;align-items:stretch!important}
.ws-seq .lb{height:auto!important;min-height:120px}
.ws-seq .lanewrap{padding-top:8px!important}
.ws-seq .lanetop{border-top:0!important;padding-top:0!important}
/* Mix: the faders and the routing diagram share the height */
/* the routing graph is as tall as its width needs (no letterbox); the strips' faders take the rest of the page, up to a
   fader's length (470 px strips, B-004), and the routing follows right under them: a window taller than that has its
   room under the page, not as a gap between the strips and the routing */
#main>.routewrap{flex:1 1 auto;min-height:0;grid-template-rows:minmax(0,470px) auto auto auto;align-content:start}
#main>.routewrap>.strips6{min-height:0;max-height:470px}
svg.route{width:100%;height:auto;aspect-ratio:1200/146;min-height:0}
/* Shift + M prepares a mute, as the MD Editor (P7): "+" unmute, "X" mute, blinking until Shift comes up */
.ms.m.prep{box-shadow:inset 0 0 0 2px var(--led);position:relative;color:transparent!important}
.ms.m.prep::after{content:attr(data-prep);position:absolute;inset:0;display:grid;place-items:center;font:700 12px var(--pix);color:var(--keytext);animation:blink .5s steps(2) infinite}
@media (prefers-reduced-motion:reduce){.ms.m.prep::after{animation:none}}
/* ===== Mix: a channel strip (signal order, top to bottom) =====
   head · trim (AMP VOL, DIST, DSND: the sound's own values) · PAN bar · LEVEL fader with its scale and readout ·
   OUT buses · IN · M / S. Every row has a fixed height except the fader's, so the six strips line up. */
#main>.routewrap .strip6{grid-template-rows:auto auto auto minmax(0,1fr) auto auto auto;align-content:stretch}
.strip6 .shead{justify-content:flex-start;gap:6px;min-width:0}
.strip6 .shead .mc{font-weight:600}
.strip6 .shead span{margin-left:auto;font-size:11px;min-width:0}
/* trim: three small two-line boxes, label over value */
.strip6 .trim{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px}
.strip6 .pc.mini{height:32px;padding:2px 6px 4px;display:grid;grid-template-rows:auto auto;align-content:center;justify-content:stretch;gap:1px}
.strip6 .pc.mini span{font-size:9px;letter-spacing:.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip6 .pc.mini b{font-size:13px;line-height:1}
.strip6 .pc.mini .mod{top:2px;right:3px}
/* PAN: one bar, L to R, with the centre detent */
.strip6 .pc.pan{height:24px;padding:0 6px;display:flex;justify-content:flex-start;gap:6px;align-items:center;cursor:ew-resize}
.strip6 .pc.pan span{flex:none;order:0}.strip6 .pc.pan .pt{flex:1 1 auto;order:2}.strip6 .pc.pan b{flex:none;order:3;width:3.4ch}
.strip6 .pc.pan::after,.strip6 .pc.pan.bip::before{display:none!important}
.strip6 .pc.pan span{font-size:9px;letter-spacing:.08em}
.strip6 .pc.pan b{font-size:12px;text-align:right}
.strip6 .pc.pan .pt{position:relative;height:6px;border-radius:1px;background:color-mix(in srgb,var(--keytext) 16%,transparent)}
.strip6 .pc.pan .pt::before{content:"";position:absolute;left:50%;top:-4px;bottom:-4px;width:1px;background:var(--keydim)}
.strip6 .pc.pan .pt::after{content:"";position:absolute;top:0;bottom:0;left:var(--pl);width:var(--pw);background:var(--trig)}
.strip6 .pc.pan .mod{position:static;order:1;flex:none}
/* LEVEL: the scale, the fader, the readout */
.strip6 .lvl{display:grid;grid-template-columns:minmax(0,1fr) 44px minmax(0,1fr);align-items:stretch;min-height:96px;padding:9px 0 7px;border-top:1px solid var(--rule)}
.strip6 .lvl .scale{position:relative;margin-right:4px}
.strip6 .lvl .scale i{position:absolute;right:0;transform:translateY(50%);font:500 9px/1 var(--mono);font-style:normal;color:var(--print2);display:flex;align-items:center;gap:3px}
.strip6 .lvl .scale i::after{content:"";width:6px;border-top:1px solid var(--print2)}
.strip6 .lvl .fader{height:auto!important;min-height:0;width:100%}
/* the LEVEL value rides beside the fader cap; the column's caption names the fader */

/* The header's LCD as one real display (P7), one stylesheet for both editors (skins/shared/). One dot grid: labels are 8 px Silkscreen (one dot = 1 px) and values 16 px (two

 background-image:radial-gradient(circle at 1px 1px,color-mix(in srgb,var(--ink) 9%,transparent) .55px,transparent .75px)!important;background-size:2px 2px!important;
 grid-template-rows:minmax(0,1fr) auto!important;row-gap:0!important;padding:6px 4px 5px!important;align-content:stretch!important}

.row2{border-top:var(--lrule)!important;padding-top:5px!important;margin-top:0!important;align-items:center!important;height:18px;box-sizing:content-box}

.l2{gap:6px!important;align-items:center!important}
.row2 .lcdsec{border-left:var(--lrule)!important;padding:0 7px!important;align-self:stretch;align-items:center}
.lcdpanel .led{width:5px!important;height:5px!important;border-radius:50%}

.syncf{flex:none;display:inline-flex;align-items:center;gap:6px;box-sizing:border-box;width:calc(8ch + 29px);padding:0 9px;border-left:var(--lrule);align-self:stretch;font:12px/12px var(--pix);letter-spacing:normal;text-transform:uppercase;color:var(--ink);white-space:nowrap;overflow:hidden}
