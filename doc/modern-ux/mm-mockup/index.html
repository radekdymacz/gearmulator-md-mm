/* ===== Kit library + Pattern chooser (from the MD Editor v50), adapted to the Monomachine =====
   MM: 128 kits (plus the UNDO KIT), 128 patterns in 8 banks A-H of 16, kit names 11 characters (SysEx 0x55).
   Every MM pattern recalls its kit (1-18); there is no CLASSIC mode. A kit or pattern DUMP is only taken on
   GLOBAL > FILE > SYSEX RECV, so every write that is a dump goes through the RECV / SEND flow.
   With a host the slot ops are its machine's intents (HOST.library: kitCopy, kitPaste, kitCopyTo, kitClear, kitRename,
   patCopy, patPaste, patCopyTo, patClear, DESIGN-UNIFY.md phase 7): its core asks before one loses something, and
   the slots come back as its documents (MMView.setKitSlot, setPatternSlot). On its own the example engine's library
   below plays them, with its own questions. */
var LIB={open:null,sel:0,renaming:null,drag:null,sig:""};
const clone=o=>JSON.parse(JSON.stringify(o));
const nn=k=>String(k+1).padStart(2,"0");
const escH=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const KNAME=11;
/* Name characters: SysEx 0x55 takes 11 ASCII bytes (7-bit). Which of them the MM font draws is not checked, so the mockup keeps to a safe set. */
const KBAD=/[^A-Z0-9 \-.\/+&!?'#*():]/g;
const KITN={0:"MONOMACHINE",1:"ACID BATH",2:"VOCODED",3:"FM BELLS",4:"DIGI CHOIR",5:"SID LEADS",6:"NOISE TOYS",7:"DUB CHORDS"};
/* kit content (1-18): machines + all DATA pages, LFOs, MIDI page, routing, trig and multi-trig settings, multi env, name */
function captureKit(){return clone({tracks:S.tracks.map(t=>({m:t.m,name:t.name,v:t.v,lev:t.lev,out:t.out,inp:t.inp,trigpos:t.trigpos,port:t.port,leg:t.leg,assign:t.assign})),midi:S.midi.map(t=>({v:t.v,cc:t.cc,ch:t.ch,name:t.name})),multi:S.multi,menv:S.menv})}
const FACTORY=captureKit();
const FKM=[["SWAVE-PULS","FM+STAT","SID-6581","DPRO-WAVE","GND-NOIS","FX-CHORUS"],["VO-6","SWAVE-ENS","FM+DYN","DPRO-BBOX","SID-6581","FX-REVERB"]];
function setMach(d,i,m){const t=d.tracks[i];t.m=m;t.v.SYN=synDefaults(m);t.name=machName(m);t.inp=isFx(m)?(i?"NEIBOR":"INP AB"):t.inp}
function factoryKit(k){const d=clone(FACTORY);if(!k)return d;const set=FKM[k%2];d.tracks.forEach((t,i)=>{if((k+i)%3===0)setMach(d,i,set[i]);Object.values(t.v).forEach(a=>a.forEach((x,j)=>a[j]=clamp(x+(k*37+i*11+j*5)%21-10)))});return d}
function clearedKit(){const d=clone(FACTORY);d.tracks.forEach((t,i)=>{t.m="GND-SIN";t.name="Sine";t.v={SYN:synDefaults("GND-SIN"),AMP:[...DEFV.AMP],FLT:[...DEFV.FLT],EFX:[...DEFV.EFX],LF1:[...DEFV.LFO],LF2:[...DEFV.LFO],LF3:[...DEFV.LFO]};t.lev=100;t.out={AB:true,CD:false,EF:false};t.inp="NEIBOR";t.trigpos=null});return d}
S.kits=Array.from({length:128},(_,k)=>({name:KITN[k]||"",empty:!KITN[k],data:null}));S.workName=S.kits[0].name;
function kitData(k){const s=S.kits[k];return s.data?clone(s.data):s.empty?clearedKit():factoryKit(k)}
function pruneLocks(){for(const k of [...S.locks.keys()]){const[t,p]=k.split("|");if(!pname(+t,p))S.locks.delete(k)}if(!pname(S.sel,S.lane)){S.lane=isMidiT(S.sel)?"MID.1":"FLT.1";S.lanePage=S.lane.split(".")[0]}}
function applyKit(d){d=clone(d);S.tracks.forEach((t,i)=>Object.assign(t,d.tracks[i]));S.midi.forEach((t,i)=>Object.assign(t,d.midi[i]));S.multi=d.multi;S.menv=d.menv;pruneLocks()}
/* pattern content (1-53): notes, locks, kit link, MIDI notes, arp / transpose / swing / slide per track; plus scale setup */
const packSeq=t=>({steps:t.steps,slide:[...t.slide],swing:[...t.swing],arp:t.arp,tr:t.tr});
function capturePat(){return clone({len:S.len,mult:S.mult,swingAmt:S.swingAmt,patTrn:S.patTrn,tr:[...S.tracks,...S.midi].map(packSeq),locks:[...S.locks].map(([k,m])=>[k,[...m]])})}
function emptyPat(len){return{len,mult:"1X",swingAmt:50,patTrn:64,tr:[...S.tracks,...S.midi].map(()=>({steps:Array(64).fill(null),slide:[],swing:[1,3,5,7,9,11,13,15].flatMap(x=>[x,x+16,x+32,x+48]),arp:newArp(),tr:{TRACK:64,SCALE:0,KEY:0}})),locks:[]}}
function applyPat(d){d=clone(d);S.len=d.len;S.mult=d.mult;S.swingAmt=d.swingAmt;S.patTrn=d.patTrn;[...S.tracks,...S.midi].forEach((t,i)=>{const x=d.tr[i];t.steps=x.steps;t.slide=new Set(x.slide);t.swing=new Set(x.swing);t.arp=x.arp;t.tr=x.tr});S.locks=new Map(d.locks.map(([k,m])=>[k,new Map(m)]));pruneLocks()}
S.patInfo=Array.from({length:128},(_,p)=>({has:p<8,len:[32,16,32,64,16,48,32,16][p%8]}));S.patData={};
(()=>{const base=capturePat();for(let p=1;p<8;p++){const d=clone(base),r=(p*2)%d.len,tn=[0,5,7,-2,3,-5,10,12][p];d.len=S.patInfo[p].len;
 d.tr.forEach((x,i)=>{const s=x.steps.slice(0,32);x.steps=Array.from({length:64},(_,k)=>{const st=s[(k+r)%32];if(!st||!st.n||i===4)return st&&clone(st);return{...clone(st),n:st.n.map(n=>clamp(n+tn))}})});d.locks=[];S.patData[p]=d}})();
const curHas=()=>[...S.tracks,...S.midi].some(t=>t.steps.slice(0,S.len).some(Boolean));
const linked=k=>Array.from({length:128},(_,p)=>p).filter(p=>S.patKit[p]===k&&hasPat(p));
const kDisp=k=>k===S.kit?S.workName:S.kits[k].name;

/* firmware honesty: what each action is on the real machine */
const KTIP={
 load:"LOAD KIT (SysEx 0x58). Unsaved edits are discarded; the machine keeps them in its UNDO KIT (the first entry of its kit list). A kit loaded from the KIT menu becomes the current pattern's kit (1-12); whether a SysEx LOAD KIT relinks the pattern too is not tested",
 save:"SAVE KIT to the current slot (SysEx 0x59). The overwritten slot goes to the machine's UNDO KIT (1-20)",
 saveas:"SAVE KIT n to the selected slot (SysEx 0x59). On the MD, SAVE KIT n also makes n the current kit (P1); the editor assumes the same on the MM (not measured). The old slot keeps what it had",
 copy:"Reads the slot with a kit dump request (0x53). A request returns the stored slot, so the current kit's unsaved edits come from the editor's own copy",
 paste:"Kit dump (0x52) into the slot. The MM only takes a dump on GLOBAL › FILE › SYSEX RECV, so it goes through RECV (emulator) or SEND n (hardware). The emulator crosses two receive passes per kit dump. Pasting into the current kit then needs LOAD KIT (0x58) to be heard",
 clear:"There is no SysEx CLEAR KIT. The editor sends a kit dump with the empty kit: six GND-SIN machines and default pages, as the machine's own empty kit (1-19). Goes through SYSEX RECV",
 rename:"Current kit: SysEx 0x55 sets the working kit's name (11 ASCII bytes); SAVE stores it. Other slots: dump request, new name, dump back through SYSEX RECV. Which characters the MM font draws is not checked",
 reload:"LOAD KIT on the current slot (0x58): the edits are discarded. The machine keeps them in its UNDO KIT",
 drag:"Drag onto another slot to copy it: dump request, then a dump into the target (through SYSEX RECV)"};
const PTIP={
 go:"LOAD PATTERN (SysEx 0x57). While playing, the machine switches at the pattern end (1-45); the editor keeps the queue itself. The pattern also loads its kit (1-18)",
 now:"Switch now (Shift+click). Stopped: the same as a click. Playing: the machine only switches at the pattern end, so the editor would send STOP, LOAD PATTERN, PLAY (not tested)",
 copy:"Pattern dump request (0x68). Copies notes, locks, MIDI notes, arp / transpose / swing / slide and the kit link, like the machine's COPY PATTERN (1-53)",
 paste:"Pattern dump (0x67) into the slot. The MM only takes it on SYSEX RECV, so it goes through RECV (emulator) or SEND n (hardware). Unlike the MD, a pattern dump is not live",
 clear:"There is no SysEx CLEAR PATTERN. The editor sends an empty pattern dump through SYSEX RECV. The machine's CLEAR PATTERN keeps the kit link (1-54); so does this"};

function kitSlot(k){const cur=k===S.kit,st=S.kits[k],empty=st.empty&&!cur,name=kDisp(k),lp=linked(k),ed=cur&&S.kitState==="edited";
 const links=lp.length?lp.slice(0,3).map(patName).join(" ")+(lp.length>3?" +"+(lp.length-3):""):empty?"":"no pattern";
 const tip=`K${nn(k)} ${name||"(empty)"}${cur?" · current kit, "+(ed?"edited: not saved on the machine":"saved"):""} · ${lp.length?"linked to "+lp.map(patName).join(" "):"no pattern links to it (the machine marks it with a star)"}. ${cur?"":"Click loads it ("+KTIP.load+"); Alt+click only selects it. "}${KTIP.drag}`;
 const nm=LIB.renaming===k?`<input class="lsin" id="lsin" maxlength="${KNAME}" value="${escH(name)}" aria-label="Kit name, up to ${KNAME} characters" spellcheck="false" autocomplete="off">`:empty&&!name?"EMPTY":escH(name||"EMPTY")+(!lp.length&&!empty?"*":"");
 return`<button class="ls ks${empty?" empty":""}${cur?" cur":""}${ed?" edited":""}" data-ks="${k}" draggable="${LIB.renaming===k?"false":"true"}" aria-selected="${k===LIB.sel}" title="${escH(tip)}"><span class="lsh"><b>K${nn(k)}</b>${cur?`<em><i class="led${ed?" on":""}"></i>${ed?"ed":"ok"}</em>`:""}</span><span class="lsn">${nm}</span><span class="lsl">${links}</span></button>`}
function drawKitLib(){const k=LIB.sel,cur=S.kit,ed=S.kitState==="edited",empty=S.kits[k].empty&&k!==cur,dis=c=>c?" disabled":"";
 return`<div class="libhead"><span class="cap">Kit library</span><span class="lcdchip">K${nn(cur)} ${escH(S.workName||"EMPTY")} · ${ed?"edited":"saved"}</span><span class="note">128 slots. Every pattern recalls its kit. Writes go through SYSEX RECV.</span>${Syx.keys()}<button class="libx" data-la="close" title="Close (Esc)">Esc</button></div>
 <div class="libacts"><div class="grp"><span class="ilab">Current K${nn(cur)}</span><button data-la="save" title="${KTIP.save}">Save</button><button class="danger" data-la="reload"${dis(!ed)} title="${KTIP.reload}">Reload</button></div>
  <div class="grp"><span class="ilab">Slot K${nn(k)}</span><button data-la="load"${dis(k===cur&&!ed)} title="${k===cur?"Already the current kit. Enter reloads it when it is edited. ":""}${KTIP.load} (Enter)">Load</button><button data-la="saveas"${dis(k===cur)} title="${k===cur?"This is the current slot: use Save. ":""}${KTIP.saveas}">Save as K${nn(k)}</button>
  <button data-la="copy" title="${KTIP.copy} (Cmd+C)">Copy</button><button data-la="paste"${dis(LCLIP?.type!=="kit")} title="${LCLIP?.type==="kit"?"Paste K"+nn(LCLIP.from)+" "+escH(LCLIP.name)+". ":"Copy a kit first. "}${KTIP.paste} (Cmd+V)">Paste</button>
  <button class="danger" data-la="clear"${dis(empty)} title="${KTIP.clear} (Delete)">Clear</button><button data-la="rename" title="${KTIP.rename} (F2 or double-click)">Rename</button></div></div>
 <div class="libgrid kits" aria-label="128 kit slots">${Array.from({length:128},(_,i)=>kitSlot(i)).join("")}</div>
 <div class="libfoot"><span>Click loads · arrows move, Enter loads · Alt+click selects · F2 or double-click renames · Delete clears · drag a slot onto another to copy · Cmd+Z undoes · Esc closes</span><span class="fw" title="The machine keeps one UNDO KIT as the first entry of its kit list: the kit lost to the last load or overwrite (1-20). The editor's own undo works on top of it.">The machine also keeps an UNDO KIT</span></div>`}
function patSlot(p){const cur=p===S.pat,q=p===S.queued&&!cur,has=hasPat(p);
 const tip=`${patName(p)} · ${has?patLen(p)+" steps · kit "+kitName(S.patKit[p]):"empty"}${cur?" · current":""}${q?" · queued: starts at the pattern end":""}. Click queues, Shift+click switches now. Drag onto another slot to copy.`;
 return`<button class="ls ps${has?"":" empty"}${cur?" cur":""}${q?" q":""}" data-ps="${p}" draggable="${has}" aria-selected="${p===LIB.sel}" title="${escH(tip)}"><b>${patName(p)}</b><span>${has?patLen(p)+" · K"+nn(S.patKit[p]):"EMPTY"}</span></button>`}
function drawPatLib(){const p=LIB.sel,cur=S.pat,dis=c=>c?" disabled":"";
 const rows=[..."ABCDEFGH"].map((b,i)=>`<button class="bank lbank${i===cur>>4?" on":""}" data-lb="${i}" title="Bank ${b} (key ${b})"><i class="led"></i>${b}</button>`+Array.from({length:16},(_,j)=>patSlot(i*16+j)).join("")).join("");
 return`<div class="libhead"><span class="cap">Patterns</span><span class="lcdchip">${patName(cur)} · ${S.len} steps · K${nn(S.patKit[cur])}${S.queued!=null&&S.queued!==cur?" → "+patName(S.queued):""}</span><span class="note">8 banks × 16. ${S.playing?"Playing: a new pattern starts at the pattern end.":"Stopped: a click switches at once."} Factory presets sit in A-D, E-H start empty.</span>${Syx.keys()}<button class="libx" data-la="close" title="Close (Esc)">Esc</button></div>
 <div class="libacts"><div class="grp"><span class="ilab">Slot ${patName(p)}</span><button data-la="go"${dis(p===cur&&S.queued==null)} title="${PTIP.go} (Enter)">${S.playing?"Queue":"Go"}</button><button data-la="now"${dis(p===cur&&S.queued==null)} title="${PTIP.now}">Now</button>
  <button data-la="copy" title="${PTIP.copy} (Cmd+C)">Copy</button><button data-la="paste"${dis(LCLIP?.type!=="pat")} title="${LCLIP?.type==="pat"?"Paste "+patName(LCLIP.from)+". ":"Copy a pattern first. "}${PTIP.paste} (Cmd+V)">Paste</button><button class="danger" data-la="clear"${dis(!hasPat(p))} title="${PTIP.clear} (Delete)">Clear</button></div></div>
 <div class="libgrid pats" aria-label="128 patterns">${rows}</div>
 <div class="libfoot"><span>Arrows move · A–H jump to a bank · Enter queues · Shift+click or Now switches now · Delete clears · drag a slot onto another to copy · Esc closes</span><span class="fw" title="${PTIP.go}">Queued = blinking</span></div>`}
let LCLIP=null;
function libSig(){return[LIB.open,LIB.sel,LIB.renaming,S.pat,S.queued,S.kit,S.kitState,S.workName,S.playing,S.len,LCLIP?.type,LCLIP?.from,hasPat(S.pat),S.patKit.join(),S.kits.map(k=>k.name+(k.empty?0:1)).join("|"),S.patInfo.map(x=>+x.has+"."+x.len).join()].join("~")}
function drawLib(focus){if(!LIB.open||LIB.drag)return;const sig=libSig(),pop=$("#libpop"),had=focus||pop.contains(document.activeElement);
 if(sig===LIB.sig&&pop.firstChild){if(focus&&!pop.contains(document.activeElement))libFocus();return}LIB.sig=sig;
 pop.innerHTML=LIB.open==="kit"?drawKitLib():drawPatLib();pop.dataset.kind=LIB.open;pop.setAttribute("aria-label",LIB.open==="kit"?"Kit library":"Pattern chooser");
 const inp=$("#lsin");if(inp){inp.focus({preventScroll:true});inp.select();return}if(had)libFocus()}
function libFocus(){const pop=$("#libpop"),el=pop.querySelector(".ls[aria-selected=true]");if(!el)return;el.focus({preventScroll:true});
 if(pop.scrollHeight>pop.clientHeight){const a=el.getBoundingClientRect(),b=pop.getBoundingClientRect();if(a.top<b.top)pop.scrollTop-=b.top-a.top+8;else if(a.bottom>b.bottom)pop.scrollTop+=a.bottom-b.bottom+8}}
function placeLib(){const pop=$("#libpop"),r=$(".lcdpanel").getBoundingClientRect(),top=Math.max(16,r.bottom+8);pop.style.top=(top+scrollY)+"px";pop.style.maxHeight=Math.max(240,innerHeight-top-12)+"px";pop.style.left=Math.max(16,(document.documentElement.clientWidth-pop.offsetWidth)/2+scrollX)+"px"}
function openLib(kind){if(!engReady()){toast("The engine is not ready yet.");return}closePicker();closeK();if(LIB.open)closeLib(false);LIB.open=kind;LIB.sel=kind==="kit"?S.kit:(S.queued??S.pat);LIB.renaming=null;$("#libpop").hidden=false;drawLib();placeLib();libFocus();$(kind==="kit"?"#kitf":"#pat").setAttribute("aria-expanded","true")}
function closeLib(back){if(!LIB.open)return;const k=LIB.open;LIB.open=null;LIB.sig="";LIB.renaming=null;LIB.drag=null;$("#libpop").hidden=true;const t=$(k==="kit"?"#kitf":"#pat");t.setAttribute("aria-expanded","false");if(back)t.focus()}
function toggleLib(kind){LIB.open===kind?closeLib(false):openLib(kind)}
addEventListener("resize",()=>{if(LIB.open)placeLib()});
function relinkCur(k){S.patKit[S.pat]=k}

/* ----- kit actions (all editor state, so all undoable) ----- */
function kitLoad(k){if(HOST.kit)return HOST.kit("load",k);if(k===S.kit){if(S.kitState==="edited")kitReload();else toast(kitName(k)+" is already the current kit.");return}
 const go=()=>{S.kit=k;applyKit(kitData(k));S.workName=S.kits[k].name;relinkCur(k);setKitState("clean");demoRebase(true);tx();render();drawLib(true);toast("Loaded "+kitName(k)+". "+patName(S.pat)+" now uses it.")};
 if(S.kitState==="edited"){ask(`Load <b>${kitName(k)}</b>? Your edits to <b>${kitName(S.kit)}</b> are not saved on the machine. Without saving, they go to its UNDO KIT.`,[["Save and load","cream",()=>{saveKit();go()}],["Load without saving","danger",go],["Cancel","",()=>drawLib(true)]]);return}go()}
function kitSave(){saveKit();drawLib(true)}
function kitSaveAs(k){if(HOST.kit)return HOST.kit("saveAs",k);if(k===S.kit){kitSave();return}
 const go=()=>{const from=S.kit;S.kits[k]={name:S.workName,empty:false,data:captureKit()};S.kit=k;relinkCur(k);setKitState("clean");demoRebase(true);tx();render();drawLib(true);toast("Saved as "+kitName(k)+". It is now the current kit; K"+nn(from)+" keeps its saved version.")};
 if(!S.kits[k].empty){ask(`Overwrite <b>${kitName(k)}</b> with the current kit <b>${kitName(S.kit)}</b>? The machine keeps the overwritten kit in its UNDO KIT.`,[["Overwrite","danger",go],["Cancel","",()=>drawLib(true)]]);return}go()}
function kitSrc(k){return k===S.kit?{from:k,name:S.workName,empty:false,data:captureKit()}:{from:k,name:S.kits[k].name,empty:S.kits[k].empty,data:S.kits[k].data?clone(S.kits[k].data):null}}
function kitCopy(k){LCLIP={type:"kit",...kitSrc(k)};if(HOST.library)HOST.library("kitCopy",{k});drawLib(true);toast("Copied "+kitName(k)+(k===S.kit&&S.kitState==="edited"?" with its unsaved edits.":"."))}
function kitPut(k,src,verb){if(src.from===k){toast("That is the same slot.");return}

/* The panel's self-test (the editors' ?selftest=p6audio, or the mockup's console): open the panel, see
   the level arrive, change the buffer size and the output device and back, and check after each change

 const check=async(name,fn)=>{try{const n=await fn();res.push(true);T.log("ok   "+name+(n?": "+n:""))}catch(e){res.push(false);T.log("FAIL "+name+": "+e.message)}};
 const D0=await until(D=>D.standalone,15000),out0=D0.output.id,buf0=D0.bufferSize.value,muted0=!!D0.input.muted;
 T.log("devices: "+D0.output.list.length+" outputs ("+out0+"), "+D0.input.list.length+" inputs, "+D0.sampleRate.value+" Hz, buffer "+buf0+", "+(D0.midiInputs||[]).length+" MIDI inputs, running "+D0.running);
 let levels=0;const lv=audioLevel;window.audioLevel=v=>{levels++;lv(v)};
 await check("panel opens",async()=>{openAudio();await sleep(700);if(!AP.open||$("#audiopop").hidden)throw new Error("not shown");const n=$("#audiopop").querySelectorAll("select,button").length;return n+" controls, "+levels+" level updates"});

 T.play(true);await sleep(1500);

 const buf1=D0.bufferSize.list.find(b=>b!==buf0&&b>=128&&b<=1024)??D0.bufferSize.list.find(b=>b!==buf0);

   them are shared with that memo, so a view the overlay writes deep into is own()ed first (a copy of the members
   built from documents). writes(view, command, clip) is what an edit intent shows at once, copied(view, command) the
   page's copy of what a copy puts on the core's clipboard, toFw(command, view, docs) an intent's values in the
   contract's units, kindOf(op) the document an op edits. Depends on MmConvert and the mockup's tables (MACH, FIXED,
   PAGES, INPUTS, DEFV, synDefaults, isFx, machName), and Overlay, all loaded before it is called. */
const MmView = (() => {
	const C = () => MmConvert;
	const SONGS = 24;
	/* the current slot of a kind, from a machine document ({current} per kind; null: not known yet).
	   One song and one global are always selected on the machine: slot 0 until it says. */
	function slotIn(m, kind) {
		const c = m && m[kind] ? m[kind].current : null;
		return c != null ? c : kind === "song" || kind === "global" ? (m ? 0 : null) : null;
	}
	const queuedIn = m => { const q = m?.pattern?.queued; return q != null && q !== m.pattern.current ? q : null; };
	/* the kit that plays: the working kit when it is the current slot's, else the stored slot (until the first
	   working kit arrives, and while a kit change has not brought the new one yet) */
	const kitDocOf = (docs, k) => k == null ? null : docs.workingKit && docs.workingKit.slot === k ? docs.workingKit.doc : docs.kits[k] || null;

	/* the last result of f for the same arguments (by identity) */
	function memo(f) {
		let args = null, out;
		return (...a) => {
			if (args && a.length === args.length && a.every((x, i) => x === args[i])) return out;
			args = a;
			return out = f(...a);
		};
	}
	/* a lock the track's machine has no parameter for is not shown (the mockup's pruneLocks) */
	function lockShown(key, kit) {
		const [t, pid] = key.split("|"), [pg, i] = pid.split("."), n = +t;
		const names = n >= 6 ? FIXED[pg] : pg === "SYN" ? MACH[kit.tracks[n].m]?.p : FIXED[pg];
		return !!(names && names[+i]);
	}
	/* the kit that plays as the page's tracks (captureKit() shape), its MIDI tracks' channels and CCs from the global */
	const kitPage = memo((d, global) => {
		const k = C().kitToPage(d, global);
		return Object.assign(k, { name: C().kitName(d) });
	});
	/* the current pattern as the page's (capturePat() shape: Sets for SLIDE and SWING, a Map of Maps for the locks),
	   its locks' values in the kit's machines */
	const patternPage = memo((d, kit) => {
		const p = C().patternToPage(d, kit);
		return {
			len: p.len, mult: p.mult, swingAmt: p.swingAmt, patTrn: p.patTrn,
			tr: p.tr.map(x => ({ steps: x.steps, slide: new Set(x.slide), swing: new Set(x.swing), arp: x.arp, tr: x.tr })),
			locks: new Map(p.locks.filter(([k]) => lockShown(k, kit)).map(([k, steps]) => [k, new Map(steps)])),
			slot: { kit: d.kit, has: C().hasTrigs(d), len: d.length }
		};
	});
	const mapPage = memo(g => g.multiMap ? C().mapToPage(g) : undefined);

	/* the 24 songs for the Song workspace's picker: names, the one edited and the machine's */
	function songsOf(docs, slot, current) {
		const names = Array.from({ length: SONGS }, (_, i) => { const s = docs.songs[i]; return s ? (C().kitEmpty(s) ? "EMPTY" : C().kitName(s)) : "…"; });
		return { names, slot, current };
	}
	/* the machine's own mutes, T1-T6 then M1-M6 (null: not known) */
	function mutesOf(m) {
		const bits = [m.mutes?.synth, m.mutes?.midi];
		return Array.from({ length: 12 }, (_, i) => { const b = bits[i < 6 ? 0 : 1]; return b == null ? null : !!((b >> (i % 6)) & 1); });
	}

	function derive(docs, ui = {}) {
		const m = docs.machine || null;
		const pat = slotIn(m, "pattern"), kit = slotIn(m, "kit"), song = ui.songEdit ?? slotIn(m, "song"), glob = slotIn(m, "global");
		const v = { pat, kit, songSlot: song, queued: queuedIn(m) };
		if (m) {
			v.kitState = m.kit?.working || "unknown";
			if (m.tempo != null) v.bpm = m.tempo;
			v.poly = m.poly ?? null;
			v.mutes = mutesOf(m);
			v.plays = { chain: m.desk?.chain ?? null, songMode: m.song?.songMode === true, song: m.song?.current ?? 0 };
			v.songs = songsOf(docs, song, slotIn(m, "song"));
		}
		const global = glob != null ? docs.globals[glob] || null : null;
		/* B-030: in a DAW whose clock the machine follows (its global: CONTROL IN TEMPO SYNC external, set by the
		   plug-in), the tempo is the host's (ui.host, the plug-in's "host" message): TEMPO shows it, also while the
		   host is stopped, and is not edited here */
		const H = ui.host;
		v.hostTempo = !!(H && H.follows && H.bpm > 0 && global && global.controlIn && global.controlIn.tempoSync === 1);
		if (v.hostTempo) v.bpm = H.bpm;
		const kd = kitDocOf(docs, kit), pd = pat != null ? docs.patterns[pat] || null : null;
		/* the view shows the machine once the current pattern and the kit that plays are there */
		v.ready = !!(kd && pd);
		if (!v.ready) return v;
		const k = kitPage(kd, global), p = patternPage(pd, k);
		v.workName = k.name;
		if (k.multi !== undefined) v.multi = k.multi;
		v.menv = k.menv;
		v.tracks = k.tracks.map((x, t) => Object.assign({}, x, p.tr[t]));
		v.midi = k.midi.map((x, t) => Object.assign({}, x, p.tr[6 + t]));
		Object.assign(v, { len: p.len, mult: p.mult, swingAmt: p.swingAmt, patTrn: p.patTrn, locks: p.locks });
		v.patSlot = Object.assign({ p: pat }, p.slot);
		/* the patterns' lengths the page knows (a song row of a whole pattern is as long as its pattern) */
		v.patLens = Object.fromEntries(Object.entries(docs.patterns).map(([q, d]) => [q, d.length]));
		const sd = song != null ? docs.songs[song] : null;
		if (sd) v.song = C().songToPage(sd, q => docs.patterns[q]?.length ?? 16);
		if (global) {
			v.routing = global.routingMode;
			const map = mapPage(global);
			if (map) v.mmap = map;
		}
		return v;
	}

	/* ---------------- what an edit intent shows at once (DESIGN-UNIFY.md 4.4) ----------------
	   writes(view, command): the [path, value] writes into the derived view that show the command's effect before
	   its result comes (Overlay, owned by the command's id). Values, never toggles; a command in the contract's units
	   (the firmware's: a lock's or a knob's raw value), written in the view's (MmConvert's page units). The intent
	   cases (doc/modern-ux/intent-cases.json) pin them to the core's edit (mmDeskEdit.cpp): applied over the view of
	   a case's documents they make the view of the documents after it. A command whose effect the view cannot know
	   (pasteSteps: the core's clipboard) writes nothing; the result brings it. */
	const DELETE = () => Overlay.DELETE;
	const trackPath = t => t < 6 ? ["tracks", t] : ["midi", t - 6];
	const trackOf = (v, t) => t < 6 ? v.tracks[t] : v.midi[t - 6];
	const lockKeyOf = (t, page, i) => t < 6 ? C().lockKey(t, page, i) : C().lockKey(t - 6, 7, i);
	const keysOf = (v, t) => [...v.locks.keys()].filter(k => +k.split("|")[0] === t);
	/* a lock the view shows (the track's machine has the parameter), in page units */
	function lockWrite(v, t, page, i, raw) {
		const key = lockKeyOf(t, page, i);
		if (t < 6 && !lockShown(key, { tracks: v.tracks })) return null;
		return [key, t < 6 ? C().valueToPage(v.tracks[t].m, PAGES[page], i, raw) : raw];
	}
	/* a step value of the intent as the view holds it (MmConvert.patternToPage's shape) */
	function pageStep(x, t) {
		if (x == null) return null;
		if (x.off) return { off: 1 };
		const n = Array.isArray(x.n) && x.n.length ? x.n.map(Number) : null;
		if (t >= 6) return n ? { a: 1, f: 1, l: 1, n } : { a: 1, f: 1, l: 1 };
		const trig = !x.notrig || !!n, st = { a: x.a ? 1 : 0, f: x.f ? 1 : 0, l: x.l ? 1 : 0 };
		if (!trig && !st.a && !st.f && !st.l) return null;
		if (n) st.n = n;
		if (!trig) st.notrig = 1;
		return st;
	}
	/* step s of track t becomes x; an empty step or a NOTE OFF loses its locks */
	function stepWrites(v, t, s, x) {
		const st = pageStep(x, t), out = [[[...trackPath(t), "steps", s], st]];
		if (!st || st.off) for (const k of keysOf(v, t)) if (v.locks.get(k).has(s)) out.push([["locks", k, s], DELETE()]);
		return out;
	}
	const ARP = { play: "PLAY", ojmp: "OJMP", mode: "MODE", length: "len" };
	const rotStep = (s, by, len) => ((s + by) % len + len) % len;
	const WRITES = {
		level: (v, c) => [[["tracks", c.t, "lev"], c.v]],
		route: (v, c) => [[["tracks", c.t, "out"], { AB: !!(c.out & 1), CD: !!(c.out & 2), EF: !!(c.out & 4) }]],
		input: (v, c) => [[["tracks", c.t, "inp"], INPUTS[c.v] ?? INPUTS[0]]],
		param: (v, c) => c.t < 6 ? [[["tracks", c.t, "v", PAGES[c.page], c.i], C().valueToPage(v.tracks[c.t].m, PAGES[c.page], c.i, c.v)]]
			: [[["midi", c.t - 6, "v", "MID", c.i], c.v]],
		trigPos: (v, c) => [[["tracks", c.t, "trigpos"], c.v ?? null]],
		legato: (v, c) => [[["tracks", c.t, "leg", { amp: "amp", filter: "flt", lfo: "lfo" }[c.env]], c.on ? 1 : 0]],
		portamento: (v, c) => [[["tracks", c.t, "port"], c.v === "always" ? 0 : 1]],
		routing: (v, c) => [[["routing"], c.v]],
		midiTrack: (v, c) => [...(c.ch != null ? [[["midi", c.t, "ch"], c.ch + 1]] : []), ...(c.cc ? [[["midi", c.t, "cc"], c.cc.map(Number)]] : [])],
		step: (v, c) => stepWrites(v, c.t, c.s, c.v),
		slide: (v, c) => [[[...trackPath(c.t), "slide", c.s], !!c.on]],
		swingStep: (v, c) => [[[...trackPath(c.t), "swing", c.s], !!c.on]],
		lock: (v, c) => {
			if (c.v == null) return [[["locks", lockKeyOf(c.t, c.page, c.i), c.s], DELETE()]];
			const w = lockWrite(v, c.t, c.page, c.i, c.v);
			return w ? [[["locks", w[0], c.s], w[1]]] : [];
		},
		clearLane: (v, c) => [[["locks", lockKeyOf(c.t, c.page, c.i)], DELETE()]],
		clearLocks: (v, c) => keysOf(v, c.t).map(k => [["locks", k], DELETE()]),
		clearPattern: v => [...Array(12).keys()].flatMap(t => [[[...trackPath(t), "steps"], Array(64).fill(null)], [[...trackPath(t), "slide"], new Set()]])
			.concat([[["locks"], new Map()]]),
		steps: (v, c) => c.rows.flatMap(r => {
			const out = [], want = new Map(r.steps.map(([s, x]) => [s, x]));
			for (let s = c.from; s < c.to; s++) out.push(...(r.locks ? [[[...trackPath(r.t), "steps", s], pageStep(want.get(s), r.t)]] : stepWrites(v, r.t, s, want.get(s))));
			if (r.slide) { const on = new Set(r.slide); for (let s = c.from; s < c.to; s++) out.push([[...trackPath(r.t), "slide", s], on.has(s)]); }
			if (r.locks) {
				for (const k of keysOf(v, r.t)) for (const s of v.locks.get(k).keys()) if (s >= c.from && s < c.to) out.push([["locks", k, s], DELETE()]);
				for (const [page, i, s, raw] of r.locks) { const w = lockWrite(v, r.t, page, i, raw); if (w) out.push([["locks", w[0], s], w[1]]); }
			}
			return out;
		}),
		rotate: (v, c) => {
			const len = Math.max(2, Math.min(64, v.len)), tr = trackOf(v, c.t);
			if (c.by % len === 0) return [];
			const steps = [...tr.steps], slide = new Set();
			for (let s = 0; s < len; s++) steps[rotStep(s, c.by, len)] = tr.steps[s];
			for (const s of tr.slide) slide.add(s < len ? rotStep(s, c.by, len) : s);
			return [[[...trackPath(c.t), "steps"], steps], [[...trackPath(c.t), "slide"], slide],
				...keysOf(v, c.t).map(k => [["locks", k], new Map([...v.locks.get(k)].map(([s, x]) => [s < len ? rotStep(s, c.by, len) : s, x]))])];
		},
		doublePattern: v => {
			const len = v.len, out = [[["len"], len * 2]];
			if (len * 2 > 64) return [];
			for (let t = 0; t < 12; t++) {
				const tr = trackOf(v, t), steps = [...tr.steps], dbl = set => { const o = new Set([...set].filter(s => s < len || s >= 2 * len)); for (const s of set) if (s < len) o.add(s + len); return o; };
				for (let s = 0; s < len; s++) steps[s + len] = tr.steps[s];
				out.push([[...trackPath(t), "steps"], steps], [[...trackPath(t), "slide"], dbl(tr.slide)], [[...trackPath(t), "swing"], dbl(tr.swing)]);
			}
			for (const [k, m] of v.locks) {
				const o = new Map([...m].filter(([s]) => s < len || s >= 2 * len));
				for (const [s, x] of m) if (s < len) o.set(s + len, x);
				out.push([["locks", k], o]);
			}
			return out.concat(rowLens(v, len * 2));
		},
		length: (v, c) => [[["len"], c.v], ...rowLens(v, c.v)],
		speed: (v, c) => [[["mult"], c.v]],
		swing: (v, c) => [[["swingAmt"], c.v]],
		transpose: (v, c) => c.t == null ? [[["patTrn"], c.v + 64]] : [
			...(c.v != null ? [[[...trackPath(c.t), "tr", "TRACK"], c.v + 64]] : []),
			...(c.scale != null ? [[[...trackPath(c.t), "tr", "SCALE"], c.scale]] : []),
			...(c.key != null ? [[[...trackPath(c.t), "tr", "KEY"], c.key]] : [])],
		arp: (v, c) => {
			const at = [...trackPath(c.t), "arp"];
			if (ARP[c.field]) return [[[...at, ARP[c.field]], c.v]];
			if (c.field === "range") return [[[...at, "RNGE"], c.v + 1]];
			if (c.field === "speed") return [[[...at, "SPD"], c.v + 1]];
			if (c.field === "trigs") return [[[...at, "amp"], c.v & 1], [[...at, "flt"], (c.v >> 1) & 1], [[...at, "lfo"], (c.v >> 2) & 1]];
			return [[[...at, "rhy", c.i], c.v !== 255], [[...at, "ofs", c.i], c.v === 255 ? 0 : c.v - 64]];
		},
		clearSteps: (v, c) => {
			const out = [];
			for (let s = c.from; s < c.to; s++) out.push(...stepWrites(v, c.t, s, null), [[...trackPath(c.t), "slide", s], false]);
			return out;
		},
		copySteps: () => [],
		/* the core's clipboard; the page shows the paste from its own copy of it (clip: MmView.copied) */
		pasteSteps: (v, c, clip) => {
			if (!clip || clip.kind !== "steps" || clip.midi !== c.t >= 6) return [];
			const to = Math.min(64, c.to ?? c.from + clip.steps.length), out = [], on = new Set();
			for (let s = c.from; s < to; s++) {
				const rel = s - c.from, x = rel < clip.steps.length ? stepVal(clip.steps[rel]) : null;
				out.push(...stepWrites(v, c.t, s, x), [[...trackPath(c.t), "slide", s], clip.slide.includes(rel)]);
				if (x && !x.off) on.add(s);
			}
			for (const [pid, steps] of clip.locks) {
				const [pg, i] = pid.split(".");
				if (c.t < 6 && pg === "SYN" && !MACH[v.tracks[c.t].m]?.p[+i]) continue;	// that machine has no such parameter
				for (const [rel, x] of steps) if (c.from + rel < to && on.has(c.from + rel)) out.push([["locks", c.t + "|" + pid, c.from + rel], x]);
			}
			return out;
		},
		/* ---- Sound and Perform: the kit that plays ---- */
		machine: (v, c) => machineWrites(v, c.t, C().machineName(c.model), c.keepFx !== false),
		clearSound: (v, c) => machineWrites(v, c.t, "GND-SIN", false),
		copySound: () => [],
		pasteSound: (v, c, clip) => clip && clip.kind === "sound" ? soundWrites(v, c.t, clip.m, clip.v) : [],
		params: (v, c) => c.values.flatMap(([t, page, i, x]) => WRITES.param(v, { t, page, i, v: x })),
		assign: (v, c) => {
			const at = ["tracks", c.t, "assign"], out = [], tab = (C().TABS.find(([, src]) => src === c.src) || [])[0];
			if (tab) for (const [k, n, f] of [["page", "pg", x => x], ["dest", "d", x => x], ["add", "add", x => Math.max(0, Math.min(127, x + 64))]])
				if (c[k] != null) out.push([[...at, "tabs", tab, c.row, n], f(c[k])]);
			for (const [k, n] of [["mirror", "mirr"], ["hpf", "hpf"], ["lpf", "lpf"]]) if (c[k] != null) out.push([[...at, n], !!c[k]]);
			return out;
		},
		multiEnv: (v, c) => c.i < MENV.length ? [[["menv", MENV[c.i]], c.v]] : [],
		multiTrig: (v, c) => !v.multi ? [] : [["mode", c.mode], ["splitKey", c.splitKey], ["splitTrack", c.splitTrack != null ? c.splitTrack + 1 : null], ["timing", c.timing]]
			.filter(([, x]) => x != null).map(([k, x]) => [["multi", k], x]),
		kitName: (v, c) => [[["workName"], String(c.name).toUpperCase()]],
		/* ---- the MULTI MAP: the page's ranges, as a whole ---- */
		multiMap: (v, c) => mapWrites(v, rows => {
			const r = rows[c.i];
			if (!r) return false;
			if (c.hi != null) r.hi = c.hi;
			if (c.pat != null) r.pat = c.pat === 255 ? -1 : c.pat;
			if (c.ofs != null) r.ofs = c.ofs === 255 ? 0 : c.ofs + 1;
			if (c.len != null) r.len = c.len;
			if (c.trn != null) r.trn = c.trn + 64;
			if (c.tim != null) r.tim = c.tim;
		}),
		multiMapSplit: (v, c) => mapWrites(v, rows => {
			const r = rows[c.i], lo = c.i ? rows[c.i - 1].hi + 1 : 0;
			if (!r || r.hi - lo < 1 || rows.length >= 32) return false;
			rows.splice(c.i, 0, Object.assign({}, r, { hi: Math.floor((lo + r.hi) / 2) }));
		}),
		multiMapDelete: (v, c) => mapWrites(v, rows => {
			if (!rows[c.i] || rows.length < 2) return false;
			const last = c.i === rows.length - 1;
			rows.splice(c.i, 1);
			if (last) rows[rows.length - 1].hi = 127;
		}),
		/* ---- Song rows: the rows the Song workspace shows, as a whole (loop and jump targets follow their rows) ---- */
		rowSet: (v, c) => songWrites(v, rows => { if (!rows[c.i]) return false; rows[c.i] = C().rowToPage(c.row, c.i, lenOf(v)); }),
		rowInsert: (v, c) => songWrites(v, rows => insertRow(rows, c.i, C().rowToPage(c.row, c.i, lenOf(v)))),
		pasteRow: (v, c, clip) => clip && clip.kind === "row" ? songWrites(v, rows => insertRow(rows, c.i, structuredClone(clip.row))) : [],
		copyRow: () => [],
		rowDelete: (v, c) => songWrites(v, rows => {
			if (!rows[c.i] || rows[c.i].type === "end") return false;
			rows.splice(c.i, 1);
			retarget(rows, j => j <= c.i ? j : j - 1);
		}),
		rowMove: (v, c) => songWrites(v, rows => {
			if (!rows[c.from] || !rows[c.to] || rows[c.from].type === "end" || rows[c.to].type === "end") return false;
			const order = rows.map((_, j) => j), [moved] = order.splice(c.from, 1);
			order.splice(c.to, 0, moved);
			const map = [], was = rows.slice();
			order.forEach((j, n) => { map[j] = n; rows[n] = was[j]; });
			retarget(rows, j => map[j] ?? j);
		})
	};
	/* the library's slot ops change stored slots: the result brings them (the library's own setters) */
	for (const op of ["patCopy", "patPaste", "patCopyTo", "patClear", "kitCopy", "kitPaste", "kitCopyTo", "kitClear", "kitRename"]) WRITES[op] = () => [];
	const MENV = ["ATK", "DEC", "SUS", "REL", "PORT"];
	/* a step of the view as the step intent's value: null, {off:true} or {n, a, f, l, notrig} */
	function stepVal(st) {
		if (!st) return null;
		if (st.off) return { off: true };
		const x = { a: st.a ? 1 : 0, f: st.f ? 1 : 0, l: st.l ? 1 : 0 };
		if (st.n && st.n.length) x.n = [...st.n];
		if (st.notrig) x.notrig = true;
		return x;
	}
	/* track t gets machine m with its start values (the core's, mmDeskEdit.cpp assignMachine: the SYN defaults; without
	   keepFx the other pages' neutral values; a processing machine on a track that had none listens and lets the sound
	   through) */
	function machineWrites(v, t, m, keepFx) {
		if (!m || !MACH[m]) return [];
		const pages = Object.assign({}, v.tracks[t].v, { SYN: synDefaults(m) }), out = [];
		if (!keepFx) Object.assign(pages, { AMP: [...DEFV.AMP], FLT: [...DEFV.FLT], EFX: [...DEFV.EFX], LF1: [...DEFV.LFO], LF2: [...DEFV.LFO], LF3: [...DEFV.LFO] });
		if (isFx(m) && !isFx(v.tracks[t].m)) {
			pages.AMP = [...pages.AMP];
			pages.AMP[2] = pages.AMP[3] = 127;
			out.push([["tracks", t, "inp"], INPUTS[t === 0 ? 3 : 0]]);
		}
		return out.concat(soundWrites(v, t, m, pages));
	}
	/* track t's machine and pages; its SYN locks follow the machine's parameters */
	function soundWrites(v, t, m, pages) {
		const out = [[["tracks", t, "m"], m], [["tracks", t, "name"], machName(m)]], was = v.tracks[t].m;
		for (const pg of PAGES) out.push([["tracks", t, "v", pg], [...pages[pg]]]);
		for (const k of keysOf(v, t)) {
			const [pg, i] = k.split("|")[1].split(".");
			if (pg !== "SYN") continue;
			if (!MACH[m].p[+i]) { out.push([["locks", k], DELETE()]); continue; }
			/* a lock's value in the new machine's units (from its band's value: a preview, the result brings the core's) */
			if (was !== m) out.push([["locks", k], new Map([...v.locks.get(k)].map(([s, x]) => [s, C().valueToPage(m, "SYN", +i, C().valueToFw(was, "SYN", +i, x))]))]);
		}
		return out;
	}
	function mapWrites(v, f) {
		if (!v.mmap) return [];
		const rows = v.mmap.map(r => Object.assign({}, r));
		return f(rows) === false ? [] : [[["mmap"], rows]];
	}
	const lenOf = v => q => q === v.pat ? v.len : v.patLens?.[q] ?? 16;
	/* the pattern that plays gets another length: a song row of it shows its own length unless it is the whole pattern */
	function rowLens(v, len) {
		if (!v.song || !v.song.some(r => !r.type && r.pat === v.pat)) return [];
		return [[["song"], v.song.map(r => {
			if (r.type || r.pat !== v.pat) return r;
			const o = Object.assign({}, r), l = r.len ?? v.len - (r.ofs || 0);
			if (l !== len - (r.ofs || 0)) o.len = l; else delete o.len;
			return o;
		})]];
	}
	/* loop and jump targets follow their rows (map: old place -> new); a HALT row's target is its own place */
	function retarget(rows, map) {
		rows.forEach((r, j) => { if (r.type === "loop" || r.type === "jump") r.to = map(r.to); else if (r.type === "halt") r.to = j; });
	}
	function insertRow(rows, at, row) {
		if (!rows[at] || rows.length >= 200) return false;
		rows.splice(at, 0, row);
		retarget(rows, j => j < at ? j : j + 1);
	}
	function songWrites(v, f) {
		if (!v.song) return [];
		const rows = v.song.map(r => Object.assign({}, r));
		return f(rows) === false ? [] : [[["song"], rows]];
	}
	/* the command's writes over the view (none while the view does not show the machine); clip: the page's copy of
	   the core's clipboard (copied), for a paste */
	function writes(v, cmd, clip) {
		const f = WRITES[cmd.op];
		return f && v && v.ready ? f(v, cmd, clip) : [];
	}
	/* what a copy command puts on the core's clipboard, in the view's units: the page's own copy of it, so a paste
	   shows at once (null: not a copy) */
	function copied(v, cmd) {
		if (!v || !v.ready) return null;
		if (cmd.op === "copySteps") {
			const tr = trackOf(v, cmd.t), locks = [];
			for (const k of keysOf(v, cmd.t)) {
				const steps = [...v.locks.get(k)].filter(([s]) => s >= cmd.from && s < cmd.to).map(([s, x]) => [s - cmd.from, x]);
				if (steps.length) locks.push([k.split("|")[1], steps]);
			}
			return { kind: "steps", midi: cmd.t >= 6, steps: structuredClone(tr.steps.slice(cmd.from, cmd.to)),
				slide: [...tr.slide].filter(s => s >= cmd.from && s < cmd.to).map(s => s - cmd.from), locks };
		}
		if (cmd.op === "copySound") return { kind: "sound", m: v.tracks[cmd.t].m, v: structuredClone(v.tracks[cmd.t].v) };
		if (cmd.op === "copyRow" && v.song?.[cmd.i] && v.song[cmd.i].type !== "end") return { kind: "row", row: structuredClone(v.song[cmd.i]) };
		return null;
	}
	/* a view the overlay may write into: its members built from the documents are shared with the memo above, so
	   the ones an edit writes deep into are copied first (only while there are writes) */
	function own(v) {
		if (!v || !v.ready) return v;
		for (const k of ["tracks", "midi", "locks", "menv", "multi", "mmap", "song"]) if (v[k] !== undefined) v[k] = structuredClone(v[k]);
		return v;
	}

	/* ---------------- an intent's values in the contract's units (DESIGN-UNIFY.md 4.1) ----------------
	   A gesture gives knob and lock values in the page's units and a song row as the page shows it; the command carries
	   the firmware's: an enumeration's value (MmConvert.valueToFw; an unchanged index keeps the raw value the documents
	   hold), a song row (MmConvert.rowToFw, on top of the row it replaces). docs: the documents the values come from
	   ({pattern, kit, song}; none: the bands' own values and a new row's defaults). */
	function toFw(c, v, docs = {}) {
		const p = docs.pattern, k = docs.kit, m = t => v.tracks?.[t]?.m;
		const lockFw = (t, page, i, s, x) => {
			if (t >= 6) return x;
			const l = p?.locks?.find(y => y.track === t && y.page === page && y.param === i), base = l?.steps.find(([y]) => y === s)?.[1];
			return C().valueToFw(m(t), PAGES[page], i, x, base);
		};
		const knobFw = (t, page, i, x) => t < 6 ? C().valueToFw(m(t), PAGES[page], i, x, k ? k.tracks[t].pages[page][i] : null) : x;
		if (c.op === "param") c.v = knobFw(c.t, c.page, c.i, c.v);
		if (c.op === "params") c.values = c.values.map(([t, page, i, x]) => [t, page, i, knobFw(t, page, i, x)]);
		if (c.op === "lock" && c.v != null) c.v = lockFw(c.t, c.page, c.i, c.s, c.v);
		if (c.op === "steps") c.rows = c.rows.map(r => r.locks ? Object.assign({}, r, { locks: r.locks.map(([page, i, s, x]) => [page, i, s, lockFw(r.t, page, i, s, x)]) }) : r);
		if (c.op === "rowSet" || c.op === "rowInsert") c.row = C().rowToFw(c.row, c.op === "rowSet" ? docs.song?.rows?.[c.i] : null, c.i, lenOf(v));
		return c;
	}

	/* ---------------- which document an op edits ----------------
	   the kit that plays (k), the active global (nothing to name), a song (s: the one the Song workspace edits), the
	   library's stored slots (the command names them), else the pattern that plays (p) */
	const OPS = {
		kit: ["level", "route", "input", "param", "trigPos", "legato", "portamento", "machine", "clearSound", "copySound", "pasteSound", "params",
			"assign", "multiEnv", "multiTrig", "kitName"],
		global: ["routing", "midiTrack", "multiMap", "multiMapSplit", "multiMapDelete"],
		song: ["rowSet", "rowInsert", "rowDelete", "rowMove", "copyRow", "pasteRow"],
		library: ["patCopy", "patPaste", "patCopyTo", "patClear", "kitCopy", "kitPaste", "kitCopyTo", "kitClear", "kitRename"]
	};
	const KIND = new Map(Object.entries(OPS).flatMap(([kind, ops]) => ops.map(op => [op, kind])));
	const kindOf = op => KIND.get(op) || "pattern";

	return { derive, slotIn, queuedIn, kitDocOf, writes, copied, toFw, kindOf, own };
})();
