/* pattern content (1-53): notes, locks, kit link, MIDI notes, arp / transpose / swing / slide per track; plus scale setup */
const packSeq=t=>({steps:t.steps,slide:[...t.slide],swing:[...t.swing],arp:t.arp,tr:t.tr});
function capturePat(){return clone({len:S.len,mult:S.mult,swingAmt:S.swingAmt,patTrn:S.patTrn,tr:[...S.tracks,...S.midi].map(packSeq),locks:[...S.locks].map(([k,m])=>[k,[...m]])})}
function emptyPat(len){return{len,mult:"1X",swingAmt:50,patTrn:64,tr:[...S.tracks,...S.midi].map(()=>({steps:Array(64).fill(null),slide:[],swing:[1,3,5,7,9,11,13,15].flatMap(x=>[x,x+16,x+32,x+48]),arp:newArp(),tr:{TRACK:64,SCALE:0,KEY:0}})),locks:[]}}
function applyPat(d){d=clone(d);S.len=d.len;S.mult=d.mult;S.swingAmt=d.swingAmt;S.patTrn=d.patTrn;[...S.tracks,...S.midi].forEach((t,i)=>{const x=d.tr[i];t.steps=x.steps;t.slide=new Set(x.slide);t.swing=new Set(x.swing);t.arp=x.arp;t.tr=x.tr});S.locks=new Map(d.locks.map(([k,m])=>[k,new Map(m)]));pruneLocks()}
S.patInfo=Array.from({length:128},(_,p)=>({has:p<8,len:[32,16,32,64,16,48,32,16][p%8]}));S.patData={};
(()=>{const base=capturePat();for(let p=1;p<8;p++){const d=clone(base),r=(p*2)%d.len,tn=[0,5,7,-2,3,-5,10,12][p];d.len=S.patInfo[p].len;
 d.tr.forEach((x,i)=>{const s=x.steps.slice(0,32);x.steps=Array.from({length:64},(_,k)=>{const st=s[(k+r)%32];if(!st||!st.n||i===4)return st&&clone(st);return{...clone(st),n:st.n.map(n=>clamp(n+tn))}})});d.locks=[];S.patData[p]=d}})();
const curHas=()=>[...S.tracks,...S.midi].some(t=>t.steps.slice(0,S.len).some(Boolean));
const linked=k=>Array.from({length:128},(_,p)=>p).filter(p=>S.patKit[p]===k&&hasPat(p));
const kDisp=k=>k===S.kit?S.workName:S.kits[k].name;

/* firmware honesty: what each action is on the real machine */
const KTIP={
 load:"LOAD KIT (SysEx 0x58). Unsaved edits are discarded; the machine keeps them in its UNDO KIT (the first entry of its kit list). A kit loaded from the KIT menu becomes the current pattern's kit (1-12); whether a SysEx LOAD KIT relinks the pattern too is not tested",
 save:"SAVE KIT to the current slot (SysEx 0x59). The overwritten slot goes to the machine's UNDO KIT (1-20)",
 saveas:"SAVE KIT n to the selected slot (SysEx 0x59). On the MD, SAVE KIT n also makes n the current kit (P1); the editor assumes the same on the MM (not measured). The old slot keeps what it had",
 copy:"Reads the slot with a kit dump request (0x53). A request returns the stored slot, so the current kit's unsaved edits come from the editor's own copy",
 paste:"Kit dump (0x52) into the slot. The MM only takes a dump on GLOBAL › FILE › SYSEX RECV, so it goes through RECV (emulator) or SEND n (hardware). The emulator crosses two receive passes per kit dump. Pasting into the current kit then needs LOAD KIT (0x58) to be heard",
 clear:"There is no SysEx CLEAR KIT. The editor sends a kit dump with the empty kit: six GND-SIN machines and default pages, as the machine's own empty kit (1-19). Goes through SYSEX RECV",
 rename:"Current kit: SysEx 0x55 sets the working kit's name (11 ASCII bytes); SAVE stores it. Other slots: dump request, new name, dump back through SYSEX RECV. Which characters the MM font draws is not checked",
 reload:"LOAD KIT on the current slot (0x58): the edits are discarded. The machine keeps them in its UNDO KIT",
 drag:"Drag onto another slot to copy it: dump request, then a dump into the target (through SYSEX RECV)"};
const PTIP={
 go:"LOAD PATTERN (SysEx 0x57). While playing, the machine switches at the pattern end (1-45); the editor keeps the queue itself. The pattern also loads its kit (1-18)",
 now:"Switch now (Shift+click, Shift+Enter). Stopped: the same as a click. Playing: the machine only switches at the pattern end, so the editor would send STOP, LOAD PATTERN, PLAY (not tested)",
 copy:"Pattern dump request (0x68). Copies notes, locks, MIDI notes, arp / transpose / swing / slide and the kit link, like the machine's COPY PATTERN (1-53)",
 paste:"Pattern dump (0x67) into the slot. The MM only takes it on SYSEX RECV, so it goes through RECV (emulator) or SEND n (hardware). Unlike the MD, a pattern dump is not live",
 clear:"There is no SysEx CLEAR PATTERN. The editor sends an empty pattern dump through SYSEX RECV. The machine's CLEAR PATTERN keeps the kit link (1-54); so does this"};

function kitSlot(k){const cur=k===S.kit,st=S.kits[k],empty=st.empty&&!cur,name=kDisp(k),lp=linked(k),ed=cur&&S.kitState==="edited";
 const links=lp.length?lp.slice(0,3).map(patName).join(" ")+(lp.length>3?" +"+(lp.length-3):""):empty?"":"no pattern";
 const tip=`K${nn(k)} ${name||"(empty)"}${cur?" · current kit, "+(ed?"edited: not saved on the machine":"saved"):""} · ${lp.length?"linked to "+lp.map(patName).join(" "):"no pattern links to it (the machine marks it with a star)"}. ${KTIP.drag}`;
 const nm=LIB.renaming===k?`<input class="lsin" id="lsin" maxlength="${KNAME}" value="${escH(name)}" aria-label="Kit name, up to ${KNAME} characters" spellcheck="false" autocomplete="off">`:empty&&!name?"EMPTY":escH(name||"EMPTY")+(!lp.length&&!empty?"*":"");
 return`<button class="ls ks${empty?" empty":""}${cur?" cur":""}${ed?" edited":""}" data-ks="${k}" draggable="${LIB.renaming===k?"false":"true"}" aria-selected="${k===LIB.sel}" title="${escH(tip)}"><span class="lsh"><b>K${nn(k)}</b>${cur?`<em><i class="led${ed?" on":""}"></i>${ed?"ed":"ok"}</em>`:""}</span><span class="lsn">${nm}</span><span class="lsl">${links}</span></button>`}
function drawKitLib(){const k=LIB.sel,cur=S.kit,ed=S.kitState==="edited",empty=S.kits[k].empty&&k!==cur,dis=c=>c?" disabled":"";
 return`<div class="libhead"><span class="cap">Kit library</span><span class="lcdchip">K${nn(cur)} ${escH(S.workName||"EMPTY")} · ${ed?"edited":"saved"}</span><span class="note">128 slots. Every pattern recalls its kit. Writes go through SYSEX RECV.</span><button class="libx" data-la="close" title="Close (Esc)">Esc</button></div>
 <div class="libacts"><div class="grp"><span class="ilab">Current K${nn(cur)}</span><button data-la="save" title="${KTIP.save}">Save</button><button class="danger" data-la="reload"${dis(!ed)} title="${KTIP.reload}">Reload</button></div>
  <div class="grp"><span class="ilab">Slot K${nn(k)}</span><button data-la="load"${dis(k===cur&&!ed)} title="${k===cur?"Already the current kit. Enter reloads it when it is edited. ":""}${KTIP.load} (Enter)">Load</button><button data-la="saveas"${dis(k===cur)} title="${k===cur?"This is the current slot: use Save. ":""}${KTIP.saveas}">Save as K${nn(k)}</button>
  <button data-la="copy" title="${KTIP.copy} (Cmd+C)">Copy</button><button data-la="paste"${dis(LCLIP?.type!=="kit")} title="${LCLIP?.type==="kit"?"Paste K"+nn(LCLIP.from)+" "+escH(LCLIP.name)+". ":"Copy a kit first. "}${KTIP.paste} (Cmd+V)">Paste</button>
  <button class="danger" data-la="clear"${dis(empty)} title="${KTIP.clear} (Delete)">Clear</button><button data-la="rename" title="${KTIP.rename} (F2 or double-click)">Rename</button></div></div>
 <div class="libgrid kits" aria-label="128 kit slots">${Array.from({length:128},(_,i)=>kitSlot(i)).join("")}</div>
 <div class="libfoot"><span>Arrows move · Enter loads · F2 or double-click renames · Delete clears · drag a slot onto another to copy · Cmd+Z undoes · Esc closes</span><span class="fw" title="The machine keeps one UNDO KIT as the first entry of its kit list: the kit lost to the last load or overwrite (1-20). The editor's own undo works on top of it.">The machine also keeps an UNDO KIT</span></div>`}
function patSlot(p){const cur=p===S.pat,q=p===S.queued&&!cur,has=hasPat(p);
 const tip=`${patName(p)} · ${has?patLen(p)+" steps · kit "+kitName(S.patKit[p]):"empty"}${cur?" · current":""}${q?" · queued: starts at the pattern end":""}. Click queues, Shift+click switches now. Drag onto another slot to copy.`;
 return`<button class="ls ps${has?"":" empty"}${cur?" cur":""}${q?" q":""}" data-ps="${p}" draggable="${has}" aria-selected="${p===LIB.sel}" title="${escH(tip)}"><b>${patName(p)}</b><span>${has?patLen(p)+" · K"+nn(S.patKit[p]):"EMPTY"}</span></button>`}
function drawPatLib(){const p=LIB.sel,cur=S.pat,dis=c=>c?" disabled":"";
 const rows=[..."ABCDEFGH"].map((b,i)=>`<button class="bank lbank${i===cur>>4?" on":""}" data-lb="${i}" title="Bank ${b} (key ${b})"><i class="led"></i>${b}</button>`+Array.from({length:16},(_,j)=>patSlot(i*16+j)).join("")).join("");
 return`<div class="libhead"><span class="cap">Patterns</span><span class="lcdchip">${patName(cur)} · ${S.len} steps · K${nn(S.patKit[cur])}${S.queued!=null&&S.queued!==cur?" → "+patName(S.queued):""}</span><span class="note">8 banks × 16. ${S.playing?"Playing: a new pattern starts at the pattern end.":"Stopped: a click switches at once."} Factory presets sit in A-D, E-H start empty.</span><button class="libx" data-la="close" title="Close (Esc)">Esc</button></div>
 <div class="libacts"><div class="grp"><span class="ilab">Slot ${patName(p)}</span><button data-la="go"${dis(p===cur&&S.queued==null)} title="${PTIP.go} (Enter)">${S.playing?"Queue":"Go"}</button><button data-la="now"${dis(p===cur&&S.queued==null)} title="${PTIP.now}">Now</button>
  <button data-la="copy" title="${PTIP.copy} (Cmd+C)">Copy</button><button data-la="paste"${dis(LCLIP?.type!=="pat")} title="${LCLIP?.type==="pat"?"Paste "+patName(LCLIP.from)+". ":"Copy a pattern first. "}${PTIP.paste} (Cmd+V)">Paste</button><button class="danger" data-la="clear"${dis(!hasPat(p))} title="${PTIP.clear} (Delete)">Clear</button></div></div>
 <div class="libgrid pats" aria-label="128 patterns">${rows}</div>
 <div class="libfoot"><span>Arrows move · A–H jump to a bank · Enter queues · Shift+Enter switches now · Delete clears · drag a slot onto another to copy · Esc closes</span><span class="fw" title="${PTIP.go}">Queued = blinking</span></div>`}
let LCLIP=null;
function libSig(){return[LIB.open,LIB.sel,LIB.renaming,S.pat,S.queued,S.kit,S.kitState,S.workName,S.playing,S.len,LCLIP?.type,LCLIP?.from,hasPat(S.pat),S.patKit.join(),S.kits.map(k=>k.name+(k.empty?0:1)).join("|"),S.patInfo.map(x=>+x.has+"."+x.len).join()].join("~")}
function drawLib(focus){if(!LIB.open||LIB.drag)return;const sig=libSig(),pop=$("#libpop"),had=focus||pop.contains(document.activeElement);
 if(sig===LIB.sig&&pop.firstChild){if(focus&&!pop.contains(document.activeElement))libFocus();return}LIB.sig=sig;
 pop.innerHTML=LIB.open==="kit"?drawKitLib():drawPatLib();pop.dataset.kind=LIB.open;pop.setAttribute("aria-label",LIB.open==="kit"?"Kit library":"Pattern chooser");
 const inp=$("#lsin");if(inp){inp.focus({preventScroll:true});inp.select();return}if(had)libFocus()}
function libFocus(){const pop=$("#libpop"),el=pop.querySelector(".ls[aria-selected=true]");if(!el)return;el.focus({preventScroll:true});
 if(pop.scrollHeight>pop.clientHeight){const a=el.getBoundingClientRect(),b=pop.getBoundingClientRect();if(a.top<b.top)pop.scrollTop-=b.top-a.top+8;else if(a.bottom>b.bottom)pop.scrollTop+=a.bottom-b.bottom+8}}
function placeLib(){const pop=$("#libpop"),r=$(".lcdpanel").getBoundingClientRect(),top=Math.max(16,r.bottom+8);pop.style.top=(top+scrollY)+"px";pop.style.maxHeight=Math.max(240,innerHeight-top-12)+"px";pop.style.left=Math.max(16,(document.documentElement.clientWidth-pop.offsetWidth)/2+scrollX)+"px"}
function openLib(kind){if(!engReady()){toast("The engine is not ready yet.");return}closePicker();closeK();if(LIB.open)closeLib(false);LIB.open=kind;LIB.sel=kind==="kit"?S.kit:(S.queued??S.pat);LIB.renaming=null;$("#libpop").hidden=false;drawLib();placeLib();libFocus();$(kind==="kit"?"#kitf":"#pat").setAttribute("aria-expanded","true")}
function closeLib(back){if(!LIB.open)return;const k=LIB.open;LIB.open=null;LIB.sig="";LIB.renaming=null;LIB.drag=null;$("#libpop").hidden=true;const t=$(k==="kit"?"#kitf":"#pat");t.setAttribute("aria-expanded","false");if(back)t.focus()}
function toggleLib(kind){LIB.open===kind?closeLib(false):openLib(kind)}
addEventListener("resize",()=>{if(LIB.open)placeLib()});
function relinkCur(k){S.patKit[S.pat]=k}

/* ----- kit actions (all editor state, so all undoable) ----- */
function kitLoad(k){if(k===S.kit){if(S.kitState==="edited")kitReload();else toast(kitName(k)+" is already the current kit.");return}
 const go=()=>{S.kit=k;applyKit(kitData(k));S.workName=S.kits[k].name;relinkCur(k);setKitState("clean");tx();render();drawLib(true);toast("Loaded "+kitName(k)+". "+patName(S.pat)+" now uses it.")};
 if(S.kitState==="edited"){ask(`Load <b>${kitName(k)}</b>? Your edits to <b>${kitName(S.kit)}</b> are not saved on the machine. They go to its UNDO KIT.`,[["Save kit, then load","cream",()=>{saveKit();go()}],["Load (edits to UNDO KIT)","danger",go],["Cancel","",()=>drawLib(true)]]);return}go()}
function kitSave(){saveKit();drawLib(true)}
function kitSaveAs(k){if(k===S.kit){kitSave();return}
 const go=()=>{const from=S.kit;S.kits[k]={name:S.workName,empty:false,data:captureKit()};S.kit=k;relinkCur(k);setKitState("clean");tx();render();drawLib(true);toast("Saved as "+kitName(k)+". It is now the current kit; K"+nn(from)+" keeps its saved version.")};
 if(!S.kits[k].empty){ask(`Overwrite <b>${kitName(k)}</b> with the current kit <b>${kitName(S.kit)}</b>? The machine keeps the overwritten kit in its UNDO KIT.`,[["Overwrite","danger",go],["Cancel","",()=>drawLib(true)]]);return}go()}
function kitSrc(k){return k===S.kit?{from:k,name:S.workName,empty:false,data:captureKit()}:{from:k,name:S.kits[k].name,empty:S.kits[k].empty,data:S.kits[k].data?clone(S.kits[k].data):null}}
function kitCopy(k){LCLIP={type:"kit",...kitSrc(k)};drawLib(true);toast("Copied "+kitName(k)+(k===S.kit&&S.kitState==="edited"?" with its unsaved edits.":"."))}
function kitPut(k,src,verb){if(src.from===k){toast("That is the same slot.");return}
 const go=()=>{S.kits[k]={name:src.name,empty:src.empty,data:src.data?clone(src.data):src.empty?null:kitData(src.from)};if(k===S.kit){applyKit(kitData(k));S.workName=S.kits[k].name;setKitState("clean")}structEdited();render();drawLib(true);toast(verb+" K"+nn(src.from)+" into "+kitName(k)+" (kit dump through SYSEX RECV).")};
 const busy=!S.kits[k].empty||k===S.kit;if(busy){ask(`${verb} <b>K${nn(src.from)} ${escH(src.name||"EMPTY")}</b> over <b>${kitName(k)}</b>?${k===S.kit?" It is the current kit"+(S.kitState==="edited"?": its unsaved edits are lost.":", so it is loaded too."):""}`,[["Overwrite","danger",go],["Cancel","",()=>drawLib(true)]]);return}go()}
function kitPaste(k){if(LCLIP?.type!=="kit"){toast("Copy a kit first.");return}kitPut(k,LCLIP,"Paste")}
function kitClear(k){if(S.kits[k].empty&&k!==S.kit){toast(kitName(k)+" is already empty.");return}
 ask(`Clear <b>${kitName(k)}</b>?${k===S.kit?" It is the current kit: all six tracks go back to GND-SIN"+(S.kitState==="edited"?" and the unsaved edits are lost.":"."):""}${linked(k).length?" "+linked(k).length+" pattern(s) link to it.":""}`,[["Clear kit","danger",()=>{S.kits[k]={name:"",empty:true,data:null};if(k===S.kit){applyKit(clearedKit());S.workName="";setKitState("clean")}structEdited();render();drawLib(true);toast("Cleared K"+nn(k)+".")}],["Cancel","",()=>drawLib(true)]])}
function kitReload(){if(S.kitState!=="edited"){toast(kitName(S.kit)+" matches its saved slot. Nothing to reload.");return}
 ask(`Reload <b>${kitName(S.kit)}</b> from the machine? Your edits go to its UNDO KIT.`,[["Reload (discard edits)","danger",()=>{applyKit(kitData(S.kit));S.workName=S.kits[S.kit].name;setKitState("clean");tx();render();drawLib(true);toast("Reloaded "+kitName(S.kit)+" from the machine.")}],["Cancel","",()=>drawLib(true)]])}
function startRename(k){if(LIB.open!=="kit")return;LIB.sel=k;LIB.renaming=k;drawLib(true)}
function finishRename(ok){const k=LIB.renaming;if(k==null)return;const v=($("#lsin")?.value||"").toUpperCase().replace(KBAD,"").slice(0,KNAME).trimEnd();LIB.renaming=null;
 if(ok&&v!==kDisp(k)){if(k===S.kit){S.workName=v;setKitState("edited");tx();toast("Renamed the working kit (SysEx 0x55). SAVE stores the name on the machine.")}else{const s=S.kits[k];if(s.empty&&!s.data)s.data=clearedKit();s.empty=false;s.name=v;structEdited();toast("Renamed K"+nn(k)+" (kit dump through SYSEX RECV).")}renderTop()}
 drawLib(true)}
/* ----- pattern actions ----- */
function patSrc(p){return{from:p,has:hasPat(p),kit:S.patKit[p],data:p===S.pat?capturePat():clone(S.patData[p]||emptyPat(S.patInfo[p].len))}}
function patCopy(p){LCLIP={type:"pat",...patSrc(p)};drawLib(true);toast("Copied "+patName(p)+": notes, locks, arp, transpose, swing, slide and its kit link.")}
function patPut(p,src,verb){if(src.from===p){toast("That is the same slot.");return}
 const go=()=>{const d=clone(src.data);S.patData[p]=d;S.patInfo[p]={has:src.has,len:d.len};S.patKit[p]=src.kit;if(p===S.pat)applyPat(d);structEdited();render();drawLib(true);toast(verb+" "+patName(src.from)+" into "+patName(p)+" (pattern dump through SYSEX RECV).")};
 if(hasPat(p)){ask(`${verb} <b>${patName(src.from)}</b> over <b>${patName(p)}</b>? Its notes and locks are replaced.`,[["Overwrite","danger",go],["Cancel","",()=>drawLib(true)]]);return}go()}
function patPaste(p){if(LCLIP?.type!=="pat"){toast("Copy a pattern first.");return}patPut(p,LCLIP,"Paste")}
function patClear(p){if(!hasPat(p)){toast(patName(p)+" is already empty.");return}
 ask(`Clear <b>${patName(p)}</b>? Its notes and locks are removed. It keeps its kit link, as on the machine.`,[["Clear pattern","danger",()=>{const e=emptyPat(patLen(p));S.patData[p]=e;S.patInfo[p]={has:false,len:e.len};if(p===S.pat)applyPat(e);structEdited();render();drawLib(true);toast("Cleared "+patName(p)+".")}],["Cancel","",()=>drawLib(true)]])}
function patGo(p,now){LIB.sel=p;if(p===S.pat&&S.queued==null){drawLib(true);return}goPattern(p,now);drawLib(true)}
function libAct(a){const k=LIB.sel,kit=LIB.open==="kit";
 ({close:()=>closeLib(true),load:()=>kitLoad(k),save:kitSave,saveas:()=>kitSaveAs(k),reload:kitReload,rename:()=>startRename(k),
   copy:()=>kit?kitCopy(k):patCopy(k),paste:()=>kit?kitPaste(k):patPaste(k),clear:()=>kit?kitClear(k):patClear(k),go:()=>patGo(k,false),now:()=>patGo(k,true)})[a]?.()}

/* ----- mouse ----- */
document.addEventListener("click",e=>{if(!LIB.open)return;if($("#libpop").contains(e.target)||e.target.closest?.("#dlg,#kitf,#pat,#undo,#redo"))return;closeLib(false)},true);
document.addEventListener("click",e=>{if(!LIB.open||!$("#libpop").contains(e.target)||e.target.closest?.("#lsin"))return;
 const a=e.target.closest("[data-la]");if(a){if(!a.disabled)libAct(a.dataset.la);return}
 const ks=e.target.closest("[data-ks]");if(ks){const k=+ks.dataset.ks;if(LIB.renaming!=null)finishRename(true);LIB.sel=k;drawLib(true);return}
 const ps=e.target.closest("[data-ps]");if(ps){patGo(+ps.dataset.ps,e.shiftKey);return}
 const lb=e.target.closest("[data-lb]");if(lb){LIB.sel=+lb.dataset.lb*16+(LIB.sel&15);drawLib(true)}});
document.addEventListener("dblclick",e=>{const ks=e.target.closest("#libpop [data-ks]");if(ks&&!e.target.closest("#lsin"))startRename(+ks.dataset.ks)});
document.addEventListener("input",e=>{if(e.target.id!=="lsin")return;const i=e.target,c=i.selectionStart,v=i.value.toUpperCase().replace(KBAD,"").slice(0,KNAME);if(v!==i.value){i.value=v;i.setSelectionRange(Math.min(c,v.length),Math.min(c,v.length))}});
document.addEventListener("focusout",e=>{if(e.target.id==="lsin"&&LIB.renaming!=null)setTimeout(()=>{if(document.activeElement?.id!=="lsin")finishRename(true)},0)});
document.addEventListener("dragstart",e=>{const s=e.target.closest?.("#libpop .ls[data-ks],#libpop .ls[data-ps]");if(!s)return;LIB.drag={kit:"ks" in s.dataset,v:+(s.dataset.ks??s.dataset.ps)};s.classList.add("dragging");e.dataTransfer.effectAllowed="copy";try{e.dataTransfer.setData("text/plain",String(LIB.drag.v))}catch(_){}});
const libTarget=el=>el.closest?.(LIB.drag?.kit?"#libpop [data-ks]":"#libpop [data-ps]");
document.addEventListener("dragover",e=>{if(!LIB.drag)return;const t=libTarget(e.target);$$("#libpop .ls.over").forEach(x=>x!==t&&x.classList.remove("over"));if(!t)return;e.preventDefault();e.dataTransfer.dropEffect="copy";t.classList.add("over")});
document.addEventListener("drop",e=>{if(!LIB.drag)return;const t=libTarget(e.target),d=LIB.drag;LIB.drag=null;if(!t)return;e.preventDefault();const to=+(t.dataset.ks??t.dataset.ps);LIB.sel=to;
 if(d.kit)kitPut(to,kitSrc(d.v),"Copy");else patPut(to,patSrc(d.v),"Copy");drawLib(true)});
document.addEventListener("dragend",()=>{if(!LIB.drag&&!$$("#libpop .dragging").length)return;LIB.drag=null;drawLib(true)});
/* ----- keyboard (capture, so the panel owns its keys while it is open) ----- */
document.addEventListener("keydown",e=>{
 if(!LIB.open){if((e.key==="Enter"||e.key===" ")&&(e.target.id==="kitf"||e.target.id==="pat")){e.preventDefault();e.stopImmediatePropagation();openLib(e.target.id==="kitf"?"kit":"pat")}return}
 if(!$("#dlg").hidden)return;
 if(e.target.id==="lsin"){if(e.key==="Enter"||e.key==="Escape"){e.preventDefault();finishRename(e.key==="Enter")}e.stopImmediatePropagation();return}
 const mod=e.metaKey||e.ctrlKey,kit=LIB.open==="kit",n=128,cols=16,key=e.key;let h=true;
 if(key==="Escape")closeLib(true);
 else if(!mod&&!e.altKey&&/^Arrow/.test(key)){LIB.sel=(LIB.sel+{ArrowLeft:-1,ArrowRight:1,ArrowUp:-cols,ArrowDown:cols}[key]+n)%n;drawLib(true)}
 else if(key==="Enter"){if(kit)kitLoad(LIB.sel);else patGo(LIB.sel,e.shiftKey||mod)}
 else if(key==="F2"&&kit)startRename(LIB.sel);

const H={undo:[],redo:[],last:null};
const packT=t=>({...t,slide:[...t.slide],swing:[...t.swing]}),unpackT=t=>({...t,slide:new Set(t.slide),swing:new Set(t.swing)});
function snap(){return JSON.stringify({tracks:S.tracks.map(packT),midi:S.midi.map(packT),locks:[...S.locks].map(([k,m])=>[k,[...m]]),song:S.song,len:S.len,mult:S.mult,swingAmt:S.swingAmt,patTrn:S.patTrn,
 routing:S.routing,multi:S.multi,menv:S.menv,mmap:S.mmap,mode:S.mode,links:S.ctl.links,kitState:S.kitState,kits:S.kits,patData:S.patData,patInfo:S.patInfo,patKit:S.patKit,kit:S.kit,workName:S.workName},(k,v)=>v===Infinity?"∞":v)}
function restore(str){const o=JSON.parse(str,(k,v)=>v==="∞"?Infinity:v);S.tracks=o.tracks.map(unpackT);S.midi=o.midi.map(unpackT);S.locks=new Map(o.locks.map(([k,m])=>[k,new Map(m)]));
 Object.assign(S,{song:o.song,len:o.len,mult:o.mult,swingAmt:o.swingAmt,patTrn:o.patTrn,routing:o.routing,multi:o.multi,menv:o.menv,mmap:o.mmap,mode:o.mode});S.ctl.links=o.links||[];setKitState(o.kitState);if(o.kits){S.kits=o.kits;S.patData=o.patData;S.patInfo=o.patInfo;S.patKit=o.patKit;S.kit=o.kit;S.workName=o.workName;drawLib()}}
function commit(){if(laneDraw||rollDrag||drag||active||arpDrag)return;const cur=snap();if(H.last==null){H.last=cur;return}if(cur!==H.last){H.undo.push(H.last);if(H.undo.length>200)H.undo.shift();H.redo=[];H.last=cur;renderTop()}}
function undo(){if(!H.undo.length){toast("Nothing to undo.");return}H.redo.push(snap());const prev=H.undo.pop();restore(prev);H.last=prev;tx();render();toast("Undo")}

 const pmk=e.target.closest("[data-pmode]");if(pmk){S.mode=pmk.dataset.pmode;if(S.mode==="poly")toast("POLY: T"+(asgT()+1)+" now plays six voices. The other five tracks are off until you leave POLY.");render();return}
 const so2=e.target.closest("[data-strk]");if(so2){S.multi.splitTrack=clamp(S.multi.splitTrack+ +so2.dataset.strk,2,6);render();return}
 const tm=e.target.closest("[data-tim]");if(tm){S.multi.timing=clamp(S.multi.timing+ +tm.dataset.tim,0,6);render();return}
 const ko=e.target.closest("[data-kboct]");if(ko){S.kbOct=clamp(S.kbOct+ +ko.dataset.kboct,0,6);render();return}
 const bd=e.target.closest("[data-band]");if(bd){S.mmapSel=+bd.dataset.band;render();return}
 const mr=e.target.closest("tr[data-mrow]");if(mr&&!e.target.closest("button,.pc,.kselbtn")){S.mmapSel=+mr.dataset.mrow;render();return}
 const mh=e.target.closest("[data-mhi]");if(mh){const i=+mh.dataset.i,r=S.mmap[i],lo=i?S.mmap[i-1].hi+1:0,nx=S.mmap[i+1];r.hi=clamp(r.hi+ +mh.dataset.mhi,lo,nx?nx.hi-1:127);render();return}
 const md=e.target.closest("[data-mdel]");if(md){const i=+md.dataset.mdel;if(S.mmap.length<2)return;const r=S.mmap.splice(i,1)[0];if(i===S.mmap.length)S.mmap[i-1].hi=127;S.mmapSel=Math.max(0,i-1);render();return}
 if(e.target.closest("[data-madd]")){const i=S.mmapSel,r=S.mmap[i],lo=i?S.mmap[i-1].hi+1:0;if(r.hi-lo<1){toast("A one-key range cannot be split.");return}const mid=Math.floor((lo+r.hi)/2);S.mmap.splice(i,0,{...r,hi:mid});render();return}
 const mi=e.target.closest("[data-mirr]");if(mi){const A=S.tracks[asgT()].assign;A.mirr=!A.mirr;soundEdited();render();return}
 const kt=e.target.closest("[data-ktrk]");if(kt){const A=S.tracks[asgT()].assign;A[kt.dataset.ktrk]=!A[kt.dataset.ktrk];soundEdited();render();return}
 const pl=e.target.closest(".pl");if(pl&&S.ws==="seq"){const k=+pl.dataset.plp;if(k<pages16()){S.page=k;S.viewAll=false;render()}return}
 const pgk=e.target.closest("#pgkey");if(pgk&&!pgk.disabled){const n=pages16();S.viewAll=false;S.page=(S.page+(e.shiftKey?-1:1)+n)%n;render();return}
 if(e.target.closest("#pgall")){S.viewAll=!S.viewAll;render();return}
 if(e.target.closest("#pgfollow")){S.follow=!S.follow;render();return}
 if(S.ws==="song"){
  const bk=e.target.closest("[data-bank]");if(bk){S.bank=+bk.dataset.bank;render();return}
  const ap=e.target.closest("[data-addpat]");if(ap){if(S.song.length>=200){toast("A song holds 200 rows.");return}let at2=S.songSel+1;if(S.song[S.songSel]?.type==="end")at2=S.songSel;S.song.splice(at2,0,{pat:+ap.dataset.addpat,rep:1});S.songSel=at2;structEdited();render();return}
  const rw=e.target.closest(".scell:not(.empty),.db[data-row]");if(rw){S.songSel=+rw.dataset.row;render();return}
  const ra=e.target.closest("[data-rowact]");if(ra){songAction(ra.dataset.rowact);return}
  const stp=e.target.closest("[data-step]");if(stp){songStep(stp.dataset.step,+stp.dataset.d*(e.shiftKey?10:1));return}
  const tt=e.target.closest("[data-ttr]");if(tt){const r=S.song[S.songSel];r.ttr=r.ttr||T64();const k=+tt.dataset.ttr;r.ttr[k]=clamp(r.ttr[k]+ +tt.dataset.d,28,100);structEdited();render();return}
  const mk=e.target.closest("[data-rowmute]");if(mk){const r=S.song[S.songSel],k=+mk.dataset.rowmute;r.mutes=r.mutes||[];r.mutes=r.mutes.includes(k)?r.mutes.filter(x=>x!==k):[...r.mutes,k];structEdited();render();return}
  if(e.target.closest("[data-bpmkeep]")){const r=S.song[S.songSel];r.bpm=r.bpm?undefined:Math.round(S.bpm);structEdited();render();return}
  if(e.target.closest("[data-fullpat]")){const r=S.song[S.songSel];delete r.ofs;delete r.len;structEdited();render();return}
  if(e.target.closest("[data-inf]")){const r=S.song[S.songSel];r.count=r.count===Infinity?2:Infinity;structEdited();render();return}}
 const dl=e.target.closest("[data-dlg]");if(dl){const d=$("#dlg"),f=d._btns[+dl.dataset.dlg][2];d.hidden=true;f();return}
 if(e.target.id==="dlg"){$("#dlg").hidden=true;return}
 if(e.target.closest("#drop")&&!e.target.closest("input")){$("#romfile").click();return}
 if(e.target.closest("#undo")){undo();return}if(e.target.closest("#redo")){redo();return}
 const sc=e.target.closest("[data-sec]");if(sc){secAction(sc.dataset.sec);return}
 if(e.target.closest("#pst.warn")){sendDialog();return}
 if(e.target.closest("#kitf")){toggleLib("kit");return}
 if(e.target.closest("#pat")){toggleLib("pat");return}
 if(e.target.closest("#learnkey")){S.learn=!S.learn;S.learnT=null;document.body.classList.toggle("learn",S.learn);renderTop();if(S.learn)toast("LEARN: click a value, then press 1-8 for a controller knob.");return}
 const tb=e.target.closest("#tabs button");if(tb){goWs(tb.dataset.ws);return}
 if(e.target.closest("#platekey")){setPlate(S.plate==="mk1"?"mk2":"mk1");return}
 if(e.target.closest("#play")){togglePlay();return}
 if(e.target.closest("#rec")){S.rec=!S.rec;renderTop();if(S.rec)toast("GRID RECORD on. On the machine: hold a trig to see its note, turn a knob to lock it. Here: just click and draw.");return}
 if(e.target.closest("#patPrev")){goPattern((S.queued??S.pat)-1);return}
 if(e.target.closest("#patNext")){goPattern((S.queued??S.pat)+1);return}});
document.addEventListener("change",e=>{const id=e.target.id,v=e.target.value,tr=trk(S.sel);
 if(id==="romfile"){checkRom(e.target.files[0]);return}
 if(id==="engsel"){const btn=document.querySelector(".lcdeng");if(v==="rom"){e.target.value=S.engine;btn.querySelector("span").textContent=e.target.selectedOptions[0].text;firstRun();return}
  S.engine=v;S.pend=0;renderPst();startEngine(v);return}
 let m=id.match(/^lp(\d)$/);if(m){const l=V("LF"+m[1]);l[0]=+v;l[1]=0;soundEdited();render();return}
 m=id.match(/^ld(\d)$/);if(m){V("LF"+m[1])[1]=+v;soundEdited();render();return}
 m=id.match(/^inp(\d)$/);if(m){S.tracks[+m[1]].inp=v;soundEdited();render();return}
 m=id.match(/^asp(\d)$/);if(m){const r=S.tracks[asgT()].assign.tabs[S.asTab][+m[1]];r.pg=+v;r.d=0;soundEdited();render();return}
 m=id.match(/^asd(\d)$/);if(m){S.tracks[asgT()].assign.tabs[S.asTab][+m[1]].d=+v;soundEdited();return}
 m=id.match(/^mpat(\d+)$/);if(m){S.mmap[+m[1]].pat=+v;render();return}
 if(id==="trigpos"){tr.trigpos=v===""?null:+v;soundEdited();render();return}
 if(id==="mch"){tr.ch=+v;soundEdited();render();return}});

/* ===== Keys ===== */
document.addEventListener("keydown",e=>{const mod=e.metaKey||e.ctrlKey,inField=e.target.closest?.("input,select,textarea");
 if(!$("#dlg").hidden&&e.key==="Escape"){$("#dlg").hidden=true;return}
 if(mod&&!inField&&(e.key==="z"||e.key==="Z")){e.preventDefault();e.shiftKey?redo():undo();return}
 if(mod&&!inField&&e.key==="y"){e.preventDefault();redo();return}
 if(mod&&!inField&&(e.key==="c"||e.key==="v")){e.preventDefault();secAction(e.key==="c"?"copy":"paste");return}
 if(S.learn&&S.learnT&&/^[1-8]$/.test(e.key)){e.preventDefault();learnBind(+e.key);return}
 if(S.learn&&e.key==="Escape"){S.learn=false;document.body.classList.remove("learn");renderTop();return}
 if(e.target.closest?.("input,select,textarea,[role=slider]")||mod||e.altKey)return;
 if(e.key==="l"||e.key==="L"){$("#learnkey").click();return}
 if(e.key==="r"||e.key==="R"){$("#rec").click();return}
 const ws=["seq","sound","mix","perform","song","control"][+e.key-1];if(ws){goWs(ws);return}
 if((S.ws==="song"||S.ws==="seq")&&(e.key==="Delete"||e.key==="Backspace")){e.preventDefault();S.ws==="song"?songAction("del"):secAction("clear");return}
 if(S.ws==="song"&&(e.key==="ArrowLeft"||e.key==="ArrowRight")){S.songSel=clamp(S.songSel+(e.key==="ArrowRight"?1:-1),0,S.song.length-1);render();return}
 if(e.key===" "){e.preventDefault();togglePlay()}
 if((e.key==="["||e.key==="]")&&S.ws==="seq"&&pages16()>1){const n=pages16();S.viewAll=false;S.page=(S.page+(e.key==="]"?1:-1)+n)%n;render()}});

/* BPM: drag or arrows */
(()=>{const b=$("#bpm");let d=null;b.addEventListener("pointerdown",e=>{d={y:e.clientY,v:S.bpm};b.setPointerCapture(e.pointerId)});
 b.addEventListener("pointermove",e=>{if(!d)return;S.bpm=clamp(Math.round((d.v+(d.y-e.clientY)*(e.shiftKey?.1:.5))*10)/10,30,300);renderTop();if(S.playing)restartClock()});
 b.addEventListener("pointerup",()=>d=null);b.addEventListener("keydown",e=>{const k={ArrowUp:1,ArrowDown:-1}[e.key];if(!k)return;e.preventDefault();S.bpm=clamp(S.bpm+k*(e.shiftKey?.1:1),30,300);renderTop();if(S.playing)restartClock()})})();


/* ===== Engine status (from the MD Editor v48): the LCD says what the engine is doing; editing waits until it is ready ===== */
const ENG={norom:["NO ROM","off"],loading:["LOADING ROM","blink"],boot:["BOOTING OS","blink"],ready:["EMU OS 1.32B","on"],hwwait:["HW CONNECT","blink"],hwready:["HW MIDI","on"],hwnone:["HW NO MIDI","off"],error:["ROM ERROR","off"]};
let engT=[];
function engReady(){return S.eng==="ready"||S.eng==="hwready"}
function setEng(st){S.eng=st;const[txt,led]=ENG[st],b=document.querySelector(".lcdeng"),l=document.getElementById("engled");if(!b)return;
 b.querySelector("span").textContent=txt;l.className="led "+(led==="on"?"on":led==="blink"?"on blink":"");
 const ready=engReady();document.querySelector(".lcdpanel").classList.toggle("engwait",!ready);document.body.classList.toggle("engwait",!ready);
 ["rec","play"].forEach(id=>{const k=document.getElementById(id);if(k)k.disabled=!ready});
 bootScreen(st==="boot");
 b.title=ready?"Engine: running. Click to switch emulator or hardware, or load another ROM.":"Engine: "+txt.toLowerCase()+". Editing starts when it is ready."}
/* while BOOTING OS the LCD shows a firmware-style start-up screen (the text is the editor's, not a copy of the ROM's) */
let bootT=[];function bootScreen(on){const el=$("#bootscr");if(!el)return;bootT.forEach(clearTimeout);bootT=[];el.classList.toggle("on",on);if(!on)return;$("#bsmk").textContent=S.plate==="mk1"?"SFX-60":"SFX-60 MKII";
 const steps=[["OS 1.32B · TESTING MEMORY",15],["BATTERY RAM · 128 KITS",40],["128 PATTERNS · 24 SONGS",65],[S.plate==="mk1"?"DSP · FACTORY WAVES":"DSP · 64 DIGIPRO WAVES",85],["STARTING SEQUENCER",100]];
 steps.forEach(([t,f],i)=>bootT.push(setTimeout(()=>{$("#bstxt").textContent=t;$("#bsbar").style.width=f+"%"},i*210)))}
function startEngine(kind){engT.forEach(clearTimeout);engT=[];if(S.playing)togglePlay();
 if(kind==="hw"){setEng("hwwait");engT.push(setTimeout(()=>{setEng("hwready");toast("Hardware mode: sound edits go out as CCs; pattern and song edits wait for SYSEX RECV")},900));return}
 setEng("loading");engT.push(setTimeout(()=>setEng("boot"),700));engT.push(setTimeout(()=>{setEng("ready");toast("Emulator ready: the real OS 1.32B is running")},1800))}
/* ===== Transport ===== */
let clock=null;
function tick(){const prev=S.step;S.step=(S.step+1)%S.len;ctlTick();if(S.step===0&&S.queued!=null){applyPattern(S.queued);return}
 const pp=Math.floor(S.step/16);$$(".pl").forEach(b=>b.classList.toggle("play",+b.dataset.plp===pp&&S.playing));
 if(S.follow&&S.ws==="seq"&&!S.viewAll&&pp!==S.page&&!laneDraw){S.page=pp;render()}
 $("#tempoled").classList.toggle("on",S.step%4===0);setPos();queueMicrotask(movePH);
 $$(`.mst[data-s="${prev}"],.lb[data-s="${prev}"],.tc[data-s="${prev}"]`).forEach(c=>c.classList.remove("ph"));$$(`.mst[data-s="${S.step}"],.lb[data-s="${S.step}"],.tc[data-s="${S.step}"]`).forEach(c=>c.classList.add("ph"));
 if(S.ws==="seq")redraw();
 if(S.ws==="perform"){const act=[0,1,2,3,4,5].filter(i=>{const st=S.tracks[i].steps[S.step];return st&&!st.off&&st.a&&audible(i)&&(S.mode!=="poly"||i===asgT())});flashTracks(act)}}
function stepMs(){const m={"1X":1,"2X":2,"3/4X":.75,"3/2X":1.5}[S.mult];return 60000/S.bpm/4/m}
function restartClock(){clearInterval(clock);clock=setInterval(tick,stepMs())}
/* Soft playhead (as the MD Editor, v45): one ink-tinted column over the roll, the ENV/SLIDE/SWING
   rows and the lock lane that glides from step to step. It jumps without animation on a wrap, a
   page flip or a scroll, and fades out on stop. It lives on <body> in viewport coordinates, so the
   roll's and the lane's scrollers both carry it (movePH(false) on scroll and resize). */
let phX=null;
function movePH(glide=true){let ph=document.getElementById("phcol");
 const seq=$("#seq"),sc=$("#seqscroll"),col=S.playing&&S.step>=0&&S.ws==="seq"&&seq&&sc?seq.querySelector(`.ruler .rul[data-s="${S.step}"]`):null;
 if(!col){if(ph)ph.style.opacity="0";phX=null;return}
 if(!ph){ph=document.createElement("div");ph.id="phcol";ph.setAttribute("aria-hidden","true");document.body.appendChild(ph);phX=null}
 const r=col.getBoundingClientRect(),v=sc.getBoundingClientRect(),top=(seq.querySelector(".nlane.big")||col).getBoundingClientRect().top,
  lane=$("#lane"),bot=(lane&&lane.getClientRects().length?lane:$("#tlanes")||seq).getBoundingClientRect().bottom;
 const jump=!glide||phX==null||r.left<phX;
 ph.style.transition=jump?"opacity .15s":`transform ${Math.round(Math.min(stepMs()*.85,140))}ms cubic-bezier(.2,.7,.3,1),opacity .15s`;
 ph.style.width=r.width+"px";ph.style.top=(top-3)+"px";ph.style.height=(bot-top+6)+"px";ph.style.transform=`translateX(${r.left}px)`;
 ph.style.opacity=r.right>v.left+1&&r.left<v.right-1?"1":"0";phX=r.left}
addEventListener("scroll",()=>{if(S.playing)movePH(false)},true);addEventListener("resize",()=>{if(S.playing)movePH(false)});
function setPos(){$("#pos").textContent=S.playing&&S.step>=0?String(Math.floor(S.step/16)+1).padStart(2,"0")+"."+String(S.step%16+1).padStart(2,"0"):"--.--"}
function togglePlay(){if(!S.playing&&S.eng&&!engReady())return;S.playing=!S.playing;clearInterval(clock);$$(".pl").forEach(b=>b.classList.remove("play"));$("#tempoled").classList.remove("on");$$(".ph").forEach(c=>c.classList.remove("ph"));if(S.playing){S.step=-1;tick();restartClock()}else S.queued=null;setPos();renderTop();redraw();movePH(false)}

/* ===== Render ===== */
function render(){closePicker();closeK();const sl=$("#seqscroll")?.scrollLeft||0;renderTop();{const m=(S.ws==="seq"||S.ws==="sound")&&S.side==="midi";if(!m&&S.sel>5)S.sel-=6;if(m&&S.sel<6)S.sel+=6}const full=["mix","perform","song","control"].includes(S.ws);
 $("#body").className="body "+(full?"full ":"")+"ws-"+S.ws;$("#rail").hidden=full;if(!full)renderRail();renderSub();
 ({control:renderControl,seq:renderSeq,sound:renderSound,mix:renderMix,perform:renderPerform,song:renderSong})[S.ws]();
 const sc=$("#seqscroll");if(sc){sc.scrollLeft=sl;const l=$("#lanescroll");if(l)l.scrollLeft=sl}enhanceSelects($("#main"));if(S.learn)document.body.classList.add("learn");movePH(false)}
function setPlate(v){S.plate=v;document.documentElement.dataset.plate=v;try{localStorage.setItem("mmeditor.plate",v)}catch(_){}
 if(v==="mk1"){const bad=S.tracks.filter(t=>MACH[t.m].mk2);if(bad.length)toast(`MKI: ${bad.map(t=>t.m).join(", ")} needs a MKII. It would load as nothing on a MKI.`);else toast("MKI: no user waveforms, no DPRO-DDRW or DPRO-DENS. The plate looks the same.")}
 if(v==="mk2")toast("MKII: the same silver plate, plus user waveforms and the DigiPRO draw machines.");
 render();redraw()}
(()=>{let v=null;try{v=localStorage.getItem("mmeditor.plate")}catch(_){}if(!["mk1","mk2"].includes(v))v="mk2";S.plate=v;document.documentElement.dataset.plate=v})();
document.fonts&&document.fonts.ready.then(()=>{if(S.ws==="seq"){fitLane();drawSlides()}redraw();alignLock()});
if(window.ResizeObserver)new ResizeObserver(()=>{if(S.ws==="seq"){fitLane();alignLock()}}).observe(document.getElementById("main"));
addEventListener("resize",()=>{if(S.ws==="seq"){fitLane();drawSlides();alignLock()}redraw()});

/* deep links: #ws=sound&t=3&dock=arp&plate=mk1&mode=multi */
(()=>{const q=new URLSearchParams(location.hash.slice(1));if(q.get("plate")){S.plate=q.get("plate");document.documentElement.dataset.plate=S.plate}if(q.get("ws"))S.ws=q.get("ws");if(q.get("side")==="midi")S.side="midi";{const t=(q.get("t")?+q.get("t")-1:0)+((S.ws==="seq"||S.ws==="sound")&&S.side==="midi"?6:0);S.sel=t;select(t)}if(q.get("dock"))S.dock=q.get("dock");if(q.get("mode"))S.mode=q.get("mode");if(q.get("mt"))S.multi.mode=+q.get("mt");if(q.get("all"))S.viewAll=true;autoRange(S.sel)})();
render();H.last=snap();startEngine("emu");{const lb=new URLSearchParams(location.hash.slice(1)).get("lib");if(lb)setTimeout(()=>openLib(lb),2000)}
</script>
