.sgrow{grid-column:1;display:grid;grid-template-rows:subgrid;column-gap:14px;min-width:0;min-height:0}
.snd .sgcol{grid-row:1/-1;display:grid;grid-template-rows:subgrid;gap:normal;min-width:0;min-height:0}
.sg{display:contents}
.sg>*{grid-column:1;min-width:0}
.sg>header{grid-row:1;border-top:2px solid var(--print);padding-top:6px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;min-width:0}
.sg h3{margin:0;font:600 12px var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--print);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;display:flex;align-items:center;gap:8px}
.sg>header>span{font:11px var(--mono);color:var(--print3);white-space:nowrap;cursor:help;flex:none}
.sg>.plot{grid-row:2;position:relative;min-height:0;border-radius:4px;overflow:hidden}
.sg>.plot>canvas.ed{position:absolute;inset:0;width:100%;height:100%!important;min-height:0!important}
.sg>:is(.ctl,.sgline,.lfobody,.sgabout){grid-row:3;align-self:start;min-width:0}
.sgrow.flat .sg>:is(.ctl,.sgline,.lfobody,.sgabout){grid-row:2}
.sgcol.stack>.sg:first-child>:not(header){grid-row:2;align-self:start}
.sgcol.stack>.sg:last-child>header{grid-row:2;align-self:end}
.sgnote{grid-row:2;margin:0;align-self:start;font:11px var(--mono);line-height:1.45;color:var(--print3);overflow:hidden;min-height:0}
.sgabout{margin:0;font:12px var(--mono);line-height:1.5;color:var(--print3)}
.sgabout .cream{margin-left:8px}
.sg>.ctl{gap:4px}
.snd .pc{padding:0 6px;height:28px}
.snd .pc span{font-size:11px;letter-spacing:.04em}
.snd .pc b{font-size:13px}
.snd .mutg{all:unset;cursor:pointer;border-bottom:1px dashed currentColor;overflow:hidden;text-overflow:ellipsis}
.snd .mutg[aria-pressed=true]{background:var(--lcd);color:var(--ink);padding:0 5px;border-radius:2px;border-bottom:0}
.snd .lfohead{gap:8px;min-width:0}
.snd .lfohandle{width:22px;height:22px;font-size:10px}
.lfobody{display:grid;gap:5px}
.lfobody .lforoute .kselbtn{height:24px;flex:1 1 0}
.lfobody .lforoute .seg{flex:none;margin-left:6px;gap:7px}
.lfobody .lforoute .seg button{font-size:10px;letter-spacing:.06em}
.lfobody .shapes{flex-wrap:nowrap;gap:2px}
.lfobody .shapes button{flex:1 1 0;padding:2px 0;display:grid;place-items:center;min-width:0}
.lfobody .shapes svg{width:20px;height:15px}
@media (max-width:1380px){.lfobody .lforoute .seg{gap:4px;margin-left:2px}.lfobody .lforoute .seg button{letter-spacing:0;gap:3px}.lfobody .lforoute .seg button::before{width:5px;height:5px}.snd .pc{padding:0 4px}.snd .pc span{font-size:10px;letter-spacing:.02em}.snd .pc b{font-size:12px}.sgrow{column-gap:11px}.snddock .ptog{padding:0 5px}}
/* Song: the row's rarer settings behind MORE (as the Machinedrum Editor's) */
.morebtn{margin-left:0}
.morebtn small{font:12px var(--mono);letter-spacing:0;text-transform:none;color:var(--print3)}
/* Song: one palette, two ways to play its pads (120-song.js renderSong, MM-P8, as the Machinedrum Editor's):
   ARRANGE adds to the song, CHAIN numbers the machine's chain (the Plays line below the pads); the header
   says what the machine plays */
.card header.phead{align-items:center;gap:14px}
.card header.phead .seg{gap:10px;color:inherit;font:inherit}
.card header .playschip{margin-left:auto;font:12px var(--pix);color:var(--ink);min-width:0;overflow:hidden;text-overflow:ellipsis}
.card header .playschip.chain{box-shadow:inset 0 0 0 2px var(--led)}
.padd em{position:absolute;right:5px;bottom:4px;font:700 12px var(--pix);font-style:normal;color:var(--led)}
.padd.in{box-shadow:inset 0 0 0 2px var(--led)}
.songleft .pnote{margin:8px 0 0;font-size:12px;color:var(--print3)}
.chainfoot{display:grid;gap:4px;margin-top:8px}
.chainfoot .irow .note{padding-left:0;flex-basis:auto}
.chainrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-height:26px}
.chainrow .lcdchip{font:12px var(--pix);text-transform:uppercase}
.chainrow .lcdchip.now{outline:2px solid var(--ink);outline-offset:-2px}
.chainrow .lcdchip.nx{animation:blink .5s steps(2) infinite}
.chainrow i{font-style:normal;color:var(--print2)}
.chainacts{display:flex;gap:6px;align-items:center}
.chainacts button{height:26px;padding:0 10px;font:600 11px var(--sans);letter-spacing:.12em;text-transform:uppercase}
.chainacts button:disabled{opacity:.35;cursor:default}
@media (prefers-reduced-motion:reduce){.chainrow .lcdchip.nx{animation:none}}

/* ===== The Sequence dock: one layout for every tab (the lock lane's) =====
   Geometry comes from the LOCKS layout only: the rail's LOCK PARAMETER block is always laid out (hidden in the
   other tabs), the panel's keys cover its keys area, the body is the lane's box (flex basis 0, so its content
   never sizes it). Switching tabs moves nothing outside the body. */
#rail .railparams{position:relative}
body.dockother #rail .railparams>:is(.lpspace,.pagetabs,.pkcol),body.dockother #rail #clearLane{visibility:hidden}
.dockkeys{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.dkg{display:grid;gap:2px;min-width:0}
.dkl{height:11px;font:600 9px/11px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--print2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dkrow{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:3px}
#rail .dkk{height:26px;width:auto;padding:0 1px;text-align:center;font:500 10.5px var(--mono);letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:clip}
#rail .dkrow.tight .dkk{font-size:10px}
#rail .dkk:disabled{opacity:.35;cursor:default}
.dkna{display:block;height:26px;font:11px/26px var(--mono);color:var(--print3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ws-seq .lanewrap>#lanescroll,.ws-seq .lanewrap>.dockbody{flex:1 1 0;min-height:140px}
.ws-seq .lanewrap>.dockbody{height:auto;padding:0 0 0 53px;box-sizing:border-box;overflow:hidden;display:grid;grid-template-rows:34px minmax(0,1fr);row-gap:8px}
.lanetop .dkread{flex:none}
.lanetop .dkhelp{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.dkvals{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;height:34px;min-width:0}
.dkvals .pc{min-width:0}
.dkvals .pc span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.dkvis{position:relative;min-height:0;display:flex;flex-direction:column;gap:4px}
/* lane-style keys: the arp steps, the scale, the envelope */
.dkvis .arptrack{flex:1 1 0;height:auto!important;min-height:0;padding:0;background:transparent;box-shadow:none;gap:3px;border-radius:0}
.dkvis .arptrack .ac{position:relative;background:var(--key);border-radius:3px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.35);overflow:hidden}
.dkvis .arptrack .ac:hover{filter:brightness(1.15)}
.dkvis .arptrack .ac.mute{background:color-mix(in srgb,var(--key) 55%,transparent)}
.dkvis .arptrack .ac.na{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--key) 30%,transparent) 0 3px,transparent 3px 6px);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--key) 40%,transparent)}
.dkvis .arptrack .ac .z{border-top:1px solid color-mix(in srgb,var(--keytext) 45%,transparent)}
.dkvis .arptrack .ac i{position:absolute;left:22%;right:22%;background:repeating-linear-gradient(to top,var(--led) 0 5px,transparent 5px 8px);filter:drop-shadow(0 0 3px color-mix(in srgb,var(--led) 70%,transparent))}
.dkvis .arptrack .ac i.dn{background:repeating-linear-gradient(to bottom,var(--led) 0 5px,transparent 5px 8px)}
.dkvis .arptrack .ac.mute i{background:transparent;filter:none;box-shadow:inset 0 0 0 1px var(--led)}
.dkvis .arptrack .ac b{position:absolute;left:0;right:0;bottom:3px;text-align:center;font:8px var(--pix);color:var(--keytext);font-weight:400;white-space:nowrap;overflow:hidden}
.dkvis .arptrack .ac b{top:3px;bottom:auto}
.dkvis .arplenrow{padding:0;gap:3px;flex:none}
.dkvis .arplenrow button{height:10px}
.dkvals2 .dkcell{display:block}
.dkscale{position:absolute;top:0;bottom:14px;left:-53px;width:50px;box-sizing:border-box;padding:0 6px 0 0;justify-items:end;text-align:right;display:grid;align-content:space-between;font:9px var(--pix);color:var(--print2);pointer-events:none}
.dkscale b{font-weight:400;opacity:.75}
/* TRIG SETUP and TRANSPOSE: an LCD plate (the Sound page's plots) filling the picture area */
.dkvis canvas.dkplot{flex:1 1 0;height:auto;min-height:0;width:100%}

/* ===== Perform v2: a short keyboard at the bottom; the joystick a big square in the middle, its rows beside it.
   The controls row takes the height the keyboard leaves; the stick is sized from the page height. ===== */
/* The top row never shrinks below its cards (envelope, assign, mutes): in a short window the page scrolls (#main) instead of the cards printing over each other. */
#main>.perf{flex:1 1 auto;min-height:min-content;grid-template-rows:minmax(300px,1fr);grid-auto-rows:auto}
.perf3{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr)!important;min-height:0}
.perf3>.card{min-height:0}
.perf3 .menvcard{grid-template-rows:auto minmax(0,1fr) auto auto;align-content:stretch}
/* B-017: the envelope's screen fills its row from a box of its own, the canvas absolute inside it. A canvas in the row
   itself sized the row from its drawing (its width and height attributes, set on every redraw), so dragging DEC grew
   the card and the page a little with each redraw until the render on release put it back. */
.perf3 .menvcard .menvplot{position:relative;min-height:96px;min-width:0}
.perf3 .menvcard .menvplot>canvas.ed{position:absolute;inset:0;width:100%;height:100%!important;min-height:0!important}
.perf3 .asgcard{--joy:clamp(200px,calc(100vh - 500px),440px);grid-template-rows:auto auto minmax(0,1fr)}
.perf3 .asgcard .asgn{grid-template-columns:var(--joy) 270px;align-items:start}
.perf3 .asgcard .asgn:not(:has(.joy)){grid-template-columns:calc(var(--joy) + 284px)}
.perf3 .asgcard .joy{width:var(--joy)!important;height:var(--joy)!important}
/* Multi map: the map table and the keyboard below keep their height, so the stick gets what is left of the window
   (about 100vh minus the page's other rows) and never more than its card's row. */
.perf.map .asgcard{--joy:clamp(96px,calc(100vh - 725px),440px)}
/* Too short for any stick above the map table (the card's row is under 170 px): the stick steps aside; the assign
   rows stay, and the table and keyboard are never covered. */
@media (max-height:759px){.perf.map .asgcard .joy{display:none}.perf.map .asgcard .asgn{grid-template-columns:minmax(0,1fr)}}
.joy small.jl{left:5px;top:50%;transform:translateY(-50%)}
.joy small.jr{right:5px;top:50%;transform:translateY(-50%)}
.joy small.ju{left:50%;top:4px;transform:translateX(-50%)}
.joy small.jd{left:50%;bottom:4px;transform:translateX(-50%)}
.joy .knobj{width:28px;height:28px;margin:-14px 0 0 -14px}
.perf3 .joy small{font-size:11px}
.perf3 .card header{flex-wrap:nowrap;white-space:nowrap;min-width:0}
.perf3 .card header>span:not(.seg){min-width:0;overflow:hidden;text-overflow:ellipsis}
.perf3 .mutes12 button{height:40px}
.perf .kb{height:clamp(96px,20vh,190px)!important}
.perf.map .kb{height:clamp(84px,14vh,150px)!important}
/* Song, as the Machinedrum Editor's: the arrangement's 200 slots fill the page across and down (13 rows of 16
   share the height); the left column (patterns, selected row) scrolls on its own. One column below 1100 px. */
@media (min-width:1101px){
#main>.songui.lay2{flex:1 1 auto;min-height:0;align-items:stretch}
.songui.lay2>.songleft{min-height:0;overflow:auto;padding-right:6px}
.songui.lay2>.card{min-height:0;grid-template-rows:auto auto minmax(0,1fr);padding:0 2px 2px 0}	/* room for the grid's bezel inside #main's clip */
.songui.lay2 .slotgrid{min-height:0;grid-template-rows:repeat(13,minmax(22px,1fr));align-content:stretch}
.songui.lay2 .slotgrid .scell{height:auto!important;min-height:0}
}
/* the arrangement's header stays one line, as the MD's: the legend shortens first */
.songui.lay2>.card>header{flex-wrap:nowrap;min-width:0;align-items:center}
.songui.lay2>.card>header>.note{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1 1 auto}
.songui.lay2>.card>header>.songpick{flex:none}

/* A narrow window (1280): the top bar fits, so MKII is not cut off: tighter gaps and workspace keys */
@media (max-width:1340px){header.top{column-gap:8px!important}header.top .left{gap:8px!important}header.top .tabs>button{min-width:0!important;padding-left:6px!important;padding-right:6px!important}}

<script>
"use strict";
/* ===================================================================
   Monomachine Editor mockup. Example state follows the OS 1.32 manual.
   Values are firmware units (0-127, or small enums); display converts.
   =================================================================== */

/* ===== Data from the manual ===== */
const PAGES=["SYN","AMP","FLT","EFX","LF1","LF2","LF3"];
const PAGEN={SYN:"Synthesis",AMP:"Amplification",FLT:"Filter",EFX:"Effects",LF1:"LFO 1",LF2:"LFO 2",LF3:"LFO 3",MID:"MIDI page"};
const FIXED={AMP:["ATK","HOLD","DEC","REL","DIST","VOL","PAN","PORT"],FLT:["BASE","WDTH","HPQ","LPQ","ATK","DEC","BOFS","WOFS"],EFX:["EQF","EQG","SRR","DTIM","DSND","DFB","DBAS","DWID"],
 LF1:["PAGE","DEST","TRIG","WAVE","MULT","SPD","INTL","DPTH"],LF2:["PAGE","DEST","TRIG","WAVE","MULT","SPD","INTL","DPTH"],LF3:["PAGE","DEST","TRIG","WAVE","MULT","SPD","INTL","DPTH"],
 MID:["LEN","VEL","PB","PCHG","CC1","CC2","CC3","CC4"]};
/* CC map, Appendix B: per track channel (base + track) */
const CCBASE={SYN:48,AMP:56,FLT:72,EFX:80,LF1:88,LF2:104,LF3:112};
/* Machines, Appendix A. id = the SysEx 0x5B machine number (Appendix C). The 8 SYN slots follow the OS 1.32B screens ("" = unused knob), which differ from the manual text in places. */
const MACH={
 "GND-GND":{id:0,p:[],about:"Silence. A clean slot."},
 "GND-SIN":{id:1,p:["","","","","","","","TUNE"],about:"A plain sine. Clearing a machine gives this one."},
 "GND-NOIS":{id:2,p:["ST","RED","STON","","","","","TUNE"],about:"Noise from white (RED 0) through pink (64) to red (127)."},
 "SID-6581":{id:3,p:["PW","PWAD","PWRS","WAVE","MOD","MSRC","MFRQ","TUNE"],about:"MOS 6581 oscillator with ring mod and sync. MSRC = PRCH takes the second frequency from the track before."},
 "SWAVE-SAW":{id:4,p:["UNIL","UNIW","UNIX","","SUBX","SUB1","SUB2","TUNE"],about:"Eight saw oscillators: base, unison pair, extended pair, three subs."},
 "SWAVE-PULS":{id:5,p:["UNIL","UNIW","SUB1","SUB2","PW","PWAD","PWRS","TUNE"],about:"Five pulse oscillators, three with pulse width sweep."},
 "DPRO-WAVE":{id:6,p:["WAVE","WP","WPM","WPRS","SYNC","SFRQ","","TUNE"],about:"32 raw 12-bit waveforms. WP morphs into the next one."},
 "DPRO-BBOX":{id:7,p:["PTCH","STRT","","","RTRG","RTIM","",""],about:"24 drum sounds from C-3 upwards. The key picks the sound."},
 "FM+STAT":{id:8,p:["1FRQ","1FIN","1ENV","1FB","2FRQ","2VOL","TONE","TUNE"],about:"The versatile FM+: two listed-frequency modulators."},
 "FM+PAR":{id:9,p:["1FRQ","1ENV","2FRQ","2ENV","3FRQ","3ENV","TONE","TUNE"],about:"Three parallel copies of the FM+ block."},
 "FM+DYN":{id:10,p:["1FRQ","1FEN","1VOL","1VEN","2FRQ","2ENV","2FB","TUNE"],about:"Continuous modulator frequencies with their own envelopes."},
 "VO-6":{id:11,p:["VOC1","VOC2","V-SW","VOIC","CONS","CLEN","CVOL","TUNE"],about:"Formant voice. A trig is a consonant then a vowel: lock them per step to spell words."},
 "SWAVE-ENS":{id:14,p:["PCH2","PCH3","PCH4","WAVE","PW","CHRL","CHRW","TUNE"],about:"Up to four-note chords from one track. Lock PCH2-4 to change chord."},
 "DPRO-DDRW":{id:32,p:["WAV1","MIX","WAV2","TIME","BR1","WID","BR2","TUNE"],mk2:true,about:"Two of the 64 waveforms (factory or user) blended. MKII only."},

/* ---- euclid: step s (0-based from the range's start) is a hit when ((s - rot) mod n) * k mod n < k.

/* A track's steps from a spec, over [from, to): { on: [step...], acc: [step...] | undefined }, or null for

			on.push(s);

		preview, progress, exported: m => m, host: null, model

 if(TAP.length<2){toast("Tap tempo: keep tapping B");return}S.bpm=clamp(Math.round(60000/((TAP[TAP.length-1]-TAP[0])/(TAP.length-1))*10)/10,30,300);if(HOST.tempo)HOST.tempo(S.bpm);renderTop();if(S.playing)restartClock();toast("Tap tempo: "+S.bpm.toFixed(1)+" BPM")}
function liveRecord(){if(HOST.record)return HOST.record(true);S.rec=!S.rec;if(S.rec&&!S.playing)togglePlay();renderTop();if(S.rec)toast("LIVE RECORDING: the notes you play are recorded.")}

/* ---- the keyboard: two rows play the selected synth track chromatically, from any workspace, as a DAW's typing
   keyboard: A S D F G H J K L are the white keys C D E F G A B C D from C-3, W E · T Y U · O P the black keys above
   them (C♯ D♯ · F♯ G♯ A♯ · C♯ D♯; R and I sit where a piano has no black key) (Z / X: the octave, −3 to +3; B taps
   the tempo, since T is F♯ here; MM-PORT-PLAN.md 2026-10-05), real MIDI notes on the track's own channel
   (GLOBAL › MIDI › CHANNELS: base + track), at KB.vel (C / V: 20 40 60 80 100 127; the machine hears it through
   ASSIGN › VEL). Each key is its own note on and off, so legato and the machine's note priority work as on a
   keyboard; while LIVE RECORDING the machine records them. MIDI tracks are not played (their notes go to the
   MIDI OUT only). Key repeat is ignored. ---- */
/* a key (its letter) to semitones above the A key's note */
const KEYS_PIANO={A:0,W:1,S:2,E:3,D:4,F:5,T:6,G:7,Y:8,H:9,U:10,J:11,K:12,O:13,L:14,P:15},KEYS_WHITE="ASDFGHJKL",KEYS_BLACK="WETYUOP",KEYS_OCT=[-3,3],KEYS_VELS=[20,40,60,80,100,127],KEYS_BASE=48;
const KB={oct:0,vel:100,held:new Map(),told:new Set()};
function keyVel(v,d){const up=KEYS_VELS.find(x=>x>v),down=[...KEYS_VELS].reverse().find(x=>x<v);return d>0?up??KEYS_VELS[KEYS_VELS.length-1]:down??KEYS_VELS[0]}
/* the keys that play and act on tracks: no dialog or panel open, no text field focused (the one rule of both editors, deskKeys.js) */
function kbOn(){return Keys.free()}
function kbTell(k,t){if(KB.told.has(k))return;KB.told.add(k);toast(t)}
function homeDown(e){if(e.repeat||KB.held.has(e.code))return;const t=S.sel,k=KEYS_PIANO[e.code.replace(/^Key/,"")];if(k==null)return;
 if(isMidiT(t)){kbTell("midi","The keys play the synth tracks: a MIDI track's notes go to the MIDI OUT only.");return}
 const n=clamp(KEYS_BASE+12*KB.oct+k);KB.held.set(e.code,{t,n});keyNote(t,n,KB.vel)}
function homeUp(code){const h=KB.held.get(code);if(!h)return;KB.held.delete(code);keyNote(h.t,h.n,0)}
/* a host plays the machine (the note intent: pitch in semitones from KEYS_BASE, C3); the example only shows the track's lamp */
function keyNote(t,n,vel){if(HOST.noteOn){const p=n-KEYS_BASE;return vel?HOST.noteOn(t,p,vel):HOST.noteOff(t,p)}if(vel){flashTracks([t]);kbTell("eg","Example: in the plug-in the keys play the machine.")}}
function kbVel(d){KB.vel=keyVel(KB.vel,d);toast(`Keyboard velocity ${KB.vel}`)}
function kbOct(d){KB.oct=clamp(KB.oct+d,KEYS_OCT[0],KEYS_OCT[1]);toast(`Keyboard octave ${KB.oct>0?"+":""}${KB.oct}: A plays ${noteName(KEYS_BASE+12*KB.oct)}`)}
document.addEventListener("keyup",e=>homeUp(e.code));addEventListener("blur",()=>[...KB.held.keys()].forEach(homeUp));
Keys.bind({id:"piano-run",scope:"any",keys:[...KEYS_WHITE,...KEYS_BLACK],group:"Playing",hidden:true,field:true,when:kbOn,run:homeDown,does:""});
Keys.bind({id:"octave-down",scope:"any",keys:["Z"],group:"Playing",hidden:true,field:true,when:kbOn,run:()=>kbOct(-1),does:""});
Keys.bind({id:"octave-up",scope:"any",keys:["X"],group:"Playing",hidden:true,field:true,when:kbOn,run:()=>kbOct(1),does:""});
Keys.bind({id:"velocity-down",scope:"any",keys:["C"],group:"Playing",hidden:true,field:true,when:kbOn,run:()=>kbVel(-1),does:""});
Keys.bind({id:"velocity-up",scope:"any",keys:["V"],group:"Playing",hidden:true,field:true,when:kbOn,run:()=>kbVel(1),does:""});
Keys.bind({id:"piano-white",scope:"any",notes:"C D E F G A B C D",keys:["A S D F G H J K L"],group:"Playing",does:"Play the selected synth track: white keys C D E F G A B C D, real notes on its MIDI channel, from any workspace. While live recording the machine records them"});
Keys.bind({id:"piano-black",scope:"any",notes:"C♯ D♯ F♯ G♯ A♯ C♯ D♯",keys:["W E T Y U O P"],group:"Playing",does:"The black keys above them: C♯ D♯ F♯ G♯ A♯ C♯ D♯, so the two rows play every semitone"});
Keys.bind({id:"octave",scope:"any",keys:["Z","X"],group:"Playing",does:()=>`Octave down / up, −3 to +3 (now ${KB.oct>0?"+":""}${KB.oct}: A is ${noteName(KEYS_BASE+12*KB.oct)})`});
Keys.bind({id:"velocity",scope:"any",keys:["C","V"],group:"Playing",does:()=>`Velocity down / up: 20 40 60 80 100 127 (now ${KB.vel})`});

/* ===== GEN and MUTATE on the page (MM-PORT-PLAN.md d, the Machinedrum Editor's DESIGN-generators.md §5) =====
   The GEN bar, always under the piano roll on Sequence (it holds the PAGE control too), and the MUTATE bar, always
   over the Sound pages. Both are live: a change writes at once. A run of changes in one context (the workspace,
   the selected track, the pattern or the kit) is one gesture, one undo step: the commits after each click wait
   (genHeld, like rotate's rotHold) until the run ends, on another context, any other edit, undo or redo. Each change
   generates from the run's base, the pattern before it, so a value moved back gives its steps back. The results
   come from the pure functions (skins/shared/deskGen.js, 52-gen.js); here they become the view's own state, and
   GEN's are the steps intent of the tracks it wrote (their steps, slides and locks over the range, so a value moved
   back gives its steps back); MUTATE's are the params intent of the values it moved. Alt is the global "all": Alt + a GEN change
   every track of the side shown over the whole pattern, Alt+R every track (Sound: every synth track). ===== */
S.gen={specs:null,last:[],m:[],run:null};
S.mut={amount:20,seed:genSeed(),scope:new Set(["SYN"]),trial:null,note:""};
S.genOwn=false;
const genKey=()=>`${S.ws}:${S.sel}:${S.pat}`,mutKey=()=>`${S.ws}:${S.sel}:${S.kit}`;
function genInfo(t){const tr=trk(t);return{m:tr.m,notes:tr.steps.slice(0,S.len).flatMap(x=>x&&!x.off&&x.n||[]),key:tr.tr?.KEY|0,scale:tr.tr?.SCALE|0}}
/* every track's spec: from its role the first time, again when its machine changed and the spec was never edited */
function genSpecs(fill){const len=S.len||64;
 if(!S.gen.specs||fill){S.gen.specs=[];S.gen.last=[];S.gen.m=[]}
 for(let t=0;t<12;t++){const m=trk(t).m;if(!S.gen.specs[t]||(S.gen.m[t]!==m&&!S.gen.last[t]?.edited)){S.gen.specs[t]=mmGenDefault(genInfo(t),len,isMidiT(t));S.gen.m[t]=m;S.gen.last[t]={}}
  S.gen.specs[t]=genFit(S.gen.specs[t],len)}	/* STEPS never longer than the pattern, also when it got shorter */
 return S.gen.specs}
function genSpec(t=S.sel){return genSpecs()[t]}
const genEdited=(t=S.sel)=>{S.gen.last[t].edited=true};
/* the range a generator writes: the steps shown, Alt the whole pattern */
function genRange(all){const[a,b]=vis();return all?[0,S.len]:[a,Math.min(b,S.len)]}
/* a run or a trial with changes in the context shown holds the commits: one undo step */
function genHeld(){return !!(S.gen&&((S.gen.run?.applied&&S.gen.run.key===genKey())||(S.mut.trial?.applied&&S.mut.trial.key===mutKey())))}
/* the run or the trial ends: its gesture closes (the next edit is a new undo step) */
function genEnd(){if(!S.gen)return;const r=S.gen.run,m=S.mut.trial,live=(r&&r.applied)||(m&&m.applied);S.gen.run=null;S.mut.trial=null;S.mut.note="";if(!live)return;
 S.genEnding=true;try{if(HOST.commit)HOST.commit()}finally{S.genEnding=false}}
function genStale(){if(S.gen&&((S.gen.run&&S.gen.run.key!==genKey())||(S.mut.trial&&S.mut.trial.key!==mutKey())))genEnd()}
/* a run's base: every track's steps, slides and locks before the run */
function genBase(){return[...Array(12).keys()].map(t=>{const tr=trk(t);return{steps:tr.steps.map(x=>x&&JSON.parse(JSON.stringify(x))),slide:new Set(tr.slide),
 locks:[...S.locks].filter(([k])=>+k.split("|")[0]===t).map(([k,m])=>[k.split("|")[1],new Map(m)])}})}
function genStart(key){if(S.gen.run&&S.gen.run.key===key)return;genEnd();commit()}
/* one track over [from, to): back to the run's base there, then the generated steps; the trigs it turns off lose
   their locks and slides. False: the track is set to keep (and nothing of a run to give back). */
function genWrite(t,from,to,run){const b=run.base[t],tr=trk(t),r=mmGenSteps(genSpec(t),t,from,to,b.steps,S.len,isMidiT(t));
 if(!r&&!run.applied)return false;
 for(let s=from;s<to;s++){tr.steps[s]=b.steps[s]&&JSON.parse(JSON.stringify(b.steps[s]));b.slide.has(s)?tr.slide.add(s):tr.slide.delete(s);clearStepLocks(t,s);for(const[pid,m] of b.locks)if(m.has(s))setLock(t,pid,s,m.get(s),true)}
 if(!r)return true;
 for(const[s,st] of r.steps)tr.steps[s]=st;
 for(const s of r.gone){clearStepLocks(t,s);tr.slide.delete(s)}
 return true}
/* Live: every change of a GEN control writes at once (all: every track of the side shown, the whole pattern) */
function genLive(all=S.alt){
 if(S.rec){toast("The generators wait while the machine records live.");return false}
 genStale();genStart(genKey());
 const run=genRunFor(S.gen.run,genKey(),genBase,()=>0),[from,to]=genRange(all),wrote=[];
 for(const t of all?side():[S.sel])if(genWrite(t,from,to,run))wrote.push(t);
 if(!wrote.length){toast(all?"Every track is set to keep: nothing to generate.":`${tLabel(S.sel)} is set to keep.`);genDraw();return false}
 S.gen.run=run;run.applied++;
 S.genOwn=true;try{edit("steps",{from,to,rows:wrote.map(t=>rangeRow(t,from,to,true))})}finally{S.genOwn=false}
 autoRange(S.sel);if(S.ws==="seq")rerenderSeq();else renderTop();
 return true}
/* the result of a track's spec for the summary: its trigs over the range from the run's base (or now) */
function genPreview(t,from,to){const run=S.gen.run&&S.gen.run.key===genKey()?S.gen.run:null,base=run?run.base[t].steps:trk(t).steps;
 return{run,base,r:mmGenSteps(genSpec(t),t,from,to,base,S.len,isMidiT(t))}}
/* Defaults (↺): every spec from its machine; writes this track (Alt every track) */
function genDefaults(){genSpecs(true);toast("Every track's spec from its machine.");genLive()}
/* a new variation: a new seed (random, the notes), random hits and rotation in the cycle (euclid); keep stays */
function genVary(t){const sp=genSpec(t),r=n=>Math.floor(Math.random()*n);if(sp.kind==="keep")return false;
 sp.seed=genSeed();if(sp.kind==="euclid"){sp.k=1+r(sp.n);sp.rot=r(sp.n)}S.gen.last[t].edited=true;return true}
function genAgain(all=false){const ts=all?side():[S.sel],varied=ts.filter(genVary).length;
 if(!varied){toast(all?"Every track is set to keep: nothing to randomise.":`${tLabel(S.sel)} is set to keep: nothing to randomise.`);return}
 if(genLive(all)&&S.ws!=="seq")toast(all?"GEN: a new variation of every track.":`GEN: a new variation of ${tLabel(S.sel)}.`)}
/* the one randomise action (R; Alt+R or Alt-click on the R key: all), by workspace */
function randomise(all){if(S.ws==="sound")mutAgain(all);else genAgain(all)}
function genKind(kind){const t=S.sel,sp=genSpec(t),last=S.gen.last[t];if(sp.kind===kind)return;last[sp.kind]=sp;last.edited=true;
 const notes=sp.notes&&JSON.parse(JSON.stringify(sp.notes)),seed=sp.seed||genSeed();
 S.gen.specs[t]=genFit(last[kind],S.len||64)||(kind==="euclid"?{kind,k:4,n:Math.min(16,S.len||64),rot:0,seed,notes}:kind==="random"?{kind,density:25,seed,mode:"replace",notes}:{kind,notes});
 genLive()}
const genCycle=(list,cur,d)=>list[((list.indexOf(cur)+(d>0?1:-1))%list.length+list.length)%list.length];
/* a value of a bar moved by d (wheel, arrows, click, drag), in the spec's own ranges */
function genVal(k,d){const lim=(v,a,b)=>Math.max(a,Math.min(b,v));
 if(k==="amt"){S.mut.amount=lim(S.mut.amount+d,0,100);mutLive();renderMutStrip();return}
 const sp=genSpec(),n=sp.notes;genEdited();
 if(k==="k")sp.k=lim(sp.k+d,0,sp.n);
 if(k==="n"){sp.n=lim(sp.n+d,1,Math.min(64,S.len||64));sp.k=Math.min(sp.k,sp.n);sp.rot=Math.min(sp.rot,sp.n-1)}
 if(k==="rot")sp.rot=((sp.rot+d)%sp.n+sp.n)%sp.n;
 if(k==="dens")sp.density=lim(sp.density+d,0,100);
 if(k==="seed")sp.seed=((sp.seed-1+d)%99999+99999)%99999+1;
 if(n){if(k==="nmot")n.motion=genCycle(n.motion==="kit"||trk(S.sel).m==="DPRO-BBOX"?["off","kit"]:["off","step","leap"],n.motion,d);
  if(n.motion!=="kit"&&n.motion!=="off"&&n.root==null){const i=genInfo(S.sel),x=mmGenDefault({...i,m:"SWAVE-SAW"},S.len);Object.assign(n,x.notes)}
  if(k==="nroot")n.root=lim(n.root+d,0,127-12*n.range);
  if(k==="nscale")n.scale=genCycle(MM_SCALES,n.scale,d);
  if(k==="nrange"){n.range=lim(n.range+(d>0?1:-1),1,2);n.root=Math.min(n.root,127-12*n.range)}}
 genLive()}
/* The bars' pieces (the Machinedrum Editor's): a group (a title on a thin rule over its controls), a value (an LCD
   window, its label inside), a key (a small square cap with its keyboard key on it and a tiny label over it). */
const gbg=(label,body,cls="",tip="")=>`<div class="gbg ${cls}"${tip?` title="${tip}"`:""}><span class="gbl">${label}</span><div class="gbc">${body}</div></div>`;
const gv=(k,label,v,tip)=>`<span class="gv" data-gv="${k}" role="spinbutton" tabindex="0" aria-label="${label}" aria-valuenow="${parseInt(v)||0}" title="${tip}. Drag up or down, scroll, or click (⇧-click: down)."><small>${label}</small><b>${v}</b></span>`;
const gkc=(attr,act,cap,label,tip)=>`<button class="kc" ${attr}="${act}" title="${tip}" aria-label="${label}"><small>${label}</small><kbd>${cap}</kbd></button>`;
const randKey=tip=>`<button class="kc cream krand" data-rand="1" title="${tip}" aria-label="Randomise"><small>Random <em>⌥R all</em></small><kbd>R</kbd></button>`;
const gtitle=(name,target,all,tip)=>`<div class="gbt" title="${tip}"><b>${name}</b><span class="${all?"all":""}">${target}</span></div>`;
const gseg=(attr,cur,items,tips)=>`<span class="seg">${items.map(([k,n])=>`<button ${attr}="${k}" aria-pressed="${cur===k}" title="${tips[k]}">${n}</button>`).join("")}</span>`;
function genNotesHtml(sp,t){const n=sp.notes;if(!n||sp.kind==="keep"||isMidiT(t))return"";const kit=n.motion==="kit"||trk(t).m==="DPRO-BBOX";
 const mot=gv("nmot","Notes",n.motion==="off"?"off":n.motion,kit?"Off: the steps keep their drums (a new one takes the last). KIT: each hit picks BD1, SD1, CH or OH":"Off: the steps keep their pitch (a new one takes the track's last note). STEP: a walk of 1 or 2 scale degrees from the root. LEAP: any note of the range");
 const seed=sp.kind==="euclid"&&n.motion!=="off"?gv("seed","Seed",sp.seed,"The same seed gives the same notes"):"";
 if(n.motion==="off"||n.motion==="kit")return gbg("Notes",mot+seed,"gnotes","The rhythm decides when, the notes what: they go to the hits the rhythm writes");
 return gbg("Notes",mot+gv("nroot","Root",noteName(n.root),"The lowest note: the scale's root at its octave (the track's KEY when its SCALE is MAJ or MIN)")+gv("nscale","Scale",n.scale==="DORIAN"?"DOR":n.scale,"MAJ, MIN, PENT (minor pentatonic) or DORIAN")
  +gv("nrange","Range",n.range+" oct","One or two octaves from the root")+seed,"gnotes","The rhythm decides when, the notes what: they go to the hits the rhythm writes (every hit; in ADD the new ones, in THIN none)")}
function genStripHtml(){const t=S.sel,tr=trk(t),sp=genSpec(t),all=S.alt,[from,to]=genRange(all),{run,base,r}=genPreview(t,from,to);
 const mode=gbg("Mode",gseg("data-genkind",sp.kind,[["euclid","Euclid"],["random","Random"],["keep","Keep"]],{euclid:"k hits spread evenly over n steps, rotated",random:"each step on by chance, from a seed",keep:"leave this track as it is (in a run: as it was before the run)"}),"gmode");
 const params=sp.kind==="euclid"?gbg("Euclid",gv("k","Hits",sp.k,"How many hits in a cycle")+gv("n","Steps",sp.n,"The cycle's length in steps, at most the pattern's; it repeats over the pattern")+gv("rot","Rotate",sp.rot,"Moves the hits later"))
  :sp.kind==="random"?gbg("Random",gv("dens","Density",sp.density+"%","The chance of each step")+gv("seed","Seed",sp.seed,"The same seed gives the same steps"))
   +gbg("Write",gseg("data-genmode",sp.mode,[["replace","Replace"],["add","Add"],["thin","Thin"]],{replace:"the track becomes the result",add:"only steps that are off may turn on",thin:"only steps that are on may turn off"}),"gwrite")
  :gbg("Keep",`<span class="gsum">${tLabel(t)} is left as it is.</span>`);
 let sum="";
 if(r){const on=r.steps.filter(([,st])=>mmTrig(st)).length,b=[];for(let s=from;s<to;s++)if(mmTrig(base[s]))b.push(s);const now=new Set(r.steps.filter(([,st])=>mmTrig(st)).map(([s])=>s));
  const add=[...now].filter(s=>!mmTrig(base[s])).length,gone=b.filter(s=>!now.has(s)).length;
  sum=all?`every track · steps ${from+1}–${to}`:`${sp.kind==="euclid"?genSummary(sp,S.len)+" · ":""}${on} on${run?` <em>+${add} −${gone}</em>`:""} · steps ${from+1}–${to}`}
 else if(all)sum=`every track · steps ${from+1}–${to}`;
 const target=all?`all ${isMidiT(t)?"MIDI":"synth"} tracks`:`${tLabel(t)} · ${isMidiT(t)?"CH"+String(tr.ch).padStart(2,"0"):tr.m.replace("SWAVE-","SW-")}`;
 return`${gtitle("Gen",target,all,"Generators: every change writes to the pattern at once. A run of changes on this track is one undo step; Undo takes it back in one step. Alt: every track of the side shown, the whole pattern.")}
  ${mode}${params}${genNotesHtml(sp,t)}
  <div class="gsum" title="${run&&run.applied?"What the run changed, against the pattern before it":"What a change writes"}">${sum}</div>
  <div class="gkeys">${randKey(all?"Randomise every track of the side: a new variation of each spec, the whole pattern (Alt+R)":`Randomise ${tLabel(t)}: a new variation, ${sp.kind==="random"?"a new seed":sp.kind==="euclid"?"random hits and rotation in the cycle, a new seed for the notes":"nothing while it is set to Keep"} (R). Alt+R or Alt-click: every track`)}${gkc("data-gen","fill","↺","Defaults","Defaults: every track's spec from its machine: a bass 5/16 with a walk in its scale, a lead random 30 % over two octaves, a pad on 1 and 3, the drum box 8/16 on BD SD CH OH; FX machines kept; MIDI tracks 4/16, rhythm only. Writes this track (Alt: every track)")}</div>`}

function mutGroupKnobs(tracks,base){const keys=[...S.mut.scope].filter(x=>x.includes(":")),out={};if(!keys.length)return out;

  for(const id of keys){const[pg,key]=id.split(":");if(/^LF\d$/.test(pg)){[2,3,4,5,6,7].forEach(i=>list.push([pg,i]));continue}const x=(g[pg]||[]).find(y=>y.key===key);if(x)x.idx.forEach(i=>list.push([pg,i]))}

 if(!S.mut.scope.size){toast("Pick what to move: SYN, AMP, FLT, EFX or LFO, or a group's title.");return}
 genStale();let tr=S.mut.trial;
 if(!tr||tr.key!==mutKey()){genStart(mutKey());S.mut.seed=genSeed();tr=S.mut.trial={key:mutKey(),base:S.tracks.map(x=>({m:x.m,v:JSON.parse(JSON.stringify(x.v))})),touched:new Set(),all:false,applied:0}}
 tr.all=all;const tracks=all?[0,1,2,3,4,5]:[S.sel];
 const spec={tracks,pages:[...S.mut.scope].filter(x=>!x.includes(":")),extra:mutGroupKnobs(tracks,tr.base),amount:S.mut.amount,seed:S.mut.seed,protect:["VOL","TUNE"]};

 /* what an earlier apply moved and this one does not goes back to the base */
 for(const k of tr.touched)if(!now.has(k)){const[t,pg,i]=k.split(":");values.push([+t,pg,+i,tr.base[+t].v[pg][+i]])}

 for(const[t,pg,i,v] of values){S.tracks[t].v[pg][i]=v;const k=t+":"+pg+":"+i;v!==tr.base[t].v[pg][i]?tr.touched.add(k):tr.touched.delete(k)}

 const moved=new Set(values.map(([t])=>t)).size;S.mut.note=`seed ${S.mut.seed} · ${moved} track${moved===1?"":"s"}, ${values.length} values`;
 if(S.ws==="sound")render();else{renderTop();toast(`MUTATE: ${all?"every synth track":tLabel(S.sel)}, ${S.mut.note}.`)}}

const ARPM=["OFF","KEY","SID","ADD"],ARPP=["TRUE","UP","DOWN","CYCLE","RND"],SCALES=["---","FIX","MAJ","MIN"];

function midiLenSteps(t,s){const v=S.locks.get(lkKey(t,"MID.0"))?.get(s)??trk(t).v.MID[0];return v>=127?Infinity:Math.max(.25,v/8)}

  if(isMidiT(t)){const d=midiLenSteps(t,s);if(d===Infinity){e=L;for(let k=s+1;k<L;k++)if(tr.steps[k]?.off){e=k;break}}else e=Math.min(L,s+d)}
  else{while(e<L&&!tr.steps[e])e++}

/* B-049: the AMP envelope in steps after the trig, as the firmware plays it (MmConvert.ampEnv: the catalogue's
   measured times). ATK (to 90 %), DEC and REL (to -20 dB, an exponential fall) are times, not the tempo's: each 8
   more about doubles them (ATK 64 ≈ 0.14 s, DEC 64 ≈ 0.55 s). HOLD counts sixteenths of the tempo (HOLD 8 = one).
   DEC 127 holds to the NOTE OFF and REL 127 never fades (Infinity). A step is the roll's (stepMs: the tempo and the
   pattern's speed multiplier; whether HOLD follows the multiplier is not measured). null before the catalogue. */
const AENV=()=>typeof MmConvert!=="undefined"&&MmConvert.ampEnv&&MmConvert.ampEnv.ready()?MmConvert.ampEnv:null;
function ampTimes(a){const E=AENV();if(!E)return null;const sm=stepMs();return{at:E.attackMs(a[0])/sm,ho:E.holdMs(a[1],S.bpm||120)/sm,de:E.fallMs(a[2])/sm,re:E.fallMs(a[3])/sm}}
/* steps (from a handle's place) back to the value whose time is nearest */
const ampValue=(kind,steps)=>{const E=AENV();return E?E.valueFor(kind,Math.max(0,steps)*stepMs(),S.bpm||120):null};
/* honest gate: where the amp envelope has died (40 dB down: twice DEC's -20 dB) before the gate ends, in steps */
function ampSteps(t){if(isMidiT(t))return Infinity;const e=ampTimes(trk(t).v.AMP);if(!e||e.de===Infinity)return Infinity;return e.at+e.ho+2*e.de}
function arpSeq(tr,chord){const a=tr.arp;let c=[...chord];if(a.PLAY===1)c.sort((x,y)=>x-y);if(a.PLAY===2)c.sort((x,y)=>y-x);if(a.PLAY===3){c.sort((x,y)=>x-y);c=[...c,...c.slice(1,-1).reverse()]}
 let seq=[];for(let o=0;o<Math.max(1,a.RNGE);o++)seq=seq.concat(c.map(n=>n+12*o));if(a.PLAY===4){let h=7;seq=seq.map(()=>seq[(h=(h*31+11)%97)%seq.length])}return seq}

 for(let k=0;k*tl<span.e-span.s&&k<256;k++){const r=k%a.len;if(!a.rhy[r])continue;out.push({x:span.s+k*tl,w:tl,n:seq[k%seq.length]+a.ofs[r]})}return out}
/* a lane-style key per arp step: the offset is a bipolar LED meter from the middle line (±24 = the half key) */
function arpCells(a){return Array.from({length:16},(_,k)=>{const o=a.ofs[k],on=a.rhy[k],na=k>=a.len,f=(Math.abs(o)/24).toFixed(4);
 return`<div class="ac ${na?"na":""} ${on?"":"mute"}" data-ac="${k}" title="Step ${k+1}: ${na?"past the end (click to extend)":on?"plays, offset "+(o>0?"+":"")+o:"muted"}. Click = mute, drag = offset.">${na?"":`<span class="z"></span><i class="${o>=0?"up":"dn"}" style="${o>=0?`bottom:50%;height:max(2px,calc((50% - 8px)*${f}))`:`top:50%;height:calc((50% - 8px)*${f})`}"></i><b>${o?(o>0?"+":"")+o:k+1}</b>`}</div>`}).join("")}

function mmPageGroups(pg,names,table){const out=[],used=new Set();
 for(const d of table){const idx=[],knobs=[];for(const n of d.knobs){const i=names.indexOf(n);if(i<0||!n||used.has(i))continue;used.add(i);idx.push(i);knobs.push(n)}
  if(idx.length)out.push({key:sgKey(d.title),title:d.title,pg,knobs,idx,ed:d.ed,note:d.note,w:d.w})}
 const rest=names.map((n,i)=>n&&!used.has(i)?i:-1).filter(i=>i>=0);
 if(rest.length)out.push({key:pg.toLowerCase(),title:{SYN:"Synthesis",AMP:"Amp",FLT:"Filter",EFX:"Effects"}[pg],pg,knobs:rest.map(i=>names[i]),idx:rest,ed:null,note:""});
 return out}
/* a machine's groups, page by page: { SYN: [...], AMP: [...], FLT: [...], EFX: [...] } */
function mmSoundGroups(m){const mk=MACH[m];if(!mk)return null;
 return{SYN:mmPageGroups("SYN",mk.p,MM_SYN_TAB[m]||[]),AMP:mmPageGroups("AMP",FIXED.AMP,MM_FIXED_TAB.AMP),FLT:mmPageGroups("FLT",FIXED.FLT,MM_FIXED_TAB.FLT),EFX:mmPageGroups("EFX",FIXED.EFX,MM_FIXED_TAB.EFX)}}
/* the check: every named knob of every page in exactly one group, a group's knobs on its page, no group a
   catch-all, every table name a knob of that machine. -> [] or the problems, in words */
function mmGroupCheck(m){const g=mmSoundGroups(m),errs=[];if(!g)return["no machine "+m];
 for(const pg of ["SYN","AMP","FLT","EFX"]){const names=pg==="SYN"?MACH[m].p:FIXED[pg],seen=new Map();
  for(const x of g[pg])x.idx.forEach((i,k)=>{if(names[i]!==x.knobs[k])errs.push(`${m} ${pg}: ${x.title} names ${x.knobs[k]} at slot ${i}`);seen.set(i,(seen.get(i)||0)+1)});
  names.forEach((n,i)=>{if(!n)return;const c=seen.get(i)||0;if(c!==1)errs.push(`${m} ${pg}.${n} is in ${c} groups`)});
  const catchAll=g[pg].find(x=>x.key===pg.toLowerCase()&&!(pg==="SYN"?MM_SYN_TAB[m]||[]:MM_FIXED_TAB[pg]).some(d=>sgKey(d.title)===x.key));
  if(catchAll)errs.push(`${m} ${pg}: ${catchAll.knobs.join(" ")} not in the table`)}
 for(const d of MM_SYN_TAB[m]||[])for(const n of d.knobs)if(!MACH[m].p.includes(n))errs.push(`${m}: the table names ${n}, the machine has none`);
 return errs}
/* ===== Sound by function: the groups' screens (85-sound-groups.js names them, renderSound lays them out) =====
   One editor per kind of picture. A canvas knows its page (data-pg) and its group's knobs (data-k), so one
   editor serves every machine that has them; a dot drags the knobs it stands for, a dot on a rail at the foot
   is a knob the picture shows. */
const V=(pg)=>trk(S.sel).v[pg];
const synIdx=n=>MACH[trk(S.sel).m].p.indexOf(n);
const sv=n=>{const i=synIdx(n);return i<0?0:V("SYN")[i]};
const sset=(n,v)=>{const i=synIdx(n);if(i>=0)V("SYN")[i]=clamp(Math.round(v),0,maxOf(meta(S.sel,"SYN",i)))};
const gIdx=(pg,n)=>pg==="SYN"?synIdx(n):FIXED[pg].indexOf(n);
const kget=(pg,n)=>{const i=gIdx(pg,n);return i<0?0:V(pg)[i]};
const kset=(pg,n,v)=>{const i=gIdx(pg,n);if(i>=0)V(pg)[i]=clamp(Math.round(v),0,maxOf(meta(S.sel,pg,i)))};
const ck=c=>(c.dataset.k||"").split(" ").filter(Boolean);
const u7=v=>clamp(v,0,127)/127;
/* a dot on the foot rail for a knob: x is its value */
const railH=(W,H,pg,n,y=H-7)=>({x:6+u7(kget(pg,n))*(W-12),y,k:n,drag:x=>kset(pg,n,(x-6)/(W-12)*127)});
function railDraw(g,W,H,y=H-7){g.strokeStyle=inkA(.35);g.lineWidth=1;g.beginPath();g.moveTo(6,y+.5);g.lineTo(W-6,y+.5);g.stroke()}
const SFONT="8px Silkscreen, monospace";
function wfDP(k,p){return Math.sin(p*6.283)*(1-(k%5)/6)+Math.sin(p*6.283*((k%7)+2))*((k%5)/6)*.8+(k%3===2?(p<.5?.3:-.3):0)}
function hashN(i){const x=Math.sin(i*127.1)*43758.5;return x-Math.floor(x)}
/* SWAVE: the base saw with the unison pair at ±UNIW (UNIL), the extended pair at twice the width (UNIX) */
ED.uni={geo(W,H){return{cx:W/2,sp:(W/2-12)/26,base:H-14,hh:H-36}},
 draw(g,W,H,c){const G=this.geo(W,H),ink=cssv("--ink");grid(g,W,H);
  const bar=(semi,h,dash)=>{const x=G.cx+semi*G.sp;g.fillStyle=ink;g.globalAlpha=dash?.5:1;g.fillRect(x-3,G.base-h*G.hh,6,Math.max(1,h*G.hh));g.globalAlpha=1};
  const uw=sv("UNIW")/127*12,ul=sv("UNIL")/127;bar(0,1);if(ul){bar(-uw,ul);bar(uw,ul)}
  if(ck(c).includes("UNIX")){const ux=Math.min(sv("UNIX"),sv("UNIL"))/127;if(ux){bar(-2*uw,ux,1);bar(2*uw,ux,1)}}
  label(g,`unison ±${Math.round(uw*10)/10} st`)},
 handles(W,H){const G=this.geo(W,H);return[{x:G.cx+sv("UNIW")/127*12*G.sp,y:G.base-sv("UNIL")/127*G.hh,k:"UNIW · UNIL",drag:(x,y)=>{sset("UNIW",(x-G.cx)/G.sp/12*127);sset("UNIL",(G.base-y)/G.hh*127)}}]}};
/* the subs: a sine one (SUB1) and two (SUB2) octaves down, a square one octave down (SUBX); the base faint */
ED.sub={geo(W,H){return{x0:16,sp:(W-28)/27,base:H-16,hh:H-38}},
 bars(c){const k=ck(c);return k.map(n=>({n,semi:n==="SUB2"?-24:-12,dx:n==="SUBX"?-8:n==="SUB1"&&k.includes("SUBX")?8:0}))},
 draw(g,W,H,c){const G=this.geo(W,H),ink=cssv("--ink"),X=s=>G.x0+(s+25)*G.sp;grid(g,W,H);g.fillStyle=inkA(.3);g.fillRect(X(0)-3,G.base-G.hh,6,G.hh);
  for(const b of this.bars(c)){const v=sv(b.n)/127,x=X(b.semi)+b.dx;g.fillStyle=ink;g.fillRect(x-3,G.base-v*G.hh,6,Math.max(1,v*G.hh));g.font=SFONT;g.fillText(b.n==="SUBX"?"SQ":b.n==="SUB2"?"-24":"-12",x-7,H-4)}
  g.font=SFONT;g.fillStyle=inkA(.6);g.fillText("BASE",X(0)-12,H-4);label(g,"subs below the base")},
 handles(W,H,c){const G=this.geo(W,H),X=s=>G.x0+(s+25)*G.sp;return this.bars(c).map(b=>({x:X(b.semi)+b.dx,y:G.base-sv(b.n)/127*G.hh,k:b.n,drag:(x,y)=>sset(b.n,(G.base-y)/G.hh*127)}))}};
/* a pulse: SID's PW is the width; SWAVE's PW is signed, 0 = square, either end a spike. PWAD sweeps it (dashed) */
ED.pulse={duty(){const m=trk(S.sel).m,p=sv("PW");return m==="SID-6581"?clamp(p/127,.03,.97):clamp(.5-Math.abs(p-64)/64*.46,.03,.97)},
 draw(g,W,H){const ink=cssv("--ink"),d=this.duty(),ad=sv("PWAD")/127,T=22,B=H-22,yy=v=>v?T:B;grid(g,W,H);railDraw(g,W,H);
  if(ad)line(g,W,x=>{const p=(x/W*2)%1;return yy(p<clamp(d+ad*.4*(Math.floor(x/W*2)?1:.5),0.03,.97))},inkA(.5),1.5,[4,3]);
  line(g,W,x=>yy((x/W*2)%1<d),ink,2);label(g,`width ${Math.round(d*100)}%${ad?" · sweep "+sv("PWAD"):""}${sv("PWRS")?" · restarts":""}`)},
 handles(W,H){return[railH(W,H,"SYN","PW")]}};
/* SID: the waveform (TRI SAW PULS MIX NOIS) with its modulation in words */
ED.sidwave={draw(g,W,H){const w=sv("WAVE"),pw=sv("PW")/127,ink=cssv("--ink");grid(g,W,H);
  line(g,W,x=>{const p=(x/W*3)%1;const v=[1-4*Math.abs(p-.5),2*p-1,p<pw?1:-1,((p*7)%1<.5?1:-1)*(p<.5?1:.4),RND[Math.floor(x/3)%8]][w]??0;return H/2+4-v*(H/2-22)},ink,2);
  label(g,EN["SID-6581.WAVE"][w]+(sv("MOD")?" · "+EN["SID-6581.MOD"][sv("MOD")]+(sv("MSRC")?" from PRCH":" from MFRQ"):""))}};
/* SWAVE-ENS / DPRO-DENS: the chord from one track, C plus PCH2-4 */
ED.chord={draw(g,W,H){const ink=cssv("--ink"),offs=["PCH2","PCH3","PCH4"].map(p=>sv(p)).filter(v=>v).map(v=>v-64);const kw=(W-16)/15,y0=24,wh=H-30;let wx=8;grid(g,W,H);
  for(let k=0;k<25;k++){if([1,3,6,8,10].includes(k%12))continue;g.strokeStyle=ink;g.lineWidth=1;g.strokeRect(wx+.5,y0+.5,kw-1,wh-1);if(k===0||offs.includes(k)){g.fillStyle=ink;g.beginPath();g.arc(wx+kw/2,y0+wh-10,4.5,0,7);g.fill()}wx+=kw}
  wx=8;for(let k=0;k<25;k++){if(![1,3,6,8,10].includes(k%12)){wx+=kw;continue}g.fillStyle=ink;g.fillRect(wx-kw*.3,y0,kw*.6,wh*.58);if(offs.includes(k)){g.fillStyle=cssv("--lcd");g.beginPath();g.arc(wx,y0+wh*.45,3.5,0,7);g.fill()}}
  label(g,"C + "+(offs.length?offs.join(" "):"no other notes"))}};
/* the ensemble's wave: saw through square to spikes (WAVE), PW mutates it; DPRO-DENS: one of the 64 waves */
ED.enswave={draw(g,W,H){const ink=cssv("--ink"),m=trk(S.sel).m;grid(g,W,H);
  if(m==="DPRO-DENS"){const a=sv("WAVE");line(g,W,x=>H/2+4-wfDP(a,(x/W*2)%1)*(H/2-24),ink,2);label(g,"wave "+(a+1));return}
  const w=sv("WAVE")/127,pw=.5+(sv("PW")-64)/140;railDraw(g,W,H);
  line(g,W,x=>{const p=(x/W*2)%1,saw=1-2*p,sq=p<pw?1:-1,spk=p<.08?1:-.25;const v=w<.5?saw+(sq-saw)*w*2:sq+(spk-sq)*(w-.5)*2;return H/2+2-v*(H/2-24)},ink,2);label(g,w<.35?"saw":w<.65?"square":"spikes")},
 handles(W,H){return trk(S.sel).m==="DPRO-DENS"?[]:[railH(W,H,"SYN","WAVE")]}};
/* DPRO-WAVE: WAVE morphing into the next at WP; DPRO-DDRW: two waves mixed (MIX) */
ED.morph={draw(g,W,H){const m=trk(S.sel).m,dd=m==="DPRO-DDRW",a=dd?sv("WAV1"):sv("WAVE"),b=dd?sv("WAV2"):(a+1)%32,mix=(dd?sv("MIX"):sv("WP"))/127,ink=cssv("--ink");grid(g,W,H);
  line(g,W,x=>{const p=(x/W*2)%1;return H/2+4-((1-mix)*wfDP(a,p)+mix*wfDP(b,p))*(H/2-24)},ink,2);label(g,dd?`wave ${a+1} ↔ ${b+1} · mix ${sv("MIX")}`:`wave ${a+1} → ${b+1}${sv("WPM")?" · sweeps":""}`)},
 handles(W,H){const dd=trk(S.sel).m==="DPRO-DDRW";return[{x:u7(sv(dd?"MIX":"WP"))*W,y:20,k:dd?"MIX":"WP",drag:x=>sset(dd?"MIX":"WP",x/W*127)}]}};
/* DPRO-BBOX: one hit, from STRT on (the key picks the drum) */
ED.drum={draw(g,W,H){const ink=cssv("--ink"),s0=u7(sv("STRT"))*.5,f=.6+u7(sv("PTCH"))*1.2;grid(g,W,H);railDraw(g,W,H);
  for(let x=0;x<W;x++){const p=x/W+s0,v=Math.exp(-p*6)*Math.sin(p*90*f+Math.sin(p*400)*2);g.fillStyle=ink;g.fillRect(x,H/2-v*(H/2-24),1,1+Math.abs(v)*2)}label(g,"the key picks the drum")},
 handles(W,H){return[railH(W,H,"SYN","STRT")]}};
/* retrigs: how many (RTRG, 127 = on and on), how far apart (RTIM) */
ED.rtrg={geo(W){const n=sv("RTRG"),dt=(6+u7(sv("RTIM"))*(W*.3));return{n:n>=127?99:n,dt}},
 draw(g,W,H){const G=this.geo(W),ink=cssv("--ink");grid(g,W,H);railDraw(g,W,H);for(let k=0;k<=G.n;k++){const x=10+k*G.dt;if(x>W-4)break;const h=(H-38)*Math.pow(.86,k);g.fillStyle=ink;g.fillRect(x,H-14-h,3,h)}
  label(g,G.n?(sv("RTRG")>=127?"retrigs on and on":G.n+" retrig"+(G.n>1?"s":"")):"one hit")},
 handles(W,H){const G=this.geo(W);return[{x:10+G.dt,y:H-14-(H-38)*.86,k:"RTIM",drag:x=>sset("RTIM",(x-16)/(W*.3)*127)},railH(W,H,"SYN","RTRG")]}};
/* FM+: one block: the carrier moved by its modulator; dot = the modulator's frequency (sideways) and level (up) */
ED.fm={ks(c){const k=ck(c);return{f:k.find(n=>/FRQ$/.test(n)),a:k.find(n=>/(ENV|VOL)$/.test(n)&&!/VEN$/.test(n)),fb:k.find(n=>/FB$/.test(n))}},
 draw(g,W,H,c){const K=this.ks(c),ink=cssv("--ink"),r=.5+u7(sv(K.f))*6,I=(K.a?u7(sv(K.a)):.5)*4,fb=K.fb?u7(sv(K.fb)):0;grid(g,W,H);
  line(g,W,x=>{const p=x/W*2;return H/2+4-Math.sin(p*6.283*r)*(K.a?u7(sv(K.a)):.5)*(H/2-26)*.5},inkA(.4),1.2,[2,3]);
  line(g,W,x=>{const p=x/W*2,mod=Math.sin(p*6.283*r+fb*Math.sin(p*6.283*r));return H/2+4-Math.sin(p*6.283+I*mod)*(H/2-24)},ink,2);label(g,`ratio ${r.toFixed(1)}${fb?" · feedback":""}`)},
 handles(W,H,c){const K=this.ks(c);return K.f?[{x:u7(sv(K.f))*W,y:K.a?H-8-u7(sv(K.a))*(H-28):H/2,k:K.a?K.f+" · "+K.a:K.f,drag:(x,y)=>{sset(K.f,x/W*127);if(K.a)sset(K.a,(H-8-y)/(H-28)*127)}}]:[]}};
/* VO-6: the vowel map (VOC1 across, VOC2 up) with the tutorial's points */
ED.vowel={draw(g,W,H){const P=[["O",35,5],["A",127,60],["I",40,110],["E",80,100],["U",10,30]];grid(g,W,H);g.font="10px Silkscreen, monospace";
  P.forEach(([l,a,b])=>{g.fillStyle=inkA(.5);g.fillText(l,10+a/127*(W-20)-3,H-10-b/127*(H-34)+4)});label(g,(sv("V-SW")?"":"no vowel · ")+CONS[sv("CONS")]+" + vowel")},
 handles(W,H){return[{x:10+sv("VOC1")/127*(W-20),y:H-10-sv("VOC2")/127*(H-34),k:"VOC1 · VOC2",drag:(x,y)=>{sset("VOC1",(x-10)/(W-20)*127);sset("VOC2",(H-10-y)/(H-34)*127)}}]}};
/* GND-NOIS: white (RED 0) through pink to red */
ED.noise={draw(g,W,H){const ink=cssv("--ink"),red=u7(sv("RED"));grid(g,W,H);let y=0;for(let x=0;x<W;x+=2){const n=hashN(x)*2-1;y=y*red*.95+n*(1-red*.8);g.fillStyle=ink;g.fillRect(x,H/2,2,-clamp(y,-1,1)*(H/2-22))}
  label(g,red<.25?"white":red<.7?"pink":"red")}};
/* FX-THRU: the input through the machine into the track's effects */
ED.fxin={draw(g,W,H){const ink=cssv("--ink"),m=trk(S.sel).m,bw=Math.min(90,W*.4);grid(g,W,H);g.strokeStyle=ink;g.lineWidth=2;g.strokeRect(W/2-bw/2,H/2-14,bw,28);g.font=SFONT;g.fillStyle=ink;g.fillText(m.slice(3),W/2-bw/2+6,H/2+3);
  g.beginPath();g.moveTo(6,H/2);g.lineTo(W/2-bw/2-2,H/2);g.moveTo(W/2+bw/2,H/2);g.lineTo(W-6,H/2);g.stroke();g.fillText(inputLabel(S.sel),6,H/2-8);label(g,"needs a trig to open")}};
/* FX-REVERB: the tail (DEC long, DAMP darker), cut at GATE (127: no gate) */
ED.verb={draw(g,W,H){const ink=cssv("--ink"),dec=.08+u7(sv("DEC"))*.9,damp=u7(sv("DAMP")),gate=sv("GATE"),gx=gate>=127?W:12+u7(gate)*(W-24);grid(g,W,H);railDraw(g,W,H);
  g.fillStyle=ink;g.fillRect(8,20,3,H-40);for(let x=14;x<gx;x+=2){const p=(x-14)/W,a=Math.exp(-p/dec*(1+damp));const h=(H-40)*a*(.5+.5*hashN(x)*(1-damp*.6));g.fillRect(x,H/2-h/2,1.5,h)}
  if(gate<127){g.fillStyle=inkA(.5);g.fillRect(gx,16,1,H-30)}label(g,gate>=127?"no gate":"gated")},
 handles(W,H){return[{x:14+Math.min(W-20,(.08+u7(sv("DEC"))*.9)*W*.7),y:H/2,k:"DEC",drag:x=>sset("DEC",((x-14)/W/.7-.08)/.9*127)},railH(W,H,"SYN","GATE")]}};
/* a band: everything below HP and above LP is cut (FX-REVERB's filter, the delay's DBAS + DWID) */
function bandDraw(g,W,H,lo,hi,txt){const ink=cssv("--ink"),T=22,B=H-12;grid(g,W,H);line(g,W,x=>{const u=x/W;let d=0;if(u<lo)d=Math.pow((lo-u)*6,2);if(u>hi)d=Math.pow((u-hi)*6,2);return clamp(T+d*(B-T),T,B)},ink,2.2);label(g,txt)}
ED.hplp={draw(g,W,H){bandDraw(g,W,H,u7(sv("HP")),u7(sv("LP")),"the reverb's band")},
 handles(W,H){return[{x:u7(sv("HP"))*W,y:24,k:"HP",drag:x=>sset("HP",x/W*127)},{x:u7(sv("LP"))*W,y:24,k:"LP",drag:x=>sset("LP",x/W*127)}]}};
/* FX-DYNAMIX: in to out (dashed = unchanged): THRS where it starts, RAT how much (127 a limiter), GAIN after */
ED.comp={pt(W,H){const t=u7(sv("THRS")),r=1/(1+u7(sv("RAT"))*12),gn=u7(sv("GAIN"))*.4;return{t,r,gn,X:u=>8+u*(W-16),Y:v=>H-10-clamp(v,0,1)*(H-34)}},
 draw(g,W,H){const P=this.pt(W,H),ink=cssv("--ink");grid(g,W,H);g.setLineDash([4,3]);g.strokeStyle=inkA(.5);g.beginPath();g.moveTo(P.X(0),P.Y(0));g.lineTo(P.X(1),P.Y(1));g.stroke();g.setLineDash([]);
  g.strokeStyle=ink;g.lineWidth=2;g.beginPath();for(let k=0;k<=40;k++){const u=k/40,o=(u<P.t?u:P.t+(u-P.t)*P.r)+P.gn;k?g.lineTo(P.X(u),P.Y(o)):g.moveTo(P.X(u),P.Y(o))}g.stroke();label(g,sv("RAT")>=127?"limiter":"1 : "+(1+Math.round(u7(sv("RAT"))*254)))},
 handles(W,H){const P=this.pt(W,H);return[{x:P.X(P.t),y:P.Y(P.t+P.gn),k:"THRS · GAIN",drag:(x,y)=>{sset("THRS",(x-8)/(W-16)*127);sset("GAIN",((H-10-y)/(H-34)-P.t)/.4*127)}}]}};
/* chorus, phaser, flanger: the sweep over time, around DEL / CNTR by DEP at SPD; FB in words */
ED.sweep={ks(){return trk(S.sel).m==="FX-PHASER"?"CNTR":"DEL"},
 geo(W,H){const c=u7(sv(this.ks())),d=u7(sv("DEP"))*.5,s=.5+u7(sv("SPD"))*6,Y=v=>H-10-clamp(v,0,1)*(H-34);return{c,d,s,Y}},
 draw(g,W,H){const G=this.geo(W,H),ink=cssv("--ink");grid(g,W,H);railDraw(g,W,H);line(g,W,x=>G.Y(G.c+G.d*Math.sin(x/W*6.283*G.s)),ink,2);label(g,(sv("FB")?"feedback "+sv("FB"):"no feedback"))},
 handles(W,H){const G=this.geo(W,H),k=this.ks(),xp=W/(4*G.s);return[{x:4,y:G.Y(G.c),k,drag:(x,y)=>sset(k,(H-10-y)/(H-34)*127)},{x:xp,y:G.Y(G.c+G.d),k:"DEP",drag:(x,y)=>sset("DEP",((H-10-y)/(H-34)-G.c)/.5*127)},railH(W,H,"SYN","SPD")]}};
/* FX-RINGMOD: the carrier, sine to triangle (WAVE); EXT in words */
ED.carrier={draw(g,W,H){const ink=cssv("--ink"),w=u7(sv("WAVE"));grid(g,W,H);railDraw(g,W,H);line(g,W,x=>{const p=(x/W*3)%1,s=Math.sin(p*6.283),t=1-4*Math.abs(((p+.25)%1)-.5);return H/2-((1-w)*s+w*t)*(H/2-24)},ink,2);label(g,w<.5?"sine":"triangle")},
 handles(W,H){return[railH(W,H,"SYN","WAVE")]}};
/* AMP DIST: in to out (dashed = clean) */
ED.dist={k(){return(kget("AMP","DIST")-64)/63},
 draw(g,W,H){const k=this.k(),a=1+Math.abs(k)*9,ink=cssv("--ink"),X=u=>8+(u+1)/2*(W-16),Y=v=>H/2+6-v*(H/2-22);grid(g,W,H);

/* MACHINE: the machine intent (its start values are the core's; keep: the effects and LFOs stay); the SYN locks of the
   track go with the old machine (clearLane each) */
function setMachine(v){const t=S.sel,tr=trk(t);const old=tr.m,synLocks=trackLockPids(t).filter(p=>p.startsWith("SYN."));tr.m=v;tr.name=machName(v);tr.v.SYN=synDefaults(v);if(!S.keepFx){tr.v.AMP=[...DEFV.AMP];tr.v.FLT=[...DEFV.FLT];tr.v.EFX=[...DEFV.EFX];tr.v.LF1=[...DEFV.LFO];tr.v.LF2=[...DEFV.LFO];tr.v.LF3=[...DEFV.LFO]}
 for(const k of [...S.locks.keys()]){const[x,p]=k.split("|");if(+x===t&&p.startsWith("SYN."))S.locks.delete(k)}
 if(isFx(v)&&!isFx(old)){tr.inp=t===0?"INP AB":"NEIBOR";tr.v.AMP[2]=127;tr.v.AMP[3]=127;toast(`${v} needs audio in: input ${tr.inp}. AMP DEC and REL are at 127 so the sound passes.`)}

/* ===== Mix: routing drawn as a signal graph ===== */
const BUSES=["AB","CD","EF"],ROUTES=["3xSTEREO","3xSTEREO+AB=MIX","6xMONO"],INPUTS=["NEIBOR","INP A","INP B","INP AB","BUS AB","BUS CD","BUS EF"];
const shortM=m=>m.replace("SWAVE-","SW-").replace("DPRO-","DP-");
function busFlow(b){const T=S.tracks;let items=[];const notes=[];
 T.forEach((tr,t)=>{const lab=(tr.inp==="NEIBOR"&&isFx(tr.m)&&t>0?`T${t}›`:"")+`T${t+1} ${shortM(tr.m)}`;
  if(isFx(tr.m)&&tr.inp==="BUS "+b){if(tr.out[b]){items=[`(${items.join(" + ")||"silence"}) › ${lab} INSERT`]}else notes.push(`${lab} takes a copy`);return}
  if(tr.out[b]&&!tr.mute)items.push(lab)});
 return{items,notes}}
function outOf(b){if(S.routing==="6xMONO")return"not sent out";if(b==="AB")return"OUT A/B";return S.routing==="3xSTEREO+AB=MIX"?`OUT ${b[0]}/${b[1]} + A/B`:`OUT ${b[0]}/${b[1]}`}
/* compact: the node row, then the three buses close under it with the INPUT jack inline on their left, the
   outputs on their right and the mode label in the bottom corner */
function routeSvg(){const T=S.tracks,W=1200,NW=140,nx=i=>118+172*i,NY=30,NH=44,by={AB:94,CD:110,EF:126},H=146,BX=110,mono=S.routing==="6xMONO";let h="";
 const IX=6,IY=by.AB-10,IW=78,IH=by.EF-by.AB+20;h+=`<g><rect x="${IX}" y="${IY}" width="${IW}" height="${IH}" rx="3" class="jack"/><text x="${IX+8}" y="${IY+15}" font-size="9">INPUT</text><text x="${IX+8}" y="${IY+IH-9}" font-size="12">A  B</text></g>`;
 BUSES.forEach(b=>{h+=`<line x1="${BX}" y1="${by[b]}" x2="1146" y2="${by[b]}" class="bus ${mono?"dim":""}"/><text x="${BX-4}" y="${by[b]+3}" font-size="8" text-anchor="end">${b}</text>`});
 h+=`<text x="1194" y="${H-3}" font-size="8" text-anchor="end">${mono?"6 X MONO":S.routing==="3xSTEREO"?"3 X STEREO":"3 X STEREO · AB = MIX"}</text>`;
 if(!mono)BUSES.forEach(b=>{h+=`<circle cx="1158" cy="${by[b]}" r="6" class="jack ${busFlow(b).items.length?"live":""}"/><text x="1169" y="${by[b]+4}" font-size="9">${b}</text>`;
  if(S.routing==="3xSTEREO+AB=MIX"&&b!=="AB")h+=`<path d="M1146 ${by[b]} C1130 ${by[b]-8},1130 ${by.AB+6},1146 ${by.AB}" class="cord dash"/>`});
 T.forEach((tr,i)=>{const x=nx(i),fx=isFx(tr.m),sel=i===S.sel;
  if(mono)h+=`<path d="M${x+NW/2} ${NY+NH} L${x+NW/2} ${H-12}" class="cord ${tr.mute?"dash":""}" opacity=".5"/><text x="${x+NW/2+4}" y="${H-3}" font-size="8">OUT ${"ABCDEF"[i]}</text>`;
  BUSES.forEach((b,k)=>{if(!tr.out[b])return;const dx=x+24+k*18;h+=`<line x1="${dx}" y1="${NY+NH}" x2="${dx}" y2="${by[b]}" class="cord ${mono?"dash":""}"/><circle cx="${dx}" cy="${by[b]}" r="4" class="tap"/>`});
  if(fx&&tr.inp.startsWith("BUS")){const b=tr.inp.slice(4),dx=x+NW-20;h+=`<path d="M${dx} ${by[b]} L${dx} ${NY+NH+6}" class="cord dash"/><path d="M${dx-4} ${NY+NH+8} L${dx} ${NY+NH+2} L${dx+4} ${NY+NH+8}" class="cord"/><circle cx="${dx}" cy="${by[b]}" r="3.5" class="jack"/><text x="${dx-7}" y="${NY+NH+13}" font-size="8" text-anchor="end">IN ${b}</text>`}
  if(fx&&tr.inp==="NEIBOR"&&i>0)h+=`<path d="M${nx(i-1)+NW} ${NY+NH/2} L${x-3} ${NY+NH/2}" class="cord"/><path d="M${x-9} ${NY+NH/2-5} L${x-2} ${NY+NH/2} L${x-9} ${NY+NH/2+5}" class="cord"/><text x="${x-16}" y="${NY-5}" font-size="7" text-anchor="middle">NEIBOR</text>`;
  if(fx&&tr.inp.startsWith("INP"))h+=`<path d="M${IX+IW} ${by.EF+6} L${x+NW/2-8} ${by.EF+9} Q${x+NW/2} ${by.EF+9},${x+NW/2} ${by.EF}L${x+NW/2} ${NY+NH}" class="cord dash"/><text x="${x+NW/2+6}" y="${NY+NH+13}" font-size="8">${tr.inp}</text>`;
  if(tr.m==="SID-6581"&&i>0&&sv2(tr,"MOD")&&sv2(tr,"MSRC")===1)h+=`<path d="M${nx(i-1)+NW-10} ${NY} C${nx(i-1)+NW} ${NY-18},${x+10} ${NY-18},${x+18} ${NY}" class="cord dot"/><text x="${x-10}" y="${NY-17}" font-size="7">PRCH</text>`;
  if(tr.trigpos!=null){const j=tr.trigpos;h+=`<path d="M${x+NW/2} ${NY} C${x+NW/2} ${NY-24},${nx(j)+NW/2} ${NY-24},${nx(j)+NW/2} ${NY}" class="cord dot"/><text x="${(x+nx(j))/2+NW/2-18}" y="${NY-20}" font-size="7">TRIG ›T${j+1}</text>`}
  h+=`<g class="node ${fx?"fx":""} ${sel?"sel":""} ${audible(i)?"":"muted"}" data-node="${i}"><rect class="body" x="${x}" y="${NY}" width="${NW}" height="${NH}" rx="3"/>${sel?`<rect class="frame" x="${x-4}" y="${NY-4}" width="${NW+8}" height="${NH+8}" rx="5"/>`:""}
   <text x="${x+8}" y="${NY+13}" font-size="9">T${i+1}${fx?" · FX":""}</text><text x="${x+8}" y="${NY+28}" font-size="11">${shortM(tr.m)}</text><text x="${x+8}" y="${NY+39}" font-size="7" opacity=".8">${tr.name.toUpperCase().slice(0,18)}</text></g>`});
 return`<svg class="route" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Routing: tracks, mix buses, outputs">${h}</svg>`}
function sv2(tr,n){const i=MACH[tr.m].p.indexOf(n);return i<0?0:tr.v.SYN[i]}
/* A channel strip, top to bottom in signal order (manual 1-26..1-29, 1-33): the sound's own mix values, then PAN,
   then the LEVEL fader at the end of the track's path, then where it goes (OUT buses, IN for an FX machine) and
   M / S. AMP VOL is part of the sound (lockable, LFO-able), so it sits with DIST and DSND as the strip's trim;
   the fader is LEVEL (the LEVEL knob, CC 7), the track's mix level, which can be neither locked nor modulated.
   Every row is the same height on every strip, so the six line up. */
const MIXTIP={
 VOL:"AMP VOL: the voice's volume, part of the sound (AMP page). It comes before LEVEL, can be locked per step and moved by an LFO. Balance tracks with the LEVEL fader; use AMP VOL for movement inside the sound.",
 DIST:"DIST: overload distortion and headroom (AMP page). Below 0 adds headroom: quieter and cleaner.",
 DSND:"DSND: delay send, into this track's own delay (EFFECTS page). Minus keeps the stereo image, plus is ping-pong. 0: no delay.",
 PAN:"PAN: the track's place in the stereo field (AMP page), L64 to R63. Drag sideways, double-click for centre.",
 LEV:"LEVEL: the track's mix level (the LEVEL knob, CC 7), at the end of its path, after AMP VOL. It cannot be locked or modulated."};
const mixBox=(g,n,i,label,tip)=>pc(g,n,{t:i,label,cls:"mini",extra:`title="${tip}"`});
function mixStrip(tr,i){const fx=isFx(tr.m);
 return`<div class="strip6 ${i===S.sel?"sel":""}" data-sel="${i}" style="${audible(i)?"":"opacity:.5"}">
   <div class="shead"><b>T${i+1}</b><b class="mc">${shortM(tr.m)}</b><span title="${tr.name}">${tr.name}</span></div>
   <div class="trim">${mixBox("AMP",5,i,"AMP VOL",MIXTIP.VOL)}${mixBox("AMP",4,i,"DIST",MIXTIP.DIST)}${mixBox("EFX",4,i,"DSND",MIXTIP.DSND)}</div>
   <div class="pc pan hz" role="slider" tabindex="0" data-g="AMP" data-n="6" data-t="${i}" aria-label="T${i+1} PAN" title="${MIXTIP.PAN}"><span>PAN</span><i class="pt"></i><b></b></div>
   <div class="lvl"><div class="scale" aria-hidden="true">${[127,96,64,32,0].map(v=>`<i style="bottom:${v/127*100}%">${v}</i>`).join("")}</div>
    <div class="fader" role="slider" tabindex="0" aria-label="T${i+1} LEVEL" data-g="lev" data-t="${i}" title="${MIXTIP.LEV}"><div class="tr"><i></i></div><div class="cap2"></div><b class="lread" data-show="${i}"></b></div>
    <small class="lcap" title="${MIXTIP.LEV}">LEVEL</small></div>
   <div class="busrow"><span class="inlab">Out</span><div class="busk">${BUSES.map(b=>`<button data-bus="${b}" data-t="${i}" aria-pressed="${tr.out[b]}" title="${tr.out[b]?"Sends to":"Not sent to"} mix bus ${b}">${b}</button>`).join("")}</div></div>
   <div class="busrow"><span class="inlab">In</span>${fx?`<select id="inp${i}" data-inp="${i}" aria-label="T${i+1} input">${INPUTS.filter(x=>!(x==="NEIBOR"&&i===0)).map(x=>opt(x,x,tr.inp)).join("")}</select>`:`<button class="kselbtn" disabled title="Only FX machines take an input"><span>synth · none</span></button>`}</div>
   <div class="mrow"><button class="ms m ${ARMED.has(i)?"prep":""}" ${ARMED.has(i)?`data-prep="${ARMED.get(i)?"X":"+"}"`:""} data-mute="${i}" aria-pressed="${tr.mute}" aria-label="Mute T${i+1}">M</button><button class="ms s" data-solo="${i}" aria-pressed="${tr.solo}" aria-label="Solo T${i+1}">S</button></div></div>`}
function renderMix(){const T=S.tracks;
 const flows=BUSES.map(b=>{const f=busFlow(b);return`<span>${b}: ${f.items.join(" + ")||"<i>empty</i>"} <i>›</i> ${outOf(b)}${f.notes.length?" <i>· "+f.notes.join(", ")+"</i>":""}</span>`}).join("");
 $("#main").innerHTML=`<div class="routewrap">
  <div class="strips6 mixrow">${T.map((tr,i)=>mixStrip(tr,i)).join("")}</div>
  <div class="routebar"><span class="cap">Routing</span><span class="seg" data-set="routing">${ROUTES.map(r=>`<button data-v="${r}" aria-pressed="${S.routing===r}">${r.replace("+"," + ")}</button>`).join("")}</span>
   <span class="grow"></span><span class="hint">Tracks sum into a bus in track order, so an FX on a bus only hears the tracks before it. Click a node to pick its strip.</span></div>
  ${routeSvg()}<div class="flowl">${flows}</div></div>`;
 syncControls()}

/* ===== Perform: keyboard modes, multi trig, multi map, multi env, assign, mutes ===== */
const PMODES=[["normal","Auto track","Keys play the track in focus (AUTO TRACK channel 9)."],["multi","Multi trig","One source plays all six tracks as one big mono synth (channel 7)."],["map","Multi map","Key ranges start patterns, with offset, length and transpose (channel 8)."],["poly","Poly","All six engines play the track in focus with six voices. Other tracks go quiet."]];
const MTM=["ALL TRK","SPLIT KEY","SEQ START","SEQ TRNSP"],TIMS=["DIRECT","1/16","2/16","4/16","8/16","16/16","32/16"];
const isBlack=n=>[1,3,6,8,10].includes(n%12);
function kbRange(){const lo=12*(S.kbOct+1);return[lo,lo+47]}
function zoneOf(n){if(S.mode!=="multi"||S.multi.mode!==1)return null;return n>=S.multi.splitKey?"up":"lo"}
function mapRow(n){let lo=0;for(let i=0;i<S.mmap.length;i++){const r=S.mmap[i];if(n>=lo&&n<=r.hi)return i;lo=r.hi+1}return -1}
function renderKb(){const[lo,hi]=kbRange(),whites=[];for(let n=lo;n<=hi;n++)if(!isBlack(n))whites.push(n);const ww=100/whites.length;let h="",wi=0;
 for(let n=lo;n<=hi;n++){if(isBlack(n)){h+=`<div class="b" data-key="${n}" style="left:${wi*ww-ww*.3}%;width:${ww*.6}%" aria-label="${noteName(n)}"></div>`;continue}
  h+=`<div class="w" data-key="${n}" style="left:${wi*ww}%;width:${ww}%" aria-label="${noteName(n)}">${n%12===0?`<small>${noteName(n)}</small>`:""}</div>`;wi++}
 if(S.mode==="multi"&&S.multi.mode===1){const sk=S.multi.splitKey;let idx=whites.findIndex(w=>w>=sk);if(idx<0)idx=whites.length;const x=idx*ww;
  h+=`<div class="zone" style="left:0;width:${x}%;background:var(--ledg)"></div><div class="zone" style="left:${x}%;width:${100-x}%;background:var(--led)"></div><div class="splitm" id="splitm" style="left:${x}%" title="Drag the split point"><span>SPLIT ${noteName(sk)} · T${S.multi.splitTrack}-6 above</span></div>`}
 return h}
function mapBands(){const[lo,hi]=kbRange(),whites=[];for(let n=lo;n<=hi;n++)if(!isBlack(n))whites.push(n);const ww=100/whites.length,xOf=n=>{let i=whites.findIndex(w=>w>=n);if(i<0)i=whites.length;return i*ww};let from=0;
 return S.mmap.map((r,i)=>{const a=Math.max(from,lo),b=Math.min(r.hi,hi);from=r.hi+1;if(b<lo||a>hi)return"";const x0=xOf(a),x1=xOf(b+1);return`<div class="band ${i===S.mmapSel?"sel":""}" data-band="${i}" style="left:${x0}%;width:${Math.max(2,x1-x0)}%">${r.pat<0?"CUR":patName(r.pat)}${r.trn!==0&&r.trn!==64?"":""}</div>`}).join("")}

 if(a==="up"&&i>0&&r.type!=="end")songMove(i,i-1);

 if(a==="loop"){const at=r.type==="end"?i:i+1;S.song.splice(at,0,{type:"loop",to:Math.max(0,i-1),count:2});songRetarget(j=>j<at?j:j+1);S.songSel=at;edit("rowInsert",{i:at,row:S.song[at]})}

function songStep(k,d){const r=S.song[S.songSel];
 if(k==="pat")r.pat=(r.pat+d+128)%128;if(k==="rep")r.rep=Math.max(1,Math.min(64,r.rep+d));if(k==="bpm")r.bpm=Math.max(30,Math.min(300,(r.bpm||S.bpm)+d));
 if(k==="trn")r.trn=clamp((r.trn??64)+d,28,100);
 if(k==="ofs"){const L=patLen(r.pat);r.ofs=Math.max(0,Math.min(L-1,(r.ofs||0)+d));if(r.len&&r.ofs+r.len>L)r.len=L-r.ofs}
 if(k==="len"){const L=patLen(r.pat);r.len=Math.max(1,Math.min(L-(r.ofs||0),rowLen(r)+d))}
 if(k==="to")r.to=Math.max(0,Math.min(r.type==="jump"?S.song.length-1:S.songSel-(r.type==="loop"?1:0),r.to+d));
 if(k==="count")r.count=r.count===Infinity?(d<0?63:Infinity):Math.max(1,Math.min(63,r.count+d));
 editRow();render()}

 else{const from=drag2.v;let to=t.mode==="onto"?t.i:S.song.length-1;if(t.mode==="onto"&&from<to)to--;if(t.mode==="append")to=S.song.length-2;if(from!==to&&to>=0)songMove(from,to)}
