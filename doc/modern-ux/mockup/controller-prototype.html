<!doctype html>
<html lang="en" data-m="mm">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>Controller Configurator</title>
<!-- Clickable prototype of the CONTROL workspace's controller configurator (doc/modern-ux/DESIGN-controller-ux.md).
     Fake data only, no host. One file with no siblings needed: open it over http or from file://. The fonts come from
     the mockups' Google Fonts link (the same families the pages bundle); offline it falls back to system fonts.
     Nothing here is product code. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=Silkscreen&display=swap">
<style>

/* ===== tokens: the Monomachine Editor's SFX-60 plate and the Machinedrum Editor's MKII plate, as shipped ===== */
:root{
  --sans:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --pix:"Silkscreen",ui-monospace,monospace;
}
:root[data-m="mm"]{
  color-scheme:light;
  --plate:#d4d5d0;--plate2:#c8cac2;--plate3:#e2e1d9;--print:#383934;--print2:#56574f;--print3:#74756f;--rule:#aaaba5;--body:#292a26;
  --key:#3a3b36;--key2:#4b4d47;--keytext:#efefe8;--keydim:#aeb0a8;--cream:#efefe8;--creamtext:#292a26;
  --led:#e65d42;--ledoff:#7b4035;--ledg:#9fc568;--rec:#cf4f39;
  --lcd:#b9c4b0;--ink:#172014;--bezel:#0d0f0c;--rust:#a04d39;--oxblood:var(--rust);
  --hover:color-mix(in srgb,var(--plate3) 70%,transparent);--hot:color-mix(in srgb,var(--led) 10%,var(--plate3));
}
:root[data-m="md"]{
  color-scheme:dark;
  --plate:#161716;--plate2:#0f100f;--plate3:#232422;--print:#f1f0ea;--print2:#c9c8c1;--print3:#94938c;--rule:#3e3f3b;--body:#ecebe5;
  --key:#232423;--key2:#30312f;--keytext:#ecebe5;--keydim:#8f908b;--cream:#ece6d6;--creamtext:#1f1e1b;
  --led:#ff3b2f;--ledoff:#4d1714;--ledg:#9fc568;--rec:#e0472e;
  --lcd:#ef5a39;--ink:#3a0e08;--bezel:transparent;--rust:#ee613f;--oxblood:#ee613f;
  --hover:#1d1e1c;--hot:color-mix(in srgb,var(--led) 12%,var(--plate));
}

/* ===== the pages' base (mmStudio.css / mdDesk.css) ===== */
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--plate)}
body{color:var(--body);font:500 15px/1.35 var(--sans);padding:14px 16px 90px;margin:0}
button,select,input{font:inherit;color:inherit}
button{background:var(--key);color:var(--keytext);border:0;border-radius:3px;padding:5px 11px;cursor:pointer;font-weight:600;letter-spacing:.04em;box-shadow:inset 0 -2px 0 rgba(0,0,0,.35)}
button:hover{background:var(--key2)}
button:active{box-shadow:none;transform:translateY(1px)}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:2px solid var(--led);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.note{font-size:14px;color:var(--print2)}
.app{max-width:1600px;margin:0 auto;display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.led{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ledoff);flex:none;vertical-align:middle}
.led.on{background:var(--led);box-shadow:0 0 6px 1px var(--led)}
.card{border-top:2px solid var(--print);padding-top:8px;display:grid;gap:10px;align-content:start;min-width:0}
.card header{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.card h3{margin:0;font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--print)}
.card header span{font:12px var(--mono);color:var(--print3)}
.ilab{font:600 11px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--print2)}
.amkey{height:26px;padding:0 10px;font:600 11px var(--sans);letter-spacing:.12em;white-space:nowrap;text-transform:uppercase;display:inline-flex;align-items:center;gap:6px}
.amkey[aria-pressed=true]{background:var(--cream);color:var(--creamtext)}
.amkey .led{width:7px;height:7px}
.chip{padding:3px 10px;font:500 12px var(--mono);letter-spacing:0}
.chip[aria-pressed=true]{background:var(--cream);color:var(--creamtext)}
.toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:var(--lcd);color:var(--ink);font:12px var(--pix);padding:10px 16px;border-radius:3px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40;box-shadow:0 0 0 3px var(--key)}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* top bar: brand, workspace keys, the LCD, setup keys */
.top{display:grid;grid-template-columns:auto 1fr auto;gap:12px 22px;align-items:end;padding:4px 0 12px;border-bottom:2px solid var(--print)}
.top .left{display:flex;gap:18px;align-items:end}
.brand{display:grid;gap:4px}
.brand b{font:600 22px/1 var(--sans);letter-spacing:.08em;color:var(--print)}
.brand small{font:600 12px var(--sans);letter-spacing:.5em;color:var(--oxblood);text-transform:uppercase}
.wsgroup{display:grid;justify-items:center;gap:4px}
.grplabel{font:600 10px var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--print);display:flex;align-items:center;gap:8px;width:100%}
.grplabel::before,.grplabel::after{content:"";flex:1;height:6px;border-top:1px solid var(--print)}
.grplabel::before{border-left:1px solid var(--print)}.grplabel::after{border-right:1px solid var(--print)}
.tabs{display:flex;gap:5px}
.tabs button{position:relative;display:grid;justify-items:center;gap:4px;padding:6px 12px 7px;font:600 12px var(--sans);letter-spacing:.12em;text-transform:uppercase}
.tabs button .led{width:7px;height:7px}
.tabs button small{position:absolute;right:4px;top:3px;font:10px var(--mono);letter-spacing:0;opacity:.55}
.tabs button[aria-selected=true]{background:var(--cream);color:var(--creamtext)}
.tabs button[aria-selected=true] .led{background:var(--led);box-shadow:0 0 6px 1px var(--led)}
.lcdpanel{display:flex;justify-self:center;background:var(--lcd);color:var(--ink);border-radius:4px;padding:5px 4px;box-shadow:0 0 0 3px var(--bezel),inset 0 0 0 1px color-mix(in srgb,var(--ink) 14%,transparent);user-select:none}
.lcdpanel .f{display:grid;gap:1px;padding:0 9px;border-left:1px solid color-mix(in srgb,var(--ink) 35%,transparent)}
.lcdpanel .f:first-child{border-left:0}
.lcdpanel small{font:9px var(--pix);letter-spacing:.04em;text-transform:uppercase;opacity:.8}
.lcdpanel b{font:14px var(--pix);font-weight:400;white-space:nowrap}
@media (max-width:1400px){.top{grid-template-columns:auto 1fr}.top .setkeys{display:none}}
@media (max-width:1100px){.top{grid-template-columns:1fr}.lcdpanel{justify-self:start}.lcdpanel .f.opt{display:none}}

/* key-style dropdowns (enhanceSelects / openK / #kpop, as on the pages) */
.kselbtn{display:flex;align-items:center;justify-content:space-between;gap:10px;height:28px;padding:0 10px;font:500 13px var(--sans);letter-spacing:.03em;min-width:0;width:100%}
.kselbtn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kselbtn svg{width:10px;height:6px;flex:none}
.kselbtn[aria-expanded=true]{background:var(--key2)}
.kpop{position:absolute;z-index:45;padding:8px;background:var(--plate);border:2px solid var(--print);border-radius:6px;box-shadow:0 14px 34px rgba(0,0,0,.35);max-width:calc(100vw - 32px)}
.klist{display:grid;gap:3px}
.kgrp{grid-column:1/-1;font:600 10px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--print);padding:6px 2px 2px}
.kopt{text-align:left;height:28px;padding:0 9px;font:500 13px var(--sans);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kopt[aria-selected=true]{background:var(--cream);color:var(--creamtext)}

/* ===== the CONTROL workspace: devices ===== */
.ctlhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.ctlhead h3{margin:0;font:600 15px var(--sans);letter-spacing:.06em;color:var(--print)}
.devs{min-height:56vh;display:grid;place-content:center;justify-items:center;gap:18px;text-align:center}
.devs .ctlhead{justify-content:center}
.ctltiles{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;max-width:900px}
.ctltile{width:200px;display:flex;flex-direction:column;align-items:center;gap:7px;padding:16px 10px 12px;border:1px solid var(--rule);border-radius:4px;background:transparent;color:var(--body);box-shadow:none;font:600 12px var(--sans)}
.ctltile:hover,.ctltile:focus-visible{border-color:var(--print);background:transparent;outline:none}
.ctltile svg{width:104px;height:60px;color:var(--print)}
.ctltile .tname{font:600 14px var(--sans);letter-spacing:.04em;color:var(--print)}
.ctltile .tstate{display:flex;align-items:center;gap:6px;font:600 10px var(--pix);text-transform:uppercase;color:var(--print2)}
.ctltile.virt{border-style:dashed}
.ctltile.dis{opacity:.62}
.empty{display:grid;justify-items:center;gap:12px;max-width:520px;padding:26px 28px;border:1px dashed var(--rule);border-radius:6px}
.empty svg{width:120px;height:70px;color:var(--print3)}
.empty h4{margin:0;font:600 18px var(--sans);letter-spacing:.06em;color:var(--print)}
.empty ol{margin:0;padding-left:20px;text-align:left;color:var(--print2);font-size:14px;display:grid;gap:3px}
.devfoot{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}

/* ===== a device's configurator ===== */
.cfg{display:grid;gap:16px}
.cfgbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding-bottom:10px;border-bottom:1px solid var(--rule)}
.cfgbar .kselbtn{width:100%}
.cfgbar .grow{flex:1}
.trackstrip{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.tp{display:grid;justify-items:center;gap:2px;min-width:44px;height:38px;padding:3px 6px;font:500 11px var(--mono);letter-spacing:0}
.tp small{font:500 9px var(--sans);letter-spacing:.06em;opacity:.8;max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tp[aria-pressed=true]{background:var(--cream);color:var(--creamtext)}
.md .tp{min-width:34px;padding:3px}
.cfggrid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:22px;align-items:start}
.warnline{margin:0;padding:6px 10px;border-radius:3px;background:var(--rec);color:#fff;font:600 12px var(--sans)}

/* ===== the matrix ===== */
.mxtools{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.mxtools .grow{flex:1}
.legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--print2)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.mxscroll{overflow-x:auto;border-top:2px solid var(--print)}
.mx{--rh:224px;--sc:124px;--cw:100px;display:grid;min-width:max-content}
.mx.md{--rh:224px;--sc:118px;--cw:84px}
.mr{display:grid;grid-template-columns:var(--rh) var(--sc) repeat(var(--n),minmax(var(--cw),1fr));min-height:44px}
.mr>*{border-bottom:1px solid var(--rule);min-width:0}
.mr .cell{border-left:1px solid color-mix(in srgb,var(--rule) 55%,transparent)}
.mr .sc0{position:sticky;left:var(--rh);z-index:2;background:var(--plate);border-left:1px solid var(--rule);border-right:1px solid var(--rule)}
.mr .rh0{position:sticky;left:0;z-index:3;background:var(--plate)}
/* the column heads */
.mr.head{min-height:52px;position:sticky;top:0;z-index:4}
.mr.head>*{background:var(--plate);display:grid;align-content:end;justify-items:start;gap:2px;padding:6px 10px 7px;border-bottom:1px solid var(--print)}
.mr.head b{font:600 12px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--print)}
.mr.head small{font:500 11px var(--mono);color:var(--print3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.mr.head .issel small{color:var(--print)}
.mr.head .issel b::after{content:" · SEL";color:var(--print3);letter-spacing:.1em}
.mr.head .sc0 b{display:flex;gap:6px;align-items:center}
/* group rows */
.mr.grp{min-height:34px}
.mr.grp>*{background:var(--plate2);border-bottom:1px solid var(--rule)}
.mr.grp .gh{grid-column:1/-1;position:sticky;left:0;display:flex;align-items:center;gap:10px;padding:0 10px;background:transparent;box-shadow:none;border-radius:0;color:var(--print);font:600 11px var(--sans);letter-spacing:.18em;text-transform:uppercase;height:34px;width:max-content;min-width:100%;text-align:left}
.mr.grp .gh:hover{background:var(--hover)}
.mr.grp .gh svg{width:10px;height:10px;transition:transform .15s}
.mr.grp .gh[aria-expanded=false] svg{transform:rotate(-90deg)}
.mr.grp .gh small{font:500 11px var(--mono);letter-spacing:0;color:var(--print3);text-transform:none}
/* a control's row head */
.rh{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto auto;gap:4px 8px;align-items:center;padding:7px 10px;cursor:pointer;text-align:left;background:var(--plate);color:var(--body);box-shadow:none;border-radius:0;font:inherit;letter-spacing:0;height:100%;width:100%}
.rh:hover{background:var(--plate)}
.rh .nm{display:flex;align-items:baseline;gap:8px;min-width:0}
.rh .nm b{font:600 14px var(--sans);letter-spacing:.05em;color:var(--print);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rh .nm small{font:500 11px var(--mono);color:var(--print3);white-space:nowrap}
.rh .tags{display:flex;gap:5px;align-items:center;justify-self:end}
.badge{font:600 9px var(--mono);letter-spacing:.04em;padding:1px 5px;border-radius:2px;border:1px solid var(--rule);color:var(--print3)}
.badge.own{border-color:var(--print2);color:var(--body)}
.type{display:inline-flex;align-items:center;gap:5px;font:600 10px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--print2)}
.type i{width:7px;height:7px;border-radius:2px;background:var(--rule)}
.type.direct i{background:var(--print2)}
.type.macro i{background:var(--rust)}
.type.roll i,.type.amount i{background:var(--ledg)}
.meter{grid-column:1/-1;display:grid;grid-template-columns:1fr 28px;gap:8px;align-items:center;cursor:ew-resize;touch-action:none}
.meter .bar{height:4px;border-radius:2px;background:color-mix(in srgb,var(--rule) 60%,transparent);position:relative;overflow:hidden}
.meter .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--print2)}
.meter .pad{height:10px;width:28px;border-radius:2px;border:1px solid var(--rule)}
.meter.pads{grid-template-columns:28px 1fr;cursor:pointer}
.meter b{font:500 11px var(--mono);color:var(--print3);text-align:right}
/* the row that moved last: steady */
.mr.hot .rh0,.mr.hot .sc0{background:var(--hot)}
.mr.hot .rh{background:transparent;box-shadow:inset 3px 0 0 var(--led)}
.mr.hot .meter .bar i{background:var(--led)}
.mr.hot .meter .pad{background:var(--led);border-color:var(--led)}
.mr.hot .meter b{color:var(--led)}
/* the selected row / cell */
.mr.selrow .rh{box-shadow:inset 3px 0 0 var(--print)}
.mr.hot.selrow .rh{box-shadow:inset 3px 0 0 var(--led)}
/* cells */
.cell{position:relative;display:grid;align-content:center;gap:4px;padding:6px 7px;background:transparent;box-shadow:none;border-radius:0;color:var(--body);font:inherit;letter-spacing:0;text-align:left;cursor:pointer}
.cell:hover{background:var(--hover)}
.mr:not(.head):not(.grp):hover>.cell,.mr:not(.head):not(.grp):hover>.sc0{background:var(--hover)}
.cell .plus{justify-self:center;font:400 16px var(--mono);color:var(--print3);opacity:0}
.cell:hover .plus,.cell:focus-visible .plus{opacity:1}
.cell.cur{box-shadow:inset 0 0 0 2px var(--print)}
.cell.off{cursor:default}
.cell.off .plus{display:none}
/* a mapped parameter in a cell */
.pchip{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 6px;align-items:center;padding:4px 7px 5px;border-radius:3px;background:var(--plate3);border:1px solid var(--rule);min-width:0}
.pchip b{font:600 12px var(--sans);letter-spacing:.06em;color:var(--print);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pchip em{font:normal 500 11px var(--mono);color:var(--print2)}
.pchip .rb{grid-column:1/-1;position:relative;height:3px;border-radius:2px;background:color-mix(in srgb,var(--rule) 55%,transparent)}
.pchip .rb i{position:absolute;top:0;bottom:0;background:var(--print2);border-radius:2px}
.pchip .rb i.inv{background:repeating-linear-gradient(90deg,var(--print2) 0 4px,transparent 4px 6px)}
.pchip .rb u{position:absolute;top:-2px;width:2px;height:7px;margin-left:-1px;background:var(--led);border-radius:1px}
.pchip .dir{font:600 9px var(--mono);color:var(--print3)}
.mr.macro .pchip{border-left:3px solid var(--rust);padding-left:5px}
.mr.hot .pchip em{color:var(--led)}
.pchip.nope{opacity:.55}
.mx.md .pchip b{font-size:11px}
.dice{display:flex;align-items:center;gap:6px;padding:4px 7px;border-radius:3px;border:1px dashed var(--print3);background:transparent}
.dice svg{width:14px;height:14px;flex:none;color:var(--print2)}
.dice b{font:600 12px var(--sans);letter-spacing:.06em;color:var(--print);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dice em{font:normal 500 11px var(--mono);color:var(--print2);margin-left:auto}
.mr.hot .dice em{color:var(--led)}
.learnrow{grid-column:1/-1;position:sticky;left:0;display:flex;gap:10px;align-items:center;padding:8px 10px;width:max-content}
.learnline{display:flex;align-items:center;gap:8px;margin:0;padding:6px 10px;border-radius:3px;background:var(--lcd);color:var(--ink);font:12px var(--pix)}

/* the voices matrix */
.vx .mr{min-height:36px}
.vx .rh{grid-template-rows:auto;grid-template-columns:minmax(0,1fr) auto}
.vstep{display:inline-flex;gap:2px;align-items:center}
.vstep button{width:20px;height:20px;padding:0;font:600 11px var(--mono)}
.vstep span{font:500 11px var(--mono);min-width:48px;text-align:center;color:var(--body)}
.vdot{justify-items:center}
.vdot i{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--rule);opacity:0}
.vdot:hover i{opacity:1}
.vdot.on i{opacity:1;background:var(--print);border-color:var(--print)}
.vdot small{font:500 10px var(--mono);color:var(--print2)}
.vx .mr.hot .vdot.on i{background:var(--led);border-color:var(--led)}

/* the inspector (a side panel; a drawer below 1180 px) */
.insp{position:sticky;top:10px}
.insp .close{display:none}
.ihead{display:grid;gap:6px}
.ititle{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.ititle b{font:600 18px var(--sans);letter-spacing:.05em;color:var(--print)}
.ititle span{font:12px var(--mono);color:var(--print3)}
.readout{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;background:var(--lcd);color:var(--ink);border-radius:4px;padding:7px 10px;box-shadow:0 0 0 3px var(--bezel);font:12px var(--pix)}
.readout small{font:9px var(--pix);opacity:.75;text-transform:uppercase;align-self:center}
.readout b{font:13px var(--pix);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.irow{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap}
.irow .ilab{min-width:52px}
.seg{display:inline-flex;gap:3px;flex-wrap:wrap}
.seg button{height:26px;padding:0 9px;font:600 11px var(--sans);letter-spacing:.1em;text-transform:uppercase}
.seg button[aria-pressed=true]{background:var(--cream);color:var(--creamtext)}
.tcards{display:grid;gap:8px}
.tcard{display:grid;gap:6px;padding:8px;border:1px solid var(--rule);border-radius:4px;background:var(--plate3)}
.tcard .trow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:5px;align-items:center}
.tcard .trow .kselbtn{height:26px}
.xkey{width:26px;height:26px;padding:0;font:600 13px var(--mono)}
.range{position:relative;height:26px;margin:0 8px;touch-action:none;cursor:pointer}
.range .rt{position:absolute;left:0;right:0;top:11px;height:4px;border-radius:2px;background:var(--rule)}
.range .rf{position:absolute;top:9px;height:8px;border-radius:2px;background:var(--print2)}
.range .rf.inv{background:repeating-linear-gradient(90deg,var(--print2) 0 6px,transparent 6px 9px)}
.range .rn{position:absolute;top:4px;width:3px;height:18px;margin-left:-1px;background:var(--led);border-radius:1px}
.range .rh2{position:absolute;top:3px;width:14px;height:20px;margin-left:-7px;border-radius:3px;background:var(--key);box-shadow:inset 0 -2px 0 rgba(0,0,0,.35),0 0 0 1px var(--plate3);cursor:ew-resize}
.range .rh2::after{content:attr(data-l);position:absolute;top:-1px;left:0;right:0;text-align:center;font:600 8px/20px var(--mono);color:var(--keytext)}

<body>
<div class="app">
  <header class="top">
    <div class="left"><div class="brand" id="brand"></div>
    <div class="wsgroup"><span class="grplabel">Workspace</span>
      <nav class="tabs" id="tabs" aria-label="Workspaces (prototype: only CONTROL)"></nav>
    </div></div>
    <div class="lcdpanel" id="lcd"></div>
    <div class="wsgroup setkeys"><span class="grplabel">Setup</span>
      <div class="tabs"><button disabled><i class="led"></i>Undo</button><button disabled><i class="led"></i>Redo</button><button disabled><i class="led"></i>Learn</button></div>
    </div>
  </header>
  <main id="main"></main>
</div>
<div class="kpop" id="kpop" role="listbox" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="dev" id="dev" aria-label="Prototype controls">
  <b>Prototype</b>
  <span class="seg" id="devver"><button data-dev="ver" data-v="v2">v2</button><button data-dev="ver" data-v="v3">v3</button></span>
  <span class="sep"></span>
  <span>Machine</span><span class="seg" id="devm"><button data-dev="m" data-v="mm">MM</button><button data-dev="m" data-v="md">MD</button></span>
  <span class="sep"></span>
  <button data-dev="plug" data-v="tr06" id="plug-tr06"></button>
  <button data-dev="plug" data-v="beatstep" id="plug-beatstep"></button>
  <button data-dev="daw" id="dev-daw">DAW plug-in</button>
  <span class="sep"></span>
  <button data-dev="hit" data-v="36" title="The TR-06 plays BD (note 36)">Hit BD</button>
  <button data-dev="hit" data-v="42" title="The TR-06 plays CH (note 42)">Hit CH</button>
  <button data-dev="bs" title="The BeatStep sends CC 77 (a control the editor has not seen yet)">BeatStep: new knob</button>
  <span class="hint" id="devhint"></span>
</div>

<script>
"use strict";
/* ============================================================================================
   Fake data. Parameter names are the machines' own (elektronData/mmMachines.cpp, mdMachines.cpp).
   ============================================================================================ */
const MM_SYN = {
	"SWAVE-SAW": ["UNIL", "UNIW", "UNIX", "", "SUBX", "SUB1", "SUB2", "TUNE"],
	"FX-CHORUS": ["DEL", "DEP", "SPD", "MIX", "FB", "WID", "LP", "INP"],
	"SID-6581": ["PW", "PWAD", "PWRS", "WAVE", "MOD", "MSRC", "MFRQ", "TUNE"],
	"VO-6": ["VOC1", "VOC2", "V-SW", "VOIC", "CONS", "CLEN", "CVOL", "TUNE"],
	"DPRO-BBOX": ["PTCH", "STRT", "", "", "RTRG", "RTIM", "", ""],
	"FX-REVERB": ["DEC", "DAMP", "GATE", "MIX", "HP", "LP", "", "INP"]
};
const MM_FIXED = { AMP: ["ATK", "HOLD", "DEC", "REL", "DIST", "VOL", "PAN", "PORT"], FLT: ["BASE", "WDTH", "HPQ", "LPQ", "ATK", "DEC", "BOFS", "WOFS"], EFX: ["EQF", "EQG", "SRR", "DTIM", "DSND", "DFB", "DBAS", "DWID"] };
const MD_SYN = {
	"TRX-BD": ["PTCH", "DEC", "RAMP", "RDEC", "STRT", "NOIS", "HARM", "CLIP"], "TRX-B2": ["PTCH", "DEC", "RAMP", "HOLD", "TICK", "NOIS", "DIRT", "DIST"],
	"TRX-SD": ["PTCH", "DEC", "BUMP", "BENV", "SNAP", "TONE", "TUNE", "CLIP"], "TRX-XT": ["PTCH", "DEC", "RAMP", "RDEC", "DAMP", "DIST", "DTYP", ""],
	"TRX-CP": ["CLPY", "TONE", "HARD", "RICH", "RATE", "ROOM", "RSIZ", "RTUN"], "TRX-RS": ["PTCH", "DEC", "DIST", "", "", "", "", ""],
	"TRX-CB": ["PTCH", "DEC", "ENH", "DAMP", "TONE", "BUMP", "", ""], "TRX-CH": ["GAP", "DEC", "HPF", "LPF", "MTAL", "", "", ""],
	"TRX-OH": ["GAP", "DEC", "HPF", "LPF", "MTAL", "", "", ""], "TRX-CY": ["RICH", "DEC", "TOP", "TTUN", "SIZE", "PEAK", "", ""],
	"EFM-BD": ["PTCH", "DEC", "RAMP", "RDEC", "MOD", "MFRQ", "MDEC", "MFB"], "EFM-SD": ["PTCH", "DEC", "NOISE", "NDEC", "MOD", "MFRQ", "MDEC", "HPF"],
	"EFM-HH": ["PTCH", "DEC", "TREM", "TFRQ", "MOD", "MFRQ", "MDEC", "FB"], "EFM-CB": ["PTCH", "DEC", "SNAP", "FB", "MOD", "MFRQ", "MDEC", ""],
	"E12-BD": ["PTCH", "DEC", "SNAP", "SPLEN", "START", "RTRG", "RTIM", "BEND"]
};
const MD_FX = ["AMD", "AMF", "EQF", "EQG", "FLTF", "FLTW", "FLTQ", "SRR"], MD_RT = ["DIST", "VOL", "PAN", "DEL", "REV", "LFOS", "LFOD", "LFOM"];
const KIT = {
	mm: ["SWAVE-SAW", "FX-CHORUS", "SID-6581", "VO-6", "DPRO-BBOX", "FX-REVERB"],
	md: ["TRX-BD", "TRX-SD", "TRX-XT", "TRX-XT", "TRX-CY", "TRX-OH", "TRX-CH", "TRX-CP", "TRX-RS", "TRX-CB", "EFM-BD", "EFM-SD", "EFM-HH", "EFM-CB", "E12-BD", "TRX-B2"]
};
const short = m => m.replace("SWAVE-", "SW-").replace("DPRO-", "DP-");

/* the parameters a target can be, grouped as the page shows them; pid "PG.i" */
function paramGroups(m, t) {
	const mach = KIT[m][t];
	if (m === "mm") return [
		["SYN", MM_SYN[mach].map((n, i) => ["SYN." + i, n, "SYN " + "ABCDEFGH"[i]])],
		...Object.entries(MM_FIXED).map(([pg, a]) => [pg, a.map((n, i) => [pg + "." + i, n, pg + " " + n])]),
		["OTHER", [["LEV.0", "LEVEL", "LEVEL"], ["NOTE.0", "NOTE", "NOTE"]]]
	];
	return [
		["SYN", MD_SYN[mach].map((n, i) => ["SYN." + i, n, "SYN " + (i + 1)])],
		["FX", MD_FX.map((n, i) => ["FX." + i, n, n])],
		["ROUTE", MD_RT.map((n, i) => ["RT." + i, n, n])],
		["OTHER", [["LEV.0", "LEVEL", "LEVEL"], ["NOTE.0", "NOTE", "NOTE"]]]
	];
}
/* a parameter's name on track t: the machine's own name, and the slot where it differs ("UNIL", "SYN A · UNIL") */
function pinfo(m, t, pid) {
	for (const [, list] of paramGroups(m, t)) for (const [id, own, slot] of list) if (id === pid) {
		if (pid === "NOTE.0") {
			if (m === "mm") return { own: "NOTE", long: "NOTE · voices' pitch", ok: true };
			const p = MD_SYN[KIT.md[t]].findIndex(n => n === "PTCH" || n === "TUNE");
			return p < 0 ? { own: "NOTE", long: "NOTE · no pitch on this machine", ok: false } : { own: MD_SYN[KIT.md[t]][p], long: "NOTE · " + MD_SYN[KIT.md[t]][p], ok: true };
		}
		if (!own) return { own: "—", long: slot + " · unused on " + KIT[m][t], ok: false };
		return { own, long: pid.startsWith("SYN") && own !== slot ? slot + " · " + own : slot, ok: true };
	}
	return { own: "?", long: pid, ok: false };
}

/* the TR-06's controls, from Roland's MIDI Implementation Chart v1.00, grouped by function */
const TR06_GROUPS = [
	["Instrument level", [[71, "ACC LEVEL"], [24, "BD LEVEL"], [29, "SD LEVEL"], [51, "LT LEVEL"], [54, "HT LEVEL"], [85, "CY LEVEL"], [82, "OH LEVEL"], [63, "CH LEVEL"]]],
	["Effect", [[17, "DRIVE"], [18, "DELAY TIME"], [19, "DELAY DEPTH"]]],
	["Tune", [[20, "BD TUNE"], [25, "SD TUNE"], [49, "LT TUNE"], [52, "HT TUNE"], [83, "CY TUNE"], [80, "OH TUNE"], [61, "CH TUNE"]]],
	["Decay", [[23, "BD DECAY"], [28, "SD DECAY"], [50, "LT DECAY"], [53, "HT DECAY"], [84, "CY DECAY"], [81, "OH DECAY"], [62, "CH DECAY"]]],
	["Tone", [[21, "BD ATTACK"], [26, "SD SNAPPY"], [92, "LT COLOR"], [94, "HT COLOR"]]],
	["Comp", [[22, "BD COMP"], [27, "SD COMP"]]],
	["Delay send", [[96, "BD DELAY SEND"], [97, "SD DELAY SEND"], [103, "LT DELAY SEND"], [104, "HT DELAY SEND"], [109, "CY DELAY SEND"], [108, "OH DELAY SEND"], [107, "CH DELAY SEND"], [111, "MIX IN DELAY SEND"]]],
	["Other", [[12, "MIX IN LVL"], [113, "MASTER PROB"]]]
];
const TR06_CC = {};
for (const [, list] of TR06_GROUPS) for (const [cc, label] of list) TR06_CC[cc] = label;
const VOICES = [["BD", "BASS DRUM", [36, 35]], ["SD", "SNARE DRUM", [38, 40]], ["LT", "LOW TOM", [47, 45]], ["HT", "HIGH TOM", [50, 48]], ["CY", "CYMBAL", [49]], ["OH", "OPEN HIHAT", [46]], ["CH", "CLOSED HIHAT", [42, 44]]];

/* ============================================================================================
   State. A mapping is per editor (the MD Editor and the MM Editor each keep their own), per device.
   ============================================================================================ */
const tgt = (p, lo = 0, hi = 127, o = {}) => Object.assign({ t: "sel", p, lo, hi, inv: false }, o);
function defaults(m) {
	const mm = m === "mm";
	const tr06 = {};
	[24, 29, 51, 54, 85, 82, 63].forEach((cc, i) => tr06["cc:" + cc] = { targets: [tgt("SYN." + i)] });
	tr06["cc:71"] = { targets: [tgt("NOTE.0", 48, 72)] };
	if (mm) {
		/* DRIVE as a macro: three parameters, one of them inverted, one on a pinned track */
		tr06["cc:17"] = { targets: [tgt("FLT.0", 20, 110), tgt("AMP.4", 0, 80), tgt("EFX.2", 60, 127, { inv: true, t: 1 })] };
		tr06["cc:18"] = { targets: [tgt("FLT.1")] };
		tr06["cc:19"] = { targets: [tgt("LEV.0")] };
		tr06["cc:20"] = { targets: [tgt("SYN.7", 40, 88)] };
		tr06["cc:80"] = { targets: [tgt("AMP.3", 0, 127, { t: 5 })] };	/* pinned: OH TUNE moves track 6's AMP REL */
	} else {
		tr06["cc:17"] = { targets: [tgt("RT.0", 0, 96), tgt("FX.7", 0, 60)] };
		tr06["cc:18"] = { targets: [tgt("RT.3")] };
		tr06["cc:19"] = { targets: [tgt("RT.4")] };
		tr06["cc:20"] = { targets: [tgt("SYN.0", 0, 127, { t: 0 })] };
		tr06["cc:61"] = { targets: [tgt("SYN.2", 0, 127, { t: 6 })] };
	}
	tr06["cc:113"] = { role: "amount", set: "rs1", targets: [] };
	const beatstep = {
		"cc:10": { targets: [tgt(mm ? "FLT.0" : "FX.4")] },
		"cc:74": { targets: [tgt(mm ? "FLT.1" : "FX.5", 0, 127, { inv: true })] },
		"note:51": { role: "roll", set: "rs1", targets: [] }
	};
	/* MIDI Learn mappings made before the configurator: CC → one target, from any input (they keep working) */
	const any = { "cc:21": { targets: [tgt(mm ? "FLT.1" : "FX.4", 0, 127, { t: mm ? 0 : 1 })], legacy: true }, "cc:22": { targets: [tgt(mm ? "EFX.4" : "RT.3", 0, 127, { t: 2, inv: true })], legacy: true } };
	const sets = [
		{ id: "rs1", name: mm ? "Timbre" : "Tone", t: "sel", params: mm ? ["SYN.0", "SYN.1", "SYN.4", "FLT.0", "FLT.1", "FLT.3"] : ["SYN.1", "SYN.2", "SYN.3", "FX.4", "FX.5"], amount: 35, how: "around", last: [] },
		{ id: "rs2", name: "Envelope", t: "sel", params: mm ? ["AMP.0", "AMP.2", "AMP.3", "FLT.4", "FLT.5"] : ["SYN.1", "RT.0"], amount: 60, how: "anywhere", last: [] }
	];
	return { tr06, beatstep, any, sets };
}
const S = {
	ver: "v3", pop: null,

	const h = e.target.closest(".range");
	if (h) {
		const { id, map } = curCtl(), k = +h.dataset.k, x = map[id].targets[k];
		const r = h.getBoundingClientRect(), at = Math.round((e.clientX - r.left) / r.width * 127);
		const lo = Math.min(x.lo, x.hi), hi = Math.max(x.lo, x.hi);
		const which = e.target.dataset.h || (Math.abs(at - lo) < Math.abs(at - hi) ? "lo" : "hi");
		dragging = { kind: "range", el: h, k, which, lo, hi };
		h.setPointerCapture(e.pointerId); e.preventDefault(); moveRange(e); return;
	}
	const b = e.target.closest("#amtbar");
	if (b) { dragging = { kind: "amt", el: b }; b.setPointerCapture(e.pointerId); moveAmt(e); e.preventDefault(); return; }
	const c3 = e.target.closest("[data-cell3]");
	if (c3 && !e.target.closest("#pop3")) { const d = S.view, id = c3.dataset.cell3; dragging = { kind: "cell3", id, d, x: e.clientX, v0: S.inv[d + "|" + id] ?? 64, moved: false }; return; }
	const p = e.target.closest("[data-hit]");
	if (p) { incoming(S.view, p.dataset.hit, 100); e.preventDefault(); return; }
	const g = e.target.closest("[data-knob]");
	if (g) { const d = S.view, id = g.dataset.knob; dragging = { kind: "knob", id, d, x: e.clientX, v0: S.inv[d + "|" + id] ?? 64, moved: false }; e.preventDefault(); }
});
document.addEventListener("pointermove", e => {
	if (!dragging) return;
	if (dragging.kind === "range") moveRange(e);
	else if (dragging.kind === "amt") moveAmt(e);
	else if (dragging.kind === "cell3") {
		const dx = e.clientX - dragging.x; if (Math.abs(dx) < 4 && !dragging.moved) return;
		if (!dragging.moved && isPad(dragging.id)) { dragging.moved = true; incoming(dragging.d, dragging.id, 100); return; }
		dragging.moved = true; if (isPad(dragging.id)) return;
		const v = Math.max(0, Math.min(127, Math.round(dragging.v0 + dx * .7)));
		if (v !== S.inv[dragging.d + "|" + dragging.id]) incoming(dragging.d, dragging.id, v);
	}
	else if (dragging.kind === "knob") {
		const dx = e.clientX - dragging.x; if (Math.abs(dx) < 3 && !dragging.moved) return;
		dragging.moved = true;
		const v = Math.max(0, Math.min(127, Math.round(dragging.v0 + dx * .7)));
		if (v !== S.inv[dragging.d + "|" + dragging.id]) incoming(dragging.d, dragging.id, v);
	}
});
document.addEventListener("pointerup", () => {
	if (!dragging) return;
	const was = dragging; dragging = null;
	if (was.kind === "cell3") { if (was.moved) { suppress3 = true; setTimeout(() => suppress3 = false, 0); } return; }
	if (was.kind === "range" || was.kind === "amt" || (was.kind === "knob" && was.moved)) render();
});
function moveRange(e) {
	const { id, map } = curCtl(), x = map[id].targets[dragging.k], r = dragging.el.getBoundingClientRect();
	const at = Math.max(0, Math.min(127, Math.round((e.clientX - r.left) / r.width * 127)));
	if (dragging.which === "lo") dragging.lo = Math.min(at, dragging.hi); else dragging.hi = Math.max(at, dragging.lo);
	x.lo = dragging.lo; x.hi = dragging.hi;
	const card = dragging.el.closest(".tcard"), lo = dragging.lo, hi = dragging.hi;
	card.querySelector(".rf").style.cssText = `left:${lo / 127 * 100}%;width:${(hi - lo) / 127 * 100}%`;
	card.querySelector('[data-h="lo"]').style.left = lo / 127 * 100 + "%"; card.querySelector('[data-h="hi"]').style.left = hi / 127 * 100 + "%";
	const bs = card.querySelectorAll(".rnums b"); bs[0].textContent = lo; bs[1].textContent = hi;
	const mx = $("#mx"); if (mx) mx.innerHTML = matrixInner(S.view);
	if (S.ver === "v3") { const g = $("#g3"); if (g) g.innerHTML = S.view === "tr06" ? grid3Inner() : gen3Inner(S.view); }
}
function moveAmt(e) {
	const s = curSet(), r = dragging.el.getBoundingClientRect();
	s.amount = Math.max(0, Math.min(100, Math.round((e.clientX - r.left) / r.width * 100)));
	[...dragging.el.children].forEach((c, i) => c.classList.toggle("on", i < Math.round(s.amount / 100 * 16)));
	$("#amtv").textContent = s.amount + "%";
}

/* the prototype's own controls: hot-plug, the DAW, the machine, simulated hardware */
function devAction(el) {
	const a = el.dataset.dev, v = el.dataset.v;
	if (a === "m") { S.m = v; S.sel = Math.min(S.sel, tracks() - 1); S.pop = null; }
	else if (a === "ver") { S.ver = v; S.pop = null; }
	else if (a === "plug") {
		S.conn[v] = !S.conn[v];
		toast(DEVICES[v].name + (S.conn[v] ? " connected" : " disconnected · its mapping is kept"));
		if (!S.conn[v] && S.view === v) S.view = "";
	}
	else if (a === "daw") { S.daw = !S.daw; S.view = ""; }
	else if (a === "hit") { if (S.conn.tr06 && !S.daw) hitVoice(+v); else toast("The TR-06 is not connected."); return; }
	else if (a === "bs") { if (!S.conn.beatstep || S.daw) { toast("The BeatStep is not connected."); return; } if (!S.enabled.beatstep) { toast("The BeatStep is not enabled in AUDIO / MIDI: nothing arrives."); return; } incoming("beatstep", "cc:77", 30 + Math.floor(Math.random() * 60)); render(); return; }
	render();
}

render();
</script>
