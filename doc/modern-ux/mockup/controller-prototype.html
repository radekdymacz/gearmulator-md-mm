<!doctype html>
<html lang="en" data-m="mm">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>Controller Configurator</title>
<!-- Clickable prototype of the CONTROL workspace's controller configurator (doc/modern-ux/DESIGN-controller-ux.md).
     Fake data only, no host. One file: open it from file:// or any static server. The fonts are the pages' own
     (skins/mdStudio/fonts, relative to this file inside the repo), with the mockups' Google Fonts link as a fallback.
     Nothing here is product code. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=Silkscreen&display=swap">
<style>
@font-face{font-family:"Barlow Condensed";font-weight:500;src:url("../../../source/elektron/md/mdJucePlugin/skins/mdStudio/fonts/BarlowCondensed-Medium.ttf") format("truetype")}
@font-face{font-family:"Barlow Condensed";font-weight:600 700;src:url("../../../source/elektron/md/mdJucePlugin/skins/mdStudio/fonts/BarlowCondensed-SemiBold.ttf") format("truetype")}
@font-face{font-family:"IBM Plex Mono";font-weight:400;src:url("../../../source/elektron/md/mdJucePlugin/skins/mdStudio/fonts/IBMPlexMono-Regular.ttf") format("truetype")}
@font-face{font-family:"IBM Plex Mono";font-weight:500 700;src:url("../../../source/elektron/md/mdJucePlugin/skins/mdStudio/fonts/IBMPlexMono-Medium.ttf") format("truetype")}
@font-face{font-family:"Silkscreen";font-weight:400 700;src:url("../../../source/elektron/md/mdJucePlugin/skins/mdStudio/fonts/Silkscreen-Regular.ttf") format("truetype")}

/* ===== tokens: the Monomachine Editor's SFX-60 plate and the Machinedrum Editor's MKII plate, as shipped ===== */
:root{
  --sans:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --pix:"Silkscreen",ui-monospace,monospace;
}
:root[data-m="mm"]{
  color-scheme:light;
  --plate:#d4d5d0;--plate2:#c8cac2;--plate3:#e2e1d9;--print:#383934;--print2:#56574f;--print3:#74756f;--rule:#aaaba5;--body:#292a26;
  --key:#3a3b36;--key2:#4b4d47;--keytext:#efefe8;--keydim:#aeb0a8;--cream:#efefe8;--creamtext:#292a26;
  --led:#e65d42;--ledoff:#7b4035;--ledg:#9fc568;--rec:#cf4f39;
  --lcd:#b9c4b0;--ink:#172014;--bezel:#0d0f0c;--rust:#a04d39;--oxblood:var(--rust);
}
:root[data-m="md"]{
  color-scheme:dark;
  --plate:#161716;--plate2:#0f100f;--plate3:#232422;--print:#f1f0ea;--print2:#c9c8c1;--print3:#94938c;--rule:#5d5e59;--body:#ecebe5;
  --key:#232423;--key2:#30312f;--keytext:#ecebe5;--keydim:#8f908b;--cream:#ece6d6;--creamtext:#1f1e1b;
  --led:#ff3b2f;--ledoff:#4d1714;--ledg:#9fc568;--rec:#e0472e;
  --lcd:#ef5a39;--ink:#3a0e08;--bezel:transparent;--rust:#ee613f;--oxblood:#ee613f;
}

/* ===== the pages' base (mmStudio.css / mdDesk.css) ===== */
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--plate)}
body{color:var(--body);font:500 15px/1.35 var(--sans);padding:14px 16px 90px;margin:0}
button,select,input{font:inherit;color:inherit}
button{background:var(--key);color:var(--keytext);border:0;border-radius:3px;padding:5px 11px;cursor:pointer;font-weight:600;letter-spacing:.04em;box-shadow:inset 0 -2px 0 rgba(0,0,0,.35)}
button:hover{background:var(--key2)}
button:active{box-shadow:none;transform:translateY(1px)}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:2px solid var(--led);outline-offset:2px}
select{background:var(--plate3);border:1px solid var(--rule);border-radius:3px;padding:4px 8px;color:var(--print)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.note{font-size:14px;color:var(--print2)}
.app{max-width:1600px;margin:0 auto;display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.led{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ledoff);flex:none;vertical-align:middle}
.led.on{background:var(--led);box-shadow:0 0 6px 1px var(--led)}
.led.g.on{background:var(--ledg);box-shadow:0 0 6px 1px var(--ledg)}
.card{border-top:2px solid var(--print);padding-top:8px;display:grid;gap:10px;align-content:start;min-width:0}
.card header{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.card h3,.cap{margin:0;font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--print)}
.card header span{font:12px var(--mono);color:var(--print3)}
.ilab{font:600 11px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--print2)}
.amkey{height:26px;padding:0 10px;font:600 11px var(--sans);letter-spacing:.12em;white-space:nowrap;text-transform:uppercase;display:inline-flex;align-items:center;gap:6px}
.amkey[aria-pressed=true]{background:var(--cream);color:var(--creamtext)}
.amkey .led{width:7px;height:7px}
.chip{padding:3px 10px;font:500 12px var(--mono);letter-spacing:0}
.chip[aria-pressed=true]{background:var(--cream);color:var(--creamtext)}
.toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:var(--lcd);color:var(--ink);font:12px var(--pix);padding:10px 16px;border-radius:3px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40;box-shadow:0 0 0 3px var(--key)}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* top bar: brand, workspace keys, the LCD, setup keys */
.top{display:grid;grid-template-columns:auto 1fr auto;gap:12px 22px;align-items:end;padding:4px 0 12px;border-bottom:2px solid var(--print)}
.top .left{display:flex;gap:18px;align-items:end}
.brand{display:grid;gap:4px}
.brand b{font:600 22px/1 var(--sans);letter-spacing:.08em;color:var(--print)}
.brand small{font:600 12px var(--sans);letter-spacing:.5em;color:var(--oxblood);text-transform:uppercase}
.wsgroup{display:grid;justify-items:center;gap:4px}
.grplabel{font:600 10px var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--print);display:flex;align-items:center;gap:8px;width:100%}
.grplabel::before,.grplabel::after{content:"";flex:1;height:6px;border-top:1px solid var(--print)}
.grplabel::before{border-left:1px solid var(--print)}.grplabel::after{border-right:1px solid var(--print)}
.tabs{display:flex;gap:5px}
.tabs button{position:relative;display:grid;justify-items:center;gap:4px;padding:6px 12px 7px;font:600 12px var(--sans);letter-spacing:.12em;text-transform:uppercase}
.tabs button .led{width:7px;height:7px}
.tabs button small{position:absolute;right:4px;top:3px;font:10px var(--mono);letter-spacing:0;opacity:.55}
.tabs button[aria-selected=true]{background:var(--cream);color:var(--creamtext)}
.tabs button[aria-selected=true] .led{background:var(--led);box-shadow:0 0 6px 1px var(--led)}
.lcdpanel{display:flex;justify-self:center;background:var(--lcd);color:var(--ink);border-radius:4px;padding:5px 4px;box-shadow:0 0 0 3px var(--bezel),inset 0 0 0 1px color-mix(in srgb,var(--ink) 14%,transparent);user-select:none}
.lcdpanel .f{display:grid;gap:1px;padding:0 9px;border-left:1px solid color-mix(in srgb,var(--ink) 35%,transparent)}
.lcdpanel .f:first-child{border-left:0}
.lcdpanel small{font:9px var(--pix);letter-spacing:.04em;text-transform:uppercase;opacity:.8}
.lcdpanel b{font:14px var(--pix);font-weight:400;white-space:nowrap}
@media (max-width:1400px){.top{grid-template-columns:auto 1fr}.top .setkeys{display:none}}
@media (max-width:1100px){.top{grid-template-columns:1fr}.lcdpanel{justify-self:start}}
@media (max-width:1060px){.lcdpanel .f.opt{display:none}}

/* key-style dropdowns (enhanceSelects / openK / #kpop, as on the pages) */
.kselbtn{display:flex;align-items:center;justify-content:space-between;gap:10px;height:28px;padding:0 10px;font:500 13px var(--sans);letter-spacing:.03em;min-width:0;width:100%}
.kselbtn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kselbtn svg{width:10px;height:6px;flex:none}
.kselbtn[aria-expanded=true]{background:var(--key2)}
.kpop{position:absolute;z-index:25;padding:8px;background:var(--plate);border:2px solid var(--print);border-radius:6px;box-shadow:0 14px 34px rgba(0,0,0,.35);max-width:calc(100vw - 32px)}
.klist{display:grid;gap:3px}
.kgrp{grid-column:1/-1;font:600 10px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--print);padding:6px 2px 2px}
.kopt{text-align:left;height:28px;padding:0 9px;font:500 13px var(--sans);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kopt[aria-selected=true]{background:var(--cream);color:var(--creamtext)}

/* ===== the CONTROL workspace: devices ===== */
.ctlhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.ctlhead h3{margin:0;font:600 15px var(--sans);letter-spacing:.06em;color:var(--print)}
.devs{min-height:56vh;display:grid;place-content:center;justify-items:center;gap:18px;text-align:center}
.devs .ctlhead{justify-content:center}
.ctltiles{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;max-width:900px}
.ctltile{width:200px;display:flex;flex-direction:column;align-items:center;gap:7px;padding:16px 10px 12px;border:1px solid var(--rule);border-radius:4px;background:transparent;color:var(--body);box-shadow:none;font:600 12px var(--sans)}
.ctltile:hover,.ctltile:focus-visible{border-color:var(--print);background:transparent;outline:none}
.ctltile svg{width:104px;height:60px;color:var(--print)}
.ctltile .tname{font:600 14px var(--sans);letter-spacing:.04em;color:var(--print)}
.ctltile .tstate{display:flex;align-items:center;gap:6px;font:600 10px var(--pix);text-transform:uppercase;color:var(--print2)}
.ctltile.virt{border-style:dashed}
.ctltile.dis{opacity:.62}
.empty{display:grid;justify-items:center;gap:12px;max-width:520px;padding:26px 28px;border:1px dashed var(--rule);border-radius:6px}
.empty svg{width:120px;height:70px;color:var(--print3)}
.empty h4{margin:0;font:600 18px var(--sans);letter-spacing:.06em;color:var(--print)}
.empty ol{margin:0;padding-left:20px;text-align:left;color:var(--print2);font-size:14px;display:grid;gap:3px}
.devfoot{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}

/* ===== a device's configurator ===== */
.cfg{display:grid;gap:14px}
.cfgbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding-bottom:10px;border-bottom:1px solid var(--rule)}
.cfgbar .kselbtn{width:100%}
.cfgbar .grow{flex:1}
.trackstrip{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.tp{display:grid;justify-items:center;gap:2px;min-width:44px;height:38px;padding:3px 6px;font:500 11px var(--mono);letter-spacing:0}
.tp small{font:500 9px var(--sans);letter-spacing:.06em;opacity:.8;max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tp[aria-pressed=true]{background:var(--cream);color:var(--creamtext)}
.md .tp{min-width:34px;padding:3px 3px}
.cfggrid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(330px,1fr);gap:18px;align-items:start}
@media (max-width:1180px){.cfggrid{grid-template-columns:minmax(0,1fr)}}

/* the drawing */
.panelwrap{background:var(--plate2);border-radius:6px;padding:8px;box-shadow:inset 0 0 0 1px var(--rule)}
svg.front{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none;touch-action:none}
.front text{font-family:var(--sans);font-weight:600;letter-spacing:.08em;fill:var(--print)}
.front .body{fill:var(--plate3);stroke:var(--print);stroke-width:2}
.front .strip{fill:var(--key)}
.front .striptext{fill:var(--keytext)}
.front .ctl{cursor:pointer}
.front .ctl .cap0{fill:var(--key);stroke:var(--print);stroke-width:1.5}
.front .ctl .ptr{stroke:var(--keytext);stroke-width:2.5;stroke-linecap:round}
.front .ctl .arc{fill:none;stroke:var(--rule);stroke-width:3}
.front .ctl .arcv{fill:none;stroke:var(--print);stroke-width:3}
.front .ctl .lab{font-size:11px}
.front .ctl .labbg{fill:transparent}
.front .ctl .cc{font:500 9px var(--mono);letter-spacing:0;fill:var(--print3)}
.front .ctl .mapled{fill:var(--ledoff)}
.front .ctl.mapped .mapled{fill:var(--led)}
.front .ctl .badge{font:600 9px var(--mono);letter-spacing:0;fill:var(--creamtext)}
.front .ctl .badgebg{fill:var(--cream);stroke:var(--print);stroke-width:1}
.front .ctl:hover .cap0{stroke-width:2.5}
.front .ctl.sel .labbg{fill:var(--cream)}
.front .ctl.sel .lab{fill:var(--creamtext)}
.front .ctl.sel .ring{stroke:var(--print);stroke-width:2;fill:none;stroke-dasharray:3 3}
.front .ctl.hot .hotring{fill:none;stroke:var(--led);stroke-width:3}
.front .ctl.hot .val{fill:var(--led)}
.front .ctl .val{font:600 10px var(--mono);letter-spacing:0;fill:transparent}
.front .ctl.dead{cursor:help;opacity:.38}
.front .ctl.dead .cap0{fill:none;stroke-dasharray:3 2}
.front .ctl.unk .cap0{stroke-dasharray:4 2}
.front .pad0{fill:var(--key);stroke:var(--print);stroke-width:1.2}
.front .ctl.hot .pad0{fill:var(--led)}
.front .ctl.sel .pad0{stroke-width:2.5;stroke:var(--print)}
.front .step0{fill:var(--key2);stroke:var(--print3);stroke-width:1.2}
.front .stepled{fill:var(--ledoff)}
.front .dim{fill:var(--print3)}
.layers{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:8px 2px 2px}
.seg{display:inline-flex;gap:3px;flex-wrap:wrap}
.seg button{height:26px;padding:0 9px;font:600 11px var(--sans);letter-spacing:.1em;text-transform:uppercase}
.seg button[aria-pressed=true]{background:var(--cream);color:var(--creamtext)}
.other{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin:6px 2px 0}

/* voices: the instrument row onto the machine's tracks */
.voices{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.vk{display:grid;gap:3px;justify-items:center;padding:6px 4px;height:auto;font:600 12px var(--sans);letter-spacing:.1em}
.vk small{font:500 10px var(--mono);letter-spacing:0;opacity:.75}
.vk .to{font:500 11px var(--mono);letter-spacing:0;background:var(--lcd);color:var(--ink);border-radius:2px;padding:1px 5px}
.vk[aria-pressed=true]{background:var(--cream);color:var(--creamtext)}
.vk.hot .to{box-shadow:0 0 0 2px var(--led)}
@media (max-width:700px){.voices{grid-template-columns:repeat(4,minmax(0,1fr))}}

/* generic: controls seen */
.seen{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;padding:10px;background:var(--plate2);border-radius:6px;box-shadow:inset 0 0 0 1px var(--rule)}
.seen .sc{position:relative;display:grid;justify-items:center;gap:3px;padding:8px 4px 6px;height:auto;font:600 11px var(--sans);letter-spacing:.06em}
.seen .sc svg{width:34px;height:34px}
.seen .sc small{font:500 10px var(--mono);letter-spacing:0;opacity:.75}
.seen .sc[aria-pressed=true]{background:var(--cream);color:var(--creamtext)}
.seen .sc.hot{box-shadow:inset 0 -2px 0 rgba(0,0,0,.35),0 0 0 2px var(--led)}
.seen .sc .mled{position:absolute;left:6px;top:6px;width:6px;height:6px}
.seen .sc .bdg{position:absolute;right:5px;top:4px;font:600 9px var(--mono)}
.seen .ghost{border:1px dashed var(--rule);background:transparent;color:var(--print2);box-shadow:none}
.seen .sep{grid-column:1/-1;font:600 10px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--print2);padding-top:4px}
@media (max-width:760px){.seen{grid-template-columns:repeat(4,minmax(0,1fr))}}
.learnline{display:flex;align-items:center;gap:8px;margin:0;padding:6px 10px;border-radius:3px;background:var(--lcd);color:var(--ink);font:12px var(--pix)}

/* the inspector */
.insp{position:sticky;top:10px}
.ihead{display:grid;gap:6px}
.ititle{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.ititle b{font:600 18px var(--sans);letter-spacing:.05em;color:var(--print)}
.ititle span{font:12px var(--mono);color:var(--print3)}
.readout{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;background:var(--lcd);color:var(--ink);border-radius:4px;padding:7px 10px;box-shadow:0 0 0 3px var(--bezel);font:12px var(--pix)}
.readout small{font:9px var(--pix);opacity:.75;text-transform:uppercase;align-self:center}
.readout b{font:13px var(--pix);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.irow{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap}
.irow .ilab{min-width:52px}
.tcards{display:grid;gap:8px}
.tcard{display:grid;gap:6px;padding:8px;border:1px solid var(--rule);border-radius:4px;background:var(--plate3)}
.tcard .trow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:5px;align-items:center}
.tcard .trow .kselbtn{height:26px}
.tpin{height:26px;padding:0 8px;font:500 11px var(--mono);letter-spacing:0;min-width:56px}
.tpin.pinned{background:var(--cream);color:var(--creamtext)}
.xkey{width:26px;height:26px;padding:0;font:600 13px var(--mono)}
.range{position:relative;height:26px;margin:0 8px;touch-action:none;cursor:pointer}
.range .rt{position:absolute;left:0;right:0;top:11px;height:4px;border-radius:2px;background:var(--rule)}
.range .rf{position:absolute;top:9px;height:8px;border-radius:2px;background:var(--print2)}
.range .rf.inv{background:repeating-linear-gradient(90deg,var(--print2) 0 6px,transparent 6px 9px)}
.range .rn{position:absolute;top:4px;width:3px;height:18px;margin-left:-1px;background:var(--led);border-radius:1px}
.range .rh{position:absolute;top:3px;width:14px;height:20px;margin-left:-7px;border-radius:3px;background:var(--key);box-shadow:inset 0 -2px 0 rgba(0,0,0,.35),0 0 0 1px var(--plate3);cursor:ew-resize}
.range .rh::after{content:attr(data-l);position:absolute;top:-1px;left:0;right:0;text-align:center;font:600 8px/20px var(--mono);color:var(--keytext)}
.rnums{display:flex;justify-content:space-between;font:11px var(--mono);color:var(--print2);gap:6px}
.rnums b{color:var(--body);font-weight:500}
.rnums .now{color:var(--led)}
.addrow{display:flex;gap:6px;flex-wrap:wrap}
.pchips{display:grid;gap:6px}
.pchips .grp{display:flex;flex-wrap:wrap;gap:3px;align-items:center}
.pchips .grp .ilab{min-width:44px}
.pchips .chip{min-width:48px}
.explain{margin:0;font-size:13px;color:var(--print2)}
.explain b{color:var(--body);font-weight:600}
.warnline{margin:0;padding:6px 10px;border-radius:3px;background:var(--rec);color:#fff;font:600 12px var(--sans)}
.segbar{display:inline-flex;gap:1px;padding:3px;background:var(--key);border-radius:3px;cursor:pointer;touch-action:none;box-shadow:inset 0 -2px 0 rgba(0,0,0,.35)}
.segbar i{width:6px;height:12px;border-radius:1px;background:var(--ledoff)}
.segbar i.on{background:var(--led);box-shadow:0 0 4px var(--led)}

/* the monitor: one LCD strip */
.monstrip{display:flex;align-items:stretch;gap:8px}
.monlcd{flex:1;min-width:0;display:flex;gap:0;overflow:hidden;background:var(--lcd);color:var(--ink);border-radius:4px;box-shadow:0 0 0 3px var(--bezel);padding:5px 4px;font:11px var(--pix)}
.monlcd .ev{display:grid;gap:1px;padding:0 9px;border-left:1px solid color-mix(in srgb,var(--ink) 35%,transparent);white-space:nowrap}
.monlcd .ev:first-child{border-left:0}
.monlcd .ev small{font:9px var(--pix);opacity:.75}
.monlcd .ev.off{opacity:.5}
.monlcd .none{padding:0 9px;align-self:center}

/* the prototype's own controls (not part of the design) */
.dev{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:8px 16px;background:repeating-linear-gradient(135deg,#2a2a26 0 10px,#26261f 10px 20px);color:#e9e6da;font:600 11px var(--sans);letter-spacing:.1em;text-transform:uppercase;border-top:2px solid #d9b44a}
.dev b{color:#d9b44a;letter-spacing:.18em}
.dev button{height:24px;padding:0 9px;font:600 11px var(--sans);letter-spacing:.08em;background:#44443c;color:#f1eee2;box-shadow:none}
.dev button[aria-pressed=true]{background:#d9b44a;color:#1d1c17}
.dev .sep{width:1px;height:18px;background:#6a6a5e}
.dev .hint{font:500 12px var(--sans);letter-spacing:.02em;text-transform:none;color:#cfcab8}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="left"><div class="brand" id="brand"></div>
    <div class="wsgroup"><span class="grplabel">Workspace</span>
      <nav class="tabs" id="tabs" aria-label="Workspaces (prototype: only CONTROL)"></nav>

	const mach = KIT[m][t];

		["SYN", MM_SYN[mach].map((n, i) => ["SYN." + i, n, "SYN " + "ABCDEFGH"[i]])],

		["SYN", MD_SYN[mach].map((n, i) => ["SYN." + i, n, "SYN " + (i + 1)])],
		["FX", MD_FX.map((n, i) => ["FX." + i, n, n])],

/* a parameter's name on track t: the machine's own name, and the slot where it differs ("UNIL", "SYN A · UNIL") */
function pinfo(m, t, pid) {
	for (const [, list] of paramGroups(m, t)) for (const [id, own, slot] of list) if (id === pid) {
		if (pid === "NOTE.0") {
			if (m === "mm") return { own: "NOTE", long: "NOTE · voices' pitch", ok: true };
			const p = MD_SYN[KIT.md[t]].findIndex(n => n === "PTCH" || n === "TUNE");

		}
		if (!own) return { own: "—", long: slot + " · unused on " + KIT[m][t], ok: false };
		return { own, long: own === slot || pid.startsWith("AMP") || pid.startsWith("FLT") || pid.startsWith("EFX") || !pid.startsWith("SYN") ? slot : slot + " · " + own, ok: true };

/* the TR-06's front panel, from Roland's MIDI Implementation Chart v1.00 and the owner's manual. Positions are a

const INST = ["ACC", "BD", "SD", "LT", "HT", "CY", "OH", "CH"];
const LAYERS = {
	LEVEL: { ACC: [71, "ACC LEVEL"], BD: [24, "BD LEVEL"], SD: [29, "SD LEVEL"], LT: [51, "LT LEVEL"], HT: [54, "HT LEVEL"], CY: [85, "CY LEVEL"], OH: [82, "OH LEVEL"], CH: [63, "CH LEVEL"] },
	TUNE: { BD: [20, "BD TUNE"], SD: [25, "SD TUNE"], LT: [49, "LT TUNE"], HT: [52, "HT TUNE"], CY: [83, "CY TUNE"], OH: [80, "OH TUNE"], CH: [61, "CH TUNE"] },
	DECAY: { BD: [23, "BD DECAY"], SD: [28, "SD DECAY"], LT: [50, "LT DECAY"], HT: [53, "HT DECAY"], CY: [84, "CY DECAY"], OH: [81, "OH DECAY"], CH: [62, "CH DECAY"] },
	TONE: { BD: [21, "BD ATTACK"], SD: [26, "SD SNAPPY"], LT: [92, "LT COLOR"], HT: [94, "HT COLOR"] },
	COMP: { BD: [22, "BD COMP"], SD: [27, "SD COMP"] },
	SEND: { BD: [96, "BD DELAY SEND"], SD: [97, "SD DELAY SEND"], LT: [103, "LT DELAY SEND"], HT: [104, "HT DELAY SEND"], CY: [109, "CY DELAY SEND"], OH: [108, "OH DELAY SEND"], CH: [107, "CH DELAY SEND"] }
};
const LAYER_HOW = { LEVEL: "turn", TUNE: "MENU + turn", DECAY: "MENU + turn", TONE: "MENU + turn", COMP: "MENU + turn", SEND: "STEP LOOP + DEPTH" };
const FXK = [["DRIVE", 17, "OD DRIVE"], ["TIME", 18, "DELAY TIME"], ["DEPTH", 19, "DELAY DEPTH"]];
const OTHER_CC = [[12, "MIX IN LVL"], [111, "MIX IN DELAY SEND"], [113, "MASTER PROB"]];
const VOICES = [["BD", "BASS DRUM", [36, 35]], ["SD", "SNARE DRUM", [38, 40]], ["LT", "LOW TOM", [47, 45]], ["HT", "HIGH TOM", [50, 48]], ["CY", "CYMBAL", [49]], ["OH", "OPEN HIHAT", [46]], ["CH", "CLOSED HIHAT", [42, 44]]];
const TR06_CC = {};
for (const [layer, row] of Object.entries(LAYERS)) for (const [inst, [cc, label]] of Object.entries(row)) TR06_CC[cc] = { label, inst, layer };
for (const [k, cc, label] of FXK) TR06_CC[cc] = { label, fx: k };
for (const [cc, label] of OTHER_CC) TR06_CC[cc] = { label, other: true };

/* ============================================================================================
   State. A mapping is per editor (the MD Editor and the MM Editor each keep their own), per device.
   ============================================================================================ */
const tgt = (p, lo = 0, hi = 127, o = {}) => Object.assign({ t: "sel", p, lo, hi, inv: false }, o);
function defaults(m) {
	const mm = m === "mm";
	const syn = [24, 29, 51, 54, 85, 82, 63];
	const tr06 = {};
	syn.forEach((cc, i) => tr06["cc:" + cc] = { targets: [tgt("SYN." + i)] });
	tr06["cc:71"] = { targets: [tgt("NOTE.0", 48, 72)] };
	if (mm) {
		/* DRIVE as a macro: three parameters, one of them inverted */
		tr06["cc:17"] = { targets: [tgt("FLT.0", 20, 110), tgt("AMP.4", 0, 80), tgt("EFX.2", 127, 60, { inv: true })] };
		tr06["cc:18"] = { targets: [tgt("FLT.1")] };
		tr06["cc:19"] = { targets: [tgt("LEV.0")] };
		tr06["cc:20"] = { targets: [tgt("SYN.7", 40, 88)] };
		tr06["cc:80"] = { targets: [tgt("AMP.3", 0, 127, { t: 5 })] };	/* pinned: OH TUNE moves track 6's AMP REL */
	} else {
		tr06["cc:17"] = { targets: [tgt("RT.0", 0, 96), tgt("FX.7", 0, 60)] };
		tr06["cc:18"] = { targets: [tgt("RT.3")] };
		tr06["cc:19"] = { targets: [tgt("RT.4")] };
		tr06["cc:20"] = { targets: [tgt("SYN.0", 0, 127, { t: 0 })] };
		tr06["cc:61"] = { targets: [tgt("SYN.2", 0, 127, { t: 6 })] };
	}
	tr06["cc:113"] = { role: "amount", set: "rs1", targets: [] };
	const beatstep = {
		"cc:10": { targets: [tgt(mm ? "FLT.0" : "FX.4")] },
		"cc:74": { targets: [tgt(mm ? "FLT.1" : "FX.5", 127, 0, { inv: true })] },
		"note:51": { role: "roll", set: "rs1", targets: [] }

	const any = { "cc:21": { targets: [tgt(mm ? "FLT.1" : "FX.4", 0, 127, { t: mm ? 0 : 1 })], legacy: true }, "cc:22": { targets: [tgt(mm ? "EFX.4" : "RT.3", 0, 127, { t: 2, inv: true })], legacy: true } };

		{ id: "rs2", name: "Envelope", t: "sel", params: mm ? ["AMP.0", "AMP.2", "AMP.3", "FLT.4", "FLT.5"] : ["SYN.1", "RT.0"], amount: 60, how: "anywhere", last: [] }

const S = {
	m: "mm", sel: 0, view: "", daw: false,
	conn: { tr06: true, beatstep: true },			/* what the OS reports (hot-plug) */
	enabled: { tr06: true, beatstep: false },		/* AUDIO / MIDI's inputs */
	on: { tr06: true, beatstep: true, any: true, host: true },
	ch: { tr06: 10, beatstep: 1 },
	mode: { tr06: "rel", beatstep: "abs", any: "abs", host: "abs" },	/* the device's default knob mode */
	layer: "LEVEL", touch: true, learn: false,
	selCtl: { tr06: "cc:24", beatstep: "cc:10", any: "cc:21", host: null },
	hot: null,						/* the control that moved last: {dev, id} (steady, until another moves) */
	hotVoice: null,
	inv: {},						/* incoming value per dev|id */
	seen: {
		beatstep: [["cc:10", "Knob 1"], ["cc:74", "Knob 2"], ["cc:71", ""], ["cc:76", ""], ["note:44", "Pad 1"], ["note:45", ""], ["note:51", "Pad 8"]],

	voices: {

const tracks = () => KIT[S.m].length;
function hash(s) { let h = 2166136261; for (const c of s) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return (h >>> 0) % 128; }

/* ============================================================================================

   ============================================================================================ */
const $ = q => document.querySelector(q), $$ = q => [...document.querySelectorAll(q)];

const KS = {};
function kselect(id, label, value, groups) {

   ============================================================================================ */
const DEVICES = {
	tr06: { name: "TR-06", full: "Roland TR-06", profile: "Roland TR-06", icon: "tr06" },

	midi: `<svg viewBox="0 0 104 60" aria-hidden="true"><rect x="2" y="6" width="100" height="48" rx="4" fill="none" stroke="currentColor" stroke-width="2"/>

function ctlName(d, id) {

	card.querySelector(".rf").style.cssText = `left:${lo / 127 * 100}%;width:${(hi - lo) / 127 * 100}%`;
	card.querySelector('[data-h="lo"]').style.left = lo / 127 * 100 + "%"; card.querySelector('[data-h="hi"]').style.left = hi / 127 * 100 + "%";
	const bs = card.querySelectorAll(".rnums b"); bs[0].textContent = lo; bs[1].textContent = hi;
}
function moveAmt(e) {
	const s = curSet(), r = dragging.el.getBoundingClientRect();
	s.amount = Math.max(0, Math.min(100, Math.round((e.clientX - r.left) / r.width * 100)));
	[...dragging.el.children].forEach((c, i) => c.classList.toggle("on", i < Math.round(s.amount / 100 * 16)));
	$("#amtv").textContent = s.amount + "%";
}

/* the prototype's own controls: hot-plug, the DAW, the machine, simulated hardware */
function devAction(el) {
	const a = el.dataset.dev, v = el.dataset.v;
	if (a === "m") { S.m = v; S.sel = Math.min(S.sel, tracks() - 1); S.selVoice = null; }
	else if (a === "plug") {
		S.conn[v] = !S.conn[v];
		toast(DEVICES[v].name + (S.conn[v] ? " connected" : " disconnected · its mapping is kept"));
		if (!S.conn[v] && S.view === v) S.view = "";
	}
	else if (a === "daw") { S.daw = !S.daw; S.view = ""; }
	else if (a === "hit") { if (S.conn.tr06 && !S.daw) hitVoice(+v); else toast("The TR-06 is not connected."); return; }
	else if (a === "bs") { if (!S.conn.beatstep || S.daw) { toast("The BeatStep is not connected."); return; } if (!S.enabled.beatstep) { toast("The BeatStep is not enabled in AUDIO / MIDI: nothing arrives."); return; } incoming("beatstep", "cc:77", 30 + Math.floor(Math.random() * 60)); return; }
	render();
}

render();
</script>
