<meta charset="utf-8">
<title>Machinedrum Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=Silkscreen&display=swap">
<style>
:root{
  color-scheme:light;
  --plate:#d0d1cc;--plate2:#c4c5bf;--plate3:#dcddd8;--print:#2f302b;--print2:#55564f;--print3:#6d6e67;--rule:#9a9b94;
  --key:#292c29;--key2:#3a3d39;--keytext:#e7e6df;--keydim:#9a9b94;
  --trig:#d77c43;--led:#e8553a;--rec:#c94d3a;--lcd:#e0472b;--ink:#38100a;--oxblood:#6b382e;
  --row:30px;--hdr:220px;
  --sans:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --pix:"Silkscreen",ui-monospace,monospace;
  /* legacy names used by the page script */
  --bg:var(--plate2);--s1:var(--plate);--s2:var(--plate2);--s3:var(--plate3);--line:var(--rule);--line2:var(--rule);
  --text:var(--print);--dim:var(--print2);--mute:var(--print3);--amber:var(--trig);--teal:var(--led);--coral:var(--rec);
  --red:var(--rec);--yellow:var(--trig);--white:var(--print);
  --trx:var(--print);--efm:var(--print);--e12:var(--print);--pi:var(--print);--gnd:var(--print);--smp:var(--trig);--inp:var(--print);--mid:var(--print);--ctr:var(--print);
}
:root[data-plate="mk2"]{
  color-scheme:dark;
  --plate:#1b1c1a;--plate2:#131412;--plate3:#252623;--print:#e7e6df;--print2:#b8b7b0;--print3:#8d8c86;--rule:#4a4b46;
  --key:#34362f;--key2:#44473f;--keytext:#e7e6df;--keydim:#8d8c86;--oxblood:#ee613f;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--plate)}
body{color:var(--print);font:500 15px/1.35 var(--sans);padding-inline:16px;padding-block:14px;margin:0}
button,select,input{font:inherit;color:inherit}
button{background:var(--key);color:var(--keytext);border:0;border-radius:3px;padding:5px 11px;cursor:pointer;font-weight:600;letter-spacing:.04em;box-shadow:inset 0 -2px 0 rgba(0,0,0,.35)}
button:hover{background:var(--key2)}
button:active{box-shadow:none;transform:translateY(1px)}
:focus-visible{outline:2px solid var(--led);outline-offset:2px}
select{background:var(--plate3);border:1px solid var(--rule);border-radius:3px;padding:4px 8px;max-width:100%;color:var(--print)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.cap,.card h3{font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--print)}
.app{max-width:1600px;margin:0 auto;display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}

/* top bar: a printed strip, keys lit like the hardware */
.top{display:grid;grid-template-columns:auto 1fr auto;gap:12px 22px;align-items:center;padding:4px 0 12px;border-bottom:2px solid var(--print)}
@media (max-width:1150px){.top{grid-template-columns:1fr}}
.left,.right{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.brand{font:600 24px/1 var(--sans);letter-spacing:.08em;white-space:nowrap}
.brand span{color:var(--oxblood)}
.transport{display:flex;gap:8px;align-items:center}
.play{width:38px;height:34px;padding:0;display:grid;place-items:center}
.play svg{width:14px;height:14px;fill:var(--keytext)}
.play[aria-pressed=true]{background:var(--trig)}
.play[aria-pressed=true] svg{fill:var(--ink)}
.num{background:var(--lcd);color:var(--ink);border-radius:3px;padding:4px 9px;font:15px var(--pix);cursor:ns-resize;touch-action:none;user-select:none;min-width:78px;text-align:right}
.patsel{display:flex;align-items:center;gap:3px}
.patsel button{padding:5px 8px}
.patsel .mono{font:15px var(--pix);background:var(--lcd);color:var(--ink);padding:4px 9px;border-radius:3px}
.tabs{justify-self:center;display:flex;gap:6px}
.tabs button{padding:7px 16px;font-size:14px;letter-spacing:.14em;text-transform:uppercase}
.tabs button[aria-selected=true]{background:var(--trig);color:var(--ink)}
.seg{display:inline-flex;gap:3px}
.seg button{padding:4px 9px;font:500 12px var(--mono);letter-spacing:0}
.seg button[aria-pressed=true]{background:var(--trig);color:var(--ink)}
.meter{display:grid;gap:4px;min-width:150px}
.meter .row{display:flex;gap:10px;justify-content:space-between;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--print2)}
.meter .row b{font:500 12px var(--mono);letter-spacing:0;color:var(--print)}
.meter .bar{height:6px;background:var(--key);overflow:hidden;border-radius:1px}
.meter .bar i{display:block;height:100%;width:var(--f);background:var(--trig);transition:width .15s}
.meter.warn .bar i,.meter.full .bar i{background:var(--led)}
.save{display:flex;align-items:center;gap:7px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--print2);width:132px}
.save i{width:8px;height:8px;border-radius:50%;background:var(--key);flex:none;box-shadow:inset 0 0 0 1px var(--rule)}
.save.dirty i{background:var(--led);box-shadow:0 0 6px var(--led)}
.note{font-size:14px;color:var(--print2)}
.note b{color:var(--print);font-weight:600}

/* layout */
.body{display:grid;grid-template-columns:var(--hdr) minmax(0,1fr);gap:18px;align-items:start}
.body.full{grid-template-columns:minmax(0,1fr)}
@media (max-width:860px){.body{grid-template-columns:minmax(0,1fr)}}
.panel{min-width:0}
.pad{padding:0}

/* track header */
.th{height:var(--row);display:grid;grid-template-columns:22px minmax(0,1fr) 24px 24px;gap:6px;align-items:center;padding:0 4px 0 2px;cursor:pointer;background:var(--plate);border-left:3px solid transparent}
.th:hover{background:var(--plate3)}
.th.sel{border-left-color:var(--trig);background:var(--plate3)}
.th .sw{display:none}
.th .n{font:12px var(--mono);color:var(--print3);text-align:right}
.th .nm{display:flex;gap:7px;align-items:baseline;min-width:0;white-space:nowrap;overflow:hidden}
.th .nm b{font:500 13px var(--mono)}
.th .nm span{font-size:14px;color:var(--print2);overflow:hidden;text-overflow:ellipsis}
.ms{width:24px;height:22px;padding:0;font:600 11px var(--mono);letter-spacing:0}
.ms.m[aria-pressed=true]{background:var(--rec);color:#fff}
.ms.s[aria-pressed=true]{background:var(--trig);color:var(--ink)}
.th.off .nm{opacity:.45}
.rail{display:grid;gap:2px;border-top:2px solid var(--print);padding-top:6px}

/* sequencer */
.toolbar{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;padding:0 0 12px}
.toolbar label{display:flex;gap:8px;align-items:center;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--print2)}
.toolbar input[type=range]{width:110px;accent-color:var(--trig)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--print2);margin-left:auto}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:14px;height:14px;border-radius:2px;display:inline-block;position:relative;background:var(--trig)}
.scroll{overflow-x:auto}
.seq{display:grid;gap:3px;min-width:max-content;border-top:2px solid var(--print);padding-top:6px}
.seq .r{display:grid;gap:3px;align-items:center}
.th.inrow{position:sticky;left:0;z-index:2}
.rul{height:18px;font:10px var(--mono);color:var(--print3);display:flex;align-items:end;padding-left:2px}
.rul.pgs{font:600 11px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--print2)}
.st{height:var(--row);border-radius:3px;background:var(--key);border:0;padding:0;position:relative;cursor:pointer;box-shadow:inset 0 -2px 0 rgba(0,0,0,.35)}
.st.q{background:var(--key2)}
.st.gap,.rul.gap{margin-left:10px}
.st:hover{filter:brightness(1.25)}
.st.on{background:var(--trig)}
.st.on.acc::after{content:"";position:absolute;left:4px;right:4px;top:4px;height:3px;background:var(--ink)}
.st.on.lk::before{content:"";position:absolute;right:4px;bottom:5px;width:6px;height:6px;background:var(--ink)}
.st.on.sl{background-image:linear-gradient(135deg,transparent 62%,color-mix(in srgb,var(--ink) 50%,transparent) 62%)}
.st.ph{box-shadow:0 0 0 2px var(--led),0 0 8px var(--led)}
.r.sel .st:not(.on){filter:brightness(1.3)}
.r.off .st.on{filter:saturate(.1) brightness(.6)}
.classic .st.on.lk::before{background:color-mix(in srgb,var(--ink) 35%,transparent)}

/* lock lane = the LCD */
.lanewrap{padding:16px 0 8px}
.lanetop{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:8px;border-top:2px solid var(--print);padding-top:8px}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{padding:3px 10px;font:500 12px var(--mono);letter-spacing:0}
.chip[aria-pressed=true]{background:var(--trig);color:var(--ink)}
.chip small{opacity:.7;margin-left:5px}
.lane{display:grid;gap:3px;min-width:max-content;padding:8px;background:var(--lcd);border-radius:4px;touch-action:none;user-select:none}
.lane .lh{position:sticky;left:0;z-index:2;background:var(--lcd);display:flex;align-items:center;height:120px;font:10px var(--pix);color:var(--ink);padding:0 8px 0 4px}
.lane .lh b{font:14px var(--pix);color:var(--ink)}
.lb{height:120px;position:relative;cursor:crosshair;overflow:hidden;border-bottom:1px solid color-mix(in srgb,var(--ink) 35%,transparent)}
.lb.gap{margin-left:10px}
.lb.none{background:repeating-linear-gradient(135deg,transparent 0 4px,color-mix(in srgb,var(--ink) 14%,transparent) 4px 6px);cursor:not-allowed}
.lb i{position:absolute;left:3px;right:3px;bottom:0;background:var(--ink);height:var(--h)}
.lb .base{position:absolute;left:0;right:0;height:0;border-top:1px dashed var(--ink);opacity:.55;bottom:var(--b)}
.lb.ph{background:color-mix(in srgb,var(--ink) 12%,transparent)}
.classic .lb i{opacity:.35}
.warnline{color:var(--rec);font-size:14px;margin:0 0 8px}

/* sound: printed sections, LCD screens */
.cols{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.sound3{display:grid;gap:22px;grid-template-columns:repeat(3,minmax(0,1fr));align-items:start}
@media (max-width:1180px){.sound3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:720px){.sound3{grid-template-columns:minmax(0,1fr)}}
.stack{display:grid;gap:22px}
.fx4{display:grid;gap:22px;margin-top:22px;grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1180px){.fx4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.fx4{grid-template-columns:minmax(0,1fr)}}
.card{border-top:2px solid var(--print);padding-top:8px;display:grid;gap:10px;align-content:start}
.card header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h3{margin:0;color:var(--print)!important}
.card header span{font:12px var(--mono);color:var(--print3)}
.ctl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}
.ctl.four{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:520px){.ctl.four{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pc{position:relative;height:34px;border-radius:3px;background:var(--key);color:var(--keytext);display:flex;justify-content:space-between;align-items:center;padding:0 8px;cursor:ew-resize;user-select:none;touch-action:none;overflow:hidden;box-shadow:inset 0 -2px 0 rgba(0,0,0,.35)}
.pc::after{content:"";position:absolute;bottom:0;left:0;height:3px;width:var(--f);background:var(--trig)}
.pc::before{display:none}
.pc span{position:relative;font:600 12px var(--sans);letter-spacing:.1em;color:var(--keydim)}
.pc b{position:relative;font:500 14px var(--mono);font-variant-numeric:tabular-nums;color:var(--keytext)}
.pc:hover{background:var(--key2)}
.pc.act{background:var(--key2);box-shadow:inset 0 0 0 1px var(--trig)}
.pc.lk span::after{content:"";display:inline-block;width:6px;height:6px;background:var(--led);margin-left:5px;vertical-align:1px}
.pc.empty{cursor:default;background:transparent;box-shadow:inset 0 0 0 1px var(--rule)}
.pc.empty::after{display:none}
canvas.ed{display:block;width:100%;height:150px;border-radius:4px;background:var(--lcd);touch-action:none}
canvas.ed.sm{height:96px}
.edhint{font-size:13px;color:var(--print3);margin-top:-4px}
.shapes{display:flex;gap:3px;flex-wrap:wrap}
.shapes button{padding:3px 5px;line-height:0}
.shapes button[aria-pressed=true]{background:var(--trig);color:var(--ink)}
.kv{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--print2)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.two label{display:grid;gap:4px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--print2)}
.headline{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:baseline;margin-bottom:16px}
.headline h2{margin:0;font:600 26px/1 var(--sans);letter-spacing:.04em}
.fam{font:600 12px var(--sans);letter-spacing:.14em;text-transform:uppercase;padding:3px 8px;border-radius:2px;background:var(--print);color:var(--plate)}

/* mix */
.strips{display:grid;grid-template-columns:repeat(16,minmax(56px,1fr));gap:4px;min-width:960px;border-top:2px solid var(--print);padding-top:8px}
.strip{padding:6px 3px;display:grid;gap:6px;justify-items:stretch;border-left:3px solid transparent}
.strip.sel{border-left-color:var(--trig);background:var(--plate3)}
.strip .top2{display:flex;justify-content:center;font:12px var(--mono);color:var(--print3)}
.strip .top2 i{display:none}
.fader{height:132px;position:relative;cursor:ns-resize;touch-action:none;user-select:none;display:grid;justify-items:center}
.fader .tr{width:6px;height:100%;border-radius:1px;background:var(--key);position:relative}
.fader .tr i{position:absolute;left:0;right:0;bottom:0;height:var(--f);background:var(--trig)}
.fader .cap2{position:absolute;left:50%;transform:translate(-50%,50%);bottom:var(--f);width:32px;height:14px;border-radius:2px;background:var(--key);box-shadow:inset 0 -2px 0 rgba(0,0,0,.4),inset 0 5px 0 -3px var(--keytext)}
.strip .v{text-align:center;font:13px var(--pix);background:var(--lcd);color:var(--ink);border-radius:2px;padding:1px 0}
.strip .pc{height:24px;padding:0 5px}
.strip .pc span{font-size:10px}.strip .pc b{font-size:11px}
.strip .nm{text-align:center;font:12px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip .mrow{display:flex;gap:3px;justify-content:center}

/* song */
.timeline{display:flex;gap:3px;overflow-x:auto;padding:8px;background:var(--lcd);border-radius:4px}
.blk{flex:none;height:44px;border-radius:2px;background:var(--ink);color:var(--lcd);font:11px var(--pix);display:flex;align-items:flex-end;padding:4px 6px}
.blk.cur{box-shadow:0 0 0 2px var(--plate),0 0 0 4px var(--ink)}
table.song{border-collapse:collapse;width:100%;min-width:680px;font-size:15px}
table.song th{font-weight:600;color:var(--print2);text-align:left;font-size:12px;letter-spacing:.16em;text-transform:uppercase;padding:8px 10px;border-bottom:2px solid var(--print)}
table.song td{padding:8px 10px;border-bottom:1px solid var(--rule)}
table.song tr.cur td{background:var(--plate3)}
table.song tr.cur td:first-child{box-shadow:inset 3px 0 0 var(--trig)}
table.song tr.jump td{color:var(--print2);font-style:italic}
.mutes{display:inline-grid;grid-template-columns:repeat(16,10px);gap:2px}
.mutes i{height:14px;border-radius:1px;background:var(--key)}
.mutes i.off{background:var(--rec)}

/* sampler */
.smpgrid{display:grid;gap:22px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:1000px){.smpgrid{grid-template-columns:minmax(0,1fr)}}
.slot.empty{opacity:.8}
.slot .route{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--print2)}
.slot .route b{font:500 12px var(--mono);color:var(--print)}
.memb{display:grid;gap:4px;min-width:260px}
.memb .bar{height:8px;background:var(--key);display:flex;overflow:hidden;border-radius:1px}
.memb .bar i{display:block;height:100%}
.chop{display:grid;gap:3px;min-width:max-content;padding:8px;background:var(--lcd);border-radius:4px}
.cp{height:54px;border-radius:2px;background:transparent;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink) 35%,transparent);padding:0;position:relative;cursor:pointer;font:12px var(--pix);color:var(--lcd);touch-action:none}
.cp.q{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink) 60%,transparent)}
.cp.gap{margin-left:10px}
.cp:hover{background:color-mix(in srgb,var(--ink) 12%,transparent)}
.cp.on{background:var(--ink);cursor:ns-resize}
.cp .sl{position:absolute;left:0;right:0;top:8px;text-align:center}
.cp .fx{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:9px}
.cp.ph{outline:2px solid var(--plate);outline-offset:-4px}
.romlist{border-collapse:collapse;width:100%;min-width:560px;font-size:15px}
.romlist th{font-weight:600;color:var(--print2);text-align:left;font-size:12px;letter-spacing:.16em;text-transform:uppercase;padding:7px 10px;border-bottom:2px solid var(--print)}
.romlist td{padding:6px 10px;border-bottom:1px solid var(--rule)}
.romlist td.e{color:var(--print3)}
.btnrow{display:flex;gap:6px;flex-wrap:wrap}

details.rules{border-top:2px solid var(--print);padding-top:10px;color:var(--print2);font-size:14px}
details.rules summary{cursor:pointer;color:var(--print);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:12px}
details.rules ul{margin:10px 0 0;padding-left:18px;columns:2 340px;column-gap:28px}
details.rules li{margin:0 0 5px;break-inside:avoid}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--lcd);color:var(--ink);font:12px var(--pix);padding:10px 16px;border-radius:3px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:10;box-shadow:0 0 0 3px var(--key)}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== Hardware-true pass (from panel photos) ===== */
:root{
  --plate:#d9dad6;--plate2:#cdcec9;--plate3:#e5e6e2;--print:#94552b;--print2:#7a5a44;--print3:#8d7a6c;--rule:#b99a80;--body:#2f2c29;
  --key:#3a4049;--key2:#4a525c;--keytext:#e9e4d6;--keydim:#a9aeb6;--cream:#e9e4d6;--creamtext:#2d2b27;
  --led:#ff3b2f;--ledoff:#8a3a33;--rec:#e0472e;--lcd:#b3c03c;--ink:#1f2a0e;--labfill:#b07a4a;--labtext:#f6efe3;--knob:#3a4049;
  --trig:var(--led);--oxblood:var(--print);
}
:root[data-plate="mk2"]{
  --plate:#161716;--plate2:#0f100f;--plate3:#232422;--print:#f1f0ea;--print2:#c9c8c1;--print3:#94938c;--rule:#5d5e59;--body:#ecebe5;
  --key:#232423;--key2:#30312f;--keytext:#ecebe5;--keydim:#8f908b;--cream:#ece6d6;--creamtext:#1f1e1b;
  --ledoff:#4d1714;--lcd:#ef5a39;--ink:#3a0e08;--labfill:#f1f0ea;--labtext:#111;--knob:#9a9ca0;
}
body{color:var(--body)}
.note,.edhint,.kv,.slot .route{color:var(--print2)}
.th .nm b,.th .nm span{color:var(--body)}.th .nm span{opacity:.75}
.headline h2{color:var(--body)}
button{background:var(--key);color:var(--keytext)}
button.cream,.key.cream{background:var(--cream);color:var(--creamtext)}
button.cream:hover{filter:brightness(.95);background:var(--cream)}

/* LED + printed label, the hardware's way of showing a mode */
.led{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ledoff);flex:none;vertical-align:middle}
.led.on{background:var(--led);box-shadow:0 0 6px 1px var(--led)}
.tabs{gap:18px}
.tabs button,.seg button{background:transparent;box-shadow:none;color:var(--print);display:inline-flex;align-items:center;gap:7px;padding:4px 2px}
.tabs button::before,.seg button::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ledoff);flex:none}
.tabs button[aria-selected=true],.seg button[aria-pressed=true]{background:transparent;color:var(--print)}
.tabs button[aria-selected=true]::before,.seg button[aria-pressed=true]::before{background:var(--led);box-shadow:0 0 6px 1px var(--led)}
.tabs button:hover,.seg button:hover{background:transparent;color:var(--body)}
.seg{gap:12px}
.seg button{font:600 12px var(--sans);letter-spacing:.12em}

/* transport keys with printed symbols above, as on the panel */
.transport{gap:12px;align-items:flex-end}
.tk{display:grid;justify-items:center;gap:3px}

/* ===== P7 LAYOUT: the page fills the window and scales with it =====
   One column of fixed bars (the header, the page's own bars) and fluid rows: the Sequence's 16 track
   rows share the height the lock lane leaves (the lane keeps at least the lock parameter list's height,

:root{--seqhead:22px;--seqfoot:34px;--row:clamp(18px,calc((100vh - 445px) / 16 - 3px),40px)!important}
html,body{height:100%}

.seqfoot{height:var(--seqfoot);display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:14px;border-bottom:2px solid var(--print);box-sizing:border-box}

#lanescroll{flex:1 1 auto;min-height:96px;display:flex;flex-direction:column;box-sizing:border-box}

.lb .base{bottom:calc(3px + (100% - 6px) * var(--bf,0))!important}
.railparams{margin-top:calc(var(--seqfoot) + 5px)!important;min-height:0;overflow:auto}

#main>.soundgrid{flex:1 1 auto;min-height:0;grid-template-rows:minmax(0,1.25fr) minmax(0,1fr);align-items:stretch}

.soundgrid .lfoin{min-height:0;align-items:stretch}
.soundgrid .lfoin canvas.ed{height:100%!important;min-height:150px}

<div class="globpop libpop" id="keyspop" role="dialog" aria-label="Keys" hidden></div>
<div class="ampop" id="audiopop" role="dialog" aria-label="Audio and MIDI settings" hidden></div>

<script>
/* MODAL BEGIN (P7): one modal system for every dialog of both editors, the same text in the MD mockup,
   the MM mockup and the MD skin (checked by the sync scripts). The dialogs keep their own open and close
   functions; this layer watches them (their hidden attribute) and gives every one the same behaviour:
   centred on the window over a dimmed backdrop, focus inside it (Tab goes round), Esc and a click
   outside by its kind, focus back where it was when it closes. Stacked: the newest is on top and only
   it answers. The kinds, as data:
     confirm  a question (the plug-in's asks, the first-run notice): Esc is its last key (Cancel, Close),
              a click outside does nothing, the first focus is its last key (never the destructive one)
     panel    a library, settings or list: Esc and a click outside close it (its own close function)
     boot     the start-up card (BOOT block): nothing closes it but the machine becoming ready
   A listbox (the dropdowns) is not a modal: it stays at its button. */
const Modal = (() => {
	const KINDS = { confirm: { outside: false, focusLast: true, esc: true }, panel: { outside: true, focusLast: false, esc: true },
		boot: { outside: false, focusLast: false, esc: false } };
	const DIALOGS = [["#dlg", "confirm", null], ["#libpop", "panel", "closeLib"], ["#globpop", "panel", "closeGlobal"],
		["#keyspop", "panel", "toggleKeys"], ["#audiopop", "panel", "closeAudio"], ["#machpop", "panel", "closePicker"], ["#bootcard", "boot", null],
		["#syxpop", "panel", null]];
	const stack = [];	// {el, kind, close, back}
	const FOCUSABLE = 'button:not([disabled]),[href],input:not([disabled]),select:not([disabled]),textarea,[tabindex]:not([tabindex="-1"])';
	let bg = null;
	/* an overlay dialog (the questions, the start-up card) is its own backdrop area; its box is inside */
	const overlay = el => el.id === "dlg" || el.id === "bootcard";
	const box = d => overlay(d.el) ? d.el.querySelector(".dlgbox,.bootbox") || d.el : d.el;
	const keys = d => [...box(d).querySelectorAll(FOCUSABLE)].filter(e => e.offsetParent !== null || e === document.activeElement);
	function layer() {
		if (!bg) { bg = document.createElement("div"); bg.id = "modalbg"; bg.className = "modalbg"; bg.hidden = true; document.body.appendChild(bg); }
		bg.hidden = !stack.length;
		stack.forEach((d, i) => { d.el.classList.add("modal"); d.el.style.setProperty("--mz", 60 + i * 2); });
		if (stack.length) bg.style.setProperty("--mz", 59 + (stack.length - 1) * 2);
		document.documentElement.classList.toggle("modalopen", stack.length > 0);
	}
	function focusIn(d) {
		const k = keys(d), ask = d.el.querySelector(".btnrow button:last-child");
		const first = KINDS[d.kind].focusLast && ask ? ask : k.find(e => !e.matches(".libx,[data-keysx]")) || k[0];
		(first || box(d)).focus({ preventScroll: true });
	}
	function shown(el, kind, close) {
		if (stack.some(d => d.el === el)) return;
		const d = { el, kind, close, back: document.activeElement };
		stack.push(d); layer();
		if (!box(d).hasAttribute("tabindex")) box(d).setAttribute("tabindex", "-1");
		/* after the dialog's own focus call (a timer, not a frame: a window behind others draws no frames) */
		setTimeout(() => { if (stack.includes(d) && (KINDS[d.kind].focusLast || !box(d).contains(document.activeElement))) focusIn(d); }, 0);
	}
	function gone(el) {
		const i = stack.findIndex(d => d.el === el); if (i < 0) return;
		const [d] = stack.splice(i, 1); el.classList.remove("modal"); layer();
		if (d.back && d.back.isConnected && !stack.length) d.back.focus({ preventScroll: true });
		else if (stack.length) focusIn(stack[stack.length - 1]);
	}
	/* close the top one as its kind says: a confirm by its last key (the dialog's own handler runs) */
	function dismiss(d) {
		if (!KINDS[d.kind].esc) return;
		if (d.kind === "confirm") { const b = d.el.querySelector(".btnrow button:last-child"); if (b) b.click(); else d.el.hidden = true; return; }
		const f = d.close && window[d.close]; if (typeof f === "function") f(false); if (!d.el.hidden) d.el.hidden = true;
	}
	const top = () => stack[stack.length - 1];
	function watch() {
		for (const [sel, kind, close] of DIALOGS) {
			const el = document.querySelector(sel); if (!el) continue;
			new MutationObserver(() => el.hidden ? gone(el) : shown(el, kind, close)).observe(el, { attributes: true, attributeFilter: ["hidden"] });
			if (!el.hidden) shown(el, kind, close);
		}
	}
	/* first in line (this block loads before the dialogs' own handlers): Esc, Tab and the backdrop */
	document.addEventListener("keydown", e => {
		const d = top(); if (!d) return;
		if (e.key === "Escape") { e.preventDefault(); e.stopImmediatePropagation(); dismiss(d); return; }
		/* keys meant for the page behind (its shortcuts) do not reach it; the menu bar's own shortcuts are the system's */
		if (e.key !== "Tab") { if (!box(d).contains(e.target) && !e.target.closest?.("#kpop") && !e.metaKey) { e.preventDefault(); e.stopImmediatePropagation(); } return; }
		const k = keys(d); if (!k.length) { e.preventDefault(); return; }
		const i = k.indexOf(document.activeElement), n = e.shiftKey ? (i <= 0 ? k.length - 1 : i - 1) : (i < 0 || i === k.length - 1 ? 0 : i + 1);
		e.preventDefault(); k[n].focus();
	}, true);
	for (const ev of ["pointerdown", "mousedown", "click"]) document.addEventListener(ev, e => {
		const d = top(); if (!d) return;
		const outside = e.target === bg || (overlay(d.el) && e.target === d.el);
		if (!outside) return;
		e.preventDefault(); e.stopImmediatePropagation();
		if (ev === "click") { if (KINDS[d.kind].outside) dismiss(d); else { const b = box(d); b.classList.remove("nudge"); void b.offsetWidth; b.classList.add("nudge"); } }
	}, true);
	/* focus that leaves the top dialog (a click on the page behind is stopped above) comes back */
	document.addEventListener("focusin", e => { const d = top(); if (d && !d.el.contains(e.target) && e.target !== bg && !e.target.closest?.("#kpop")) focusIn(d); });
	if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", watch); else watch();
	/* Tips: the LCD's titles show under the display, never over it (a native tooltip covers the fields) */
	const tip = document.createElement("div"); tip.className = "lcdtip"; tip.hidden = true; tip.setAttribute("role", "tooltip"); document.body.appendChild(tip);
	let tipT = 0;
	document.addEventListener("mouseover", e => {
		const el = e.target.closest?.(".lcdpanel [title],.lcdpanel [data-tip]"), lcd = el?.closest(".lcdpanel");
		clearTimeout(tipT); tip.hidden = true;
		if (!el || !lcd) return;
		if (el.title) { el.dataset.tip = el.title; el.removeAttribute("title"); }
		tipT = setTimeout(() => {
			/* never over an open menu (its list opens where the tip would show) */
			if (document.querySelector("#kpop:not([hidden])") || el.closest("[aria-expanded=true]")) return;
			const r = el.getBoundingClientRect(), l = lcd.getBoundingClientRect();
			tip.textContent = el.dataset.tip; tip.hidden = false;
			tip.style.top = (l.bottom + 8) + "px";
			tip.style.left = Math.max(8, Math.min(innerWidth - tip.offsetWidth - 8, r.left + r.width / 2 - tip.offsetWidth / 2)) + "px";
		}, 450);
	});
	/* a press ends the tip at once: the press may open a menu */
	document.addEventListener("pointerdown", () => { clearTimeout(tipT); tip.hidden = true; }, true);
	document.addEventListener("mouseout", e => { if (e.target.closest?.(".lcdpanel")) { clearTimeout(tipT); tip.hidden = true; } });
	/* a title set later (a state's new words) moves to the tip too */
	new MutationObserver(ms => { for (const m of ms) { const el = m.target; if (el.title && el.closest?.(".lcdpanel")) { el.dataset.tip = el.title; el.removeAttribute("title"); } } })
		.observe(document.body, { attributes: true, attributeFilter: ["title"], subtree: true });
	return { open: () => stack.map(d => d.el.id), top: () => top()?.el.id || null };
})();
/* MODAL END */
/* BOOT BEGIN (P7): the start-up card, the same text in both editors (checked by the sync scripts). While
   the firmware starts, a modal card over the whole window (the modal layer's "boot" kind: nothing behind it
   takes a key or a click) shows the machine's own LCD, mirrored big and pixel for pixel, a progress bar and
   what to wait for; it fades out when the machine takes input. The same card is the first run: NO ROM and
   ROM ERROR show a clear "choose your ROM" button (the host's native file chooser) and the ROM folder. The page
   reads no ROM bytes: the host opens, checks and copies the file (Boot.host).
     Boot.update({state, machine, text})  state: "loading" | "booting" | "missing" | "unsupported" | "ready"
     Boot.lcd(bytes)                     the firmware's 128 x 64 screen (1024 bytes, rows of 16, MSB first)
     Boot.rom({ok, text})                the host's verdict on a chosen file
     Boot.showInstalled({machine, os, name, size, inFolder})   the same card while a firmware runs (LOAD ROM):
                                         the current image, a button to choose another, Remove, Show the ROM folder, Close
     Boot.host = {chooseRom(), revealRom(), recheck(), removeRom(info), say(text)}   the app's host calls
   A file dragged onto the page is not opened by the web view (that would replace the page): the card says to click
   the button instead. */
const Boot = (() => {
	const EXPECT = { Machinedrum: 14000, Monomachine: 11000 };	// ms from the first BOOTING OS to input (measured)
	const card = document.createElement("div");
	card.id = "bootcard"; card.className = "bootcard"; card.hidden = true;
	card.setAttribute("role", "dialog"); card.setAttribute("aria-modal", "true"); card.setAttribute("aria-labelledby", "boott");
	card.innerHTML = `<div class="bootbox" tabindex="-1">
 <div class="bootlcd"><canvas id="bootlcd" width="128" height="64" aria-label="The machine's own screen"></canvas></div>
 <h2 id="boott">Starting…</h2>
 <div class="bootbar" id="bootbar" role="progressbar" aria-valuemin="0" aria-valuemax="100"><i></i></div>
 <p class="bootline" id="bootline">Keys work when the start-up animation ends.</p>
 <div class="bootrom" id="bootrom" hidden>
  <p class="bootcur" id="bootcur" hidden></p>
  <button class="bootzone" data-bootrom="choose" aria-describedby="bootres"><b id="bootzone"></b><span>Click here to choose the file. The editor checks it and copies it into its ROM folder.</span></button>
  <p class="bootres" id="bootres" role="status"></p>
  <p class="bootpriv">The firmware stays on this computer: the editor checks it and copies it into its ROM folder, and sends it nowhere. <button class="linkkey" data-bootrom="folder">Show the ROM folder</button> <button class="linkkey" data-bootrom="recheck">Check again</button> <button class="linkkey" data-bootrom="remove" hidden>Remove the ROM</button> <button class="linkkey" data-bootrom="close" hidden>Close</button></p>
 </div>
</div>`;
	document.body.appendChild(card);
	const $b = id => card.querySelector("#" + id);
	let shown = null, t0 = 0, raf = 0, machine = "Machinedrum", lastBits = null, manage = null;
	const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
	function draw() {
		const c = $b("bootlcd"), g = c.getContext("2d");
		g.fillStyle = cssv("--lcd") || "#b8c4b0"; g.fillRect(0, 0, 128, 64);
		if (!lastBits) return;
		g.fillStyle = cssv("--ink") || "#1a2418";
		for (let y = 0; y < 64; y++) for (let x = 0; x < 128; x++) if (lastBits[y * 16 + (x >> 3)] & (0x80 >> (x & 7))) g.fillRect(x, y, 1, 1);
	}
	function tick() {
		raf = 0;
		if (shown !== "booting") return;
		const f = Math.min(.95, (performance.now() - t0) / (EXPECT[machine] || 14000));
		$b("bootbar").querySelector("i").style.width = (f * 100).toFixed(1) + "%";
		$b("bootbar").setAttribute("aria-valuenow", Math.round(f * 100));
		raf = requestAnimationFrame(tick);
	}
	function romName(m) { return m === "Monomachine" ? "Monomachine SFX-60 OS 1.32B" : "Machinedrum OS 1.63"; }
	const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
	const links = (m) => {	// which of the card's links show: the first-run ones, or the installed firmware's
		card.querySelector('[data-bootrom="recheck"]').hidden = m;
		card.querySelector('[data-bootrom="remove"]').hidden = !m;
		card.querySelector('[data-bootrom="close"]').hidden = !m;
	};
	function leaveManage() { if (!manage) return; manage = null; card.classList.remove("manage"); $b("bootcur").hidden = true; links(false); }
	/* LOAD ROM with a firmware running: the same card, the current image on one line */
	function showInstalled(o) {
		machine = o.machine || machine; manage = o; shown = "manage";
		card.classList.remove("out", "ind"); card.classList.add("rom", "manage");
		$b("boott").textContent = `${machine} firmware`;
		$b("bootline").hidden = true; $b("bootrom").hidden = false;
		$b("bootzone").textContent = `Choose another ${romName(machine)} ROM (.bin or .zip) to replace it`;
		const cur = $b("bootcur");
		cur.innerHTML = `<b>${esc(o.os)}</b><span class="bootfile" title="${esc(o.name)}${o.inFolder ? "" : " (outside the editor's ROM folder)"}">${esc(o.name)}</span><i>${(o.size / 1048576).toFixed(1)} MiB</i>`;
		cur.hidden = false;
		$b("bootres").textContent = ""; $b("bootres").className = "bootres";
		links(true);
		card.hidden = false;
	}
	function update(o) {
		machine = o.machine || machine;
		const st = o.state === "animating" ? "booting" : o.state;
		if (manage) { if (st === "ready" || !st) return; leaveManage(); shown = null; }
		if (st === "ready" || !st) {
			if (shown && !card.hidden) { card.classList.add("out"); setTimeout(() => { if (shown === null) { card.hidden = true; card.classList.remove("out"); } }, 380); }
			shown = null; return;
		}
		card.classList.remove("out");
		if (st !== shown) {
			if (st === "booting" || st === "loading") t0 = performance.now();
			shown = st;
		}
		const rom = st === "missing" || st === "unsupported";
		card.classList.toggle("rom", rom);
		card.classList.toggle("ind", st === "loading");
		$b("boott").textContent = rom ? (st === "missing" ? `${machine} firmware needed` : `This is not the ${machine}'s firmware`) : st === "loading" ? `Preparing the ${machine}…` : `Starting the ${machine}…`;
		$b("bootline").textContent = st === "unsupported" ? "The ROM in the ROM folder is another OS or a damaged dump." : rom ? "" : "Keys work when the start-up animation ends.";
		$b("bootline").hidden = st === "missing";
		$b("bootrom").hidden = !rom;
		if (rom) $b("bootzone").textContent = `Choose your ${romName(machine)} ROM (.bin or .zip, 8 MB)`;
		card.hidden = false;
		draw();
		if (!raf && st === "booting") raf = requestAnimationFrame(tick);
	}
	function lcd(bits) { lastBits = bits; if (!card.hidden) draw(); }
	function rom(r) {
		if (manage && r.ok) { leaveManage(); shown = null; card.hidden = true; return; }	// the machine starts again on the new image
		const el = $b("bootres");
		el.textContent = r.text || ""; el.className = "bootres " + (r.ok ? "ok" : "bad");
		if (r.ok) { $b("boott").textContent = `Starting the ${machine}…`; t0 = performance.now(); }
	}
	card.addEventListener("click", e => {
		const k = e.target.closest("[data-bootrom]"); if (!k || !Boot.host) return;
		const a = k.dataset.bootrom;
		if (a === "choose") Boot.host.chooseRom(); else if (a === "recheck") Boot.host.recheck(); else if (a === "folder") Boot.host.revealRom();
		else if (a === "remove" && manage && Boot.host.removeRom) Boot.host.removeRom(manage);
		else if (a === "close") { leaveManage(); shown = null; card.hidden = true; }
	});
	/* a dragged file: the web view must not open it (it would replace the page), and the card points at the button */
	const files = e => e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types || [], "Files") >= 0;
	document.addEventListener("dragover", e => { if (files(e)) { e.preventDefault(); e.dataTransfer.dropEffect = "none"; } }, true);
	document.addEventListener("drop", e => {
		if (!files(e)) return;
		e.preventDefault();
		const f = e.dataTransfer.files && e.dataTransfer.files[0], open = !card.hidden && !$b("bootrom").hidden;
		const text = f && /\.syx$/i.test(f.name || "") ? "Use Import SysEx… in the menu to open a .syx." : open ? "Click here to choose the ROM." : "Use LOAD ROM in the engine menu to choose a ROM.";
		if (!open) { if (Boot.host && Boot.host.say) Boot.host.say(text); } else rom({ ok: false, text });
	}, true);
	return { update, lcd, rom, showInstalled, host: null, state: () => shown };
})();
/* BOOT END */
/* SYX BEGIN (P7): SysEx import and export, the same text in both editors (checked by the sync scripts).
   The host opens, parses and writes the files (the page never reads their bytes): a .syx chosen with
   "Import SysEx…" comes back as a preview, here a panel of the modal layer with
   what is in the file and what it overwrites; "Import" sends the chosen kinds as ordinary document writes
   (one undo step), a few at a time, with progress and a Stop key.
     Syx.keys()            the library's two keys (markup)
     Syx.preview(m)        {type:"syxPreview", ok, text, file, model, fullBackup, items:{kind:[{slot,name,overwrites}]}, problems}
     Syx.progress(m)       {type:"syxProgress", done, total, running, text}
     Syx.exported(m)       {type:"syxExport", ok, text}
     Syx.host = {choose(), exportAll(), start(kinds), stop()}   the app's host calls */
const Syx = (() => {
	const KINDS = [["kit", "Kits"], ["pattern", "Patterns"], ["song", "Songs"], ["global", "Globals"]];
	const pop = document.createElement("div");
	pop.id = "syxpop"; pop.className = "syxpop libpop"; pop.hidden = true;
	pop.setAttribute("role", "dialog"); pop.setAttribute("aria-label", "Import SysEx");
	document.body.appendChild(pop);
	let last = null, running = false;
	const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
	const chosen = () => [...pop.querySelectorAll("[data-syxkind]:checked")].map(b => b.dataset.syxkind);
	function sums() {
		const k = chosen(), items = last?.items || {};
		const n = k.reduce((a, x) => a + (items[x] || []).length, 0), over = k.reduce((a, x) => a + (items[x] || []).filter(i => i.overwrites).length, 0);
		const go = pop.querySelector('[data-syxgo="start"]');
		if (go) { go.textContent = n ? `Import ${n} item${n > 1 ? "s" : ""}` : "Nothing chosen"; go.disabled = !n || running; go.className = over ? "danger" : "cream"; }
		const w = pop.querySelector(".syxwarn");
		if (w) w.textContent = over ? `${over} slot${over > 1 ? "s" : ""} on the machine hold data and are overwritten, the pattern and kit that play too if they are among them. One Undo takes the whole import back.` : n ? "Only empty slots are written." : "";
	}
	function preview(m) {
		last = m; running = false;

function songAction(a){const i=S.songSel,r=S.song[i];

 if(a==="dup"&&!r.type){S.song.splice(i+1,0,JSON.parse(JSON.stringify(r)));S.songSel=i+1}
 if(a==="up"&&i>0&&r.type!=="end"){[S.song[i-1],S.song[i]]=[S.song[i],S.song[i-1]];S.songSel=i-1}
 if(a==="down"&&i<S.song.length-2&&r.type!=="end"){[S.song[i+1],S.song[i]]=[S.song[i],S.song[i+1]];S.songSel=i+1}
 if(a==="loop"){const at=r.type==="end"?i:i+1;S.song.splice(at,0,{type:"loop",to:Math.max(0,i-1),count:2});S.songSel=at}
 markDirty();render()}
function songStep(k,d){const r=S.song[S.songSel];
 if(k==="pat")r.pat=(r.pat+d+128)%128;
 if(k==="rep")r.rep=Math.max(1,Math.min(64,r.rep+d));
 if(k==="bpm")r.bpm=Math.max(30,Math.min(300,(r.bpm||S.bpm)+d));
 if(k==="ofs"){const L=patLen(r.pat);r.ofs=Math.max(0,Math.min(L-1,(r.ofs||0)+d));if(r.len&&r.ofs+r.len>L)r.len=L-r.ofs}
 if(k==="len"){const L=patLen(r.pat);r.len=Math.max(1,Math.min(L-(r.ofs||0),rowLen(r)+d))}
 if(k==="to")r.to=Math.max(0,Math.min(S.songSel-(r.type==="loop"?1:0),r.to+d));
 if(k==="count")r.count=r.count===Infinity?(d<0?63:Infinity):Math.max(1,Math.min(63,r.count+d));
 markDirty();render()}

 const g=c.getContext("2d");g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W,H);ed.draw(g,W,H,c);
 ed.handles(W,H,c).forEach(h=>{const on=active&&active.c===c&&active.k===h.k;g.beginPath();g.arc(h.x,clamp(h.y,6,H-6),on?7:5.5,0,7);g.fillStyle=cssv("--lcd");g.fill();g.lineWidth=2.5;g.strokeStyle=h.c;g.stroke();

/* ===== Sampler (UW) ===== */
const recTrack=n=>S.tracks.findIndex(t=>t.m==="RAM-R"+n),playTrack=n=>S.tracks.findIndex(t=>t.m==="RAM-P"+n);
const ROMS=["Amen break","Vinyl crackle","Rhodes stab","Hoover","Tape kick","Vox chop","909 ride","Shaker loop","Sub drop","Clap room","Bell hit","Noise sweep","Break 2","Dub chord","Rim room","Tabla","Snap","Perc loop","FM zap","Cowbell 808","Lo-fi hat","Choir","String hit","Pad swell"];
function hash(i){const x=Math.sin(i*127.1)*43758.5;return x-Math.floor(x)}
/* The captured audio is modelled from the pattern itself: resampling records your own beat. */
function capture(n,bins){const r=recTrack(n);if(r<0)return null;const R=S.tracks[r].syn,steps=Math.max(1,Math.round(R.LEN/4)),mix=R.MLEV/127,inp=R.ILEV/127,q=R.RATE/127;const out=new Float32Array(bins);
 for(let b=0;b<bins;b++){const pos=b/bins*steps;let a=0;
  S.tracks.forEach((t,i)=>{if(t.fam==="SMP"||t.fam==="CTR"||t.fam==="MID"||!audible(i))return;const d=.12+(t.syn.DEC??64)/127*.9;
   for(let k=Math.floor(pos)-3;k<=Math.floor(pos);k++){if(k<0||!t.trigs[k%S.len])continue;const dt=pos-k;a+=(t.rt.VOL??100)/127*Math.exp(-dt/d)*(i<2?1:.55)}});
  a=a*mix*1.6+inp*.25*(.5+.5*Math.sin(b*.07));a*=(.55+.45*hash(b));if(q<.98){const lv=2+Math.round(q*30);a=Math.round(a*lv)/lv}out[b]=Math.min(1,a)}return out}
function wave(g,W,H,data,from,to,color,dim){const n=data.length,mid=H/2+6;for(let x=0;x<W;x++){const v=data[Math.floor(x/W*n)]||0,h=v*(H/2-14);const u=x/W;const inside=u>=Math.min(from,to)&&u<=Math.max(from,to);g.fillStyle=inside?color:dim;g.fillRect(x,mid-h,1,Math.max(1,h*2))}}
ED.sample={draw(g,W,H){const tr=S.tracks[S.sel],y=tr.syn,n=+(tr.m.match(/RAM-P(\d)/)||[])[1];grid(g,W,H);
  const data=n?capture(n,W):Float32Array.from({length:W},(_,i)=>Math.exp(-i/W*5)*(.5+.5*hash(i)));
  if(!data){label(g,`No RAM-R${n} in this kit, so there is nothing to play`);return}
  const a=y.STRT/127,b=y.END/127,rev=b<a;wave(g,W,H,data,a,b,rev?cssv("--ink"):cssv("--ink"),inkA(0.26));
  const m=S.locks.get(lk(S.sel,"STRT"));if(m){g.strokeStyle=cssv("--ink");g.lineWidth=1;g.font="10px Silkscreen, monospace";g.fillStyle=cssv("--ink");
   [...m.entries()].sort((p,q)=>p[1]-q[1]).forEach(([st,v])=>{const x=Math.round(v/127*W)+.5;g.beginPath();g.moveTo(x,22);g.lineTo(x,H-4);g.stroke();g.fillText(st+1,x+2,H-6)})}
  label(g,(n?`RAM-P${n} · plays RAM-R${n}`:"ROM sample")+(rev?" · reversed":""))},
 handles(W,H){const y=S.tracks[S.sel].syn;return[{x:y.STRT/127*W,y:H-14,k:"STRT",c:cssv("--ink"),drag:x=>{y.STRT=clamp(Math.round(x/W*127))}},{x:y.END/127*W,y:30,k:"END",c:cssv("--ink"),drag:x=>{y.END=clamp(Math.round(x/W*127))}}]}};
ED.rec={draw(g,W,H){const tr=S.tracks[S.sel],n=+tr.m.slice(5),R=tr.syn,data=capture(n,W),len=R.LEN/127;grid(g,W,H);
  wave(g,W,H,data,0,1,cssv("--ink"),"transparent");g.fillStyle=inkA(0.3);g.fillRect(len*W,0,W-len*W,H);
  g.fillStyle=cssv("--ink");g.font="10px Silkscreen, monospace";for(let k=0;k<=32;k+=4){const x=k/32*W;g.fillText(k?k+"":"",x+2,H-4)}

 handles(W,H){const R=S.tracks[S.sel].syn;return[{x:R.LEN/127*W,y:H/2,k:"LEN",c:cssv("--ink"),drag:x=>{R.LEN=clamp(Math.round(x/W*127))}}]}};
ED.slot={draw(g,W,H,c){const n=+c.dataset.n,p=playTrack(n),data=capture(n,W);grid(g,W,H);if(!data){label(g,"Empty");return}
  const y=p>=0?S.tracks[p].syn:{STRT:0,END:127};const a=y.STRT/127,b=y.END/127;wave(g,W,H,data,a,b,b<a?cssv("--ink"):cssv("--ink"),inkA(0.26));
  const m=p>=0&&S.locks.get(lk(p,"STRT"));if(m){g.strokeStyle=cssv("--ink");[...m.values()].forEach(v=>{const x=Math.round(v/127*W)+.5;g.beginPath();g.moveTo(x,20);g.lineTo(x,H-2);g.stroke()})}
  label(g,`RAM-R${n} capture`)},

function chopCls(p,s){const t=S.tracks[p],c=["cp"];if(s%4===0)c.push("q");if(s%16===0&&s)c.push("gap");if(t.trigs[s])c.push("on");if(S.playing&&s===S.step)c.push("ph");return c.join(" ")}

/* ===== Undo / redo: plain snapshots of everything the user edits ===== */
const H={undo:[],redo:[],last:null};
function snap(){return JSON.stringify({tracks:S.tracks.map(t=>({...t,acc:[...t.acc],slide:[...t.slide]})),locks:[...S.locks].map(([k,m])=>[k,[...m]]),song:S.song,mfx:S.mfx,links:S.ctl.links,
 len:S.len,mult:S.mult,swing:S.swing,accAmt:S.accAmt,mode:S.mode,kitState:S.kitState,pat:S.pat,kit:S.kit,workName:S.workName,kits:S.kits,patKit:S.patKit,patInfo:S.patInfo,patData:S.patData},(k,v)=>v===Infinity?"∞":v)}
function restore(str){const o=JSON.parse(str,(k,v)=>v==="∞"?Infinity:v);S.tracks=o.tracks.map(t=>({...t,acc:new Set(t.acc),slide:new Set(t.slide)}));S.locks=new Map(o.locks.map(([k,m])=>[k,new Map(m)]));
 S.song=o.song;S.mfx=o.mfx;S.ctl.links=o.links;S.len=o.len;S.mult=o.mult;S.swing=o.swing;S.accAmt=o.accAmt;S.mode=o.mode;
 S.pat=o.pat;S.queued=null;S.kit=o.kit;S.workName=o.workName;S.kits=o.kits;S.patKit=o.patKit;S.patInfo=o.patInfo;S.patData=o.patData;setKitState(o.kitState)}
function commit(){const cur=snap();if(H.last==null){H.last=cur;return}if(cur!==H.last){H.undo.push(H.last);if(H.undo.length>200)H.undo.shift();H.redo=[];H.last=cur;renderTop()}}
function undo(){if(!H.undo.length){toast("Nothing to undo.");return}const cur=snap();H.redo.push(cur);const prev=H.undo.pop();restore(prev);H.last=prev;tx();render();toast("Undo")}
function redo(){if(!H.redo.length){toast("Nothing to redo.");return}const cur=snap();H.undo.push(cur);const nx=H.redo.pop();restore(nx);H.last=nx;tx();render();toast("Redo")}
["pointerup","keyup","click","change"].forEach(ev=>document.addEventListener(ev,()=>setTimeout(commit,0)));

/* ===== Copy / clear / paste (the hardware's COPY CLEAR PASTE, per workspace) ===== */
let CLIP=null;
function pageRange(){const[a,b]=vis();return[a,b]}
function secAction(kind){
 if(S.ws==="seq"){const t=S.sel,tr=S.tracks[t],[a,b]=pageRange();const where=`track ${t+1}, steps ${a+1}–${b}`;
  if(kind==="copy"){CLIP={type:"trackpage",trigs:tr.trigs.slice(a,b),acc:[...tr.acc].filter(x=>x>=a&&x<b).map(x=>x-a),slide:[...tr.slide].filter(x=>x>=a&&x<b).map(x=>x-a),
    locks:[...S.locks].filter(([k])=>+k.split(":")[0]===t).map(([k,m])=>[k.split(":")[1],[...m].filter(([st])=>st>=a&&st<b).map(([st,v])=>[st-a,v])])};toast("Copied "+where+".");return}
  if(kind==="clear"){for(let i=a;i<b;i++){tr.trigs[i]=false;tr.acc.delete(i);tr.slide.delete(i);clearStep(t,i)}markDirty();render();toast("Cleared "+where+".");return}
  if(kind==="paste"){if(CLIP?.type!=="trackpage"){toast("Copy a track page first.");return}for(let i=a;i<b;i++){tr.trigs[i]=!!CLIP.trigs[i-a];tr.acc.delete(i);tr.slide.delete(i);clearStep(t,i)}
   CLIP.acc.forEach(x=>tr.acc.add(x+a));CLIP.slide.forEach(x=>tr.slide.add(x+a));let skipped=0;CLIP.locks.forEach(([p,steps])=>{if(!params(t).includes(p)){skipped++;return}steps.forEach(([st,v])=>setLock(t,p,st+a,v,true))});
   markDirty();render();toast("Pasted into "+where+"."+(skipped?" "+skipped+" lock(s) skipped: this machine has no such parameter.":""));return}}
 if(S.ws==="sound"){const t=S.sel,tr=S.tracks[t];
  if(kind==="copy"){CLIP={type:"sound",m:tr.m,syn:{...tr.syn},fx:{...tr.fx},rt:{...tr.rt},lfo:{...tr.lfo}};toast("Copied the sound of track "+(t+1)+" ("+tr.m+").");return}
  if(kind==="clear"){const pg=pages(tr.m);tr.syn=mk(pg.s,true);tr.fx=mk(pg.e);tr.rt=mk(pg.r);markDirty();render();toast("Track "+(t+1)+" reset to the machine's defaults.");return}
  if(kind==="paste"){if(CLIP?.type!=="sound"){toast("Copy a track's sound first.");return}tr.m=CLIP.m;tr.fam=famOf(CLIP.m);tr.name=nameOf(CLIP.m);tr.syn={...CLIP.syn};tr.fx={...CLIP.fx};tr.rt={...CLIP.rt};tr.lfo={...CLIP.lfo,TRCK:t};markDirty();render();toast("Pasted "+CLIP.m+" onto track "+(t+1)+".");return}}
 if(S.ws==="song"){const i=S.songSel,r=S.song[i];
  if(kind==="copy"){if(r.type==="end"){toast("END cannot be copied.");return}CLIP={type:"row",row:JSON.parse(JSON.stringify(r))};toast("Copied row "+String(i+1).padStart(3,"0")+".");return}
  if(kind==="clear"){songAction("del");return}
  if(kind==="paste"){if(CLIP?.type!=="row"){toast("Copy a song row first.");return}if(S.song.length>=256){toast("A song holds 256 rows.");return}const at=r.type==="end"?i:i+1;S.song.splice(at,0,JSON.parse(JSON.stringify(CLIP.row)));S.songSel=at;markDirty();render();return}}
 toast("Copy, clear and paste work in Sequence, Sound and Song.")}

/* kit content = machines, parameters, effects, routing, LFOs, groups, master effects, name (manual p.14) */
function captureKit(){return clone({tracks:S.tracks.map(t=>({m:t.m,name:t.name,fam:t.fam,syn:t.syn,fx:t.fx,rt:t.rt,lfo:t.lfo,muteGroup:t.muteGroup,trigGroup:t.trigGroup,out:t.out||"MAIN"})),mfx:S.mfx})}

function factoryKit(k){const d=clone(FACTORY);if(!k)return d;
 if(k%3===1){setMach(d,0,"EFM-BD");setMach(d,1,"EFM-SD")}else if(k%3===2){setMach(d,0,"E12-BD");setMach(d,1,"E12-SD")}
 d.tracks.forEach((t,i)=>Object.keys(t.syn).forEach((p,j)=>t.syn[p]=clamp(t.syn[p]+(k*37+i*11+j*5)%31-15)));d.mfx.echo.v.FB=clamp(48+k*3);d.mfx.gate.v.DEC=clamp(60+k*4);return d}

function pruneLocks(){for(const k of [...S.locks.keys()]){const[t,p]=k.split(":");if(!params(+t).includes(p))S.locks.delete(k)}if(!params(S.sel).includes(S.lane))S.lane=params(S.sel).includes("FLTF")?"FLTF":params(S.sel)[0]}

/* pattern content = trigs, accents, slides, locks, length (+ kit link) */
function capturePat(){return{len:S.len,tr:S.tracks.map(t=>({g:t.trigs.map(b=>b?1:0).join(""),acc:[...t.acc],slide:[...t.slide]})),locks:[...S.locks].map(([k,m])=>[k,[...m]])}}
function emptyPat(len){return{len,tr:S.tracks.map(()=>({g:"0".repeat(64),acc:[],slide:[]})),locks:[]}}
function applyPat(d){S.len=d.len;d.tr.forEach((x,i)=>{const t=S.tracks[i];t.trigs=[...x.g].map(c=>c==="1");t.acc=new Set(x.acc);t.slide=new Set(x.slide)});S.locks=new Map(d.locks.map(([k,m])=>[k,new Map(m)]));pruneLocks()}
for(let p=1;p<12;p++){const r=(p*2)%32;S.patData[p]={len:S.patInfo[p].len,tr:SEED.map((g,i)=>{const s=(g.slice(r)+g.slice(0,r));return{g:(i+p)%4===3?"0".repeat(64):s+s,acc:i<2?[12,28]:[],slide:[]}}),locks:[]}}

/* firmware honesty: what each action is on the real machine */
const KTIP={
 load:"LOAD KIT (SysEx 0x58). Unsaved edits are discarded; the machine keeps them in its UNDO KIT (the first entry of its kit list). EXTENDED: the current pattern is relinked to this kit. Whether the firmware relinks on a manual load is not tested",
 save:"SAVE KIT to the current slot (SysEx 0x59). The overwritten slot goes to the machine's UNDO KIT",
 saveas:"SAVE KIT n to the selected slot (SysEx 0x59). On the machine SAVE KIT n also makes n the current kit (P1), so the editor switches to it. The old slot keeps what it had",
 copy:"Reads the slot with a kit dump request (0x53). The current kit is read from the working kit in memory (P3), so unsaved edits come along. On other firmware that needs SAVE KIT first",
 paste:"Kit dump (0x52) into the slot. A dump only writes the stored slot, so pasting into the current kit also sends LOAD KIT (0x58) to be heard (P1)",
 clear:"There is no SysEx CLEAR KIT. The editor sends a kit dump with init values. What the machine's own CLEAR KIT leaves in a slot (machines, name) is not checked",
 rename:"Current kit: SysEx 0x55 sets the working kit's name (16 ASCII bytes); SAVE stores it. Other slots: dump request, new name, dump back. Which characters the MD font draws is not checked",
 reload:"LOAD KIT on the current slot (0x58): the edits are discarded. The machine keeps them in its UNDO KIT",
 drag:"Drag onto another slot to copy it: dump request, then a dump into the target"};
const PTIP={
 go:"LOAD PATTERN (SysEx 0x57). While playing the machine switches at the pattern end. P1: its status reports the new pattern about 2 steps early and never says queued, so the editor keeps the queue itself",
 now:"Switch now (Shift+click, Shift+Enter). Stopped: the same as a click. Playing: the machine only switches at the pattern end, so the editor would send STOP, LOAD PATTERN, PLAY (not tested)",
 copy:"Pattern dump request (0x68). Copies notes, locks and the kit link, like the machine's COPY PATTERN",
 paste:"Pattern dump (0x67) into the slot. Pattern dumps are live (P1). Pasting over the current pattern does not load its kit here; whether the machine does is not tested",
 clear:"There is no SysEx CLEAR PATTERN. The editor sends an empty pattern dump. The machine's own CLEAR PATTERN may reset more (length, scale) than this does"};

  <button data-la="copy" title="${PTIP.copy} (Cmd+C)">Copy</button><button data-la="paste"${dis(CLIP?.type!=="pat")} title="${CLIP?.type==="pat"?"Paste "+patName(CLIP.from)+". ":"Copy a pattern first. "}${PTIP.paste} (Cmd+V)">Paste</button><button class="danger" data-la="clear"${dis(!hasPat(p))} title="${PTIP.clear} (Delete)">Clear</button></div></div>

 if(sig===LIB.sig&&pop.firstChild){if(focus&&!pop.contains(document.activeElement))libFocus();return}LIB.sig=sig;
 pop.innerHTML=LIB.open==="kit"?drawKitLib():drawPatLib();pop.dataset.kind=LIB.open;pop.setAttribute("aria-label",LIB.open==="kit"?"Kit library":"Pattern chooser");
 const inp=$("#lsin");if(inp){inp.focus({preventScroll:true});inp.select();return}if(had)libFocus()}

 if(pop.scrollHeight>pop.clientHeight){const a=el.getBoundingClientRect(),b=pop.getBoundingClientRect();if(a.top<b.top)pop.scrollTop-=b.top-a.top+8;else if(a.bottom>b.bottom)pop.scrollTop+=a.bottom-b.bottom+8}}

/* ----- kit actions (all editor state, so all undoable) ----- */
function kitLoad(k){if(k===S.kit){if(S.kitState==="edited")kitReload();else toast(kitName(k)+" is already the current kit.");return}
 const go=()=>{S.kit=k;applyKit(kitData(k));S.workName=S.kits[k].name;if(S.mode==="EXTENDED")S.patKit[S.pat]=k;setKitState("clean");tx();render();drawLib(true);toast("Loaded "+kitName(k)+".")};
 if(S.kitState==="edited"){ask(`Load <b>${kitName(k)}</b>? Your edits to <b>${kitName(S.kit)}</b> are not saved on the machine and will be lost.`,[["Save kit, then load","cream",()=>{saveKit();go()}],["Load and lose edits","danger",go],["Cancel","",()=>drawLib(true)]]);return}go()}
function kitSave(){saveKit();drawLib(true)}
function kitSaveAs(k){if(k===S.kit){kitSave();return}
 const go=()=>{const from=S.kit;S.kits[k]={name:S.workName,empty:false,data:captureKit()};S.kit=k;if(S.mode==="EXTENDED")S.patKit[S.pat]=k;setKitState("clean");tx();render();drawLib(true);toast("Saved as "+kitName(k)+". It is now the current kit; K"+nn(from)+" keeps its saved version.")};
 if(!S.kits[k].empty){ask(`Overwrite <b>${kitName(k)}</b> with the current kit <b>${kitName(S.kit)}</b>? The machine keeps the overwritten kit in its UNDO KIT.`,[["Overwrite","danger",go],["Cancel","",()=>drawLib(true)]]);return}go()}
function kitSrc(k){return k===S.kit?{from:k,name:S.workName,empty:false,data:captureKit()}:{from:k,name:S.kits[k].name,empty:S.kits[k].empty,data:S.kits[k].data?clone(S.kits[k].data):null}}
function kitCopy(k){CLIP={type:"kit",...kitSrc(k)};drawLib(true);toast("Copied "+kitName(k)+(k===S.kit&&S.kitState==="edited"?" with its unsaved edits.":"."))}
function kitPut(k,src,verb){if(src.from===k){toast("That is the same slot.");return}
 const go=()=>{S.kits[k]={name:src.name,empty:src.empty,data:src.data?clone(src.data):src.empty?null:kitData(src.from)};if(k===S.kit){applyKit(kitData(k));S.workName=S.kits[k].name;setKitState("clean")}tx();render();drawLib(true);toast(verb+" K"+nn(src.from)+" into "+kitName(k)+".")};
 const busy=!S.kits[k].empty||k===S.kit;if(busy){ask(`${verb} <b>K${nn(src.from)} ${escH(src.name||"EMPTY")}</b> over <b>${kitName(k)}</b>?${k===S.kit?" It is the current kit"+(S.kitState==="edited"?": its unsaved edits are lost.":", so it is loaded too."):""}`,[["Overwrite","danger",go],["Cancel","",()=>drawLib(true)]]);return}go()}
function kitPaste(k){if(CLIP?.type!=="kit"){toast("Copy a kit first.");return}kitPut(k,CLIP,"Paste")}
function kitClear(k){if(S.kits[k].empty&&k!==S.kit){toast(kitName(k)+" is already empty.");return}
 ask(`Clear <b>${kitName(k)}</b>?${k===S.kit?" It is the current kit: the tracks go back to init values"+(S.kitState==="edited"?" and the unsaved edits are lost.":"."):""}${linked(k).length?" "+linked(k).length+" pattern(s) link to it.":""}`,[["Clear kit","danger",()=>{S.kits[k]={name:"",empty:true,data:null};if(k===S.kit){applyKit(clearedKit());S.workName="";setKitState("clean")}tx();render();drawLib(true);toast("Cleared K"+nn(k)+".")}],["Cancel","",()=>drawLib(true)]])}
function kitReload(){if(S.kitState!=="edited"){toast(kitName(S.kit)+" matches its saved slot. Nothing to reload.");return}
 ask(`Reload <b>${kitName(S.kit)}</b> from the machine? Your edits are lost.`,[["Reload (discard edits)","danger",()=>{applyKit(kitData(S.kit));S.workName=S.kits[S.kit].name;setKitState("clean");tx();render();drawLib(true);toast("Reloaded "+kitName(S.kit)+" from the machine.")}],["Cancel","",()=>drawLib(true)]])}
function startRename(k){if(LIB.open!=="kit")return;LIB.sel=k;LIB.renaming=k;drawLib(true)}
function finishRename(ok){const k=LIB.renaming;if(k==null)return;const v=($("#lsin")?.value||"").toUpperCase().replace(KBAD,"").slice(0,16).trimEnd();LIB.renaming=null;
 if(ok&&v!==kDisp(k)){if(k===S.kit){S.workName=v;setKitState("edited");toast("Renamed the working kit. SAVE stores the name on the machine.")}else{const s=S.kits[k];if(s.empty&&!s.data)s.data=clearedKit();s.empty=false;s.name=v;tx();toast("Renamed K"+nn(k)+" on the machine.")}renderTop()}
 drawLib(true)}
/* ----- pattern actions ----- */
function patSrc(p){return{from:p,has:hasPat(p),kit:S.patKit[p],data:p===S.pat?capturePat():clone(S.patData[p]||emptyPat(S.patInfo[p].len))}}
function patCopy(p){CLIP={type:"pat",...patSrc(p)};drawLib(true);toast("Copied "+patName(p)+": notes, locks"+(S.mode==="EXTENDED"?" and its kit link.":"."))}
function patPut(p,src,verb){if(src.from===p){toast("That is the same slot.");return}

/* The page's key map (P5): every shortcut is an entry here. The ? overlay is generated from it, so it
   lists what the keys really do. An entry with run() is dispatched by the one handler below (in order,
   the first match wins); an entry without run() is handled next to its own code (a panel, a focused
   control) and only described here. Nothing here knows the DOM of the workspaces. */
const Keys = (() => {
	const list = [];
	const norm = e => e.key === " " ? "Space" : e.key.length === 1 ? e.key.toUpperCase() : e.key;
	/* {keys: ["Z"], mod: "cmd"|"alt"|"shift"|"cmd+shift"|"", group, does, when?: () => bool, run?: e => void, field?: true} */
	function bind(entry) { list.push(Object.assign({ mod: "", when: null, field: false }, entry)); }
	function modOf(e) { return [e.metaKey || e.ctrlKey ? "cmd" : "", e.altKey ? "alt" : "", e.shiftKey ? "shift" : ""].filter(Boolean).join("+"); }
	document.addEventListener("keydown", e => {
		const inField = e.target.closest?.("input,select,textarea,[role=slider]"), k = norm(e), m = modOf(e);
		for (const b of list) {
			if (!b.run || !b.keys.includes(k)) continue;
			const want = b.mod || "", ok = want === m || (want === "" && m === "shift" && k.length === 1 && !/[A-Z]/.test(k));
			if (!ok || (inField && !b.field) || (b.when && !b.when())) continue;
			e.preventDefault(); b.run(e); return;
		}
	});
	const label = b => [...(b.mod ? b.mod.split("+").map(x => ({ cmd: "⌘", alt: "⌥", shift: "⇧" }[x])) : []), b.keys.map(k => ({ Space: "Space", ArrowLeft: "←", ArrowRight: "→", ArrowUp: "↑", ArrowDown: "↓", Escape: "Esc", Delete: "Delete", Backspace: "⌫", Enter: "Enter" }[k] || k)).join(" / ")].join("");
	return { bind, list: () => list.slice(), label };
})();

/* ===== The ? overlay ===== */
function drawKeys() {
	const pop = $("#keyspop"); if (!pop) return;
	const groups = [];
	for (const b of Keys.list()) { let g = groups.find(x => x.name === b.group); if (!g) groups.push(g = { name: b.group, rows: [] }); g.rows.push(b); }
	pop.innerHTML = `<div class="libhead"><span class="cap">Keys</span><span class="note">Every shortcut of the editor, from its key map. ? or Esc closes.</span><button class="libx" data-keysx="1">Esc</button></div>
	<div class="keysgrid">${groups.map(g => `<section class="card"><header><h3>${g.name}</h3></header><div class="keyrows">${g.rows.map(b => `<div class="keyrow"><kbd>${Keys.label(b)}</kbd><span>${b.does}</span></div>`).join("")}</div></section>`).join("")}</div>`;
	pop.hidden = false;
	const r = $(".lcdpanel").getBoundingClientRect(), top = Math.max(16, r.bottom + 8);
	pop.style.top = (top + scrollY) + "px"; pop.style.maxHeight = Math.max(240, innerHeight - top - 12) + "px"; pop.style.left = Math.max(16, (document.documentElement.clientWidth - pop.offsetWidth) / 2 + scrollX) + "px";
}
function toggleKeys(on) { const pop = $("#keyspop"); if (!pop) return; if (on ?? pop.hidden) drawKeys(); else pop.hidden = true; }
Keys.bind({ keys: ["?"], group: "Help", does: "This list of keys", run: () => toggleKeys() });

 const cmd={driver:{set:"driver",device:v},output:{set:"output",device:v},input:{set:"input",device:v},rate:{set:"sampleRate",value:+v},buffer:{set:"bufferSize",value:+v},midiOut:{set:"midiOutput",device:v}}[f];if(cmd)audioSend(cmd)});

/* The panel's self-test (the editors' ?selftest=p6audio, or the mockup's console): open the panel, see
   the level arrive, change the buffer size and the output device and back, and check after each change
   that the machine keeps playing (its step moves). T gives log, play(on), step() and playing(). */
async function audioSelfTest(T){const sleep=ms=>new Promise(r=>setTimeout(r,ms)),res=[];
 const until=async(f,ms=8000)=>{const t0=Date.now();while(Date.now()-t0<ms){const D=audioDoc();if(D&&f(D))return D;await sleep(100)}const D=audioDoc();throw new Error("timeout: output "+D?.output?.id+", buffer "+D?.bufferSize?.value+", running "+D?.running+(D?.error?", error "+D.error:""))};
 const moving=async()=>{const s0=T.step();for(let i=0;i<30;i++){await sleep(100);if(T.playing()&&T.step()!==s0)return true}return false};
 const check=async(name,fn)=>{try{const n=await fn();res.push(true);T.log("ok   "+name+(n?": "+n:""))}catch(e){res.push(false);T.log("FAIL "+name+": "+e.message)}};
 const D0=await until(D=>D.standalone,15000),out0=D0.output.id,buf0=D0.bufferSize.value,muted0=!!D0.input.muted;
 T.log("devices: "+D0.output.list.length+" outputs ("+out0+"), "+D0.input.list.length+" inputs, "+D0.sampleRate.value+" Hz, buffer "+buf0+", "+(D0.midiInputs||[]).length+" MIDI inputs, running "+D0.running);
 let levels=0;const lv=audioLevel;window.audioLevel=v=>{levels++;lv(v)};
 await check("panel opens",async()=>{openAudio();await sleep(700);if(!AP.open||$("#audiopop").hidden)throw new Error("not shown");const n=$("#audiopop").querySelectorAll("select,button").length;return n+" controls, "+levels+" level updates"});
 window.audioLevel=lv;
 T.play(true);await sleep(1500);
 await check("playing before the changes",async()=>{if(!(await moving()))throw new Error("the step does not move");return "step "+T.step()});
 const buf1=D0.bufferSize.list.find(b=>b!==buf0&&b>=128&&b<=1024)??D0.bufferSize.list.find(b=>b!==buf0);
 await check("buffer size "+buf0+" -> "+buf1,async()=>{if(buf1==null)throw new Error("one buffer size only");audioSend({set:"bufferSize",value:buf1});const D=await until(D=>D.bufferSize.value===buf1&&D.running);if(!(await moving()))throw new Error("audio stopped");return D.latencyMs+" ms, still playing"});
 await check("buffer size back to "+buf0,async()=>{audioSend({set:"bufferSize",value:buf0});await until(D=>D.bufferSize.value===buf0&&D.running);if(!(await moving()))throw new Error("audio stopped");return "still playing"});
 const out1=D0.output.list.find(o=>o!==out0);
 await check("output "+out0+" -> "+(out1??"-"),async()=>{if(!out1)return "one output device only, skipped";audioSend({set:"output",device:out1});await until(D=>D.output.id===out1&&D.running);if(!(await moving()))throw new Error("audio stopped");return "still playing"});
 await check("output back to "+out0,async()=>{if(!out1)return "skipped";audioSend({set:"output",device:out0});await until(D=>D.output.id===out0&&D.running);if(!(await moving()))throw new Error("audio stopped");return "still playing"});
 await check("input mute toggles and is kept",async()=>{audioSend({set:"mute",on:!muted0});await until(D=>!!D.input.muted===!muted0);audioSend({set:"mute",on:muted0});await until(D=>!!D.input.muted===muted0);return muted0?"muted again":"live again"});
 T.play(false);closeAudio();await sleep(300);
 T.log((res.every(Boolean)?"PASS ":"FAIL ")+res.filter(Boolean).length+"/"+res.length)}

const AUD={schema:"gm-audio/devices",version:1,standalone:true,driver:{id:"CoreAudio",list:["CoreAudio"]},
 output:{id:"MacBook Pro Speakers",list:["MacBook Pro Speakers","External Headphones","Audient iD14"]},

function audioSend(c){const D=AUD,say=t=>typeof toast==="function"&&toast(t);

 if(c.do==="bluetooth"){say("The system's Bluetooth MIDI dialog opens here");return}
 if(c.set==="output"){D.output.id=c.device;const n=c.device==="Audient iD14"?4:2;D.outputChannels=Array.from({length:n},(_,i)=>({name:"Output "+(i+1),on:i<2}))}
 else if(c.set==="input")D.input.id=c.device;
 else if(c.set==="mute")D.input.muted=c.on;
 else if(c.set==="outputChannel"){const on=D.outputChannels.filter(x=>x.on).length;if(!c.on&&on<=1){D.error="At least one output channel stays on"}else{D.outputChannels[c.index].on=c.on;D.error=""}}
 else if(c.set==="sampleRate")D.sampleRate.value=c.value;
 else if(c.set==="bufferSize")D.bufferSize.value=c.value;
 else if(c.set==="midiInput"){const m=D.midiInputs.find(x=>x.id===c.device);if(m)m.on=c.on}
 else if(c.set==="midiOutput")D.midiOutput.id=c.device;
 if(c.set!=="outputChannel")D.error="";
 D.latencyMs=Math.round((D.bufferSize.value+96)/D.sampleRate.value*10000)/10;drawAudio()}
