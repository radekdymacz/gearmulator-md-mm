<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Machinedrum Editor</title>
<!-- The Machinedrum Editor page: the approved mockup
     doc/modern-ux/mockup/index.html on the plug-in's documents. Markup and
     stylesheet are generated by doc/modern-ux/sync-mdstudio-skin.py; do not
     edit them by hand. The editor inlines the stylesheet, scripts and any
     bundled fonts before loading (WKWebView reads only this file). -->
<link rel="stylesheet" href="mdDesk.css">
<!-- first, before the page draws: the stylesheet without what an older WebKit lacks (macOS 12) -->
<script src="deskCompat.js"></script>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="left">
      <div class="brand" aria-label="Machinedrum Editor"><b>MACHINEDRUM</b><small class="ed">Editor</small></div>
    <div class="wsgroup"><span class="grplabel">Workspace</span>
    <nav class="tabs" role="tablist" id="tabs">
      <button role="tab" data-ws="seq"><i class="led"></i><span>Sequence</span><small>1</small></button>
      <button role="tab" data-ws="sound"><i class="led"></i><span>Sound</span><small>2</small></button>
      <button role="tab" data-ws="mix"><i class="led"></i><span>Mix</span><small>3</small></button>
      <button role="tab" data-ws="sampler"><i class="led"></i><span>Sampler</span><small>4</small></button>
      <button role="tab" data-ws="song"><i class="led"></i><span>Song</span><small>5</small></button>
    </nav></div>
    </div>
    <div class="midgrp">
      <div class="lcdgroup">
        <div class="lcdpanel">
          <div class="lcdfw" id="lcdfw" aria-hidden="true"><canvas id="lcdfwc" width="128" height="64"></canvas></div>
          <div class="f trf"><small class="engf"><select id="engsel" data-k="1" hidden><option value="emu">EMU OS 1.63</option><option value="hw">HW MIDI</option><option value="global">GLOBAL…</option><option value="audio">AUDIO/MIDI…</option><option value="rom">LOAD ROM</option></select><button class="kselbtn lcdeng" type="button" data-for="engsel" aria-haspopup="listbox" aria-expanded="false" aria-label="Engine: emulator or hardware" title="Engine: run the emulator, or edit a real Machinedrum over MIDI"><i class="led on" id="engled"></i><span>EMU OS 1.63</span><svg viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button></small><span class="lcdt">
            <button class="lt rec" id="rec" aria-pressed="false" aria-label="Record" title="Record (Alt+Space)"><i class="led" id="recled"></i>●</button>
            <button class="lt" id="play" aria-pressed="false" aria-label="Play" title="Play / stop (Space)"><i class="led" id="playled"></i><span id="playico">▶</span></button>
</span></div>
          <div class="f"><small>Tempo <i class="led" id="tempoled" aria-hidden="true"></i></small><b id="bpm" role="slider" tabindex="0" aria-label="Tempo in bpm" title="Drag up or down">124.0</b></div>
          <div class="f posf"><small>Position</small><b id="pos">--.--</b></div>
          <div class="f patf"><small>Pattern</small><span class="patrow"><button class="lcdbtn" id="patPrev" aria-label="Previous pattern" title="Previous pattern">‹</button><b id="pat" role="button" tabindex="0" aria-haspopup="dialog" aria-expanded="false" title="Pattern chooser: all 128 patterns">A01</b><button class="lcdbtn" id="patNext" aria-label="Next pattern" title="Next pattern">›</button></span></div>
          <div class="f kitf" id="kitf" role="button" tabindex="0" aria-haspopup="dialog" aria-expanded="false" title="Kit library: all 64 kits. Load, save, copy, rename"><small>Kit <span class="save" id="save" role="status"><i></i><span>saved</span></span></small><b id="kitname">K01 WAREHOUSE</b></div>
          <div class="f meter" id="meter" title="Locked parameters in this pattern. The Machinedrum allows 64."><small>Locks</small><b id="lockn">00/64</b></div>
          <div class="row2"><div class="lcd2" id="lcd2"></div><div class="syncf" id="syncf" role="status" title="In step with the machine"><i class="led txled" id="txled" aria-hidden="true"></i><b id="synct">Sync</b></div><div class="lcdsec"><button data-sec="copy" title="Copy (Cmd+C)">Copy</button><button data-sec="clear" title="Clear (Delete)">Clr</button><button data-sec="paste" title="Paste (Cmd+V)">Paste</button></div></div>
        </div>
      </div>
    </div>
    <div class="rightgrp">
    <div class="wsgroup setgroup"><span class="grplabel">Setup</span>
     <div class="tabs setkeys">
      <button class="skey" id="undo" aria-label="Undo" title="Undo (Cmd+Z)"><i class="ico">↶</i><span>Undo</span><small id="undon"></small></button>
      <button class="skey" id="redo" aria-label="Redo" title="Redo (Shift+Cmd+Z)"><i class="ico">↷</i><span>Redo</span><small id="redon"></small></button>
      <button class="skey" id="globkey" aria-pressed="false" aria-label="GLOBAL: the machine's global settings" title="GLOBAL: the machine's own settings, kept in its memory (MIDI channel, sync, the note map, routing). Also in the engine menu: GLOBAL…"><i class="led"></i><span>GLOBAL</span></button>
      <button class="skey" id="platekey" aria-label="Switch panel colour" title="Switch between the MKI silver and MKII black panel"><i class="led"></i><span>MKI</span></button>
     </div></div>
    </div>
    <p class="statusline" id="status" role="status" hidden></p>
    <p class="errline" id="errline" role="alert" hidden></p>
  </header>

  <div class="subbar" id="subbar"></div>
  <div class="body" id="body">
    <aside class="panel rail" id="rail" aria-label="Tracks"></aside>
    <main id="main"></main>
  </div>

</div>
<div class="machpop" id="machpop" role="dialog" aria-label="Choose a machine" hidden></div>
<div class="kpop" id="kpop" role="listbox" hidden></div>
<div class="libpop" id="libpop" role="dialog" hidden></div>
<div class="globpop libpop" id="globpop" role="dialog" aria-label="Global settings" hidden></div>
<div class="globpop libpop" id="keyspop" role="dialog" aria-label="Keys" hidden></div>
<div class="ampop" id="audiopop" role="dialog" aria-label="Audio and MIDI settings" hidden></div>
<div class="dlg" id="dlg" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="deskModal.js"></script>
<script src="deskMenu.js"></script>
<script src="deskCaps.js"></script>
<script src="deskBoot.js"></script>
<script src="deskSyx.js"></script>
<script src="deskBridge.js"></script>
<script src="deskDrop.js"></script>
<script src="deskZoom.js"></script>
<script src="deskAbout.js"></script>
<script src="deskDocs.js"></script>
<script src="deskOverlay.js"></script>
<script src="mdDeskModel.js"></script>
<script src="deskGen.js"></script>
<script src="mdDeskGen.js"></script>
<script src="deskKeys.js"></script>
<script src="deskKeyView.js"></script>
<script src="mdDeskKeys.js"></script>
<script src="mdDeskMod.js"></script>
<script src="deskTogglePaint.js"></script>
<script src="mdDeskApp.js"></script>
<script src="mdDeskSoundGroups.js"></script>
<script src="mdDeskTop.js"></script>
<script src="mdDeskSeq.js"></script>
<script src="mdDeskSound.js"></script>
<script src="mdDeskEditors.js"></script>
<script src="mdDeskMix.js"></script>
<script src="mdDeskSampler.js"></script>
<script src="mdDeskSong.js"></script>
<script src="mdDeskPicker.js"></script>
<script src="mdDeskControl.js"></script>
<script src="mdDeskGenUi.js"></script>
<script src="mdDeskComforts.js"></script>
<script src="mdDeskSelect.js"></script>
<script src="mdDeskRom.js"></script>
<script src="mdDeskGestures.js"></script>
<script src="mdDeskRender.js"></script>
<script src="mdDeskLive.js"></script>
<script src="mdDeskLibrary.js"></script>
<script src="mdDeskGlobal.js"></script>
<script src="deskAudio.js"></script>
<script src="mdDeskAudio.js"></script>
<script src="deskAudioSelfTest.js"></script>
<script src="mdDeskSelfTest.js"></script>
<script src="deskJourney.js"></script>
<script src="mdDeskJourneys.js"></script>
</body>
</html>
