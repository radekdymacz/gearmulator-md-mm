<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Monomachine Editor</title>
<!-- The Monomachine Editor page: the approved mockup (doc/modern-ux/mm-mockup)
     played by the plug-in: mmAdapter.js is its host (P6). Markup, stylesheet and
     mmMockup.js are copied by doc/modern-ux/sync-mmstudio-skin.py; do not edit
     them by hand. The editor inlines stylesheet, scripts and fonts. -->
<link rel="stylesheet" href="mmStudio.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="left">
      <div class="brand" aria-label="Monomachine Editor"><b>MONOMACHINE</b><small class="ed">Editor</small></div>
    <div class="wsgroup"><span class="grplabel">Workspace</span>
    <nav class="tabs" role="tablist" id="tabs">
      <button role="tab" data-ws="seq"><i class="led"></i><span>Sequence</span><small>1</small></button>
      <button role="tab" data-ws="sound"><i class="led"></i><span>Sound</span><small>2</small></button>
      <button role="tab" data-ws="mix"><i class="led"></i><span>Mix</span><small>3</small></button>
      <button role="tab" data-ws="perform"><i class="led"></i><span>Perform</span><small>4</small></button>
      <button role="tab" data-ws="song"><i class="led"></i><span>Song</span><small>5</small></button>
      <button role="tab" data-ws="control" hidden><i class="led"></i><span>Control</span><small>6</small></button>
    </nav></div>
    </div>
    <div class="midgrp">
      <div class="lcdgroup">
        <div class="lcdpanel"><div class="bootscr" id="bootscr" aria-hidden="true"><div class="bs1">MONOMACHINE <span id="bsmk">SFX-60 MKII</span></div><div class="bs2" id="bstxt">OS 1.32B · STARTING</div><div class="bsbar"><i id="bsbar"></i></div></div>
          <div class="f trf"><small class="engf"><select id="engsel" data-k="1" hidden><option value="emu">EMU OS 1.32B</option><option value="hw">HW MIDI</option><option value="audio">AUDIO/MIDI…</option><option value="rom">LOAD ROM</option></select><button class="kselbtn lcdeng" type="button" data-for="engsel" aria-haspopup="listbox" aria-expanded="false" aria-label="Engine: emulator or hardware" title="Engine: run the emulator, or edit a real Monomachine over MIDI"><i class="led on" id="engled"></i><span>EMU OS 1.32B</span><svg viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button></small><span class="lcdt">
            <button class="lt rec" id="rec" aria-pressed="false" aria-label="Record" title="Grid record (R). Hold R and press Space for live record."><i class="led" id="recled"></i>●</button>
            <button class="lt" id="play" aria-pressed="false" aria-label="Play" title="Play / stop (Space)"><i class="led" id="playled"></i><span id="playico">▶</span></button>
</span></div>
          <div class="f"><small>Tempo <i class="led" id="tempoled" aria-hidden="true"></i></small><b id="bpm" role="slider" tabindex="0" aria-label="Tempo in bpm" title="Drag up or down. Tempo is global: patterns do not store it, song rows can.">120.0</b></div>
          <div class="f posf"><small>Position</small><b id="pos">--.--</b></div>
          <div class="f patf"><small>Pattern</small><span class="patrow"><button class="lcdbtn" id="patPrev" aria-label="Previous pattern" title="Previous pattern">‹</button><b id="pat" role="button" tabindex="0" aria-haspopup="dialog" aria-expanded="false" title="Pattern chooser: 128 patterns in banks A-H. Click, or Enter.">A01</b><button class="lcdbtn" id="patNext" aria-label="Next pattern" title="Next pattern">›</button></span></div>
          <div class="f kitf" id="kitf" role="button" tabindex="0" aria-haspopup="dialog" aria-expanded="false" title="Kit library: all 128 kits. Load, save, save as, copy, paste, clear, rename."><small>Kit <span class="save" id="save" role="status"><i></i><span>saved</span></span></small><b id="kitname">K01 MONOMACHINE</b></div>
          <div class="f meter" id="meter" title="Locked parameters in this pattern. The Monomachine pools 62 across all twelve tracks."><small>Locks</small><b id="lockn">00/62</b></div>
          <div class="row2"><div class="lcd2" id="lcd2"></div><div class="syncf" id="syncf" role="status" title="In step with the machine"><i class="led txled" id="txled" aria-hidden="true"></i><b id="pst">Sync</b></div><div class="lcdsec"><button data-sec="copy" title="Copy (Cmd+C)">Copy</button><button data-sec="clear" title="Clear (Delete)">Clr</button><button data-sec="paste" title="Paste (Cmd+V)">Paste</button></div></div>
        </div>
      </div>
    </div>
    <div class="rightgrp">
    <div class="wsgroup setgroup"><span class="grplabel">Setup</span>
     <div class="tabs setkeys">
      <button class="skey" id="undo" aria-label="Undo" title="Undo (Cmd+Z)"><i class="ico">↶</i><span>Undo</span><small id="undon"></small></button>
      <button class="skey" id="redo" aria-label="Redo" title="Redo (Shift+Cmd+Z)"><i class="ico">↷</i><span>Redo</span><small id="redon"></small></button>
      <button class="skey" id="learnkey" hidden aria-pressed="false" title="Map any value to a controller knob (L)"><i class="led"></i><span>Learn</span><small>L</small></button>
      <button class="skey" id="platekey" aria-label="Switch MKI or MKII" title="MKI or MKII. Same silver plate; the MKII adds user waveforms and the DigiPRO Doubledraw and Ensemble machines."><i class="led"></i><span>MKII</span></button>
     </div></div>
    </div>
  </header>

  <div class="body" id="body">
    <aside class="panel rail" id="rail" aria-label="Tracks"></aside>
    <main id="main"></main>
  </div>
</div>
<div class="libpop" id="libpop" role="dialog" hidden></div>
<div class="machpop" id="machpop" role="dialog" aria-label="Choose a machine" hidden></div>
<div class="kpop" id="kpop" role="listbox" hidden></div>
<div class="ampop" id="audiopop" role="dialog" aria-label="Audio and MIDI settings" hidden></div>
<div class="dlg" id="dlg" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<svg class="cordsvg" id="cordsvg" aria-hidden="true"></svg>
<script src="mdDeskBridge.js"></script>
<script src="mmAdapter.js"></script>
<script src="mmSelfTest.js"></script>
<script src="mmMockup.js"></script>
<script src="mmConvert.js"></script>
</body>
</html>
