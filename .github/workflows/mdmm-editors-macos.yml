name: MD/MM Editors macOS

# This fork's macOS build and start test (doc/modern-ux/FOUNDATION.md, "Build and check" and "CI start tests";
# upstream's elektron-macos.yml was deleted in 0.5). Called by
# mdmm-editors.yml on every push (and by mdmm-editors-release.yml when no tested build of the tag's commit exists).
#
#   build     the fixture-free universal package, once: scripts/macos/build_mdmm.sh with the release
#             settings (ThinLTO, the committed PGO profile, arm64 + x86_64, unit and plug-in tests, package check),
#             on Ninja with ccache. Its
#             zip (artifact macos-mdmm-universal) is what the start test below and the release installers use.
#   installers unsigned .pkg + .dmg from that zip (the release's script): an artifact minutes after the build.
#   vst3host  the start test's minimal VST3 host (scripts/vst3EditorHost), beside the build.
#   smoke     on a clean macos-14 and macos-15: starts each standalone and each VST3 (in the host) of that zip with
#             no ROM, reads "<machine> firmware needed" from the page through the Accessibility API, presses real
#             keys, runs auval on each AU, keeps screenshots (scripts/macos/smoke_mdmm.sh), then pluginval
#             (strictness 5, no ROM) on each VST3 and AU.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: macOS universal package (fixture-free, ccache)
    # The release installers have always been built on macos-15 (Xcode 16): the one build per push is the one the
    # release packages, so it is built there.
    runs-on: macos-15
    timeout-minutes: 120
    env:
      # Paths below the checkout are hashed relative to it.
      CCACHE_BASEDIR: ${{ github.workspace }}
      # The compiler's own version, not the /usr/bin shim's mtime: a runner image with another Xcode misses.
      CCACHE_COMPILERCHECK: "%compiler% -v"
      CCACHE_SLOPPINESS: "include_file_mtime,include_file_ctime,time_macros,pch_defines"
      CCACHE_MAXSIZE: 3G
      CCACHE_COMPRESS: "true"
      # build_mdmm.sh passes no generator: a new build tree takes these from the environment (cmake(1)).
      CMAKE_GENERATOR: Ninja
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CMAKE_OBJC_COMPILER_LAUNCHER: ccache
      CMAKE_OBJCXX_COMPILER_LAUNCHER: ccache

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install ccache and Ninja
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew install ccache ninja
          ccache --version | head -n 1; ninja --version
          echo "CCACHE_DIR=${RUNNER_TEMP}/ccache" >> "${GITHUB_ENV}"

      # One cache per branch and toolchain; a new branch starts from main's (the default branch: its caches are
      # readable from every branch). Saved after every run, pass or fail, under a new key.
      - name: Restore the compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-v1-macos15-universal-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ccache-v1-macos15-universal-${{ github.ref_name }}-
            ccache-v1-macos15-universal-main-

      - name: Test macOS release tooling
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          /bin/bash -n scripts/macos/build_mdmm.sh scripts/macos/verify_mdmm_package.sh
          python3 scripts/macos/test_write_mdmm_receipt.py
          python3 scripts/macos/test_check_mdmm_core_capacity.py
          # The committed profile is profile data only (names, hashes, counts): no firmware can be in it.
          python3 scripts/macos/mdmm_pgo_profile.py check source/elektron/md/pgo/mdmm-macos.proftext

      - name: Build, test and package MD/MM
        env:
          GEARMULATOR_REQUIRE_FIRMWARE_TESTS: "0"
          GEARMULATOR_MDMM_MACOS_ARCHITECTURES: "arm64;x86_64"
          # The profile committed in source/elektron/md/pgo (trained locally with the ROMs; CI never has them), for
          # both slices; a stale or missing profile only warns (doc/release/CI.md, "PGO").
          GEARMULATOR_MDMM_APPLE_PGO_MODE: "committed"
        run: |
          ccache --zero-stats > /dev/null
          ./scripts/macos/build_mdmm.sh \
            "${{ github.workspace }}" \
            "${{ runner.temp }}/gearmulator-elektron-build" \
            "${{ github.workspace }}/artifacts/macos-mdmm"

      - name: Compiler cache statistics
        if: always()
        run: |
          ccache --show-stats --verbose | tee "${RUNNER_TEMP}/ccache-stats.txt"
          {
            echo "### ccache (macOS universal)"
            echo '```'
            ccache --show-stats
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Save the compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-v1-macos15-universal-${{ github.ref_name }}-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        with:
          name: macos-mdmm-universal
          path: artifacts/macos-mdmm/Gearmulator-Elektron-macOS-*.zip
          if-no-files-found: error
          retention-days: 14

  # The two installers and two disk images of this push, unsigned (ad-hoc), made by the script the release uses
  # (scripts/macos/package_mdmm_installers.sh) from the zip above: downloadable as soon as this job ends, without
  # waiting for the start tests or for Windows and Linux. Not a release: nothing here is notarized, and the
  # release builds its own from the tested zip.
  installers:
    name: Unsigned installers (.pkg, .dmg) for testing
    needs: build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - uses: actions/download-artifact@v4
        with:
          name: macos-mdmm-universal
          path: ${{ runner.temp }}/macos-mdmm

      - name: Package
        run: |
          set -euo pipefail
          zip="$(find "${RUNNER_TEMP}/macos-mdmm" -name 'Gearmulator-Elektron-macOS-*.zip' -print -quit)"
          ./scripts/macos/package_mdmm_installers.sh "${zip}" "${RUNNER_TEMP}/mdmm-pkg" "mdmm-v0.0.0-ci"

      - name: Verify the signatures (ad-hoc)
        env:
          MDMM_EXPECT_SIGNED: "0"
        run: ./scripts/macos/verify_mdmm_signed.sh "${RUNNER_TEMP}/mdmm-pkg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-mdmm-ci-installers-UNSIGNED
          path: |
            ${{ runner.temp }}/mdmm-pkg/*.pkg
            ${{ runner.temp }}/mdmm-pkg/*.dmg
          if-no-files-found: error
          retention-days: 14

  vst3host:
    name: Minimal VST3 host (scripts/vst3EditorHost)
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Build the host
        run: |
          set -euo pipefail
          host="$(./scripts/macos/build_vst3_host.sh "${RUNNER_TEMP}/vst3host" | sed -n 's/^VST3_HOST=//p')"
          app="${host%/Contents/MacOS/*}"
          mkdir -p "${RUNNER_TEMP}/out"
          ditto -c -k --keepParent "${app}" "${RUNNER_TEMP}/out/mdmmVst3EditorHost-macOS.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-vst3host
          path: ${{ runner.temp }}/out/mdmmVst3EditorHost-macOS.zip
          if-no-files-found: error
          retention-days: 14

  smoke:
    name: Start the standalones, VST3s and AUs (${{ matrix.os }})
    needs: [build, vst3host]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - uses: actions/download-artifact@v4
        with:
          name: macos-vst3host
          path: ${{ runner.temp }}/vst3host

      - uses: actions/download-artifact@v4
        with:
          name: macos-mdmm-universal
          path: ${{ runner.temp }}/macos-mdmm

      - name: Unpack the package and the host
        run: |
          set -euo pipefail
          ditto -x -k "${RUNNER_TEMP}/vst3host/mdmmVst3EditorHost-macOS.zip" "${RUNNER_TEMP}/vst3host"
          echo "VST3_HOST=${RUNNER_TEMP}/vst3host/mdmmVst3EditorHost.app/Contents/MacOS/mdmmVst3EditorHost" >> "${GITHUB_ENV}"
          zip="$(find "${RUNNER_TEMP}/macos-mdmm" -name 'Gearmulator-Elektron-macOS-*.zip' | head -n 1)"
          ditto -x -k "${zip}" "${RUNNER_TEMP}/package"
          dir="$(find "${RUNNER_TEMP}/package" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          ls -la "${dir}"
          echo "PACKAGE_DIR=${dir}" >> "${GITHUB_ENV}"

      - name: Start each standalone and VST3, check the page and the bridge, run auval, take screenshots
        run: ./scripts/macos/smoke_mdmm.sh "${PACKAGE_DIR}" "${RUNNER_TEMP}/smoke" "${VST3_HOST}"

      # pluginval 1.0.4 (pinned, sha256-checked: scripts/pluginval.env), strictness 5, scratch data root, no ROM.
      - name: pluginval on each VST3 and AU
        if: always()
        run: |
          . scripts/mdmm-product.env
          ./scripts/ci/mdmm_pluginval.sh --install-au --out "${RUNNER_TEMP}/pluginval" --label "macOS ${{ matrix.os }}" \
            "${PACKAGE_DIR}/${MDMM_PRODUCT_NAME_MD}.vst3" "${PACKAGE_DIR}/${MDMM_PRODUCT_NAME_MM}.vst3" \
            "${PACKAGE_DIR}/${MDMM_PRODUCT_NAME_MD}.component" "${PACKAGE_DIR}/${MDMM_PRODUCT_NAME_MM}.component"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-mdmm-pluginval-${{ matrix.os }}
          path: ${{ runner.temp }}/pluginval
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-mdmm-smoke-${{ matrix.os }}
          path: ${{ runner.temp }}/smoke
          if-no-files-found: warn
          retention-days: 14
