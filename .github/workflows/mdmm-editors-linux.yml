name: MD/MM Editors Linux x64

# This fork's Linux build (doc/release/LINUX.md, doc/modern-ux/UPSTREAM.md: a workflow of ours). Builds
# the standalones and VST3s with the web view on, runs the unit tests, packages one .tar.gz per machine
# (scripts/linux/build_mdmm.sh), then starts each packaged standalone and VST3 (in scripts/vst3EditorHost) on a
# virtual X11 display on the oldest and the newest supported Ubuntu with only runtime packages, checks the page
# and the bridge, and keeps screenshots (scripts/linux/smoke_mdmm.sh; doc/modern-ux/FOUNDATION.md, "CI start
# tests"), then runs pluginval (strictness 5, no ROM, on the same virtual display) on the VST3 of each archive.
# Called by mdmm-editors.yml on every push; on an mdmm-v* tag, mdmm-editors-release.yml attaches the archives of
# the tag commit's tested run (or calls mdmm-editors.yml when there is none) to the draft release, only when all of
# it, start tests and pluginval, has passed. Compiler cache: ccache, one archive per branch (actions/cache).

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Linux x64 VST3 and Standalone
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    env:
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: "%compiler% -v"
      CCACHE_SLOPPINESS: "include_file_mtime,include_file_ctime,time_macros,pch_defines"
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: "true"
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CC: gcc-13
      CXX: g++-13

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      # GCC 13 (as on the 24.04 jobs, mdmm-core.yml): GCC 11, 22.04's own, rejects some of the editors' C++17.
      # Building on 22.04 keeps the glibc floor at 2.35; libstdc++ and libgcc are linked statically.
      - name: Install build dependencies
        run: >-
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test &&
          sudo apt-get update && sudo apt-get install -y g++-13 gcc-13 ninja-build ccache pkg-config xvfb
          libasound2-dev libgl1-mesa-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev
          libxinerama-dev libxrandr-dev libxrender-dev libfreetype6-dev libfontconfig1-dev
          libwebkit2gtk-4.0-dev libgtk-3-dev

      # ccache (one archive per branch and toolchain; a new branch starts from main's) instead of sccache's GitHub
      # cache backend, which stores an entry per object and lost writes to the cache service's rate limit.
      - name: Compiler cache folder
        run: echo "CCACHE_DIR=${RUNNER_TEMP}/ccache" >> "${GITHUB_ENV}"

      - name: Restore the compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-v1-linux-x64-gcc13-2204-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ccache-v1-linux-x64-gcc13-2204-${{ github.ref_name }}-
            ccache-v1-linux-x64-gcc13-2204-main-

      - name: Build, test and package MD/MM
        run: |
          ccache --zero-stats > /dev/null
          xvfb-run -a ./scripts/linux/build_mdmm.sh \
            "${{ github.workspace }}" \
            "${{ runner.temp }}/gearmulator-elektron-build" \
            "${{ github.workspace }}/artifacts/linux-mdmm"

      # The start test's minimal VST3 host (scripts/vst3EditorHost), built here where the headers are; libstdc++
      # and libgcc linked statically, as the editors, so it runs with runtime packages only.
      - name: Build the minimal VST3 host
        run: |
          set -euo pipefail
          cmake -S scripts/vst3EditorHost -B "${RUNNER_TEMP}/vst3host" -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc"
          cmake --build "${RUNNER_TEMP}/vst3host" --parallel 4
          mkdir -p artifacts/linux-vst3host
          find "${RUNNER_TEMP}/vst3host" -type f -name mdmmVst3EditorHost -perm -u+x -exec cp {} artifacts/linux-vst3host/ \;
          test -x artifacts/linux-vst3host/mdmmVst3EditorHost

      - name: Compiler cache statistics
        if: always()
        run: |
          ccache --show-stats --verbose
          { echo "### ccache (Linux x64)"; echo '```'; ccache --show-stats; echo '```'; } >> "${GITHUB_STEP_SUMMARY}"

      - name: Save the compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-v1-linux-x64-gcc13-2204-${{ github.ref_name }}-${{ github.run_id }}

      - name: Check the packages
        run: |
          set -euo pipefail
          for t in artifacts/linux-mdmm/*.tar.gz; do
            echo "== ${t}"
            tar -tzvf "${t}"
          done
          tmp="$(mktemp -d)"
          tar -C "${tmp}" -xzf artifacts/linux-mdmm/Machinedrum-Editor-Linux-x64-not-tested.tar.gz
          app="${tmp}/Machinedrum-Editor-Linux-x64/Standalone/Machinedrum Editor"
          # The run path that finds the shims, and no hard dependency on WebKit or GTK.
          readelf -d "${app}" | grep -E 'RUNPATH|RPATH' | grep -F '$ORIGIN'
          if readelf -d "${app}" | grep NEEDED | grep -E 'webkit|gtk'; then
            echo "The standalone must not link WebKit or GTK" >&2
            exit 1
          fi
          readelf -d "${tmp}/Machinedrum-Editor-Linux-x64/Standalone/libgtk-3.so" | grep NEEDED | grep -F libgtk-3.so.0
          echo "Highest glibc symbol version used:"
          objdump -T "${app}" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n 1

      - uses: actions/upload-artifact@v4
        with:
          name: linux-mdmm
          path: artifacts/linux-mdmm/*.tar.gz
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: linux-mdmm-vst3host
          path: artifacts/linux-vst3host/mdmmVst3EditorHost
          if-no-files-found: error
          retention-days: 14

  smoke:
    name: Start the packaged standalones and VST3s (${{ matrix.os }}, runtime packages only)
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            packages: libwebkit2gtk-4.0-37 libgtk-3-0 libasound2 libgl1
          - os: ubuntu-24.04
            packages: libwebkit2gtk-4.1-0 libgtk-3-0t64 libasound2t64 libgl1
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - name: Install runtime packages
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb x11-utils xdotool imagemagick
          inotify-tools dbus dbus-x11 at-spi2-core python3-gi gir1.2-atspi-2.0 libglib2.0-bin
          ${{ matrix.packages }} libx11-6 libxext6 libxcursor1 libxinerama1 libxrandr2 libxrender1
          libxcomposite1 libfreetype6 libfontconfig1 &&
          dpkg -l | grep -i -E 'webkit2gtk|libgtk-3-0'

      - uses: actions/download-artifact@v4
        with:
          name: linux-mdmm
          path: ${{ runner.temp }}/linux-mdmm

      - uses: actions/download-artifact@v4
        with:
          name: linux-mdmm-vst3host
          path: ${{ runner.temp }}/vst3host

      - name: Start each standalone and VST3, check the page and the bridge, take screenshots
        run: |
          chmod +x "${{ runner.temp }}/vst3host/mdmmVst3EditorHost"
          ./scripts/linux/smoke_mdmm.sh "${{ runner.temp }}/linux-mdmm" "${{ runner.temp }}/smoke" \
            "${{ runner.temp }}/vst3host/mdmmVst3EditorHost"

      # pluginval 1.0.4 (pinned, sha256-checked: scripts/pluginval.env), strictness 5, scratch data root, no ROM,
      # on the archives the release attaches. The editor tests open the window on the virtual display.
      - name: pluginval on each VST3
        if: always()
        run: |
          set -euo pipefail
          . scripts/mdmm-product.env
          rm -rf "${RUNNER_TEMP}/pv-unpacked"; mkdir -p "${RUNNER_TEMP}/pv-unpacked"
          for t in "${RUNNER_TEMP}"/linux-mdmm/*.tar.gz; do tar -C "${RUNNER_TEMP}/pv-unpacked" -xzf "${t}"; done
          xvfb-run -a ./scripts/ci/mdmm_pluginval.sh --out "${RUNNER_TEMP}/pluginval" --label "Linux ${{ matrix.os }}" \
            "${RUNNER_TEMP}/pv-unpacked/Machinedrum-Editor-Linux-x64/VST3/${MDMM_PRODUCT_NAME_MD}.vst3" \
            "${RUNNER_TEMP}/pv-unpacked/Monomachine-Editor-Linux-x64/VST3/${MDMM_PRODUCT_NAME_MM}.vst3"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-mdmm-pluginval-${{ matrix.os }}
          path: ${{ runner.temp }}/pluginval
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-mdmm-smoke-${{ matrix.os }}
          path: ${{ runner.temp }}/smoke
          if-no-files-found: warn
          retention-days: 14
