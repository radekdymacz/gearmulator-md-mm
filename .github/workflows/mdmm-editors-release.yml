name: MD/MM Editors release installers

# This fork's own release job (doc/modern-ux/UPSTREAM.md): upstream's elektron-prerelease.yml and
# elektron-macos.yml stay as they are. On an mdmm-v* tag this builds the fixture-free universal
# bundles itself (the same script and settings as elektron-macos.yml), packages the two installers
# and attaches them to the release.

on:
  push:
    tags:
      - "mdmm-v*"

permissions:
  contents: read

jobs:
  build-macos:
    name: macOS universal bundles for the installers
    runs-on: macos-14
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Build, test, sign, and package MD/MM
        env:
          # Hosted runners have no secure firmware-fixture channel. Local
          # release verification defaults to requiring both validated images.
          GEARMULATOR_REQUIRE_FIRMWARE_TESTS: "0"
          GEARMULATOR_MDMM_MACOS_ARCHITECTURES: "arm64;x86_64"
          GEARMULATOR_MDMM_APPLE_PGO_MODE: "none"
        run: >-
          ./scripts/macos/build_mdmm.sh
          "${{ github.workspace }}"
          "${{ runner.temp }}/gearmulator-elektron-build"
          "${{ github.workspace }}/artifacts/macos-mdmm"

      # Release artifacts preferably come from a local run with both pinned
      # firmware images; the installers job below uploads installers only
      # where the release has none.
      - name: Upload universal bundles for installer packaging
        uses: actions/upload-artifact@v4
        with:
          name: macos-mdmm-universal
          path: artifacts/macos-mdmm/Gearmulator-Elektron-macOS-*.zip
          if-no-files-found: error
          retention-days: 7

  # The website links to releases/latest/download/<name>, so these file names
  # are fixed: Machinedrum-Editor-macOS.pkg, Monomachine-Editor-macOS.pkg, and
  # the drag-and-drop images Machinedrum-Editor-macOS.dmg,
  # Monomachine-Editor-macOS.dmg.
  #
  # Signing (doc/release/SIGNING.md). With all five signing secrets set, every
  # bundle is signed with Developer ID (hardened runtime, timestamp), notarized
  # and stapled, the packages are signed with Developer ID Installer, and the
  # packages and images are notarized and stapled; any error fails the job.
  # With none set, the job keeps the ad-hoc signatures, marks the draft release
  # UNSIGNED and refuses to touch a published release. A partial set fails.
  macos-installers:
    name: macOS installer packages and disk images
    needs: build-macos
    runs-on: macos-14
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Check packaging scripts
        run: |
          /bin/bash -n scripts/macos/build_mdmm_pkg.sh scripts/macos/build_mdmm_dmg.sh \
            scripts/macos/sign_mdmm.sh scripts/macos/notarize_mdmm.sh \
            scripts/macos/verify_mdmm_signed.sh scripts/macos/verify_mdmm_pkg_install.sh
          plutil -lint scripts/macos/entitlements/mdmm-standalone.entitlements

      - name: Signing mode
        id: mode
        env:
          MDMM_SIGNING_P12_BASE64: ${{ secrets.MDMM_SIGNING_P12_BASE64 }}
          MDMM_SIGNING_P12_PASSWORD: ${{ secrets.MDMM_SIGNING_P12_PASSWORD }}
          MDMM_NOTARY_KEY_ID: ${{ secrets.MDMM_NOTARY_KEY_ID }}
          MDMM_NOTARY_ISSUER_ID: ${{ secrets.MDMM_NOTARY_ISSUER_ID }}
          MDMM_NOTARY_KEY_P8: ${{ secrets.MDMM_NOTARY_KEY_P8 }}
        run: |
          set -euo pipefail
          present=0
          missing=()
          for name in MDMM_SIGNING_P12_BASE64 MDMM_SIGNING_P12_PASSWORD \
              MDMM_NOTARY_KEY_ID MDMM_NOTARY_ISSUER_ID MDMM_NOTARY_KEY_P8; do
            if [[ -n "${!name}" ]]; then
              present=$((present + 1))
            else
              missing+=("${name}")
            fi
          done
          if [[ ${present} -eq 5 ]]; then
            echo "signed=true" >> "${GITHUB_OUTPUT}"
            echo "Signing secrets present: Developer ID signing and notarization"
          elif [[ ${present} -eq 0 ]]; then
            echo "signed=false" >> "${GITHUB_OUTPUT}"
            echo "::warning title=UNSIGNED build::No signing secrets: ad-hoc signatures only. The release stays a draft marked UNSIGNED and must not be published."
          else
            echo "::error title=Incomplete signing secrets::Missing: ${missing[*]}. Set all five or none (doc/release/SIGNING.md)."
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: macos-mdmm-universal
          path: ${{ runner.temp }}/mdmm-zip

      - name: Unpack the universal bundles
        run: |
          set -euo pipefail
          # mdmm-v0.2.0 -> 0.2.0, mdmm-v0.1.0-alpha -> 0.1.0 (Installer versions are numeric).
          version="$(printf '%s' "${TAG#mdmm-v}" | sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
          bundles="${RUNNER_TEMP}/mdmm-bundles"
          mkdir -p "${bundles}"
          zip="$(find "${RUNNER_TEMP}/mdmm-zip" -name 'Gearmulator-Elektron-macOS-*.zip' -print -quit)"
          /usr/bin/ditto -x -k "${zip}" "${bundles}"
          package_dir="$(dirname "$(find "${bundles}" -maxdepth 2 -name 'Gearmulator MD.app' -print -quit)")"
          {
            echo "MDMM_VERSION=${version}"
            echo "MDMM_BUNDLES=${package_dir}"
            echo "MDMM_OUT=${RUNNER_TEMP}/mdmm-pkg"
          } >> "${GITHUB_ENV}"

      - name: Import the Developer ID identities
        if: steps.mode.outputs.signed == 'true'
        env:
          MDMM_SIGNING_P12_BASE64: ${{ secrets.MDMM_SIGNING_P12_BASE64 }}
          MDMM_SIGNING_P12_PASSWORD: ${{ secrets.MDMM_SIGNING_P12_PASSWORD }}
          MDMM_NOTARY_KEY_P8: ${{ secrets.MDMM_NOTARY_KEY_P8 }}
        run: |
          set -euo pipefail
          keychain="${RUNNER_TEMP}/mdmm-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          security create-keychain -p "${keychain_password}" "${keychain}"
          security set-keychain-settings -lut 21600 "${keychain}"
          security unlock-keychain -p "${keychain_password}" "${keychain}"
          p12="${RUNNER_TEMP}/mdmm-signing.p12"
          printf '%s' "${MDMM_SIGNING_P12_BASE64}" | base64 --decode > "${p12}"
          security import "${p12}" -k "${keychain}" -P "${MDMM_SIGNING_P12_PASSWORD}" -f pkcs12 \
            -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/productsign
          rm -f "${p12}"
          # The Developer ID intermediates, so the identities validate on a
          # fresh runner (an "already exists" error is fine).
          for ca in DeveloperIDG2CA DeveloperIDCA; do
            curl -fsSL "https://www.apple.com/certificateauthority/${ca}.cer" -o "${RUNNER_TEMP}/${ca}.cer"
            security import "${RUNNER_TEMP}/${ca}.cer" -k "${keychain}" || true
          done
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "${keychain_password}" "${keychain}" > /dev/null
          # Search the temporary keychain first, keep the defaults after it.
          existing=()
          while IFS= read -r line; do
            line="${line#"${line%%[![:space:]]*}"}"
            existing+=("${line//\"/}")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "${keychain}" "${existing[@]}"

          app_identity="$(security find-identity -v -p codesigning "${keychain}" \
            | sed -n 's/.*"\(Developer ID Application: .*\)"$/\1/p' | sort -u)"
          installer_identity="$(security find-identity -v "${keychain}" \
            | sed -n 's/.*"\(Developer ID Installer: .*\)"$/\1/p' | sort -u)"
          if [[ -z "${app_identity}" || "$(printf '%s\n' "${app_identity}" | wc -l)" -ne 1 ]]; then
            echo "::error::Expected exactly one valid Developer ID Application identity in the .p12, found: ${app_identity:-none}"
            exit 1
          fi
          if [[ -z "${installer_identity}" || "$(printf '%s\n' "${installer_identity}" | wc -l)" -ne 1 ]]; then
            echo "::error::Expected exactly one valid Developer ID Installer identity in the .p12, found: ${installer_identity:-none}"
            exit 1
          fi
          echo "Application identity: ${app_identity}"
          echo "Installer identity:   ${installer_identity}"

          key_dir="${RUNNER_TEMP}/mdmm-notary"
          mkdir -p "${key_dir}"
          chmod 700 "${key_dir}"
          printf '%s\n' "${MDMM_NOTARY_KEY_P8}" > "${key_dir}/AuthKey.p8"
          chmod 600 "${key_dir}/AuthKey.p8"
          {
            echo "MDMM_SIGN_KEYCHAIN=${keychain}"
            echo "MDMM_SIGN_IDENTITY=${app_identity}"
            echo "MDMM_DMG_SIGN_IDENTITY=${app_identity}"
            echo "MDMM_INSTALLER_IDENTITY=${installer_identity}"
            echo "MDMM_NOTARY_KEY_PATH=${key_dir}/AuthKey.p8"
          } >> "${GITHUB_ENV}"

      # Without secrets MDMM_SIGN_IDENTITY is unset: the script re-signs ad-hoc
      # without the hardened runtime, exactly what the build job produced.
      - name: Sign the six bundles
        run: ./scripts/macos/sign_mdmm.sh "${MDMM_BUNDLES}"

      - name: Notarize and staple the bundles
        if: steps.mode.outputs.signed == 'true'
        env:
          MDMM_NOTARY_KEY_ID: ${{ secrets.MDMM_NOTARY_KEY_ID }}
          MDMM_NOTARY_ISSUER_ID: ${{ secrets.MDMM_NOTARY_ISSUER_ID }}
        run: ./scripts/macos/notarize_mdmm.sh --bundles "${MDMM_BUNDLES}"

      - name: Build the two installer packages
        run: ./scripts/macos/build_mdmm_pkg.sh "${MDMM_BUNDLES}" "${MDMM_OUT}" "${MDMM_VERSION}"

      - name: Build the two disk images
        run: ./scripts/macos/build_mdmm_dmg.sh "${MDMM_BUNDLES}" "${MDMM_OUT}" "${MDMM_VERSION}"

      - name: Notarize and staple the packages and disk images
        if: steps.mode.outputs.signed == 'true'
        env:
          MDMM_NOTARY_KEY_ID: ${{ secrets.MDMM_NOTARY_KEY_ID }}
          MDMM_NOTARY_ISSUER_ID: ${{ secrets.MDMM_NOTARY_ISSUER_ID }}
        run: |
          ./scripts/macos/notarize_mdmm.sh \
            "${MDMM_OUT}/Machinedrum-Editor-macOS.pkg" "${MDMM_OUT}/Monomachine-Editor-macOS.pkg" \
            "${MDMM_OUT}/Machinedrum-Editor-macOS.dmg" "${MDMM_OUT}/Monomachine-Editor-macOS.dmg"

      - name: Verify signatures, notarization and Gatekeeper
        env:
          MDMM_EXPECT_SIGNED: ${{ steps.mode.outputs.signed == 'true' && '1' || '0' }}
        run: ./scripts/macos/verify_mdmm_signed.sh "${MDMM_OUT}"

      - name: Test-install both packages and run auval
        env:
          MDMM_EXPECT_SIGNED: ${{ steps.mode.outputs.signed == 'true' && '1' || '0' }}
        run: |
          set -euo pipefail
          sudo installer -pkg "${MDMM_OUT}/Machinedrum-Editor-macOS.pkg" -target /
          sudo installer -pkg "${MDMM_OUT}/Monomachine-Editor-macOS.pkg" -target /
          mkdir -p "${RUNNER_TEMP}/empty-data"
          GEARMULATOR_DATA_ROOT="${RUNNER_TEMP}/empty-data" ./scripts/macos/verify_mdmm_pkg_install.sh

      - name: Remove the signing keychain and API key
        if: always() && steps.mode.outputs.signed == 'true'
        run: |
          security delete-keychain "${RUNNER_TEMP}/mdmm-signing.keychain-db" || true
          rm -rf "${RUNNER_TEMP}/mdmm-notary" "${RUNNER_TEMP}/mdmm-signing.p12"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.mode.outputs.signed == 'true' && 'macos-mdmm-installers' || 'macos-mdmm-installers-UNSIGNED' }}
          path: |
            ${{ runner.temp }}/mdmm-pkg/*.pkg
            ${{ runner.temp }}/mdmm-pkg/*.dmg
          if-no-files-found: error
          retention-days: 30

      # A release reviewed and uploaded by hand (from a local, firmware-tested
      # build) wins: an asset that is already there is never replaced. With no
      # release yet, a draft is created for Radek to publish. A draft release
      # counts as existing: `gh release view <tag>` does not see drafts (the
      # API's tag lookup skips them), so the release is looked up in the list,
      # drafts included, and never created twice. Nothing ships unsigned: an
      # unsigned run only ever touches a draft, and titles it UNSIGNED.
      - name: Attach installers to the GitHub release
        env:
          SIGNED: ${{ steps.mode.outputs.signed }}
        run: |
          set -euo pipefail
          notes="doc/release/v${TAG#mdmm-v}.md"
          assets=("${MDMM_OUT}/Machinedrum-Editor-macOS.pkg" \
                  "${MDMM_OUT}/Monomachine-Editor-macOS.pkg" \
                  "${MDMM_OUT}/Machinedrum-Editor-macOS.dmg" \
                  "${MDMM_OUT}/Monomachine-Editor-macOS.dmg")
          release_id="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"${TAG}\") | .id" | head -n 1)"
          if [[ -n "${release_id}" ]]; then
            is_draft="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" --jq '.draft')"
            if [[ "${SIGNED}" != "true" && "${is_draft}" != "true" ]]; then
              echo "::error title=Refusing unsigned upload::Release ${TAG} is published; unsigned installers are never attached to a published release."
              exit 1
            fi
            if [[ "${SIGNED}" != "true" ]]; then
              gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
                -f name="UNSIGNED - do not publish - Machinedrum Editor + Monomachine Editor ${TAG#mdmm-v}" \
                --jq '.name'
            fi
            existing="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" --jq '.assets[].name')"
            for asset in "${assets[@]}"; do
              name="$(basename "${asset}")"
              if printf '%s\n' "${existing}" | grep -qxF "${name}"; then
                echo "Keeping the existing ${name} on release ${release_id} (${TAG})"
              else
                gh api --method POST -H "Content-Type: application/octet-stream" \
                  "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?name=${name}" \
                  --input "${asset}" --jq '.name'
              fi
            done
          else
            notes_file="${RUNNER_TEMP}/release-notes.md"
            : > "${notes_file}"
            title="Machinedrum Editor + Monomachine Editor ${TAG#mdmm-v}"
            if [[ "${SIGNED}" != "true" ]]; then
              title="UNSIGNED - do not publish - ${title}"
              printf '%s\n\n' "> **UNSIGNED BUILD - do not publish.** Built without the Developer ID secrets (doc/release/SIGNING.md). Add them and re-run the tag's workflow." >> "${notes_file}"
            fi
            if [[ -f "${notes}" ]]; then
              cat "${notes}" >> "${notes_file}"
              notes_args=(--notes-file "${notes_file}")
            elif [[ -s "${notes_file}" ]]; then
              notes_args=(--notes-file "${notes_file}" --generate-notes)
            else
              notes_args=(--generate-notes)
            fi
            # A tag with a suffix (mdmm-v0.1.0-alpha) is a pre-release; a plain
            # version is a normal release, so releases/latest/download/ resolves.
            channel_args=()
            if [[ "${TAG#mdmm-v}" == *-* ]]; then
              channel_args=(--prerelease)
            fi
            # Always a draft: publishing is Radek's step, and only for signed builds.
            gh release create "${TAG}" "${assets[@]}" --repo "${GITHUB_REPOSITORY}" \
              --draft ${channel_args[@]+"${channel_args[@]}"} --verify-tag \
              --title "${title}" \
              "${notes_args[@]}"
          fi
