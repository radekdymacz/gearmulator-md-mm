name: MD/MM Editors release installers

# This fork's own release job (doc/modern-ux/UPSTREAM.md): upstream's elektron-prerelease.yml and
# elektron-macos.yml stay as they are. On an mdmm-v* tag this takes the packages that mdmm-editors.yml built and
# tested for the tag's commit (the push of that commit ran it: the fixture-free universal macOS bundles, the
# Windows zip, the Linux archives, with their start tests and pluginval), so nothing is built twice: `locate` finds
# that run (waiting for it while it runs), and only when there is none (the commit's push did not touch the editors,
# its artifacts expired after 14 days, or it failed) `build` calls mdmm-editors.yml here. It then packages the two
# macOS installers and attaches them to the release, and one "not-tested" archive per machine and platform for
# Windows and Linux to the same release while it is a draft (doc/release/LINUX.md).
#
# The in-app updates' ed25519 signatures are not made here: publishing the release runs
# mdmm-site-release.yml, which signs the assets as published (a hand-uploaded asset wins over this job's,
# so only the published bytes are worth signing) and writes them into mdmm.dev/latest.json
# (doc/modern-ux/DESIGN-updates.md 2).
# Nothing reaches the release before the tests have passed on what is packaged (the owner's rule):
#   - macOS: macos-tests installs the two signed .pkg that macos-installers made, starts the installed standalones
#     and VST3s (no ROM), runs auval and pluginval strictness 5 on the installed VST3 and AU, and checks the .dmg
#     hold the very same bundles; only then macos-publish attaches the four files.
#   - Windows and Linux: mdmm-editors.yml ran its start tests and pluginval on the packages it built (a run is used
#     only when it succeeded as a whole); package-other packages the per-machine archives and checks they hold the
#     tested files byte for byte; other-platforms attaches them after macos-publish.
# A manual run (workflow_dispatch) with dry_run (the default) does all of it except the upload: use it to try this
# file on a branch. Dispatching on a tag with dry_run off does the real thing again.

on:
  push:
    tags:
      - "mdmm-v*"
  # A dry run of every push to a release branch whose mdmm-editors.yml run (all three systems) passed: the installers
  # of that commit are made, installed and tested without being attached to anything. GitHub runs a workflow_run
  # workflow from the default branch's copy of this file, with github.sha and github.ref of the default branch:
  # the commit under test is workflow_run.head_sha (SHA / checkout `ref` below), and no job that publishes can
  # run (they need a refs/tags/mdmm-v* ref and a push or dispatch event).
  workflow_run:
    workflows: ["MD/MM Editors"]
    types: [completed]
    branches:
      - "release/**"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and test everything, attach nothing to any release
        type: boolean
        default: true

permissions:
  contents: read

# One dry run per commit; a newer push to the branch does not cancel one that is already testing installers.
concurrency:
  group: mdmm-release-${{ github.event.workflow_run.head_sha || github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  # The run of mdmm-editors.yml that built and tested this commit: the newest successful one whose packages have not
  # expired. One still running is waited for. None: `build` below makes one in this run.
  locate:
    name: Find the tested build of this commit
    # From CI (workflow_run): only a successful push run.
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      actions: read
    outputs:
      run_id: ${{ steps.find.outputs.run_id }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          wanted="macos-mdmm-universal macos-vst3host windows-mdmm linux-mdmm"
          # A tag's release ships the whole-program-optimised Windows files (a push's build is not): that
          # flavour's marker artifact is required, else this run builds them (below).
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then wanted="${wanted} windows-mdmm-ltcg"; fi
          deadline=$(( $(date +%s) + 140 * 60 ))
          while :; do
            runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/mdmm-editors.yml/runs?head_sha=${SHA}&per_page=50" \
              --jq '.workflow_runs | sort_by(.created_at) | reverse | .[] | "\(.id) \(.status) \(.conclusion) \(.event) \(.html_url)"')"
            echo "${runs:-no run of mdmm-editors.yml for ${SHA}}"
            found=""
            while read -r id status conclusion _event url; do
              [[ -n "${id}" && "${status}" == completed && "${conclusion}" == success ]] || continue
              have="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/artifacts?per_page=100" \
                --jq '.artifacts[] | select(.expired == false) | .name')"
              ok=1
              for name in ${wanted}; do grep -qxF "${name}" <<< "${have}" || ok=0; done
              if (( ok )); then found="${id}"; echo "Using the packages of ${url}"; break; fi
              echo "${url}: its packages expired"
            done <<< "${runs}"
            if [[ -n "${found}" ]]; then break; fi
            if grep -qE '^[0-9]+ (queued|in_progress|waiting|requested|pending) ' <<< "${runs}" && (( $(date +%s) < deadline )); then
              echo "A run of this commit is still going: waiting"
              sleep 60
              continue
            fi
            echo "::notice title=Building here::No successful mdmm-editors.yml run with packages for ${SHA}: this run builds and tests them"
            break
          done
          echo "run_id=${found}" >> "${GITHUB_OUTPUT}"

  build:
    needs: locate
    if: needs.locate.outputs.run_id == ''
    uses: ./.github/workflows/mdmm-editors.yml
    with:
      # A tag's release gets LTCG Windows files; a dry run on a branch tries the push flavour.
      ltcg: ${{ startsWith(github.ref, 'refs/tags/') }}

  # The website links to releases/latest/download/<name>, so these file names
  # are fixed: Machinedrum-Editor-macOS.pkg, Monomachine-Editor-macOS.pkg, and
  # the drag-and-drop images Machinedrum-Editor-macOS.dmg,
  # Monomachine-Editor-macOS.dmg.
  #
  # Signing (doc/release/SIGNING.md). With all five signing secrets set, every
  # bundle is signed with Developer ID (hardened runtime, timestamp), notarized
  # and stapled, the packages are signed with Developer ID Installer, and the
  # packages and images are notarized and stapled; any error fails the job.
  # With none set, the job keeps the ad-hoc signatures, marks the draft release
  # UNSIGNED and refuses to touch a published release. A partial set fails.
  macos-installers:
    name: macOS installer packages and disk images
    needs: [locate, build]
    if: ${{ !cancelled() && needs.locate.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    outputs:
      signed: ${{ steps.mode.outputs.signed }}
    env:
      # A branch (dry run) has no tag: a made-up one gives the installers a numeric version.
      TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'mdmm-v0.0.0-dryrun' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 1
          submodules: false

      - name: Check packaging scripts
        run: |
          /bin/bash -n scripts/macos/build_mdmm_pkg.sh scripts/macos/build_mdmm_dmg.sh \
            scripts/macos/sign_mdmm.sh scripts/macos/notarize_mdmm.sh scripts/macos/package_mdmm_installers.sh \
            scripts/macos/verify_mdmm_signed.sh scripts/macos/verify_mdmm_pkg_install.sh
          plutil -lint scripts/macos/entitlements/mdmm-standalone.entitlements

      - name: Signing mode
        id: mode
        env:
          MDMM_SIGNING_P12_BASE64: ${{ secrets.MDMM_SIGNING_P12_BASE64 }}
          MDMM_SIGNING_P12_PASSWORD: ${{ secrets.MDMM_SIGNING_P12_PASSWORD }}
          MDMM_NOTARY_KEY_ID: ${{ secrets.MDMM_NOTARY_KEY_ID }}
          MDMM_NOTARY_ISSUER_ID: ${{ secrets.MDMM_NOTARY_ISSUER_ID }}
          MDMM_NOTARY_KEY_P8: ${{ secrets.MDMM_NOTARY_KEY_P8 }}
        run: |
          set -euo pipefail
          present=0
          missing=()
          for name in MDMM_SIGNING_P12_BASE64 MDMM_SIGNING_P12_PASSWORD \
              MDMM_NOTARY_KEY_ID MDMM_NOTARY_ISSUER_ID MDMM_NOTARY_KEY_P8; do
            if [[ -n "${!name}" ]]; then
              present=$((present + 1))
            else
              missing+=("${name}")
            fi
          done
          if [[ ${present} -eq 5 ]]; then
            echo "signed=true" >> "${GITHUB_OUTPUT}"
            echo "Signing secrets present: Developer ID signing and notarization"
          elif [[ ${present} -eq 0 ]]; then
            echo "signed=false" >> "${GITHUB_OUTPUT}"
            echo "::warning title=UNSIGNED build::No signing secrets: ad-hoc signatures only. The release stays a draft marked UNSIGNED and must not be published."
          else
            echo "::error title=Incomplete signing secrets::Missing: ${missing[*]}. Set all five or none (doc/release/SIGNING.md)."
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: macos-mdmm-universal
          path: ${{ runner.temp }}/mdmm-zip
          run-id: ${{ needs.locate.outputs.run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Output folder
        run: echo "MDMM_OUT=${RUNNER_TEMP}/mdmm-pkg" >> "${GITHUB_ENV}"

      - name: Import the Developer ID identities
        if: steps.mode.outputs.signed == 'true'
        env:
          MDMM_SIGNING_P12_BASE64: ${{ secrets.MDMM_SIGNING_P12_BASE64 }}
          MDMM_SIGNING_P12_PASSWORD: ${{ secrets.MDMM_SIGNING_P12_PASSWORD }}
          MDMM_NOTARY_KEY_P8: ${{ secrets.MDMM_NOTARY_KEY_P8 }}
        run: |
          set -euo pipefail
          keychain="${RUNNER_TEMP}/mdmm-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          security create-keychain -p "${keychain_password}" "${keychain}"
          security set-keychain-settings -lut 21600 "${keychain}"
          security unlock-keychain -p "${keychain_password}" "${keychain}"
          p12="${RUNNER_TEMP}/mdmm-signing.p12"
          printf '%s' "${MDMM_SIGNING_P12_BASE64}" | base64 --decode > "${p12}"
          security import "${p12}" -k "${keychain}" -P "${MDMM_SIGNING_P12_PASSWORD}" -f pkcs12 \
            -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/productsign
          rm -f "${p12}"
          # The Developer ID intermediates, so the identities validate on a
          # fresh runner (an "already exists" error is fine).
          for ca in DeveloperIDG2CA DeveloperIDCA; do
            curl -fsSL "https://www.apple.com/certificateauthority/${ca}.cer" -o "${RUNNER_TEMP}/${ca}.cer"
            security import "${RUNNER_TEMP}/${ca}.cer" -k "${keychain}" || true
          done
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "${keychain_password}" "${keychain}" > /dev/null
          # Search the temporary keychain first, keep the defaults after it.
          existing=()
          while IFS= read -r line; do
            line="${line#"${line%%[![:space:]]*}"}"
            existing+=("${line//\"/}")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "${keychain}" "${existing[@]}"

          app_identity="$(security find-identity -v -p codesigning "${keychain}" \
            | sed -n 's/.*"\(Developer ID Application: .*\)"$/\1/p' | sort -u)"
          installer_identity="$(security find-identity -v "${keychain}" \
            | sed -n 's/.*"\(Developer ID Installer: .*\)"$/\1/p' | sort -u)"
          if [[ -z "${app_identity}" || "$(printf '%s\n' "${app_identity}" | wc -l)" -ne 1 ]]; then
            echo "::error::Expected exactly one valid Developer ID Application identity in the .p12, found: ${app_identity:-none}"
            exit 1
          fi
          if [[ -z "${installer_identity}" || "$(printf '%s\n' "${installer_identity}" | wc -l)" -ne 1 ]]; then
            echo "::error::Expected exactly one valid Developer ID Installer identity in the .p12, found: ${installer_identity:-none}"
            exit 1
          fi
          echo "Application identity: ${app_identity}"
          echo "Installer identity:   ${installer_identity}"

          key_dir="${RUNNER_TEMP}/mdmm-notary"
          mkdir -p "${key_dir}"
          chmod 700 "${key_dir}"
          printf '%s\n' "${MDMM_NOTARY_KEY_P8}" > "${key_dir}/AuthKey.p8"
          chmod 600 "${key_dir}/AuthKey.p8"
          {
            echo "MDMM_SIGN_KEYCHAIN=${keychain}"
            echo "MDMM_SIGN_IDENTITY=${app_identity}"
            echo "MDMM_DMG_SIGN_IDENTITY=${app_identity}"
            echo "MDMM_INSTALLER_IDENTITY=${installer_identity}"
            echo "MDMM_NOTARY_KEY_PATH=${key_dir}/AuthKey.p8"
          } >> "${GITHUB_ENV}"

      # The same script every push runs (mdmm-editors-macos.yml, ad-hoc): sign the six bundles, notarize and staple
      # them (signed mode), build the two packages and the two disk images, notarize and staple those. Without
      # secrets MDMM_SIGN_IDENTITY is unset: the bundles are re-signed ad-hoc, exactly what the build job produced.
      - name: Sign, notarize and package
        env:
          MDMM_NOTARIZE: ${{ steps.mode.outputs.signed == 'true' && '1' || '0' }}
          MDMM_NOTARY_KEY_ID: ${{ secrets.MDMM_NOTARY_KEY_ID }}
          MDMM_NOTARY_ISSUER_ID: ${{ secrets.MDMM_NOTARY_ISSUER_ID }}
        run: |
          zip="$(find "${RUNNER_TEMP}/mdmm-zip" -name 'Gearmulator-Elektron-macOS-*.zip' -print -quit)"
          ./scripts/macos/package_mdmm_installers.sh "${zip}" "${MDMM_OUT}" "${TAG}"

      - name: Verify signatures, notarization and Gatekeeper
        env:
          MDMM_EXPECT_SIGNED: ${{ steps.mode.outputs.signed == 'true' && '1' || '0' }}
        run: ./scripts/macos/verify_mdmm_signed.sh "${MDMM_OUT}"

      - name: Test-install both packages and run auval
        env:
          MDMM_EXPECT_SIGNED: ${{ steps.mode.outputs.signed == 'true' && '1' || '0' }}
        run: |
          set -euo pipefail
          sudo installer -pkg "${MDMM_OUT}/Machinedrum-Editor-macOS.pkg" -target /
          sudo installer -pkg "${MDMM_OUT}/Monomachine-Editor-macOS.pkg" -target /
          mkdir -p "${RUNNER_TEMP}/empty-data"
          GEARMULATOR_DATA_ROOT="${RUNNER_TEMP}/empty-data" ./scripts/macos/verify_mdmm_pkg_install.sh

      - name: Remove the signing keychain and API key
        if: always() && steps.mode.outputs.signed == 'true'
        run: |
          security delete-keychain "${RUNNER_TEMP}/mdmm-signing.keychain-db" || true
          rm -rf "${RUNNER_TEMP}/mdmm-notary" "${RUNNER_TEMP}/mdmm-signing.p12"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.mode.outputs.signed == 'true' && 'macos-mdmm-installers' || 'macos-mdmm-installers-UNSIGNED' }}
          path: |
            ${{ runner.temp }}/mdmm-pkg/*.pkg
            ${{ runner.temp }}/mdmm-pkg/*.dmg
          if-no-files-found: error
          retention-days: 30

  # The gate: the exact signed packages are installed, as a user does, and tested; the .dmg are checked to hold the
  # same bundles. Needs no ROM: the machine does not run, the page says "firmware needed". Two runners: the one
  # the release is built on and the oldest hosted one.
  macos-tests:
    name: Test the installed packages (${{ matrix.os }})
    needs: [locate, macos-installers]
    if: ${{ !cancelled() && needs.macos-installers.result == 'success' }}
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      MDMM_EXPECT_SIGNED: ${{ needs.macos-installers.outputs.signed == 'true' && '1' || '0' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 1
          submodules: false

      - uses: actions/download-artifact@v4
        with:
          pattern: macos-mdmm-installers*
          path: ${{ runner.temp }}/installers
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: macos-vst3host
          path: ${{ runner.temp }}/vst3host
          run-id: ${{ needs.locate.outputs.run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: The minimal VST3 host (scripts/vst3EditorHost, built beside the package)
        run: |
          ditto -x -k "${RUNNER_TEMP}/vst3host/mdmmVst3EditorHost-macOS.zip" "${RUNNER_TEMP}/vst3host"
          echo "VST3_HOST=${RUNNER_TEMP}/vst3host/mdmmVst3EditorHost.app/Contents/MacOS/mdmmVst3EditorHost" >> "${GITHUB_ENV}"

      - name: Install both packages, check the installation
        run: |
          set -euo pipefail
          ls -l "${RUNNER_TEMP}/installers"
          sudo installer -pkg "${RUNNER_TEMP}/installers/Machinedrum-Editor-macOS.pkg" -target /
          sudo installer -pkg "${RUNNER_TEMP}/installers/Monomachine-Editor-macOS.pkg" -target /
          mkdir -p "${RUNNER_TEMP}/empty-data"
          GEARMULATOR_DATA_ROOT="${RUNNER_TEMP}/empty-data" ./scripts/macos/verify_mdmm_pkg_install.sh

      # smoke_mdmm.sh takes a folder of "<product>.app/.vst3/.component": the installed bundles.
      - name: Gather the installed bundles
        run: |
          set -euo pipefail
          . scripts/mdmm-product.env
          installed="${RUNNER_TEMP}/installed"
          mkdir -p "${installed}"
          for product in "${MDMM_PRODUCT_NAME_MD}" "${MDMM_PRODUCT_NAME_MM}"; do
            ditto "/Applications/${product}.app" "${installed}/${product}.app"
            ditto "/Library/Audio/Plug-Ins/VST3/${product}.vst3" "${installed}/${product}.vst3"
            ditto "/Library/Audio/Plug-Ins/Components/${product}.component" "${installed}/${product}.component"
          done
          echo "INSTALLED_DIR=${installed}" >> "${GITHUB_ENV}"

      - name: The disk images hold the same bundles as the packages
        run: |
          set -euo pipefail
          . scripts/mdmm-product.env
          for product in "${MDMM_PRODUCT_NAME_MD}" "${MDMM_PRODUCT_NAME_MM}"; do
            dmg="${RUNNER_TEMP}/installers/${product// /-}-macOS.dmg"
            mount="${RUNNER_TEMP}/dmg-${product// /-}"
            mkdir -p "${mount}"
            hdiutil attach -nobrowse -readonly -mountpoint "${mount}" "${dmg}" > /dev/null
            for part in app vst3 component; do
              diff -r "${mount}/${product}.${part}" "${INSTALLED_DIR}/${product}.${part}"
            done
            hdiutil detach "${mount}" > /dev/null
            echo "${dmg##*/}: the same bundles as the installed package"
          done

      - name: Start each installed standalone and VST3, check the page and the bridge, run auval
        run: ./scripts/macos/smoke_mdmm.sh "${INSTALLED_DIR}" "${RUNNER_TEMP}/smoke" "${VST3_HOST}"

      # pluginval 1.0.4 (pinned, sha256-checked: scripts/pluginval.env), strictness 5, scratch data root, no ROM.
      - name: pluginval on each installed VST3 and AU
        if: always()
        run: |
          . scripts/mdmm-product.env
          ./scripts/ci/mdmm_pluginval.sh --out "${RUNNER_TEMP}/pluginval" --label "macOS ${{ matrix.os }}, installed release packages" \
            "/Library/Audio/Plug-Ins/VST3/${MDMM_PRODUCT_NAME_MD}.vst3" "/Library/Audio/Plug-Ins/VST3/${MDMM_PRODUCT_NAME_MM}.vst3" \
            "/Library/Audio/Plug-Ins/Components/${MDMM_PRODUCT_NAME_MD}.component" "/Library/Audio/Plug-Ins/Components/${MDMM_PRODUCT_NAME_MM}.component"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-macos-pluginval-${{ matrix.os }}
          path: ${{ runner.temp }}/pluginval
          if-no-files-found: warn
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-macos-smoke-${{ matrix.os }}
          path: ${{ runner.temp }}/smoke
          if-no-files-found: warn
          retention-days: 30

  # Attaches the four macOS files to the draft. Runs only after macos-tests passed, never in a dry run.
  macos-publish:
    name: Attach the macOS installers to the draft release
    needs: [macos-installers, macos-tests]
    if: ${{ !cancelled() && needs.macos-installers.result == 'success' && needs.macos-tests.result == 'success' && github.event_name != 'workflow_run' && !inputs.dry_run && startsWith(github.ref, 'refs/tags/mdmm-v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      MDMM_OUT: ${{ github.workspace }}/installers

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 1
          submodules: false

      - uses: actions/download-artifact@v4
        with:
          pattern: macos-mdmm-installers*
          path: installers
          merge-multiple: true

      # A release reviewed and uploaded by hand (from a local, firmware-tested
      # build) wins: an asset that is already there is never replaced. With no
      # release yet, a draft is created for Radek to publish. A draft release
      # counts as existing: `gh release view <tag>` does not see drafts (the
      # API's tag lookup skips them), so the release is looked up in the list,
      # drafts included, and never created twice. Nothing ships unsigned: an
      # unsigned run only ever touches a draft, and titles it UNSIGNED.
      - name: Attach installers to the GitHub release
        env:
          SIGNED: ${{ needs.macos-installers.outputs.signed }}
        run: |
          set -euo pipefail
          notes="doc/release/v${TAG#mdmm-v}.md"
          assets=("${MDMM_OUT}/Machinedrum-Editor-macOS.pkg" \
                  "${MDMM_OUT}/Monomachine-Editor-macOS.pkg" \
                  "${MDMM_OUT}/Machinedrum-Editor-macOS.dmg" \
                  "${MDMM_OUT}/Monomachine-Editor-macOS.dmg")
          release_id="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"${TAG}\") | .id" | head -n 1)"
          if [[ -n "${release_id}" ]]; then
            is_draft="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" --jq '.draft')"
            if [[ "${SIGNED}" != "true" && "${is_draft}" != "true" ]]; then
              echo "::error title=Refusing unsigned upload::Release ${TAG} is published; unsigned installers are never attached to a published release."
              exit 1
            fi
            if [[ "${SIGNED}" != "true" ]]; then
              gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
                -f name="UNSIGNED - do not publish - Machinedrum Editor + Monomachine Editor ${TAG#mdmm-v}" \
                --jq '.name'
            fi
            if [[ "${SIGNED}" == "true" && "${is_draft}" == "true" ]]; then
              current_name="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" --jq '.name')"
              if [[ "${current_name}" == UNSIGNED* ]]; then
                # a signed re-run replaces the unsigned draft: drop its assets, title and banner
                echo "Replacing the unsigned draft ${TAG}: deleting its assets, resetting title and notes"
                for asset_id in $(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" --jq '.assets[].id'); do
                  gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets/${asset_id}"
                done
                if [[ -f "${notes}" ]]; then body="$(cat "${notes}")"; else body=""; fi
                gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
                  -f name="Machinedrum Editor + Monomachine Editor ${TAG#mdmm-v}" \
                  -f body="${body}" \
                  --jq '.name'
              fi
            fi
            existing="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" --jq '.assets[].name')"
            for asset in "${assets[@]}"; do
              name="$(basename "${asset}")"
              if printf '%s\n' "${existing}" | grep -qxF "${name}"; then
                echo "Keeping the existing ${name} on release ${release_id} (${TAG})"
              else
                gh api --method POST -H "Content-Type: application/octet-stream" \
                  "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?name=${name}" \
                  --input "${asset}" --jq '.name'
              fi
            done
          else
            notes_file="${RUNNER_TEMP}/release-notes.md"
            : > "${notes_file}"
            title="Machinedrum Editor + Monomachine Editor ${TAG#mdmm-v}"
            if [[ "${SIGNED}" != "true" ]]; then
              title="UNSIGNED - do not publish - ${title}"
              printf '%s\n\n' "> **UNSIGNED BUILD - do not publish.** Built without the Developer ID secrets (doc/release/SIGNING.md). Add them and re-run the tag's workflow." >> "${notes_file}"
            fi
            if [[ -f "${notes}" ]]; then
              cat "${notes}" >> "${notes_file}"
              notes_args=(--notes-file "${notes_file}")
            elif [[ -s "${notes_file}" ]]; then
              notes_args=(--notes-file "${notes_file}" --generate-notes)
            else
              notes_args=(--generate-notes)
            fi
            # A tag with a suffix (mdmm-v0.1.0-alpha) is a pre-release; a plain
            # version is a normal release, so releases/latest/download/ resolves.
            channel_args=()
            if [[ "${TAG#mdmm-v}" == *-* ]]; then
              channel_args=(--prerelease)
            fi
            # Always a draft: publishing is Radek's step, and only for signed builds.
            gh release create "${TAG}" "${assets[@]}" --repo "${GITHUB_REPOSITORY}" \
              --draft ${channel_args[@]+"${channel_args[@]}"} --verify-tag \
              --title "${title}" \
              "${notes_args[@]}"
          fi

  # Windows and Linux: one archive per machine, "not-tested" in the name, never signed. They go only
  # to the draft the macOS job made or found (so this runs after it, and only one job creates the
  # release): an existing asset is kept, and a published release is left alone with a warning (the
  # archives stay in the run's artifacts; Radek attaches them by hand if he wants them there). The
  # body gets the "not tested" line once. The macOS names stay as they are (the website links to them).
  # Packages the per-machine archives and proves they hold the files that were tested: the Windows zips are cut
  # from the zip mdmm-editors-windows.yml tested, the Linux tarballs are the ones mdmm-editors-linux.yml tested.
  package-other:
    name: Windows and Linux archives (packaged)
    needs: [locate, build]
    if: ${{ !cancelled() && needs.locate.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 1
          submodules: false

      - uses: actions/download-artifact@v4
        with:
          name: windows-mdmm
          path: ${{ runner.temp }}/windows
          run-id: ${{ needs.locate.outputs.run_id || github.run_id }}
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@v4
        with:
          name: linux-mdmm
          path: ${{ runner.temp }}/assets
          run-id: ${{ needs.locate.outputs.run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: One Windows zip per machine
        run: |
          set -euo pipefail
          zip="$(find "${RUNNER_TEMP}/windows" -name 'Gearmulator-Elektron-Windows-x64.zip' -print -quit)"
          ./scripts/windows/package_mdmm_editors.sh "${zip}" "${RUNNER_TEMP}/assets"
          ls -l "${RUNNER_TEMP}/assets"
          # The archives hold the files that were tested.
          . scripts/mdmm-product.env
          mkdir -p "${RUNNER_TEMP}/cmp/all"
          unzip -q "${zip}" -d "${RUNNER_TEMP}/cmp/all"
          for entry in "Machinedrum-Editor|${MDMM_PRODUCT_NAME_MD}" "Monomachine-Editor|${MDMM_PRODUCT_NAME_MM}"; do
            asset="${entry%%|*}"; product="${entry#*|}"
            unzip -q "${RUNNER_TEMP}/assets/${asset}-Windows-x64-not-tested.zip" -d "${RUNNER_TEMP}/cmp/${asset}"
            diff -r "${RUNNER_TEMP}/cmp/all/${product}.vst3" "${RUNNER_TEMP}/cmp/${asset}/${asset}-Windows-x64/${product}.vst3"
            cmp "${RUNNER_TEMP}/cmp/all/${product}.exe" "${RUNNER_TEMP}/cmp/${asset}/${asset}-Windows-x64/${product}.exe"
            echo "${asset}: the Windows zip holds the tested exe and vst3"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: mdmm-windows-linux-not-tested
          path: ${{ runner.temp }}/assets/*-not-tested.*
          if-no-files-found: error
          retention-days: 30

  other-platforms:
    name: Windows and Linux archives (not tested by a person) on the draft release
    needs: [macos-publish, package-other]
    if: ${{ !cancelled() && needs.macos-publish.result == 'success' && needs.package-other.result == 'success' && github.event_name != 'workflow_run' && !inputs.dry_run && startsWith(github.ref, 'refs/tags/mdmm-v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mdmm-windows-linux-not-tested
          path: ${{ runner.temp }}/assets

      - name: Attach to the draft release
        run: |
          set -euo pipefail
          assets=("${RUNNER_TEMP}/assets/Machinedrum-Editor-Windows-x64-not-tested.zip" \
                  "${RUNNER_TEMP}/assets/Monomachine-Editor-Windows-x64-not-tested.zip" \
                  "${RUNNER_TEMP}/assets/Machinedrum-Editor-Linux-x64-not-tested.tar.gz" \
                  "${RUNNER_TEMP}/assets/Monomachine-Editor-Linux-x64-not-tested.tar.gz")
          for asset in "${assets[@]}"; do
            if [[ ! -f "${asset}" ]]; then
              echo "::error::Missing ${asset}"
              exit 1
            fi
          done
          release_id="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"${TAG}\") | .id" | head -n 1)"
          if [[ -z "${release_id}" ]]; then
            echo "::error::No release for ${TAG}: the macOS job makes the draft first."
            exit 1
          fi
          if [[ "$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" --jq '.draft')" != "true" ]]; then
            echo "::warning title=Published release left alone::${TAG} is published; the unsigned, not-tested Windows and Linux archives go to drafts only. They are in this run's artifacts."
            exit 0
          fi
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" --jq '.assets[].name')"
          for asset in "${assets[@]}"; do
            name="$(basename "${asset}")"
            if printf '%s\n' "${existing}" | grep -qxF "${name}"; then
              echo "Keeping the existing ${name} on release ${release_id} (${TAG})"
            else
              gh api --method POST -H "Content-Type: application/octet-stream" \
                "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?name=${name}" \
                --input "${asset}" --jq '.name'
            fi
          done
          line="**Windows and Linux: not tested.** The \`*-Windows-x64-not-tested.zip\` and \`*-Linux-x64-not-tested.tar.gz\` archives are built and unit-tested by CI only; nobody has used them yet. Each has a README (install paths, required packages). Bring your own ROM."
          body="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" --jq '.body // ""')"
          if ! printf '%s' "${body}" | grep -qF "Windows and Linux: not tested"; then
            printf '%s\n\n%s\n' "${body}" "${line}" > "${RUNNER_TEMP}/body.md"
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
              -F body=@"${RUNNER_TEMP}/body.md" --jq '.name'
          fi
